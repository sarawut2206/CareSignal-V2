function drawPose(ctx,canvas,video,lm){
  if(canvas.width!==video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!lm)return;
  var pairs=[[11,12],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],[11,13],[13,15],[12,14],[14,16]];
  ctx.lineWidth=Math.max(3,canvas.width/150); ctx.strokeStyle="rgba(96,165,250,.9)"; ctx.lineCap="round";
  pairs.forEach(function(p){
    var a=lm[p[0]],b=lm[p[1]]; if(!a||!b)return;
    ctx.beginPath();ctx.moveTo(a.x*canvas.width,a.y*canvas.height);ctx.lineTo(b.x*canvas.width,b.y*canvas.height);ctx.stroke();
  });
  [11,12,23,24,25,26,27,28].forEach(function(i){
    var p=lm[i]; if(!p)return;
    ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,Math.max(4,canvas.width/110),0,6.3);
    ctx.fillStyle=(i===23||i===24)?"#FCD34D":"#DBEAFE";ctx.fill();
  });
}
/* ============================================================
   สอบเทียบ — คนเป็นผู้บอกว่าท่าไหนคือท่านั่ง ท่าไหนคือท่ายืน
   ------------------------------------------------------------
   ของเดิมระบบจับเวลา "นิ่งครบ 2 วินาที" แล้วบันทึกเอง โดยไม่รู้เลยว่า
   ตอนนั้นคนนั่งอยู่หรือยืนอยู่ ถ้าผู้ใช้ยังไม่ทันนั่ง หรือยืนค้างอยู่
   ค่าที่ได้ก็สลับกัน แล้วการนับลุกนั่งทั้งชุดก็เพี้ยนตามไปหมด

   รุ่นนี้กลับด้าน: กล้อง "รายงาน" สิ่งที่เห็นอย่างเดียว ไม่บันทึกเอง
   ผู้ใช้นั่งลงแล้วพูดว่า "บันทึกท่านั่ง" · ยืนขึ้นแล้วพูดว่า "บันทึกท่ายืน"
   ระบบขานรับทุกครั้งว่าบันทึกอะไรไปแล้ว จะทำสลับลำดับก็ได้
   ============================================================ */
function setupCalib(video,canvas,ctx){
  var sitVal=null, standVal=null, cur=null;
  var cap=document.getElementById("cap"), cstep=document.getElementById("cstep"), coach=document.getElementById("coach");
  var capStand=document.getElementById("capStand");

  function fmtState(){
    return "บันทึกแล้ว: "+(sitVal!=null?"ท่านั่ง ✓":"ท่านั่ง —")+" · "+(standVal!=null?"ท่ายืน ✓":"ท่ายืน —");
  }
  /* กล้องบอกได้แค่ "เทียบกับค่าที่บันทึกไว้แล้ว สูงขึ้นหรือต่ำลง"
     ไม่เดาเองว่านั่งหรือยืนเมื่อยังไม่มีอะไรให้เทียบ */
  function seenText(){
    if(cur==null)return null;
    if(sitVal==null&&standVal==null)return null;
    var ref=sitVal!=null?sitVal:standVal, isSit=sitVal!=null;
    var d=cur-ref;
    if(isSit)  return d>0.05?"ตอนนี้ตัวสูงกว่าค่าท่านั่งที่บันทึกไว้":"ตอนนี้ยังใกล้เคียงค่าท่านั่งที่บันทึกไว้";
    return d<-0.05?"ตอนนี้ตัวต่ำกว่าค่าท่ายืนที่บันทึกไว้":"ตอนนี้ยังใกล้เคียงค่าท่ายืนที่บันทึกไว้";
  }
  function loop(){
    if(S.screen!=="calib"){return}
    var lm=detectPose(video);
    drawPose(ctx,canvas,video,lm);
    var ok=false;
    if(lm){
      var q=visOK(lm), m=hipRatio(lm);
      if(q<0.85){cur=null;coach.textContent="ขยับมือถือให้เห็นตั้งแต่ศีรษะถึงเท้า";
        setStatus("yellow","ยังเห็นตัวไม่ครบ — ถอยมือถือให้เห็นตั้งแต่หัวถึงเท้า",false)}
      else if(m==null){cur=null;coach.textContent="ยังจับสัดส่วนลำตัวไม่ได้ ลองถอยห่างอีกเล็กน้อย";
        setStatus("yellow","ถอยห่างอีกนิด ให้เห็นทั้งตัว",false)}
      else{
        cur=m; ok=true;
        var s=seenText();
        coach.innerHTML="<b>"+esc(fmtState())+"</b><br>"+
          (s?esc(s)+" — ":"")+'พูดว่า "บันทึกท่านั่ง" หรือ "บันทึกท่ายืน" (หรือกดปุ่ม)';
        setStatus("green","เห็นตัวชัดแล้ว — ท่านเป็นผู้สั่งว่าจะบันทึกท่าไหน",false);
      }
    }else{cur=null;coach.textContent="ยังไม่พบคนในภาพ";
      setStatus("yellow","ยังไม่พบคนในภาพ — เข้ามาในกรอบกล้อง",false)}
    cap.disabled=!ok; if(capStand)capStand.disabled=!ok;
    RAF=requestAnimationFrame(loop);
  }
  loop();

  function capture(kind){
    if(cur==null){speak("ยังมองไม่เห็นตัวชัดพอ กรุณาขยับให้เห็นทั้งตัวก่อน");
      setStatus("yellow","ยังมองไม่เห็นตัวชัดพอ — ยังบันทึกไม่ได้",false);return}
    if(kind==="sit"){sitVal=cur;toast("บันทึกท่านั่งแล้ว");speak("บันทึกท่านั่งเรียบร้อยแล้ว")}
    else{standVal=cur;toast("บันทึกท่ายืนแล้ว");speak("บันทึกท่ายืนเรียบร้อยแล้ว")}
    cstep.textContent=fmtState();
    setStatus("green",(kind==="sit"?"บันทึกท่านั่งเรียบร้อย":"บันทึกท่ายืนเรียบร้อย")+" · "+fmtState(),false);
    if(sitVal!=null&&standVal!=null)finish();
  }
  function finish(){
    if(standVal-sitVal<0.045){
      /* ค่าสองท่าใกล้กันเกินไป = น่าจะบันทึกท่าเดียวกันสองครั้ง หรือสลับกัน */
      toast("ค่าท่านั่งกับท่ายืนต่างกันน้อยเกินไป");
      setStatus("red","ค่าสองท่าต่างกันน้อยเกินไป — กรุณาบันทึกใหม่ทีละท่า",false);
      speak("ค่าท่านั่งกับท่ายืนต่างกันน้อยเกินไป อาจบันทึกท่าเดียวกันสองครั้ง "+
            "กรุณานั่งลงแล้วพูดว่า บันทึกท่านั่ง จากนั้นยืนขึ้นแล้วพูดว่า บันทึกท่ายืน");
      sitVal=null;standVal=null;cstep.textContent=fmtState();return;
    }
    S.draft.sitRef=sitVal;S.draft.standRef=standVal;
    audit("สอบเทียบกล้อง (ผู้ใช้เป็นผู้สั่งบันทึกทีละท่า)",
      "ค่าท่านั่ง "+sitVal.toFixed(3)+" ค่าท่ายืน "+standVal.toFixed(3)+" ช่วงห่าง "+(standVal-sitVal).toFixed(3));
    toast("สอบเทียบเรียบร้อย");
    setStatus("green","สอบเทียบเรียบร้อย — ขั้นต่อไป ทดสอบลุกนั่ง 5 ครั้ง",false);
    speak("สอบเทียบเรียบร้อยแล้ว ขั้นตอนต่อไป ทดสอบลุกนั่ง ห้าครั้ง กรุณานั่งลงบนเก้าอี้");
    vcStop();
    setTimeout(function(){go("test")},2600);
  }
  cap.addEventListener("click",function(){capture("sit")});
  if(capStand)capStand.addEventListener("click",function(){capture("stand")});
  vcStart(function(cmd){
    if(cmd==="sit")capture("sit");
    else if(cmd==="stand")capture("stand");
    else if(cmd==="again"){sitVal=null;standVal=null;cstep.textContent=fmtState();
      setStatus("yellow","ล้างค่าที่บันทึกไว้แล้ว — เริ่มบันทึกใหม่ได้",false)}
    else if(cmd==="stop"){vcStop();stopCam();go("assess")}
  });
  cstep.textContent=fmtState();
  speak("ขั้นตอนสอบเทียบ ระบบจะไม่บันทึกเอง ท่านเป็นผู้สั่ง "+
        "เมื่อนั่งบนเก้าอี้เรียบร้อยแล้ว พูดว่า บันทึกท่านั่ง "+
        "จากนั้นยืนขึ้นตรง ๆ แล้วพูดว่า บันทึกท่ายืน");
}
function setupTest(video,canvas,ctx){
  DET=new RepDetector({target:5});
  /* ตรวจใบหน้าเป็นระยะระหว่างทดสอบ กันการสลับคนกลางคัน */
  var faceRef=faceEnabled()?loadFaceSig():null;
  var frameN=0, faceChecks=0, faceFails=0;
  S.draft.identityChecks=0; S.draft.identityFails=0;
  DET.setRefs(S.draft.sitRef,S.draft.standRef);
  var repEl=document.getElementById("rep"),clk=document.getElementById("clk"),trk=document.getElementById("trk"),
      st=document.getElementById("st"),coach=document.getElementById("coach"),qual=document.getElementById("qual"),
      startBtn=document.getElementById("startBtn"),stopBtn=document.getElementById("stopBtn");
  var running=false, t0=0, lastEvt=0, AUTOSTART=null;
  function loop(){
    if(S.screen!=="test")return;
    var lm=detectPose(video);
    drawPose(ctx,canvas,video,lm);
    frameN++;
    /* ตรวจใบหน้าทุก ~60 เฟรม (≈2 วินาที) เฉพาะตอนกำลังจับเวลา */
    if(faceRef&&running&&FACE&&frameN%60===0){
      try{
        var fr=FACE.detectForVideo(video,performance.now());
        var flm=fr&&fr.faceLandmarks&&fr.faceLandmarks[0]?fr.faceLandmarks[0]:null;
        if(flm){
          var sg=faceSignature(flm);
          faceChecks++; S.draft.identityChecks=faceChecks;
          if(sigDist(sg,faceRef)>FACE_TOL){faceFails++; S.draft.identityFails=faceFails}
        }
      }catch(e){}
    }
    if(lm){
      var q=visOK(lm),m=hipRatio(lm),ka=kneeAngle(lm);
      qual.innerHTML="คุณภาพภาพ <b>"+Math.round(q*100)+"%</b>"+(ka!=null?" · เข่า "+Math.round(ka)+"°":"")+
        (faceRef?(faceFails>0?" · <b style='color:#FCA5A5'>ใบหน้าไม่ตรง</b>":(faceChecks?" · <b style='color:#6EE7B7'>ยืนยันตัวตนแล้ว</b>":" · รอตรวจใบหน้า")):"");
      if(m!=null&&running){
        var ev=DET.push(m,performance.now());
        st.textContent=DET.state==="stand"?"ยืน":"นั่ง";
        repEl.textContent=DET.reps;
        trk.style.width=(DET.reps/5*100)+"%";
        if(ev&&ev.event==="rep"){lastEvt=performance.now();
          coach.innerHTML="นับได้ "+ev.reps+" ครั้ง — นั่งลงให้สุดแล้วลุกต่อ<span class='statebadge'>"+(DET.state==="stand"?"ยืน":"นั่ง")+"</span>";
          setStatus("green","นับได้ "+ev.reps+" ครั้ง จาก 5 ครั้ง",false);
          speak(["","หนึ่ง","สอง","สาม","สี่","ห้า"][ev.reps]);}
        if(ev&&ev.event==="down")lastEvt=performance.now();
        if(ev&&ev.event==="finish"){finishTest(ev.elapsed);return}
      }else if(m!=null&&!running){
        var sitting=m<(S.draft.sitRef+S.draft.standRef)/2;
        st.textContent=sitting?"นั่ง":"ยืน";
        if(AUTOSTART&&!AUTOSTART.counting)
          setStatus(sitting?"green":"yellow",
            sitting?"เห็นท่านั่งแล้ว — เมื่อพร้อม พูดว่า \"เริ่มทดสอบ\"":"กรุณานั่งลงบนเก้าอี้ก่อน",false);
        if(AUTOSTART)AUTOSTART.update(sitting&&q>=0.8);
      }
      if(q<0.8)coach.textContent="เห็นตัวไม่ครบ — ขยับมือถือให้เห็นทั้งตัว";
    }else{qual.innerHTML="คุณภาพภาพ <b>—</b>"}
    if(running){
      var el=(performance.now()-t0)/1000;clk.innerHTML=el.toFixed(1)+'<span style="font-size:13px"> วิ</span>';
      /* ตาข่ายนิรภัย: นับไม่ขึ้นเกิน 20 วินาที → แนะทางออก ไม่ปล่อยให้ติดค้าง */
      if(performance.now()-lastEvt>20000){
        coach.innerHTML="ระบบนับไม่ขึ้นใช่ไหม — ลอง<b>ลุกให้สุด นั่งให้ก้นแตะเก้าอี้</b> หรือกดปุ่มด้านล่างเพื่อกรอกเวลาเอง";
        setStatus("red","ระบบนับไม่ขึ้น — ลุกให้สุด นั่งให้สุด หรือกดปุ่มกรอกเวลาเอง");
        stopBtn.hidden=false;
      }
    }
    RAF=requestAnimationFrame(loop);
  }
  loop();
  /* เริ่มจับเวลาเองอัตโนมัติเมื่อผู้ใช้นั่งนิ่งพร้อม — ไม่ต้องเดินมากดปุ่ม */
  /* เดิม: เริ่มจับเวลาเองเมื่อนั่งนิ่ง → ผู้ใช้สะท้อนว่า "เริ่มทั้งที่ยังไม่พร้อม"
     ใหม่: ระบบประกาศว่าพร้อม แล้วรอคำสั่งเสียงหรือปุ่มจากผู้ใช้เสมอ */
  AUTOSTART=new AutoCapture({screen:"test",holdMs:2500,readyText:"นั่งพร้อมแล้ว",announce:true,
    abortOnLost:false,onFire:function(){
      setStatus("green","นั่งพร้อมแล้ว — "+vcHint(),false);
      speak("นั่งพร้อมแล้ว เมื่อพร้อม พูดว่า เริ่มทดสอบ หรือกดปุ่มเริ่มจับเวลา");
    }});
  vcStart(function(cmd){
    if(cmd==="start")beginTimer();
    else if(cmd==="stop"&&running)stopBtn.click();
  });
  speak("กรุณานั่งบนเก้าอี้ กอดอกไว้ เมื่อพร้อมแล้ว พูดว่า เริ่มทดสอบ หรือกดปุ่มเริ่ม");
  function beginTimer(){
    if(running)return;
    AUTOSTART.abort();AUTOSTART.done=true;
    running=true;t0=performance.now();lastEvt=t0;DET.start(t0);
    startBtn.textContent="กำลังจับเวลา…";startBtn.disabled=true;
    stopBtn.hidden=false;
    setStatus("green","เริ่มได้เลย — นาฬิกาจะเริ่มเดินเมื่อคุณเริ่มลุก",false);speak("เริ่มได้เลย");
    coach.innerHTML="ลุกยืนให้สุดแล้วนั่งลงให้สุด ทำต่อเนื่อง<span class='statebadge'>เริ่มแล้ว</span>";
  }
  startBtn.addEventListener("click",function(){
    if(running)return;
    AUTOSTART.abort();
    beginTimer();
  });
  stopBtn.addEventListener("click",function(){
    var reps=DET?DET.reps:0;
    stopCam();
    audit("หยุดการทดสอบด้วยกล้องกลางคัน","ผู้ใช้หยุดเองขณะนับได้ "+reps+" ครั้ง แล้วเลือกกรอกเวลาเอง");
    askTime(function(n){
      S.draft.ftsst=n;S.draft.method="manual";S.draft.reps=5;S.draft.cv=null;S.draft.gaps=null;
      audit("บันทึกเวลาด้วยตนเอง","ผู้ใช้กรอกเวลา "+n.toFixed(1)+" วินาที");
      go("q",0);
    },function(){go("assess")});
  });
}
function finishTest(elapsed){
  stopCam();
  var gaps=[];
  for(var i=1;i<DET.stamps.length;i++)gaps.push((DET.stamps[i]-DET.stamps[i-1])/1000);
  var cv=null;
  if(gaps.length>1){
    var mean=gaps.reduce(function(a,b){return a+b},0)/gaps.length;
    var sd=Math.sqrt(gaps.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/gaps.length);
    cv=mean>0?sd/mean:null;
  }
  S.draft.ftsst=Math.round(elapsed*10)/10;
  S.draft.method="camera-pose";
  S.draft.reps=DET.reps;
  S.draft.cv=cv;
  S.draft.gaps=gaps.map(function(g){return Math.round(g*10)/10});
  /* สรุปผลยืนยันตัวตน: ผ่านเมื่อตรวจอย่างน้อย 1 ครั้งและไม่ตรงไม่เกิน 1 ครั้ง */
  var ck=S.draft.identityChecks||0, fl=S.draft.identityFails||0;
  S.draft.identityVerified=(faceEnabled()&&ck>=1&&fl<=1);
  audit("ผลการยืนยันตัวตนระหว่างทดสอบ", faceEnabled()
    ? ("ตรวจใบหน้า "+ck+" ครั้ง ไม่ตรง "+fl+" ครั้ง → "+(S.draft.identityVerified?"ยืนยันผ่าน":"ยืนยันไม่ผ่าน"))
    : "ผู้ใช้ไม่ได้ลงทะเบียนใบหน้า ผลนี้ไม่ได้ยืนยันตัวตน");
  audit("วัดด้วยกล้อง","ลุกนั่ง 5 ครั้งใน "+S.draft.ftsst.toFixed(1)+" วินาที · เวลาต่อครั้ง "+S.draft.gaps.join(", ")+" วินาที"+(cv!=null?" · ความแปรปรวน "+(cv*100).toFixed(0)+"%":""));
  speak("ครบห้าครั้ง เสร็จเรียบร้อย ใช้เวลา "+S.draft.ftsst.toFixed(0)+" วินาที เก่งมากค่ะ ขั้นตอนต่อไป ทดสอบการทรงตัว");
  toast("วัดเสร็จแล้ว "+S.draft.ftsst.toFixed(1)+" วินาที");
  if(PILOT){go("plog");return}
  setTimeout(function(){go("tug")},2400);
}

/* ============================================================
   ทดสอบการทรงตัว — ยืนเท้าชิด หลับตา 10 วินาที
   ------------------------------------------------------------
   กล้องวัด "ความโคลงเคลง" (postural sway) จากการขยับของจุดกึ่งกลางลำตัว
   หารด้วยความกว้างไหล่ เพื่อให้ค่าไม่ขึ้นกับระยะห่างจากกล้อง

   ⚠️ ค่าที่วัดได้เป็น "ข้อสังเกตจากกล้อง" ไม่ใช่การตัดสิน
   ผู้เอาประกันเป็นผู้ยืนยันความรู้สึกจริงอีกครั้งเสมอ
   และกระบวนการนี้จะถูกตรวจสอบโดยเจ้าหน้าที่ประกันภัยในภายหลัง
   ============================================================ */
var BAL_SECONDS=10;

/* จุดกึ่งกลางลำตัวและความกว้างไหล่ ใช้ทำให้ค่าไม่ขึ้นกับระยะกล้อง */
function trunkCenter(lm){
  var sh={x:(lm[LM.LSH].x+lm[LM.RSH].x)/2, y:(lm[LM.LSH].y+lm[LM.RSH].y)/2};
  var hp={x:(lm[LM.LHIP].x+lm[LM.RHIP].x)/2, y:(lm[LM.LHIP].y+lm[LM.RHIP].y)/2};
  return {x:(sh.x+hp.x)/2, y:(sh.y+hp.y)/2};
}
function shoulderWidth(lm){
  return Math.hypot(lm[LM.LSH].x-lm[LM.RSH].x, lm[LM.LSH].y-lm[LM.RSH].y);
}
/* ค่าโคลงเคลง = ส่วนเบี่ยงเบนมาตรฐานของตำแหน่งลำตัว หารความกว้างไหล่ */
function swayScore(samples){
  if(samples.length<8)return null;
  var n=samples.length, mx=0, my=0;
  samples.forEach(function(s){mx+=s.x;my+=s.y});
  mx/=n; my/=n;
  var vx=0, vy=0;
  samples.forEach(function(s){vx+=(s.x-mx)*(s.x-mx); vy+=(s.y-my)*(s.y-my)});
  return Math.sqrt(vx/n+vy/n);
}
/* แปลงค่าเป็นข้อสังเกต 3 ระดับ */
function swayLabel(v){
  /* หน่วย: สัดส่วนของความยาวลำตัว (ไหล่→สะโพก) — เปลี่ยนจากความกว้างไหล่
     ตั้งแต่เอนจิน 1.4.1 เพราะไม่เพี้ยนเมื่อหันข้างให้กล้อง */
  if(v==null)return {nm:"วัดไม่ได้", cls:"", hint:"กล้องเห็นตัวไม่ครบตลอด 10 วินาที"};
  if(v<0.012)return {nm:"นิ่งมาก", cls:"t4", hint:"แทบไม่มีการโคลง"};
  if(v<0.028)return {nm:"โคลงเล็กน้อย", cls:"t3", hint:"มีการแกว่งบ้างตามปกติ"};
  if(v<0.050)return {nm:"โคลงปานกลาง", cls:"t2", hint:"แกว่งชัดเจน ควรมีที่จับใกล้มือ"};
  return {nm:"โคลงมาก", cls:"t1", hint:"แกว่งมาก ควรมีคนอยู่ข้าง ๆ เสมอ"};
}

/* ============================================================
   BalanceEngine v3 — 4-Stage Balance Test มุมมอง "ยืนหันข้าง"
   ------------------------------------------------------------
   ผู้ใช้จริงสะท้อนจากรุ่นก่อนว่า ตรวจความโคลงเคลงและตำแหน่งเท้า
   ไม่ได้จริง รุ่นนี้จึงเปลี่ยนวิธีทั้งชุด:
   (1) ให้ยืน "หันข้าง" ให้กล้อง — ท่าทั้ง 4 แยกจากกันชัดที่สุดในแนวข้าง
       เท้าชิด = เท้าสองข้างซ้อนกัน · กึ่งต่อ = เหลื่อมราวครึ่งเท้า ·
       ต่อเท้า = เหลื่อมเต็มความยาวเท้า · ขาเดียว = ข้อเท้าข้างหนึ่งลอย
   (2) จับ "เท้าเป็นหลัก" — ส้นเท้า(29,30) ปลายเท้า(31,32) ข้อเท้า(27,28)
       หน่วยวัด = ความยาวเท้าของผู้ใช้เอง (ส้น→ปลาย) จึงไม่ขึ้นกับ
       ระยะกล้อง และระบบบอกได้ว่าเท้าที่เห็น "ตรงกับท่าที่สั่งหรือไม่"
   (3) ความโคลงเคลง = การแกว่งของลำตัว (ไหล่+สะโพก) หน่วยลำตัว
   (4) ไม่เริ่มเอง — ประกาศเมื่อพร้อม แล้วรอคำสั่งเสียง/ปุ่มเสมอ
   เท้ามองไม่เห็น (กางเกงคลุม แสงน้อย) → ถอยไปใช้ลำตัวแบบรุ่นก่อน
   โดยอัตโนมัติ จึงไม่มีทางค้างเหมือนรุ่นแรก ๆ
   ============================================================ */
var STANCE_NM=["เท้าชิด","กึ่งต่อเท้า","ต่อเท้า","ยกขาข้างหนึ่ง"];
function BalanceEngine(stage){
  this.stage=stage;                 /* 0-3 = เท้าชิด กึ่งต่อเท้า ต่อเท้า ขาเดียว */
  this.state="search";
  this.c=null; this.torso=null;
  this.stillN=0; this.lostN=0; this.badN=0;
  this.refC=null; this.refFeet=null; this.refLift=null;
  this.samples=[]; this.liftWarned=false; this.lastLm=null;
  this.stHist=[]; this.startStance=null;
  /* ตัวนับคุณภาพ/ความปลอดภัยระหว่างจับเวลา — ใช้ "รายงาน" ให้คนตัดสิน
     ไม่ได้เอาไปตัดสินผ่าน/ไม่ผ่านเอง */
  this.hn=0; this.hFeet=0; this.dropN=0; this.dropped=false;
  this.stepAt=null; this.lostFrames=0;
}
BalanceEngine.prototype._read=function(lm){
  if(!lm)return null;
  function vis(i){var p=lm[i];return p&&(p.visibility===undefined||p.visibility>0.4)}
  if(!(vis(LM.LSH)&&vis(LM.RSH)&&vis(LM.LHIP)&&vis(LM.RHIP)))return null;
  var sh={x:(lm[LM.LSH].x+lm[LM.RSH].x)/2,y:(lm[LM.LSH].y+lm[LM.RSH].y)/2};
  var hp={x:(lm[LM.LHIP].x+lm[LM.RHIP].x)/2,y:(lm[LM.LHIP].y+lm[LM.RHIP].y)/2};
  var torso=Math.hypot(sh.x-hp.x,sh.y-hp.y);
  if(!isFinite(torso)||torso<0.04)return null;
  /* หันข้าง = ไหล่สองข้างซ้อนกันในภาพ (ระยะไหล่แคบเทียบลำตัว) */
  var sideOk=Math.abs(lm[LM.LSH].x-lm[LM.RSH].x)/torso<0.5;
  var f=null;
  if(vis(LM.LANK)&&vis(LM.RANK)){
    /* ศูนย์เท้าแต่ละข้าง = เฉลี่ยจุดที่มองเห็น (ข้อเท้า·ส้น·ปลายเท้า) */
    function foot(ank,heel,toe){
      var xs=[lm[ank].x],ys=[lm[ank].y];
      if(vis(heel)){xs.push(lm[heel].x);ys.push(lm[heel].y)}
      if(vis(toe)){xs.push(lm[toe].x);ys.push(lm[toe].y)}
      var n=xs.length,sx=0,sy=0;
      for(var i=0;i<n;i++){sx+=xs[i];sy+=ys[i]}
      return {x:sx/n,y:sy/n};
    }
    var Lc=foot(LM.LANK,LM.LHEEL,LM.LTOE), Rc=foot(LM.RANK,LM.RHEEL,LM.RTOE);
    /* หน่วยวัด = ความยาวเท้า (ส้น→ปลาย) — สเกลกับตัวผู้ใช้เอง */
    var flL=vis(LM.LHEEL)&&vis(LM.LTOE)?Math.hypot(lm[LM.LTOE].x-lm[LM.LHEEL].x,lm[LM.LTOE].y-lm[LM.LHEEL].y):null;
    var flR=vis(LM.RHEEL)&&vis(LM.RTOE)?Math.hypot(lm[LM.RTOE].x-lm[LM.RHEEL].x,lm[LM.RTOE].y-lm[LM.RHEEL].y):null;
    var unit=flL&&flR?(flL+flR)/2:(flL||flR||torso*0.55);
    if(!isFinite(unit)||unit<0.02)unit=torso*0.55;
    f={L:Lc,R:Rc,unit:unit,
       gap:Math.abs(Lc.x-Rc.x)/unit,                    /* เหลื่อมหน้า-หลังในแนวข้าง */
       lift:Math.abs(lm[LM.LANK].y-lm[LM.RANK].y)/unit};/* ข้อเท้าข้างหนึ่งลอยแค่ไหน */
  }
  return {c:{x:(sh.x+hp.x)/2/torso,y:(sh.y+hp.y)/2/torso},
          torso:torso, sideOk:sideOk, feet:f};
};
/* จำแนกท่าจากเท้า (มุมมองด้านข้าง) — คืน 0..3 หรือ null เมื่อไม่เห็นเท้า */
BalanceEngine.prototype._stance=function(f){
  if(!f)return null;
  if(f.lift>0.65)return 3;      /* ข้อเท้าลอยเกินครึ่งความยาวเท้า = ยกขา */
  if(f.gap<0.40)return 0;       /* ซ้อนกัน = เท้าชิด */
  if(f.gap<0.90)return 1;       /* เหลื่อมราวครึ่งเท้า = กึ่งต่อ */
  return 2;                     /* เหลื่อมเต็มเท้า = ต่อเท้า */
};
BalanceEngine.prototype.frame=function(lm){
  this.lastLm=lm;
  var r=this._read(lm);
  if(!r){
    this.lostN++; this.stillN=0;
    return {seen:false, lost:this.lostN, ready:false,
            fail:this.state==="hold"&&this.lostN>75,
            why:"กล้องมองไม่เห็นตัวนานเกินไป", sway:this.liveSway()};
  }
  this.lostN=0;
  var prev=this.c;
  this.c=prev?{x:prev.x*0.7+r.c.x*0.3, y:prev.y*0.7+r.c.y*0.3}:r.c;
  this.torso=this.torso?this.torso*0.9+r.torso*0.1:r.torso;
  var mv=prev?Math.hypot(this.c.x-prev.x,this.c.y-prev.y):9;

  /* โหวตท่าจากหลายเฟรม — จุดเดียวหลอกง่าย เสียงข้างมาก 15 เฟรมเชื่อได้ */
  var st=r.sideOk?this._stance(r.feet):null;
  this.stHist.push(st); if(this.stHist.length>15)this.stHist.shift();
  var cnt={}, best=null, bn=0;
  for(var i=0;i<this.stHist.length;i++){
    var v=this.stHist[i]; if(v==null)continue;
    cnt[v]=(cnt[v]||0)+1;
    if(cnt[v]>bn){bn=cnt[v];best=v}
  }
  var stanceSeen=bn>=8?best:null;

  if(this.state!=="hold"){
    /* ก่อนเริ่ม: เห็นตัว + ยืนนิ่ง → "พร้อม" แล้วรอคำสั่ง (ไม่เริ่มเอง) */
    if(mv<0.02)this.stillN++; else this.stillN=0;
    var ready=this.stillN>=12;
    this.state=ready?"steady":"search";
    return {seen:true, ready:ready, feet:r.feet, sway:null,
            stance:stanceSeen,
            stanceOk:stanceSeen==null?null:stanceSeen===this.stage,
            sideOk:r.sideOk,
            liftNow:r.feet?r.feet.lift:null};
  }

  /* ---- ระหว่างจับเวลา 10 วินาที ---- */
  this.samples.push({x:this.c.x,y:this.c.y});
  this.hn++; if(r.feet)this.hFeet++;
  var res={seen:true, ready:true, fail:false, why:null,
           sway:this.liveSway(), stepped:false, dropped:false, remind:null};

  /* ความปลอดภัย: ทรุดตัวหรือนั่งลง — ศูนย์กลางลำตัวต่ำลงเกินครึ่งช่วงลำตัว
     ต่อเนื่อง ต้องหยุดจับเวลาทันทีและบอกให้ผู้ดูแลเข้าไปดู */
  if(this.refC&&(this.c.y-this.refC.y)>0.55)this.dropN++; else this.dropN=0;
  if(this.dropN>=8){
    this.dropped=true;
    res.fail=true; res.dropped=true; res.why="กล้องเห็นว่าท่านนั่งลงหรือทรุดตัว";
    return res;
  }

  if(r.feet&&this.refFeet){
    if(this.stage===3){
      /* ขาเดียว: เท้าที่ยกแกว่งได้ตามธรรมชาติ ล้มเหลวเมื่อเท้ากลับลงพื้น */
      if(this.refLift!=null&&this.refLift>0.55&&
         r.feet.lift<Math.max(0.25,this.refLift*0.4))this.badN++;
      else this.badN=0;
      res.why="เท้าที่ยกลงแตะพื้น";
    }else{
      /* เกณฑ์หยุดของ CDC คือ "ขยับเท้า" — วัดที่เท้าตรง ๆ ในหน่วยความยาวเท้า */
      var d=Math.max(
        Math.hypot(r.feet.L.x-this.refFeet.L.x,r.feet.L.y-this.refFeet.L.y),
        Math.hypot(r.feet.R.x-this.refFeet.R.x,r.feet.R.y-this.refFeet.R.y))/this.refFeet.unit;
      if(d>0.9)this.badN++; else this.badN=0;   /* เลื่อนเกินเกือบหนึ่งช่วงเท้า = ก้าวจริง */
      res.why="ขยับเท้าออกจากตำแหน่งเดิม";
    }
  }else{
    /* มองไม่เห็นเท้า — ไม่ตัดจบและไม่ตัดสินว่าไม่ผ่าน
       เหตุผล: เกณฑ์ของ CDC คือ "ขยับเท้า" การเลื่อนของลำตัวไม่ใช่สิ่งเดียวกัน
       ผู้สูงอายุแกว่งตัวเพื่อรักษาสมดุลได้โดยไม่ขยับเท้า ซึ่งยังนับว่าผ่าน
       จึงบันทึกไว้เป็น "ธงคุณภาพภาพ" ให้คนตัดสินแทน ไม่ให้ระบบเดา */
    this.badN=0;
    res.noFeet=true;
    res.why="กล้องมองไม่เห็นเท้าในช่วงนี้ — ให้ผู้ดูแลเป็นผู้ยืนยันผล";
  }
  if(this.badN>=10){res.fail=true;res.stepped=true;
    if(this.stepAt==null)this.stepAt=this.hn/30;}   /* วินาทีโดยประมาณที่เห็นการขยับเท้า */

  /* ท่าขาเดียวแต่ยังไม่ยกเท้า: เตือนด้วยเสียงครั้งเดียว ไม่ตัดคะแนน */
  if(this.stage===3&&r.feet&&!this.liftWarned&&this.samples.length>50&&r.feet.lift<0.45){
    this.liftWarned=true;
    res.remind="อย่าลืมยกเท้าข้างหนึ่งขึ้นจากพื้นด้วยนะ";
  }
  return res;
};
BalanceEngine.prototype.beginHold=function(){
  this.state="hold"; this.samples=[]; this.badN=0; this.lostN=0;
  var r=this._read(this.lastLm);
  this.refC=r?r.c:this.c;
  this.refFeet=r?r.feet:null;
  this.refLift=r&&r.feet?r.feet.lift:null;
  this.startStance=r&&r.sideOk?this._stance(r.feet):null;  /* ท่าที่เห็นตอนเริ่ม เก็บไว้รายงาน */
};
BalanceEngine.prototype._sd=function(arr){
  if(arr.length<8)return null;
  var mx=0,my=0;arr.forEach(function(p){mx+=p.x;my+=p.y});mx/=arr.length;my/=arr.length;
  var v=0;arr.forEach(function(p){v+=(p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my)});
  return Math.sqrt(v/arr.length);
};
/* สรุปสิ่งที่ "กล้องสังเกตเห็น" ไว้ให้คนอ่านก่อนตัดสิน — ไม่ใช่คำตัดสิน */
BalanceEngine.prototype.observe=function(){
  var feetRatio=this.hn?this.hFeet/this.hn:0;
  var obs=[], suggest="pass", conf="high";
  if(this.dropped){obs.push("เห็นว่าท่านนั่งลงหรือทรุดตัวระหว่างทดสอบ");suggest="fail"}
  if(this.stepAt!=null)obs.push("เห็นการขยับเท้าที่ประมาณวินาทีที่ "+this.stepAt.toFixed(0));
  if(this.stepAt!=null&&suggest!=="fail")suggest="fail";
  if(this.lostN>30){obs.push("ท่านหลุดออกนอกกรอบภาพบางช่วง");conf="low";suggest="unsure"}
  if(feetRatio<0.5){
    obs.push("กล้องมองไม่เห็นเท้าชัดเจนตลอดการทดสอบ");
    conf="low"; if(suggest==="pass")suggest="unsure";
  }
  if(!obs.length)obs.push("ไม่พบการขยับเท้าและไม่พบการทรุดตัว");
  return {obs:obs, suggest:suggest, confidence:conf,
          feetSeen:Math.round(feetRatio*100), sway:this.finalSway()};
};
BalanceEngine.prototype.liveSway=function(){return this._sd(this.samples.slice(-90))};
BalanceEngine.prototype.finalSway=function(){return this._sd(this.samples)};

/* ============================================================
   TugTracker — ตรวจการเดินไป-กลับ 3 เมตรของ TUG ด้วยกล้องตัวเดียว
   ------------------------------------------------------------
   ผู้ใช้วางป้ายจุดเริ่ม (ข้างเก้าอี้) และป้ายจุดกลับที่ 3 เมตร
   กล้องไม่จำเป็นต้องเห็นป้าย — ใช้ขนาดตัวในภาพเป็นมาตรวัดแทน:
   เดินออกห่าง → ตัวเล็กลง · ถึงจุดกลับ → เล็กสุด · เดินกลับ → ใหญ่ขึ้น
   - "เดินครบรอบ" ยืนยันเมื่อขนาดเล็กสุด ≤ 82% ของขนาดตอนยืนที่เก้าอี้
   - การเดินตรง วัดจากการเบี่ยงซ้าย-ขวาของกึ่งกลางไหล่ หน่วยเป็น
     ความกว้างไหล่ ณ ระยะนั้น จึงเทียบได้ทุกระยะห่างจากกล้อง
   ============================================================ */
function TugTracker(refs){
  this.sitRef=refs.sitRef; this.standRef=refs.standRef;
  /* CDC ให้เริ่มจับเวลาเมื่อผู้ประเมินพูดว่า "เริ่ม" ไม่ใช่ตอนที่ผู้รับการ
     ประเมินขยับ ระบบจึงบันทึกเวลาสัญญาณเริ่มไว้ที่ goAt แล้วเก็บเวลา
     ที่เริ่มขยับจริงไว้ต่างหาก เพื่อรายงานเวลาตอบสนองแยกได้ */
  this.goAt=null;
  this.state="waiting"; this.t0=null; this.tTurn=null; this.t1=null;
  this.buf=[]; this.onsetFrac=0.18;
  this.s0=null; this.s0buf=[]; this.sMin=null; this.sw=null;
  this.cx0=null; this.maxDrift=0; this.driftSum=0; this.driftN=0;
}
TugTracker.prototype.pushFrame=function(raw,sw,cx,t){
  /* แกนลุก-นั่ง: ตรรกะเดียวกับตัวจับ TUG เดิม (เริ่มนับตั้งแต่เริ่มโน้มตัวลุก) */
  this.buf.push(raw); if(this.buf.length>5)this.buf.shift();
  var v=this.buf.reduce(function(a,b){return a+b},0)/this.buf.length;
  var range=this.standRef-this.sitRef;
  var onset=this.sitRef+range*this.onsetFrac;
  var up=this.sitRef+range*0.68, down=this.sitRef+range*0.36;
  /* ขนาดตัวในภาพ ปรับเรียบด้วย EMA กันกระตุกรายเฟรม */
  if(sw&&sw>0.01)this.sw=this.sw==null?sw:this.sw*0.8+sw*0.2;

  if(this.state==="waiting"&&v>=onset){this.state="rising";this.t0=t;return{event:"onset"}}
  if(this.state==="rising"&&v>=up){this.state="standing";this.s0buf=[];return{event:"stand"}}
  if(this.state==="standing"){
    /* เก็บขนาดตอนยืนตรงหน้าเก้าอี้ ~15 เฟรม ใช้มัธยฐานเป็นฐานเทียบ */
    if(this.sw!=null)this.s0buf.push(this.sw);
    if(this.s0buf.length>=15){
      this.s0buf.sort(function(a,b){return a-b});
      this.s0=this.s0buf[Math.floor(this.s0buf.length/2)];
      this.sMin=this.s0; this.cx0=cx;
      this.state="walkOut"; return {event:"walk"};
    }
    return null;
  }
  if((this.state==="walkOut"||this.state==="walkBack")&&this.sw!=null&&this.s0){
    if(this.sw<this.sMin)this.sMin=this.sw;
    if(cx!=null&&this.cx0!=null){
      var d=Math.abs(cx-this.cx0)/this.sw;
      if(d>this.maxDrift)this.maxDrift=d;
      this.driftSum+=d; this.driftN++;
    }
    /* จุดกลับ: ตัวเล็กลงพอสมควรแล้ว และเริ่มกลับมาใหญ่ขึ้นต่อเนื่อง */
    if(this.state==="walkOut"&&this.sMin<=this.s0*0.90&&this.sw>=this.sMin*1.07){
      this.state="walkBack"; this.tTurn=t; return {event:"turn"};
    }
  }
  if((this.state==="walkOut"||this.state==="walkBack")&&v<=down&&this.t0&&(t-this.t0)>4000){
    this.state="done"; this.t1=t;
    var base=this.goAt!=null?this.goAt:this.t0;
    return {event:"finish",
      elapsed:(t-base)/1000,
      reaction:this.goAt!=null?(this.t0-this.goAt)/1000:null,
      out:this.tTurn?(this.tTurn-base)/1000:null,
      back:this.tTurn?(this.t1-this.tTurn)/1000:null,
      distanceOk:this.s0!=null&&this.sMin<=this.s0*0.82,
      turnSeen:this.tTurn!=null,
      drift:this.driftN?{max:this.maxDrift,avg:this.driftSum/this.driftN}:null};
  }
  return null;
};
/* แปลผลการเดินตรงเป็นข้อสังเกต (หน่วย: เท่าของความกว้างไหล่) */
function gaitLabel(d){
  if(!d)return {nm:"วัดไม่ได้",cls:""};
  if(d.max<0.8)return {nm:"เดินตรงดี",cls:"t4"};
  if(d.max<1.6)return {nm:"เบี่ยงเล็กน้อย",cls:"t3"};
  return {nm:"เบี่ยงมาก ควรเฝ้าระวัง",cls:"t1"};
}



/* ============================================================
   4-Stage Balance Test (CDC STEADI)
   ------------------------------------------------------------
   ยืน 4 ท่าเรียงจากง่ายไปยาก ท่าละไม่เกิน 10 วินาที
   ⚠️ ลืมตาตลอด และไม่ใช้อุปกรณ์ช่วยหรือที่จับ
   ทำท่าถัดไปเฉพาะเมื่อท่าปัจจุบันยืนครบ 10 วินาที
   ผู้ที่ยืนท่าต่อเท้า (tandem) ไม่ครบ 10 วินาที สัมพันธ์กับความเสี่ยงหกล้มที่สูงขึ้น
   ที่มา: CDC STEADI · Vincenzo & Patton, Health Promot Pract 2021;22(2):236-247
   ============================================================ */
var BAL_STAGES=[
  {nm:"เท้าชิดกัน",   how:"ยืนหันข้างให้กล้อง เท้าชิดกัน ปลายเท้าและส้นเท้าเสมอกัน"},
  {nm:"กึ่งต่อเท้า",  how:"ยืนหันข้างให้กล้อง เลื่อนเท้าข้างหนึ่งไปข้างหน้าครึ่งเท้า ให้อุ้งเท้าแตะนิ้วหัวแม่เท้าอีกข้าง"},
  {nm:"ต่อเท้าเป็นเส้นตรง", how:"ยืนหันข้างให้กล้อง วางส้นเท้าหน้าชิดปลายนิ้วเท้าหลัง เป็นเส้นตรงเดียวกัน"},
  {nm:"ยืนขาเดียว",   how:"ยืนหันข้างให้กล้อง ยกเท้าข้างหนึ่งขึ้นจากพื้น ยืนด้วยขาเดียว"}
];
/* คะแนนทรงตัว 0-3 ตามท่าสูงสุดที่ยืนครบ 10 วินาที */
function balanceScore(passed){
  if(passed>=4)return {score:3, nm:"ทรงตัวดีมาก — ยืนขาเดียวได้ครบ"};
  if(passed>=3)return {score:2, nm:"ทรงตัวดี — ยืนต่อเท้าได้ครบ"};
  if(passed>=2)return {score:1, nm:"ทรงตัวพอใช้ — ยืนต่อเท้าไม่ครบ 10 วินาที"};
  return {score:0, nm:"ทรงตัวควรเฝ้าระวัง — ยืนกึ่งต่อเท้าไม่ครบ"};
}

async function startTugPipeline(){
  camFullscreen();
  var video=document.getElementById("vid"),canvas=document.getElementById("cv"),ctx=canvas.getContext("2d");
  var tag=document.getElementById("tag"),coach=document.getElementById("coach"),
      clk=document.getElementById("tugclk"),phaseEl=document.getElementById("tphase"),
      startBtn=document.getElementById("tugStart");
  var stream;
  setStatus("yellow","กำลังเปิดกล้อง กรุณารอสักครู่");
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:720},height:{ideal:1280}},audio:false})}
  catch(e){tag.textContent="เปิดกล้องไม่ได้";setStatus("red","เปิดกล้องไม่ได้ — ข้ามขั้นนี้ได้");return}
  S.cam=stream;video.srcObject=stream;/* บางเบราว์เซอร์ play() ค้างไม่ resolve เมื่อหน้าจอถูกซ่อนหรือสตรีมผิดปกติ
     ใส่เพดานเวลาไว้ 1.5 วินาที เพื่อไม่ให้การทดสอบค้างตั้งแต่เปิดกล้อง */
  await Promise.race([video.play().catch(function(){}),new Promise(function(r){setTimeout(r,1500)})]);
  try{await loadModel(tag)}catch(e){tag.textContent="โหลดโมเดลไม่สำเร็จ";setStatus("red","โหลดระบบไม่สำเร็จ — ข้ามขั้นนี้ได้");return}
  tag.textContent="พร้อมแล้ว";

  /* phase: waitSit → arming → active → done */
  var phase="waitSit", TUG=null, seatedN=0, cdTimer=null, introDone=false, armed=false;
  var sitRef=S.draft.sitRef, standRef=S.draft.standRef, range=standRef-sitRef;
  var PH={waitSit:"รอท่านนั่ง",arming:"นับถอยหลัง",waiting:"พร้อม",rising:"กำลังลุก",
          standing:"ยืนแล้ว",walkOut:"ขาไป",walkBack:"ขากลับ",done:"เสร็จ"};

  function clearCd(){ if(cdTimer){clearInterval(cdTimer);cdTimer=null} }

  /* ---------- นับ 3-2-1 แล้วปล่อยสัญญาณเริ่ม ---------- */
  function countdown(){
    if(phase!=="waitSit")return;
    phase="arming"; startBtn.disabled=true; startBtn.textContent="กำลังนับถอยหลัง…";
    phaseEl.textContent=PH.arming;
    var n=3, w={3:"สาม",2:"สอง",1:"หนึ่ง"};
    setStatus("green","พร้อมทดสอบ — เตรียมตัว "+n,false);
    coach.textContent="พร้อมทดสอบ — เตรียมตัว "+n;
    speak("พร้อมทดสอบแล้ว เตรียมตัว สาม");
    clearCd();
    cdTimer=setInterval(function(){
      if(S.screen!=="tug"){clearCd();return}
      n--;
      if(n>=1){ setStatus("green","เตรียมตัว "+n,false); coach.textContent="เตรียมตัว "+n; speak(w[n]); }
      else { clearCd(); begin(); }
    },1000);
  }
  function begin(){
    phase="active";
    TUG=new TugTracker({sitRef:sitRef,standRef:standRef});
    /* CDC ให้เริ่มจับเวลาที่สัญญาณ "เริ่ม" ไม่ใช่ตอนผู้รับการประเมินขยับ */
    TUG.goAt=performance.now();
    setStatus("green","เริ่ม — ลุกขึ้นแล้วเดินไปที่ป้าย",false);
    coach.textContent="เริ่ม — ลุกขึ้น เดินไปที่ป้าย หมุนกลับ แล้วมานั่งลง";
    speak("เริ่ม ลุกขึ้น เดินไปที่ป้าย หมุนกลับ แล้วกลับมานั่งลง");
  }

  function loop(){
    if(S.screen!=="tug")return;
    var lm=detectPose(video);
    drawPose(ctx,canvas,video,lm);
    var m=lm?hipRatio(lm):null;

    if(phase==="waitSit"){
      /* รอให้กลับมานั่งเก้าอี้จริง ๆ ก่อน จึงจะประกาศพร้อมทดสอบ */
      var seated = m!=null && m<=sitRef+range*0.22;
      if(seated)seatedN++; else seatedN=0;
      phaseEl.textContent=PH.waitSit;
      if(!lm){
        setStatus("yellow","ขยับให้กล้องเห็นทั้งตัวและเก้าอี้",false);
      }else if(seated){
        if(!armed){
          setStatus("green","เห็นแล้วว่าท่านนั่งอยู่",false);
          coach.textContent="เห็นแล้วว่าท่านนั่งอยู่";
        }
      }else{
        setStatus("yellow","วางป้ายให้ครบ แล้วกลับมานั่งที่เก้าอี้",false);
        coach.textContent="วางป้ายให้ครบ แล้วกลับมานั่งพิงพนักเก้าอี้";
      }
      if(seatedN>=45&&!armed){ armed=true;   /* นั่งนิ่งราว 1.8 วิ — ประกาศแล้วรอคำสั่ง ไม่เริ่มเอง */
        setStatus("green","นั่งพร้อมแล้ว — "+vcHint(),false);
        coach.textContent='พร้อมแล้ว — พูดว่า "เริ่มทดสอบ" หรือกดปุ่มเริ่ม';
        speak("เห็นแล้วว่าท่านนั่งพร้อม เมื่อพร้อมทดสอบ พูดว่า เริ่มทดสอบ หรือกดปุ่มเริ่ม");
      }
    }
    else if(phase==="active"&&lm&&m!=null){
      var sw=shoulderWidth(lm), cx=(lm[LM.LSH].x+lm[LM.RSH].x)/2;
      var ev=TUG.pushFrame(m,sw,cx,performance.now());
      phaseEl.textContent=PH[TUG.state]||"—";
      if(ev&&ev.event==="walk"){coach.textContent="เดินไปให้ถึงป้ายจุดกลับ 3 เมตร";speak("เดินไปที่ป้ายได้เลย")}
      if(ev&&ev.event==="turn"){coach.textContent="ถึงจุดกลับแล้ว — เดินกลับมานั่งลง";speak("ถึงจุดกลับแล้ว เดินกลับมานั่งลงได้เลย")}
      if(ev&&ev.event==="finish"){ finishVisionTug(ev); return }
    }

    if(phase==="active"&&TUG&&TUG.goAt!=null)
      clk.textContent=((performance.now()-TUG.goAt)/1000).toFixed(1);
    if(phase==="active"&&TUG&&TUG.goAt!=null&&performance.now()-TUG.goAt>75000)
      coach.textContent="หากนั่งลงแล้วระบบไม่หยุด กดข้ามขั้นนี้ได้ — คะแนนส่วนอื่นยังครบ";
    RAF=requestAnimationFrame(loop);
  }
  loop();

  startBtn.addEventListener("click",function(){ if(phase==="waitSit")countdown(); });
  vcStart(function(cmd){
    if(cmd==="start"&&phase==="waitSit")countdown();
    else if(cmd==="stop"&&phase!=="done"){var b=document.getElementById("tugSkip");if(b)b.click()}
  });

  if(!introDone){
    introDone=true;
    setStatus("yellow","วางป้าย 2 จุด แล้วกลับมานั่งเก้าอี้",false);
    speak("การทดสอบลุกเดินสามเมตร กรุณาวางป้ายจุดเริ่มไว้ที่เก้าอี้ และป้ายจุดกลับให้ห่างสามเมตร "+
          "เมื่อวางเสร็จแล้ว กลับมานั่งพิงพนักเก้าอี้ เมื่อระบบเห็นว่าท่านนั่งแล้ว พูดว่า เริ่มทดสอบ ระบบจึงจะนับถอยหลัง");
  }
}

function finishVisionTug(ev){
  stopCam();
  S.draft.tug=Math.round(ev.elapsed*10)/10;
  S.draft.tugOut=ev.out!=null?Math.round(ev.out*10)/10:null;
  S.draft.tugBack=ev.back!=null?Math.round(ev.back*10)/10:null;
  S.draft.tugDistanceOk=!!ev.distanceOk;
  S.draft.tugDrift=ev.drift?Math.round(ev.drift.max*100)/100:null;
  S.draft.tugReaction=ev.reaction!=null?Math.round(ev.reaction*10)/10:null;
  var g=gaitLabel(ev.drift);
  audit("วัดลุกเดิน 3 เมตร (TUG ไป-กลับ ตามโปรโตคอล CDC)",
    "รวม "+S.draft.tug.toFixed(1)+" วิ (จับเวลาตั้งแต่สัญญาณเริ่ม)"+
    (S.draft.tugReaction!=null?" · เวลาตอบสนอง "+S.draft.tugReaction.toFixed(1)+" วิ":"")+
    (S.draft.tugOut!=null?" · ขาไป "+S.draft.tugOut.toFixed(1)+" วิ · ขากลับ "+S.draft.tugBack.toFixed(1)+" วิ":"")+
    " · "+(ev.distanceOk?"เดินครบระยะ":"ระยะอาจไม่ครบ 3 เมตร — ไม่นำมาคัดกรอง")+
    " · การเดิน: "+g.nm);
  setStatus(S.draft.tug>=12?"yellow":"green",
    "เสร็จสิ้น — ใช้เวลา "+S.draft.tug.toFixed(1)+" วินาที · "+g.nm,false);
  speak("เสร็จสิ้น บันทึกเรียบร้อยแล้ว ใช้เวลา "+Math.round(ev.elapsed)+" วินาที "+
        (ev.distanceOk?"เดินครบระยะ":"ระยะเดินอาจไม่ครบสามเมตร")+
        " ขั้นตอนต่อไป ทดสอบการทรงตัวสี่ท่า");
  toast("ลุกเดิน "+S.draft.tug.toFixed(1)+" วิ · "+g.nm);
  setTimeout(function(){ if(S.screen==="tug")go("balance") },3200);
}

  '<b>ผลผ่าน/ไม่ผ่านยืนยันโดยท่านหรือผู้ดูแลเสมอ</b> — ระบบไม่ใช้ค่าความโคลงจากกล้องตัดสินผล '+
  'เพราะการวัดการแกว่งของร่างกายให้เชื่อถือได้ต้องใช้อุปกรณ์อย่าง force plate หรือเซ็นเซอร์ติดตัว</div></div>';
  document.getElementById("bStop").addEventListener("click",function(){
    stopCam();
    audit("หยุดการทดสอบทรงตัวกลางคัน","ผู้ใช้เลือกตอบด้วยตนเอง");
    go("q",0);
  });
  startBalancePipeline();
}

async function startBalancePipeline(){
  camFullscreen();
  var video=document.getElementById("vid"),canvas=document.getElementById("cv"),ctx=canvas.getContext("2d");
  var tag=document.getElementById("tag"),coach=document.getElementById("coach"),
      secEl=document.getElementById("bsec"),swayEl=document.getElementById("bsway"),trk=document.getElementById("btrk"),
      startBtn=document.getElementById("bStart"),retryBtn=document.getElementById("bRetry"),
      confirmBox=document.getElementById("bConfirm"),obsBox=document.getElementById("bObs"),
      bcQ=document.getElementById("bcQ");
  var stream;
  setStatus("yellow","กำลังเปิดกล้อง กรุณารอสักครู่");
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:720},height:{ideal:1280}},audio:false})}
  catch(e){setStatus("red","เปิดกล้องไม่ได้ — กดปุ่มหยุดเพื่อตอบด้วยตนเอง");
    coach.textContent="เปิดกล้องไม่ได้ — กดปุ่มหยุดด้านล่างเพื่อตอบเอง";return}
  S.cam=stream;video.srcObject=stream;
  await Promise.race([video.play().catch(function(){}),new Promise(function(r){setTimeout(r,1500)})]);
  setStatus("yellow","กำลังโหลดระบบตรวจจับท่าทาง",false);
  try{await loadModel(tag)}
  catch(e){setStatus("red","โหลดระบบไม่สำเร็จ — กดปุ่มหยุดเพื่อตอบด้วยตนเอง");return}

  /* phase: setup → arming → holding → between → done */
  var stage=0, phase="intro", results=[], attempts=[0,0,0,0], armed=false;
  var ENG=null, t0=0, cdTimer=null, halfWarned=false, extraN=0, pending=null, askTimer=null;

  function chip(i,cls,txt){
    var el=document.getElementById("bc"+i); if(!el)return;
    el.className=cls||""; if(txt)el.textContent=txt;
  }
  function clearCd(){ if(cdTimer){clearInterval(cdTimer);cdTimer=null} }

  function announce(retry){
    var st=BAL_STAGES[stage];
    phase="setup"; armed=false; halfWarned=false; extraN=0; ENG=new BalanceEngine(stage);
    confirmBox.hidden=true;
    secEl.textContent=BAL_SECONDS; trk.style.width="0%"; swayEl.textContent="—";
    startBtn.hidden=false; startBtn.disabled=false;
    startBtn.textContent="เริ่มท่าที่ "+(stage+1)+" (แทนคำสั่งเสียงได้)";
    retryBtn.hidden=true;
    chip(stage,"on");
    coach.innerHTML='<b>ท่าที่ '+(stage+1)+' · '+esc(st.nm)+'</b><br>'+esc(st.how);
    setStatus("yellow","ท่าที่ "+(stage+1)+" จาก 4 — "+st.nm,false);
    speak((retry?"ลองท่านี้ใหม่อีกครั้ง ":"ต่อไป ")+"ท่าที่ "+(stage+1)+" จาก 4 ท่า "+st.nm+" "+st.how+
          " เมื่อพร้อม กรุณาพูดว่า เริ่ม");
  }

  function countdown(){
    if(phase!=="setup")return;
    phase="arming"; startBtn.disabled=true; startBtn.textContent="กำลังนับถอยหลัง…";
    var n=3, w={3:"สาม",2:"สอง",1:"หนึ่ง"};
    setStatus("green","เตรียมตัว "+n,false);
    coach.textContent="เตรียมตัว "+n;
    speak("พร้อมแล้ว เตรียมตัว สาม");
    clearCd();
    cdTimer=setInterval(function(){
      if(S.screen!=="balance"){clearCd();return}
      n--;
      if(n>=1){setStatus("green","เตรียมตัว "+n,false);coach.textContent="เตรียมตัว "+n;speak(w[n])}
      else{clearCd();beginHold()}
    },1000);
  }
  function beginHold(){
    phase="holding"; t0=performance.now(); halfWarned=false; extraN=0;
    ENG.beginHold();
    attempts[stage]++;
    confirmBox.hidden=true;
    coach.innerHTML='<b>'+esc(BAL_STAGES[stage].nm)+'</b> — ยืนนิ่ง ๆ อย่าขยับเท้า';
    setStatus("green","กำลังจับเวลา — ยืนนิ่ง 10 วินาที ลืมตาไว้",false);
    speak("เริ่มจับเวลา ยืนนิ่ง ๆ สิบวินาที");
  }

  /* ---------- จบการจับเวลา → ให้ "คน" ยืนยันผลเสมอ ----------
     กล้องรายงานสิ่งที่สังเกตเห็น แต่ไม่ตัดสินแทน เพราะเกณฑ์ CDC คือ
     "ยืนครบ 10 วินาทีโดยไม่ขยับเท้าและไม่ต้องจับพยุง" ซึ่งการจับพยุง
     และการเสียสมดุลจริง คนที่อยู่ตรงนั้นเห็นชัดกว่ากล้องมือถือมาก */
  function endStage(held,reason){
    if(phase!=="holding")return;
    phase="confirm"; clearCd();
    var o=ENG.observe();
    if(extraN>20)o.obs.push("เห็นคนมากกว่าหนึ่งคนในภาพ — หากมีการช่วยพยุงถือว่าไม่ผ่าน");
    pending={held:Math.round(held*10)/10, reason:reason||null, o:o};
    startBtn.hidden=true; retryBtn.hidden=true;
    var full=held>=BAL_SECONDS-0.3;

    bcQ.textContent=full?("ยืนครบ "+BAL_SECONDS+" วินาทีหรือไม่")
                        :("หยุดที่ "+held.toFixed(1)+" วินาที — บันทึกผลอย่างไร");
    obsBox.innerHTML='<b>กล้องสังเกตเห็น</b> (ข้อมูลประกอบ ไม่ใช่คำตัดสิน)<br>· '+
      o.obs.map(esc).join('<br>· ')+
      '<br>· เห็นเท้าชัด '+o.feetSeen+'% ของเวลาทดสอบ'+
      (o.sway!=null?'<br>· ความโคลงของลำตัว: '+esc(swayLabel(o.sway).nm)+' <i>(ข้อสังเกตเชิงสำรวจ ไม่ใช้ตัดสินผล)</i>':'');
    confirmBox.hidden=false;

    var q=full?("ยืนครบ "+BAL_SECONDS+" วินาที โดยไม่ขยับเท้าและไม่ต้องจับพยุง ใช่หรือไม่ ")
              :("หยุดที่ "+held.toFixed(0)+" วินาที ");
    var hint=o.suggest==="fail"?"กล้องเห็นการขยับเท้าหรือการทรุดตัว ":
             (o.suggest==="unsure"?"กล้องมองเห็นไม่ชัดพอ จึงไม่สรุปแทนท่าน ":"");
    setStatus(o.suggest==="fail"?"yellow":"green", "รอการยืนยันผล — พูดว่า ผ่าน หรือ ไม่ผ่าน", false);
    coach.innerHTML='<b>กรุณายืนยันผล</b> — พูดว่า "ผ่าน" หรือ "ไม่ผ่าน" หรือกดปุ่ม';
    speak(q+hint+"กรุณาพูดว่า ผ่าน หรือ ไม่ผ่าน หรือกดปุ่มบนหน้าจอ");

    /* ถามซ้ำครั้งเดียวเมื่อเงียบไป 25 วินาที แล้วเปิดทางออกให้กดเอง
       ไม่ตัดสินใจแทนโดยอัตโนมัติ และไม่ปล่อยให้ค้างตลอดไป */
    if(askTimer)clearTimeout(askTimer);
    askTimer=setTimeout(function(){
      /* ต้องเช็คหน้าจอด้วย ไม่ใช่แค่ phase — ผู้ใช้อาจกด "หยุดการทดสอบ"
         ออกไปหน้าคำถามแล้ว ถ้าเช็คแต่ phase เสียงจะไปพูดผิดหน้า */
      if(S.screen!=="balance"||phase!=="confirm")return;
      speak("ยังรอการยืนยันผลอยู่ กรุณาพูดว่า ผ่าน หรือ ไม่ผ่าน หรือกดปุ่มบนหน้าจอ");
      coach.innerHTML='<b>ยังรอการยืนยัน</b> — หากไม่มีผู้ยืนยัน ให้กดปุ่มตามที่เกิดขึ้นจริง';
    },25000);
  }

  /* ผลถูกบันทึกเมื่อคนกดหรือพูดยืนยันเท่านั้น */
  function settle(pass){
    if(phase!=="confirm"||!pending)return;
    if(askTimer){clearTimeout(askTimer);askTimer=null}
    phase="between"; confirmBox.hidden=true;
    var o=pending.o;
    results[stage]={held:pending.held, pass:!!pass,
                    stage:BAL_STAGES[stage].nm, attempts:attempts[stage], reason:pending.reason,
                    footStance:ENG.startStance!=null?STANCE_NM[ENG.startStance]:null,
                    footOk:ENG.startStance===stage,
                    aiObs:o.obs, aiSuggest:o.suggest, aiConfidence:o.confidence,
                    feetSeenPct:o.feetSeen, decidedBy:"human",
                    sway:o.sway};                      /* เก็บไว้เชิงสำรวจเท่านั้น */
    chip(stage, pass?"ok":"bad");
    pending=null;

    if(pass){
      setStatus("green","ท่าที่ "+(stage+1)+" ผ่าน — บันทึกแล้ว",false);
      coach.innerHTML='<b>ท่าที่ '+(stage+1)+' ผ่าน</b> — บันทึกเรียบร้อยแล้ว';
      speak("บันทึกว่าผ่านแล้ว");
      stage++;
      if(stage>=BAL_STAGES.length){setTimeout(function(){finishAll("ทำครบทุกท่า")},2200);return}
      setTimeout(function(){ if(S.screen==="balance")announce(false) },2200);
      return;
    }
    setStatus("yellow","ท่าที่ "+(stage+1)+" ไม่ผ่าน",false);
    coach.innerHTML='<b>บันทึกว่าไม่ผ่าน</b> — พูดว่า "ทำใหม่" เพื่อลองอีกครั้ง หรือ "ทำต่อ" เพื่อสรุปผล';
    speak("บันทึกว่าไม่ผ่านแล้ว ถ้าต้องการลองอีกครั้ง พูดว่า ทำใหม่ ถ้าจะสรุปผล พูดว่า ทำต่อ");
    if(attempts[stage]<2){
      retryBtn.hidden=false;
      var wait=setTimeout(function(){ if(phase==="between")doFinishFail() },20000);
      retryBtn.onclick=function(){clearTimeout(wait);retryBtn.hidden=true;announce(true)};
      pendingRetry=function(){clearTimeout(wait);retryBtn.hidden=true;announce(true)};
      pendingNext=function(){clearTimeout(wait);doFinishFail()};
    }else{
      pendingRetry=null; pendingNext=doFinishFail;
      setTimeout(doFinishFail,3000);
    }
    function doFinishFail(){
      if(phase!=="between")return;
      for(var i=stage+1;i<BAL_STAGES.length;i++)chip(i,"",""+(i+1)+" ไม่ได้ทำ");
      finishAll("หยุดที่ท่าที่ "+(stage+1)+" เพราะยืนไม่ผ่านตามการยืนยันของผู้ทดสอบ");
    }
  }
  var pendingRetry=null, pendingNext=null;

  /* หยุดเพื่อความปลอดภัย — จบทั้งชุดทันที ไม่ต้องทำท่าที่เหลือ */
  function haltSafe(){
    if(askTimer){clearTimeout(askTimer);askTimer=null}
    clearCd(); confirmBox.hidden=true;
    if(pending){
      results[stage]={held:pending.held, pass:false, stage:BAL_STAGES[stage].nm,
        attempts:attempts[stage], reason:"หยุดเพื่อความปลอดภัย",
        aiObs:pending.o.obs, aiSuggest:pending.o.suggest, aiConfidence:pending.o.confidence,
        feetSeenPct:pending.o.feetSeen, decidedBy:"human-safety", sway:pending.o.sway};
      chip(stage,"bad"); pending=null;
    }
    for(var i=stage+1;i<BAL_STAGES.length;i++)chip(i,"",""+(i+1)+" ไม่ได้ทำ");
    speak("รับทราบ หยุดการทดสอบเพื่อความปลอดภัย บันทึกไว้แล้ว");
    finishAll("หยุดเพื่อความปลอดภัย");
  }

  function finishAll(reason){
    phase="done"; clearCd();
    var passed=0;
    results.forEach(function(r){ if(r&&r.pass)passed++ });   /* นับจากผลที่คนยืนยัน */
    var sc=balanceScore(passed);
    S.draft.balStages=results;
    S.draft.balPassed=passed;
    S.draft.balScoreHint=sc.score;
    S.draft.balLabel=sc.nm;
    /* ค่าความโคลงเก็บไว้เชิงสำรวจเท่านั้น ไม่มีผลต่อคะแนนหรือระดับความเสี่ยง */
    var lastOk=results.filter(function(r){return r&&r.sway!=null}).pop();
    S.draft.swayValue=lastOk?lastOk.sway:null;
    S.draft.swayHeld=results.length?(results[results.length-1]||{}).held:null;
    S.draft.swayLabel=lastOk?swayLabel(lastOk.sway).nm:null;
    S.draft.balConfirmedBy="human";
    S.draft.balAiAgree=results.filter(function(r){
      return r&&r.aiSuggest&&((r.aiSuggest==="pass")===!!r.pass)}).length;
    stopCam();
    audit("ทดสอบการทรงตัว 4 ท่า (CDC 4-Stage Balance Test)",
      results.map(function(r,i){return r?((i+1)+"."+BAL_STAGES[i].nm+" "+r.held.toFixed(1)+" วิ "+(r.pass?"ผ่าน":"ไม่ผ่าน")+
        (r.aiSuggest&&(r.aiSuggest==="pass")!==!!r.pass?" (กล้องเห็นต่าง: "+r.aiSuggest+")":"")+
        (r.attempts>1?" ลอง "+r.attempts+" ครั้ง":"")):null})
             .filter(Boolean).join(" · ")+
      " · ผ่าน "+passed+"/4 ท่า · "+sc.nm+" · ผลยืนยันโดยผู้ทดสอบ/ผู้ดูแล กล้องทำหน้าที่ช่วยจัดท่าและเฝ้าระวังเท่านั้น"+
      (reason?" · "+reason:""));
    setStatus(passed>=3?"green":(passed>=2?"yellow":"red"),
      "ทดสอบเสร็จสมบูรณ์ — ยืนผ่าน "+passed+" จาก 4 ท่า · "+sc.nm,false);
    coach.innerHTML='<b>ทดสอบเสร็จสมบูรณ์</b> — ยืนผ่าน '+passed+' จาก 4 ท่า';
    speak("การทดสอบการทรงตัวเสร็จสมบูรณ์ ยืนผ่าน "+passed+" จาก 4 ท่า บันทึกเรียบร้อยแล้ว ขั้นตอนต่อไป กรุณายืนยันความรู้สึกของท่านเอง");
    setTimeout(function(){ if(S.screen==="balance")go("q",0) },3400);
  }

  function loop(){
    if(S.screen!=="balance")return;
    var lm=detectPose(video);
    drawPose(ctx,canvas,video,lm);

    if(phase==="setup"&&ENG){
      var g=ENG.frame(lm);
      if(!g.seen)setStatus("yellow","ถอยให้กล้องเห็นทั้งตัว แล้วยืนหันข้าง",false);
      else{
        var stTxt=g.stance!=null?("กล้องเห็นท่า: "+STANCE_NM[g.stance]):null;
        if(g.sideOk===false&&!armed)
          setStatus("yellow","หันข้างให้กล้อง เพื่อให้เห็นตำแหน่งเท้าชัดที่สุด",false);
        else if(g.ready&&(g.stanceOk||g.stance==null)){
          /* นิ่งแล้ว + เท้าตรงท่า (หรือมองไม่เห็นเท้า) → ประกาศครั้งเดียว แล้วรอคำสั่ง */
          if(!armed){armed=true;
            setStatus("green",(g.stanceOk?"เท้าอยู่ในท่าถูกต้อง":"พร้อมแล้ว")+" — "+vcHint(),false);
            coach.innerHTML='<b>'+(g.stanceOk?"เท้าอยู่ในท่า "+esc(BAL_STAGES[stage].nm)+" ถูกต้อง":"พร้อมแล้ว")+'</b> — พูดว่า "เริ่มทดสอบ" หรือกดปุ่ม';
            speak((g.stanceOk?"จัดเท้าถูกต้องแล้ว ":"พร้อมแล้ว ")+"เมื่อพร้อม พูดว่า เริ่มทดสอบ");
          }
        }
        else if(g.ready&&g.stanceOk===false)
          setStatus("yellow",(stTxt||"ท่ายังไม่ตรง")+" — กรุณาจัดเท้าเป็นท่า "+BAL_STAGES[stage].nm,false);
        else if(!armed)
          setStatus("yellow","ยืนนิ่ง ๆ ในท่า "+BAL_STAGES[stage].nm+(stTxt?" · "+stTxt:""),false);
      }
    }
    else if(phase==="holding"&&ENG){
      var h=ENG.frame(lm);
      var el=(performance.now()-t0)/1000;
      secEl.textContent=Math.max(0,BAL_SECONDS-el).toFixed(0);
      trk.style.width=Math.min(100,el/BAL_SECONDS*100)+"%";
      if(h.sway!=null)swayEl.textContent="สังเกต: "+swayLabel(h.sway).nm;
      if(POSE_COUNT>1)extraN++;
      if(h.remind)speak(h.remind);
      if(!halfWarned&&el>=BAL_SECONDS/2){halfWarned=true;speak("เหลืออีก ห้า วินาที")}
      if(h.dropped){speak("ระวัง กรุณาจับที่ยึดและให้ผู้ดูแลเข้าไปช่วย");endStage(Math.min(el,BAL_SECONDS),h.why);return}
      if(h.fail){endStage(Math.min(el,BAL_SECONDS),h.why);return}
      if(el>=BAL_SECONDS){endStage(BAL_SECONDS,null);return}
      if(!h.seen&&h.lost>30)coach.textContent="ขยับให้กล้องเห็นตัว…";
    }
    RAF=requestAnimationFrame(loop);
  }
  loop();

  startBtn.addEventListener("click",function(){ if(phase==="setup")countdown() });
  document.getElementById("bcPass").addEventListener("click",function(){settle(true)});
  document.getElementById("bcFail").addEventListener("click",function(){settle(false)});
  document.getElementById("bcHalt").addEventListener("click",haltSafe);
  document.getElementById("bAgain").addEventListener("click",function(){
    if(phase==="between"&&pendingRetry)pendingRetry();
    else if(phase==="setup"||phase==="holding"){clearCd();announce(true)}
  });
  document.getElementById("bHelp").addEventListener("click",function(){speak(VC_HELP)});
  /* คำสั่งเสียงครบชุด — ทุกคำมีปุ่มบนจอทดแทนได้เสมอ */
  vcStart(function(cmd){
    if(cmd==="start"&&phase==="setup"){countdown();return}
    if(cmd==="pass"&&phase==="confirm"){settle(true);return}
    if(cmd==="fail"&&phase==="confirm"){settle(false);return}
    if(cmd==="done"&&phase==="confirm"){settle(pending&&pending.held>=BAL_SECONDS-0.3);return}
    if(cmd==="again"){
      if(phase==="between"&&pendingRetry){pendingRetry();return}
      if(phase==="setup"||phase==="holding"){clearCd();announce(true);return}
    }
    if(cmd==="next"&&phase==="between"&&pendingNext){pendingNext();return}
    if(cmd==="stop"){ if(phase==="confirm"||phase==="holding")haltSafe();
                      else{var b=document.getElementById("bStop");if(b)b.click()} }
  });

  phase="intro";
  setStatus("yellow","ยืนห่างกล้อง 2–3 เมตร ให้เห็นทั้งตัว",false);

/* ============================================================
   ดัชนีบาร์เธล ฉบับย่อ 5 ด้าน (Short-Form Barthel Index)
   ------------------------------------------------------------
   Hobart & Thompson 2001 (J Neurol Neurosurg Psychiatry 71:225-230)
   พิสูจน์ว่า 5 ด้าน — ย้ายตัว อาบน้ำ ใช้ห้องส้วม ขึ้นบันได เดิน —
   ให้ข้อมูลเทียบเท่าฉบับเต็ม 10 ด้าน (สหสัมพันธ์สูงกว่า 0.95)
   คะแนนย่อเต็ม 11 → ประมาณฉบับเต็ม 20 ด้วยสัดส่วน 20/11
   เกณฑ์ไทยคงเดิม: 12–20 ติดสังคม · 5–11 ติดบ้าน · 0–4 ติดเตียง
   ============================================================ */
var BARTHEL=[
  {k:"transfer",nm:"การย้ายตัว (จากเตียงไปเก้าอี้ และกลับ)",max:3,
   o:[["ทำได้เองทั้งหมด",3],["ต้องช่วยเล็กน้อย หรือมีคนคอยดู",2],["ต้องช่วยมาก แต่ยังนั่งได้เอง",1],["ต้องใช้คนยกทั้งหมด",0]]},
  {k:"bath",nm:"การอาบน้ำ",max:1,
   o:[["อาบเองได้ทั้งหมด",1],["ต้องมีคนช่วย",0]]},
  {k:"toilet",nm:"การใช้ห้องส้วม",max:2,
   o:[["ทำได้เองทั้งหมด",2],["ต้องมีคนช่วยบ้าง",1],["ทำเองไม่ได้",0]]},
  {k:"stairs",nm:"การขึ้นลงบันได 1 ชั้น",max:2,
   o:[["ขึ้นลงได้เอง",2],["ต้องมีคนช่วยหรือคอยดู",1],["ขึ้นลงไม่ได้",0]]},
  {k:"mobility",nm:"การเดินในบ้าน",max:3,
   o:[["เดินได้เอง (ใช้ไม้เท้าได้)",3],["เดินได้แต่ต้องมีคนพยุง",2],["ใช้รถเข็นได้เอง",1],["เดินหรือเคลื่อนที่เองไม่ได้",0]]}
];
var BARTHEL_MAX=11;
function barthelTotal(a){var t=0;BARTHEL.forEach(function(it){if(a[it.k]!=null)t+=a[it.k]});return t}
/* ประมาณค่าดัชนีเต็ม 20 จากฉบับย่อ เพื่อคงเกณฑ์ไทยและเทียบผลเก่าได้ */
function barthelEst20(sf){return Math.round(sf*20/BARTHEL_MAX)}
function barthelBand(t){

/* ============================================================
   ยา — Medication Classification Pipeline
   ------------------------------------------------------------
     ถ่ายรูปซองยา → OCR ในเครื่อง (Tesseract.js ไทย+อังกฤษ)
     → ระบบเสนอชื่อยา → ผู้ใช้/ผู้ดูแล ยืนยัน · แก้ · ไม่แน่ใจ
     → จับคู่ตัวยาสำคัญ → ATC → กลุ่ม FRID
     → เข้าเกณฑ์ → ส่งเภสัชกรทบทวน (เปิดคำขออัตโนมัติที่ฐานข้อมูล)

   ทำไมไม่ให้ AI ตัดสินเอง: ฉลากยาไทยอ่านยาก ชื่อการค้าหลากหลาย
   และความผิดพลาดเรื่องยาเสี่ยงสูงกว่าเรื่องอื่นมาก ระบบจึง "เสนอ"
   แล้วให้คนกดยืนยันทุกรายการ ถ้า OCR ไม่มั่นใจ ถอยไปให้เลือก
   "ใช้รักษาอะไร" แล้วให้เภสัชกรจัดกลุ่มแทน — ไม่เดา
   ระบบไม่สั่งหยุด ลด หรือเพิ่มยา ทุกกรณี
   ============================================================ */
var OCR={worker:null,state:"idle"};
async function ocrLoad(onStatus){
  if(OCR.worker)return OCR.worker;
  OCR.state="loading";
  if(onStatus)onStatus("กำลังโหลดตัวอ่านฉลาก (ครั้งแรกใช้เวลาสักครู่)…");
  var mod=await import("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js");
  var T=mod.default||mod;
  OCR.worker=await T.createWorker(["tha","eng"],1,{
    logger:function(m){ if(onStatus&&m.status==="recognizing text")onStatus("กำลังอ่านฉลาก "+Math.round((m.progress||0)*100)+"%") }
  });
  OCR.state="ready";
  return OCR.worker;
}
/* ย่อรูปอย่างเดียว ไม่ปรับสี — รูปที่เก็บให้เภสัชกรต้องคงสีเดิม
   ความละเอียดตั้งต้น 2000px เพราะตัวหนังสือบนฉลากยาไทยเล็ก ที่ 1400px อ่านพลาดบ่อย */
function shrinkImage(file,maxW){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var sc=Math.min(1,(maxW||2000)/img.width);
      var c=document.createElement("canvas");
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){res({blob:b,canvas:c})},"image/jpeg",0.85);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("เปิดรูปไม่ได้"))};
    img.src=url;
  });
}
/* ============================================================
   เตรียมภาพ 3 แบบสำหรับอ่านฉลาก
   ------------------------------------------------------------
   ฉลากยามีทั้งพื้นขาว พื้นสี และฟอยล์สะท้อนแสง — สูตรปรับภาพสูตรเดียว
   จึงล้มเหลวบ่อยทั้งที่รูปคมชัด อ่านทีละแบบแล้วเลือกผลที่ดีที่สุดแทน
   ============================================================ */
function ocrVariants(base){
  function mono(fn){
    var c=document.createElement("canvas"); c.width=base.width; c.height=base.height;
    var ctx=c.getContext("2d"); ctx.drawImage(base,0,0);
    var d=ctx.getImageData(0,0,c.width,c.height), px=d.data, i;
    var lum=new Float32Array(px.length/4), sum=0;
    for(i=0;i<px.length;i+=4){var g=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];lum[i/4]=g;sum+=g}
    var mean=sum/(px.length/4);
    for(i=0;i<px.length;i+=4){
      var v=fn(lum[i/4],mean);
      px[i]=px[i+1]=px[i+2]=v<0?0:v>255?255:v;
    }
    ctx.putImageData(d,0,0);
    return c;
  }
  return [
    mono(function(g){return (g-128)*1.35+128}),          /* คอนทราสต์ (สูตรเดิม) */
    mono(function(g){return g}),                          /* ขาวดำล้วน — ฉลากซีดบางแบบอ่านง่ายกว่า */
    mono(function(g,mean){return g>mean*0.92?255:0})      /* ตัดสองระดับ — ตัวพิมพ์บนพื้นสี/ฟอยล์ */
  ];
}

  var status=function(t){var e=document.getElementById("medStatus");if(e)e.textContent=t||""};

  function multi(wrap,list,arrKey){
    document.getElementById(wrap).innerHTML=list.map(function(g){
      var on=(m[arrKey]||[]).indexOf(g.k)>=0;
      return '<button class="pick" data-mk="'+arrKey+'" data-mv="'+g.k+'" style="'+

  function lvColor(lv){return lv===2?"var(--c1)":lv===1?"var(--c2)":lv===0?"var(--c4)":"var(--ink3)"}
  function renderList(){
    var el=document.getElementById("medList");
    if(!m.items.length){el.innerHTML='<p class="sub" style="margin:0 0 6px;color:var(--ink3)">ยังไม่มีรายการ</p>';return}
    el.innerHTML=m.items.map(function(x,ix){
      var c=x.inn?CSMeds.classify(x.inn):{frid:"unknown",lv:null,fridNm:"ยังไม่ระบุตัวยา — เภสัชกรจะช่วยจัดกลุ่ม"};
      if(x.frid&&x.frid!=="unknown"){c.frid=x.frid;c.lv=x.lv;c.fridNm=CSMeds.FRID[x.frid]?CSMeds.FRID[x.frid].nm:x.frid}
      var nm=x.inn||x.brand||(x.purpose?"ยาสำหรับ "+esc(x.purpose):"ยาไม่ทราบชื่อ");
      return '<div class="rowline" style="align-items:flex-start"><span class="k" style="flex:1">'+
        '<b>'+esc(nm)+'</b>'+(x.dose?' · '+esc(x.dose):'')+(x.freq?' · '+esc(x.freq):'')+
        '<br><span style="font-size:12.5px;color:'+lvColor(c.lv)+'">'+esc(c.fridNm)+'</span>'+
        (x.source==="photo_ocr"?'<span style="font-size:11.5px;color:var(--ink3)"> · อ่านจากรูป'+(x.conf!=null?' ('+Math.round(x.conf*100)+'%)':'')+'</span>':'')+
        '</span><button class="ghostb" data-rm="'+ix+'" style="width:auto;padding:6px 10px;margin:0;font-size:12.5px">ลบ</button></div>';
    }).join("");
    el.querySelectorAll("[data-rm]").forEach(function(b){b.addEventListener("click",function(){m.items.splice(+b.dataset.rm,1);renderList();syncSummary()})});
  }
  function syncSummary(){
    /* คงโครงสร้างเดิมของ purposes/fridScore ไว้ให้เอนจินความเสี่ยงและชั้นสัญญาณ */
    var sum=CSMeds.summarize(m.items.map(function(x){return {inn:x.inn,frid:x.frid,lv:x.lv}}));
    m.summary=sum;
    var derived=[];
    m.items.forEach(function(x){
      var c=x.frid&&x.frid!=="unknown"?{frid:x.frid,lv:x.lv}:(x.inn?CSMeds.classify(x.inn):null);
      if(c&&c.lv===2)derived.push(c.frid==="bzd"?"sleep":c.frid==="antidep"?"depr":c.frid==="opioid"?"pain":c.frid==="anticonv"?"seiz":"anx");
      else if(c&&c.lv===1)derived.push(c.frid==="antihtn"?"bp":c.frid==="diuretic"?"diur":c.frid==="relax"?"muscle":c.frid==="alpha"?"prost":c.frid==="bladder"?"incont":"allergy");
      else if(x.purpose)derived.push(x.purpose);
    });
    m.purposes=derived.filter(function(v,i,a){return a.indexOf(v)===i});
    if(m.count==null&&m.items.length)m.count=m.items.length>=10?4:m.items.length>=6?3:m.items.length>=4?2:1;
    document.getElementById("mGo").disabled=(m.count==null);
    var el=document.getElementById("mcWrap"); if(el)renderCount();
  }
  function renderCount(){
    document.getElementById("mcWrap").innerHTML=MED_COUNT.map(function(o){
      var on=m.count===o[1];
      return '<button class="pick" data-mc="'+o[1]+'" style="'+
        (on?"border-color:var(--brand);background:var(--surf2);font-weight:600":"")+'">'+(on?"✓ ":"")+esc(o[0])+'</button>';
    }).join("");
    V.querySelectorAll("[data-mc]").forEach(function(b){
      b.addEventListener("click",function(){
        m.count=+b.dataset.mc;
        if(m.count===0){m.items=[];m.purposes=[];m.changed=["none"];m.symptoms=[]}
        renderCount();renderList();syncSummary();renderChange();
      });
    });
    document.getElementById("mGo").disabled=(m.count==null);
  }
  function renderChange(){
    multi("mgWrap",MED_CHANGE,"changed");
    var changed=(m.changed||[]).filter(function(x){return x!=="none"}).length>0;
    document.getElementById("msCard").hidden=!changed;
    if(changed)multi("msWrap",MED_SYMPTOM,"symptoms");
    V.querySelectorAll("[data-mk]").forEach(function(b){
      b.addEventListener("click",function(){
        var key=b.dataset.mk, val=b.dataset.mv;
        if(!m[key])m[key]=[];
        var ix=m[key].indexOf(val);
        if(ix>=0)m[key].splice(ix,1);
        else{ if(val==="none")m[key]=["none"]; else m[key]=m[key].filter(function(x){return x!=="none"}).concat([val]); }
        renderChange();
      });
    });
  }

  /* ---------- กล่องงาน: ยืนยันชื่อยาที่ระบบเสนอ ---------- */
  function work(html){var w=document.getElementById("medWork");w.hidden=false;w.innerHTML=html}
  function workClose(){var w=document.getElementById("medWork");w.hidden=true;w.innerHTML=""}

  function confirmBox(cands,ctx){
    /* cands: [{inn,conf,token}] · ctx: {ocr,doses,freq,photoFile} */
    var top=cands[0];
    var opts=cands.slice(0,3).map(function(c,ix){
      var cl=CSMeds.classify(c.inn);
      return '<button class="pick" data-pick="'+ix+'" style="text-align:left"><b>'+esc(c.inn)+'</b>'+
        ' <span style="font-size:12px;color:var(--ink3)">('+Math.round(c.conf*100)+'% · เห็นคำว่า “'+esc(c.token)+'”)</span><br>'+
        '<span style="font-size:12.5px;color:'+lvColor(cl.lv)+'">'+esc(cl.fridNm)+'</span></button>';
    }).join("");
    work('<div class="notice" style="margin:0 0 10px"><b>ระบบตรวจพบ: '+esc(top.inn)+(ctx.doses&&ctx.doses[0]?' '+esc(ctx.doses[0]):'')+'</b><br>ถูกต้องหรือไม่? กดยืนยัน หรือเลือกตัวที่ถูก</div>'+
      opts+
      '<div class="field" style="margin-top:8px"><label>ขนาดยา (ถ้ามี)</label><input id="wDose" value="'+esc(ctx.doses&&ctx.doses[0]||"")+'" placeholder="เช่น 5 mg"></div>'+
      '<div class="field"><label>วิธีใช้ (ถ้ามี)</label><input id="wFreq" value="'+esc(ctx.freq&&ctx.freq[0]||"")+'" placeholder="เช่น ก่อนนอน"></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="cta" id="wOk" style="flex:1;margin:0">✓ ยืนยัน '+esc(top.inn)+'</button>'+
        '<button class="ghostb" id="wEdit" style="flex:1;margin:0">แก้ไขชื่อ</button>'+
        '<button class="ghostb" id="wUnsure" style="flex:1;margin:0">ไม่แน่ใจ</button></div>'+
      (ctx.ocr?'<details style="margin-top:8px"><summary style="font-size:12.5px;color:var(--ink3)">ข้อความที่อ่านได้จากรูป</summary><pre style="font-size:11.5px;white-space:pre-wrap;color:var(--ink2)">'+esc(ctx.ocr.slice(0,400))+'</pre></details>':''));
    var chosen=0;
    var pickBtns=document.querySelectorAll("[data-pick]");
    pickBtns.forEach(function(b){b.addEventListener("click",function(){chosen=+b.dataset.pick;pickBtns.forEach(function(x){x.style.borderColor="";x.style.fontWeight=""});b.style.borderColor="var(--brand)";b.style.fontWeight="600";document.getElementById("wOk").textContent="✓ ยืนยัน "+cands[chosen].inn})});
    document.getElementById("wOk").addEventListener("click",function(){
      var c=cands[chosen], cl=CSMeds.classify(c.inn);
      addItem({inn:c.inn,brand:c.token,dose:document.getElementById("wDose").value.trim(),freq:document.getElementById("wFreq").value.trim(),
               atc:cl.atc,frid:cl.frid,lv:cl.lv,source:ctx.ocr?"photo_ocr":"manual",conf:c.conf,ocr:ctx.ocr,photoFile:ctx.photoFile,by:"user"});
    });
    document.getElementById("wEdit").addEventListener("click",function(){manualBox(ctx)});
    document.getElementById("wUnsure").addEventListener("click",function(){purposeBox(ctx)});
  }
  function manualBox(ctx){
    ctx=ctx||{};
    work('<div class="field"><label>พิมพ์ชื่อยาตามที่เห็นบนซอง (ไทยหรืออังกฤษ)</label><input id="wName" placeholder="เช่น Amlodipine หรือ ยานอนหลับสีขาว" autofocus></div>'+
      '<div id="wSuggest"></div>'+
      '<div class="field"><label>ขนาดยา (ถ้ามี)</label><input id="wDose" value="'+esc(ctx.doses&&ctx.doses[0]||"")+'"></div>'+
      '<div style="display:flex;gap:8px"><button class="cta" id="wOk" style="flex:1;margin:0">บันทึก</button><button class="ghostb" id="wCancel" style="flex:1;margin:0">ยกเลิก</button></div>');
    var inp=document.getElementById("wName"), sug=document.getElementById("wSuggest");
    inp.addEventListener("input",function(){
      var r=CSMeds.matchToken(inp.value);
      sug.innerHTML=r?'<p class="sub" style="margin:0 0 6px;color:var(--c4)">น่าจะเป็น <b>'+esc(r.inn)+'</b> · '+esc(CSMeds.classify(r.inn).fridNm)+'</p>':'<p class="sub" style="margin:0 0 6px;color:var(--ink3)">ไม่พบในฐานข้อมูล — จะบันทึกชื่อตามที่พิมพ์ แล้วให้เภสัชกรจัดกลุ่ม</p>';
    });
    document.getElementById("wOk").addEventListener("click",function(){
      var nm=inp.value.trim(); if(!nm){toast("กรุณาพิมพ์ชื่อยา");return}
      var r=CSMeds.matchToken(nm), cl=r?CSMeds.classify(r.inn):null;
      addItem({inn:r?r.inn:null,brand:nm,dose:document.getElementById("wDose").value.trim(),atc:cl?cl.atc:null,
               frid:cl?cl.frid:"unknown",lv:cl?cl.lv:null,source:ctx.ocr?"photo_ocr":"manual",conf:r?r.conf:null,ocr:ctx.ocr||null,photoFile:ctx.photoFile,by:"user"});
    });
    document.getElementById("wCancel").addEventListener("click",workClose);

  function purposeBox(ctx){
    ctx=ctx||{};
    work('<p class="sub" style="margin:0 0 8px">ไม่เป็นไร — บอกแค่ว่ายานี้ใช้เพื่ออะไร เภสัชกรจะช่วยดูจากรูปให้</p>'+
      '<div id="wPur">'+FRID_GROUPS.map(function(g){return '<button class="pick" data-pur="'+g.k+'">'+esc(g.nm)+'</button>'}).join("")+'</div>'+
      '<button class="ghostb" id="wCancel">ยกเลิก</button>');
    document.querySelectorAll("[data-pur]").forEach(function(b){b.addEventListener("click",function(){
      var g=FRID_GROUPS.filter(function(x){return x.k===b.dataset.pur})[0];
      addItem({inn:null,brand:null,purpose:g.k,frid:"unknown",lv:null,source:"purpose_only",ocr:ctx.ocr||null,photoFile:ctx.photoFile,by:"user"});
    })});
    document.getElementById("wCancel").addEventListener("click",workClose);
  }
  async function addItem(x){
    /* อัปโหลดรูปเมื่อมี session — เก็บ path ไว้ให้เภสัชกรเปิดดู */
    if(x.photoFile&&typeof CSBackend!=="undefined"&&CSBackend.isCloud()){
      try{ var sh=await shrinkImage(x.photoFile,1200); x.photo=await CSBackend.uploadMedPhoto(new File([sh.blob],"med.jpg",{type:"image/jpeg"})); }catch(e){}
    }
    delete x.photoFile;
    m.items.push(x);
    workClose(); renderList(); syncSummary();
    var cl=x.frid&&x.frid!=="unknown"?{lv:x.lv}:(x.inn?CSMeds.classify(x.inn):{lv:null});
    status(cl.lv===2?"บันทึกแล้ว — ยานี้อยู่ในกลุ่มที่ควรให้เภสัชกรทบทวน":cl.lv===1?"บันทึกแล้ว — จะรวมให้เภสัชกรดูพร้อมรายการอื่น":cl.lv===0?"บันทึกแล้ว — ไม่อยู่ในกลุ่มเสี่ยงหกล้ม":"บันทึกแล้ว — เภสัชกรจะช่วยจัดกลุ่มให้");
    speak(cl.lv===2?"บันทึกแล้ว ยานี้อยู่ในกลุ่มที่ควรให้เภสัชกรทบทวน":"บันทึกแล้ว");
  }

  /* ---------- OCR จากรูป ---------- */
  document.getElementById("mPhoto").addEventListener("change",async function(){
    var f=this.files&&this.files[0]; this.value=""; if(!f)return;
    status("กำลังเตรียมรูป…");
    try{
      var sh=await shrinkImage(f,2000);
      var w=await ocrLoad(status);
      /* อ่านทีละแบบ สูงสุด 3 รอบ หยุดทันทีเมื่อมั่นใจพอ */
      var vars=ocrVariants(sh.canvas), best=null, allText="";
      for(var vi=0;vi<vars.length;vi++){
        status("กำลังอ่านฉลาก รอบที่ "+(vi+1)+" จาก "+vars.length+"…");
        var r=await w.recognize(vars[vi]);
        var text=(r&&r.data&&r.data.text)||"";
        if(text.replace(/\s+/g,"").length>allText.replace(/\s+/g,"").length)allText=text;
        var ex=CSMeds.extract(text);
        if(ex.candidates.length&&(!best||ex.candidates[0].conf>best.conf))
          best={conf:ex.candidates[0].conf,cands:ex.candidates,text:text,doses:ex.doses,freq:ex.freq};
        if(best&&best.conf>=0.75)break;
      }
      status("");
      if(best){
        /* พบชื่อยาที่พอเทียบได้ — ผู้ใช้เป็นคนยืนยันเสมอ ระบบไม่ตัดสินเอง */
        confirmBox(best.cands,{ocr:best.text,doses:best.doses,freq:best.freq,photoFile:f});
      }else if(allText.replace(/\s+/g,"").length>=14){
        /* อ่านตัวหนังสือได้ แต่ยาไม่อยู่ในฐาน 155 ตัวยา — ไม่ใช่ความผิดของรูป
           เดิมกรณีนี้ถูกเหมาว่า "รูปไม่ชัด ถ่ายใหม่" ทำให้ถ่ายซ้ำกี่ครั้งก็ล้มเหลวเหมือนเดิม */
        work('<div class="notice" style="margin:0 0 10px">อ่านตัวหนังสือจากรูปได้ แต่<b>ไม่พบชื่อยาที่ระบบรู้จัก</b> (ฐานข้อมูลมี 155 ตัวยา) — ไม่ใช่ปัญหาความคมชัดของรูป เลือกวิธีอื่นได้เลย</div>'+
          '<button class="cta" id="wKeep" style="margin:0 0 8px">📎 เก็บรูปให้เภสัชกรจัดกลุ่มให้</button>'+
          '<button class="ghostb" id="wType">พิมพ์ชื่อยาเอง</button>'+
          '<button class="ghostb" id="wPur2">บอกว่าใช้รักษาอะไร</button>'+
          '<details style="margin-top:8px" open><summary style="font-size:12.5px;color:var(--ink3)">ข้อความที่อ่านได้</summary><pre style="font-size:11.5px;white-space:pre-wrap;color:var(--ink2)">'+esc(allText.slice(0,400))+'</pre></details>');
        document.getElementById("wKeep").addEventListener("click",function(){addItem({inn:null,brand:null,purpose:null,frid:"unknown",lv:null,source:"photo_only",ocr:allText.slice(0,400),photoFile:f})});
        document.getElementById("wType").addEventListener("click",function(){manualBox({ocr:allText,photoFile:f})});
        document.getElementById("wPur2").addEventListener("click",function(){purposeBox({ocr:allText,photoFile:f})});
      }else{
        /* อ่านแทบไม่ได้จริง ๆ — ค่อยแนะนำให้ถ่ายใหม่ พร้อมบอกวิธี */
        work('<div class="notice" style="margin:0 0 10px">อ่านตัวหนังสือจากรูปนี้แทบไม่ได้ — มักเกิดจากแสงน้อย เงาบัง หรือถ่ายไกลเกินไป<br>'+
          '<b>เคล็ดลับ:</b> ถ่ายในที่สว่าง ให้ชื่อยาเต็มกรอบ ถือให้นิ่งสัก 1 วินาที</div>'+
          '<button class="cta" id="wRetry" style="margin:0 0 8px">📷 ถ่ายใหม่</button>'+
          '<button class="ghostb" id="wType">พิมพ์ชื่อยาเอง</button>'+
          '<button class="ghostb" id="wPur2">บอกว่าใช้รักษาอะไร</button>');
        document.getElementById("wRetry").addEventListener("click",function(){workClose();document.getElementById("mPhoto").click()});
        document.getElementById("wType").addEventListener("click",function(){manualBox({photoFile:f})});
        document.getElementById("wPur2").addEventListener("click",function(){purposeBox({photoFile:f})});
      }
    }catch(e){
      status("");
      work('<div class="notice" style="margin:0 0 10px">ตัวอ่านฉลากใช้ไม่ได้ในเครื่องนี้ (ต้องต่ออินเทอร์เน็ตครั้งแรก) — พิมพ์ชื่อยาหรือบอกวัตถุประสงค์แทนได้</div>'+
        '<button class="cta" id="wType" style="margin:0 0 8px">พิมพ์ชื่อยาเอง</button><button class="ghostb" id="wPur2">บอกว่าใช้รักษาอะไร</button>');
      document.getElementById("wType").addEventListener("click",function(){manualBox({photoFile:f})});
      document.getElementById("wPur2").addEventListener("click",function(){purposeBox({photoFile:f})});
    }
  });
  document.getElementById("mManual").addEventListener("click",function(){manualBox({})});
  document.getElementById("mPurpose").addEventListener("click",function(){purposeBox({})});

  renderCount(); renderList(); renderChange(); syncSummary();

  document.getElementById("mGo").addEventListener("click",async function(){
    S.draft.meds = (m.count!=null&&m.count>=2&&m.count!==9)?0:1;
    var sum=CSMeds.summarize(m.items.map(function(x){return {inn:x.inn,frid:x.frid,lv:x.lv}}));
    m.summary=sum;
    /* บันทึกรายการยาลงฐานข้อมูล (ทีละรายการ) — ทริกเกอร์จะเปิดคำขอทบทวนให้เองเมื่อเข้าเกณฑ์ */
    if(typeof CSBackend!=="undefined"&&CSBackend.isCloud()){
      for(var k=0;k<m.items.length;k++){ if(m.items[k].saved)continue;
        try{await CSBackend.saveMed(m.items[k]);m.items[k].saved=true}catch(e){} }
    }
    audit("บันทึกข้อมูลยา (pipeline)",
      "รายการ "+m.items.length+" · กลุ่มเสี่ยงสูง "+sum.high+" · ปานกลาง "+sum.mod+" · ไม่รู้จัก "+sum.unknown+
      (sum.needsReview?" · เข้าเกณฑ์ส่งเภสัชกรทบทวน":"")+
      ((m.changed||[]).filter(function(x){return x!=="none"}).length?" · มีการปรับยาใน 14 วัน":""));
    if(sum.needsReview)toast("มียาที่ควรให้เภสัชกรทบทวน — ระบบส่งคำขอให้แล้ว");
    go("q",i+1);
  });
}

function qV(i){
  i=i||0; var q=QS[i];
  if(q.fallsDetail){ renderFallsQ(i); return }
  if(q.medsDetail){ renderMedsQ(i); return }

  /* ---- แบบรูบริก: ดัชนีบาร์เธล 10 รายการ ---- */
  if(q.barthel){
    head("ข้อ "+(i+1)+" จาก "+QS.length,"ความสามารถในการทำกิจวัตรประจำวัน","ตอบสั้น ๆ 5 ด้าน · ฉบับย่อที่งานวิจัยยืนยันว่าแทนฉบับเต็ม 10 ด้านได้","assess");
    if(!S.draft.barthel)S.draft.barthel={};
    var b=S.draft.barthel;
    V.innerHTML='<div class="anim">'+
    '<div class="card" style="background:var(--surf2)"><h3>ทำไมเหลือ 5 ด้าน</h3>'+
    '<p class="sub" style="margin:0">เราใช้<b>ดัชนีบาร์เธลฉบับย่อ 5 ด้าน</b> (Short-Form Barthel Index — Hobart &amp; Thompson 2001) ซึ่งงานวิจัยยืนยันว่าให้ข้อมูลใกล้เคียงฉบับเต็ม 10 ด้านมาก (สหสัมพันธ์สูงกว่า 0.95) จึงตอบเร็วขึ้นกว่าเท่าตัวโดยไม่เสียความแม่น · ระบบประมาณค่ากลับเป็นดัชนีเต็ม 20 เพื่อใช้เกณฑ์เดียวกับระบบสาธารณสุขไทย</p></div>'+
    '<div id="bWrap"></div>'+
    '<div class="card" id="bSum"></div>'+
    '<button class="cta" id="bGo" disabled>บันทึกและดูผลการประเมิน</button>'+
    '<div class="disc">ฉบับย่อ 5 ด้านนี้ใช้เพื่อ<b>เฝ้าระวังแนวโน้ม</b> (อ้างอิง: Hobart &amp; Thompson 2001) การตัดสินว่าเข้าเกณฑ์ภาวะพึ่งพิงเพื่อรับสินไหม ต้องประเมินฉบับเต็มโดยทีมสหวิชาชีพที่ไปถึงบ้าน · กล้องวัดข้อนี้แทนไม่ได้ เพราะเป็นเรื่องการอาบน้ำและเข้าห้องน้ำซึ่งไม่ควรถ่ายภาพ</div></div>';

    function renderB(){
      document.getElementById("bWrap").innerHTML=BARTHEL.map(function(it,idx){
        return '<div class="card"><h3>'+(idx+1)+' · '+esc(it.nm)+'</h3>'+
        it.o.map(function(o){
          var on=b[it.k]===o[1];
          return '<button class="pick" data-k="'+it.k+'" data-v="'+o[1]+'" '+
            'style="'+(on?"border-color:var(--brand);background:var(--surf2);font-weight:600":"")+'">'+
            (on?"✓ ":"")+esc(o[0])+'<span style="float:right;font-family:var(--mono);color:var(--ink3)">'+o[1]+'</span></button>';
        }).join("")+'</div>';
      }).join("");
      var n=Object.keys(b).length, sf=barthelTotal(b), tot=barthelEst20(sf), band=barthelBand(tot);
      var full=(n===BARTHEL.length);
      document.getElementById("bSum").innerHTML=
        '<h3>คะแนนรวม</h3>'+
        '<div class="rowline"><span class="k">ตอบแล้ว</span><span class="v">'+n+' / '+BARTHEL.length+' ด้าน</span></div>'+
        '<div class="rowline"><span class="k">คะแนนฉบับย่อ</span><span class="v">'+sf+' / '+BARTHEL_MAX+'</span></div>'+
        '<div class="rowline"><span class="k">เทียบดัชนีเต็ม</span><span class="v">~'+tot+' / 20</span></div>'+
        (full?'<div class="rowline"><span class="k">ระดับ</span><span class="v"><span class="pill '+band.cls+'">'+band.nm+'</span></span></div>':
              '<p class="sub" style="margin:10px 0 0">กรุณาตอบให้ครบทุกด้านเพื่อสรุปผล</p>')+
        '<p class="sub" style="margin:10px 0 0">เกณฑ์: 12–20 ติดสังคม · 5–11 ติดบ้าน · 0–4 ติดเตียง</p>';
      document.getElementById("bGo").disabled=!full;
      /* ปุ่มตัวเลือกถูกสร้างใหม่ทุกครั้งที่ re-render จึงผูก listener ตรงนี้ได้ */
      V.querySelectorAll("[data-k]").forEach(function(btn){
        btn.addEventListener("click",function(){
          b[btn.dataset.k]=+btn.dataset.v;
          renderB();
        });
      });
    }
    renderB();
    /* ผูกปุ่มบันทึกเพียงครั้งเดียวนอก renderB — ไม่งั้น listener จะซ้อนทุกครั้งที่ติ๊ก
       และกดบันทึกครั้งเดียวจะบันทึกผลซ้ำหลายรายการ */
    document.getElementById("bGo").addEventListener("click",function(){
      if(this.disabled)return;
      this.disabled=true;
      var sf=barthelTotal(b), tot=barthelEst20(sf), band=barthelBand(tot);
      S.draft.adl=band.adl;
      S.draft.barthelTotal=tot;      /* สเกล 20 (ประมาณจากฉบับย่อ) — กฎ R9 ใช้ต่อได้ */
      S.draft.barthelSF=sf;
      S.draft.barthelBand=band.nm;
      audit("ประเมินกิจวัตรประจำวัน (Barthel ฉบับย่อ 5 ด้าน)",
        "คะแนนย่อ "+sf+"/"+BARTHEL_MAX+" ≈ "+tot+"/20 · ระดับ "+band.nm);
      finishAssess();
    });
    return;
  }

  /* ---- แบบเลือกตอบปกติ ---- */
  head("ข้อ "+(i+1)+" จาก "+QS.length,q.q,"ตอบตามความเป็นจริง ผลที่ตรงช่วยให้ระบบดูแลคุณได้ถูกต้อง","assess");
  V.innerHTML='<div class="anim">'+
    (q.fromCamera?cameraObs():"")+
    q.o.map(function(o,k){
      return '<button class="pick" data-v="'+o[1]+'">'+esc(o[0])+'</button>'}).join("")+
    (q.verify?verifyNotice():"")+
    '<div class="disc">ข้อมูลชุดนี้รวมกับผลจากกล้อง เป็นคะแนนเต็ม 12</div></div>';
  V.querySelectorAll(".pick").forEach(function(b){
    b.addEventListener("click",function(){
      S.draft[q.k]=+b.dataset.v;
      if(i+1<QS.length)go("q",i+1); else finishAssess();
    });
  });
}
async function finishAssess(){
  var p=S.data.profile, r=scoreOf(S.draft,p.age);
  var rec={at:nowISO(),score:r.score,max:r.max,tier:r.tier,ftsst:S.draft.ftsst,parts:r.parts,
           method:S.draft.method,reps:S.draft.reps,cv:S.draft.cv,gaps:S.draft.gaps||null,
           verified:!!S.draft.identityVerified,
           idChecks:S.draft.identityChecks||0, idFails:S.draft.identityFails||0,
           tug:S.draft.tug!=null?S.draft.tug:null,
           safety:S.draft.safety||null,
           safetyVerdict:S.draft.safetyVerdict||null,
           notTested:!!S.draft.notTested,
           fallsDetail:S.draft.fallsDetail||null,
           medsDetail:S.draft.medsDetail||null,
           steadi:S.draft.steadi||null,
           tugOut:S.draft.tugOut!=null?S.draft.tugOut:null,
           tugBack:S.draft.tugBack!=null?S.draft.tugBack:null,
           tugDistanceOk:S.draft.tugDistanceOk!=null?S.draft.tugDistanceOk:null,
           tugDrift:S.draft.tugDrift!=null?S.draft.tugDrift:null,
           balStages:S.draft.balStages||null,
           balPassed:S.draft.balPassed!=null?S.draft.balPassed:null,
           balLabel:S.draft.balLabel||null,
           sway:S.draft.swayValue!==undefined?S.draft.swayValue:null,
           swayHeld:S.draft.swayHeld!=null?S.draft.swayHeld:null,
           swayLabel:S.draft.swayLabel||null,
           barthel:S.draft.barthel||null,
           barthelTotal:S.draft.barthelTotal!=null?S.draft.barthelTotal:null,
           barthelBand:S.draft.barthelBand||null,
           /* แหล่งที่มาของคำตอบเชิงประวัติ — เริ่มต้นเป็น "ผู้ใช้กรอกเอง" เสมอ */
           src:{balance:"self_reported",falls:"self_reported",meds:"self_reported",adl:"self_reported"}};
  S.data.assessments.push(rec);
  audit("ให้คะแนนการประเมิน","คะแนน "+r.score+"/"+r.max+" ระดับ "+CFG.tiers[r.tier].nm+" · วิธีวัด: "+(rec.method==="camera-pose"?"กล้องตรวจจับท่าทาง":"จับเวลาเอง"));
  var tr=trajectory();
  if(tr){
    audit("วิเคราะห์แนวโน้มความเสี่ยง","ระดับ "+ENGINE.levelNm[tr.level]+" · กฎที่ทำงาน: "+(tr.flags.map(function(f){return f.id}).join(", ")||"ไม่มี")+" · นัดประเมินซ้ำใน "+tr.nextDays+" วัน");
    if(tr.referral.need){
      S.data.cases.push({id:"C"+Date.now().toString(36),at:nowISO(),uid:p.uid,name:p.name,age:p.age,sex:p.sex,
        level:tr.level,sla:tr.referral.sla,action:tr.referral.nm,
        reasons:tr.flags.map(function(f){return{id:f.id,text:f.text}}),
        status:"pending"});
      audit("สร้างเคสส่งต่อ",tr.referral.nm+" "+tr.referral.sla+" — สถานะ: รอผู้เชี่ยวชาญยืนยัน","ต้องมีพยาบาล/Care Manager ยืนยันก่อนดำเนินการ");
    }
  }
  await saveAll();
  cloudSync(rec,tr);   /* ซิงก์ขึ้นระบบกลางแบบไม่บล็อกผู้ใช้ */
  S.draft={};
  go("result",rec);
}

async function mrvV(){

  '<div class="card"><h3>ขอบเขตที่คุณอนุญาต</h3>'+
  '<div class="field"><label>สถานพยาบาล</label><input id="mHosp" placeholder="เช่น โรงพยาบาลประจำจังหวัด"></div>'+
  '<div class="field"><label>ช่วงเวลาที่อนุญาตให้ตรวจสอบ</label><input id="mPeriod" value="2568-2569" placeholder="เช่น 2568-2569"></div>'+
  '<div class="field"><label>ข้อมูลที่อนุญาต (เลือกได้หลายข้อ)</label>'+
  '<label class="chk" style="margin-bottom:8px"><input type="checkbox" id="mFalls" checked><span>ประวัติการหกล้ม</span></label>'+
  '<label class="chk" style="margin-bottom:8px"><input type="checkbox" id="mMeds" checked><span>รายการยาประจำ</span></label>'+
  '<label class="chk"><input type="checkbox" id="mAdl"><span>การประเมินกิจวัตรประจำวัน (ADL)</span></label></div>'+
  '<label class="chk" style="margin-top:12px"><input type="checkbox" id="mConsent"><span>ข้าพเจ้ายินยอมให้ตรวจสอบข้อมูลตามขอบเขตข้างต้นเท่านั้น และทราบว่าถอนความยินยอมได้ทุกเมื่อ</span></label></div>'+
  '<button class="cta" id="mGo">ยื่นคำขอตรวจสอบ</button>'+

    '<span class="v">'+(stNm[r.status]||r.status)+'</span></div>'}).join("")+
    '<button class="ghostb danger" id="mRevoke" style="margin:12px 0 0">ถอนความยินยอมและยกเลิกคำขอทั้งหมด</button></div>':'')+

      ok:"ถอนความยินยอม",cancel:"ไม่ถอน",danger:true,
      onOk:async function(){
        try{await CSBackend.revokeConsent("medical_record_check");
          audit("ถอนความยินยอมตรวจสอบเวชระเบียน","คำขอที่ค้างถูกยกเลิกทั้งหมด");
          toast("ถอนความยินยอมแล้ว");render()}
        catch(e){toast("ถอนไม่สำเร็จ")}
      }});
  });
}
