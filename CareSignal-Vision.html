<!-- ล็อก layout ไว้ที่ 430 หน่วยแล้วให้เบราว์เซอร์ขยายเต็มจอจริง —
     ทำให้ขนาดตัวอักษรเป็นสัดส่วนเดียวกันทุกเครื่อง แม้อุปกรณ์ที่ตั้งค่าการแสดงผล
     ให้รายงานจอกว้างผิดปกติ (เช่น 800+ CSS px) ก็ไม่ทำให้ตัวอักษรหดเล็ก -->
<meta name="viewport" content="width=430, viewport-fit=cover">
<meta name="description" content="วัดสมรรถภาพผู้สูงอายุด้วยกล้องมือถือ — นับลุกนั่ง 5 ครั้งอัตโนมัติ ประมวลผลในเครื่อง ไม่ส่งภาพออกไปที่ใด">
<title>CareSignal Vision — ตรวจจับสมรรถภาพด้วยกล้อง</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CareSignal">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6FB; --surf:#FFF; --surf2:#EAF0FE; --navy:#0F1B33;
  --ink:#16233B; --ink2:#5B6B84; --ink3:#93A1B7;
  --line:#DFE7F2; --line2:#EDF2FA;
  --brand:#2563EB; --brand2:#1D4ED8;
  --accent:#F59E0B; --accent2:#B45309; --accentb:#FEF3C7;
  --c4:#0E9F6E; --c3:#C79200; --c2:#D97706; --c1:#DC2626;
  --c4b:#E3F6EF; --c3b:#FEF6DE; --c2b:#FDECD8; --c1b:#FEE9E9;
  --sans:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  --loop:"IBM Plex Sans Thai Looped","Prompt",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sh:0 1px 2px rgba(22,35,59,.04),0 8px 24px rgba(22,35,59,.06);
  --shx:0 2px 8px rgba(22,35,59,.08),0 24px 60px rgba(22,35,59,.13);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0B1220;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  font-size:17px;line-height:1.7;display:flex;align-items:center;justify-content:center}
.phone{width:100%;max-width:430px;height:100dvh;background:var(--bg);position:relative;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shx)}
/* กรอบจำลองมือถือ — เฉพาะตอนเปิดในเบราว์เซอร์จอใหญ่เพื่อการนำเสนอ */
@media(min-width:520px) and (min-height:760px){.phone{border-radius:28px;height:880px;max-height:calc(100dvh - 40px)}}
/* เมื่อติดตั้งเป็นแอป (PWA standalone/fullscreen) ให้เต็มจอเสมอ ไม่ว่าอุปกรณ์จะรายงานจอกว้างเท่าใด */
@media(display-mode:standalone),(display-mode:fullscreen){
  body{display:block}
  .phone{max-width:none;max-height:none;width:100%;height:100dvh;border-radius:0;box-shadow:none}
}

/* หัวแถบ */
.bar{flex:none;background:linear-gradient(135deg,var(--brand2),var(--brand) 62%,#3B82F6);color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;position:relative}
.brandrow{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.bar .kick{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#FCD34D}
.bar h1{margin:3px 0 0;font-size:26px;letter-spacing:-.02em;font-weight:600;line-height:1.32}
.bar p{margin:7px 0 0;font-size:16.5px;color:rgba(255,255,255,.88);line-height:1.6}
.chip{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;background:rgba(245,158,11,.22);color:#FDE68A;padding:5px 10px;border-radius:99px}
.backb{background:rgba(255,255,255,.16);border:0;color:#fff;font-family:var(--sans);font-size:16.5px;
  padding:10px 18px;border-radius:99px;margin-bottom:10px;cursor:pointer;min-height:44px}

/* เนื้อหา */
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch}
.anim{animation:up .32s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.anim{animation:none}}

.card{background:var(--surf);border-radius:20px;padding:19px;box-shadow:var(--sh);margin-bottom:13px}
.card h3{margin:0 0 11px;font-size:20px;letter-spacing:-.01em;font-weight:600;line-height:1.45}
.sub{color:var(--ink2);font-size:17px;line-height:1.72}
.rowline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 0;border-top:1px solid var(--line2);font-size:17px}
.rowline:first-of-type{border-top:0}
.rowline .k{color:var(--ink2)}
.rowline .v{font-family:var(--mono);font-weight:600;text-align:right}
.cta{display:block;width:100%;border:0;border-radius:16px;background:var(--brand);color:#fff;font-family:var(--loop);
  font-size:21px;font-weight:600;padding:19px;cursor:pointer;margin-bottom:11px;transition:transform .1s;min-height:62px}
.cta:active{transform:scale(.985)}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.ghostb{display:block;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);
  font-family:var(--sans);font-size:18px;padding:17px;cursor:pointer;margin-bottom:11px;min-height:58px}
.ghostb.danger{color:var(--c1);border-color:#F6CFCF}
.pill{display:inline-block;font-size:14.5px;font-weight:600;padding:5px 13px;border-radius:99px}
.t4{background:var(--c4b);color:var(--c4)}.t3{background:var(--c3b);color:var(--c3)}
.t2{background:var(--c2b);color:var(--c2)}.t1{background:var(--c1b);color:var(--c1)}

/* กล้อง — องค์ประกอบหลักของหน้าจอนี้ */
.stage{position:relative;border-radius:22px;overflow:hidden;background:#0B1220;aspect-ratio:3/4;margin-bottom:12px;box-shadow:var(--shx)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video{transform:scaleX(-1)}
.stage canvas{transform:scaleX(-1);pointer-events:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.hudtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hudtag{background:rgba(11,18,32,.62);backdrop-filter:blur(8px);color:#fff;font-size:13.5px;padding:7px 12px;border-radius:99px;line-height:1.4}
.hudtag b{color:#FCD34D}
.hudbot{background:rgba(11,18,32,.68);backdrop-filter:blur(10px);border-radius:16px;padding:13px 15px;color:#fff}
.counter{display:flex;align-items:baseline;gap:10px}
.counter .n{font-family:var(--mono);font-size:46px;font-weight:600;line-height:1;letter-spacing:-.03em}
.counter .of{font-size:16px;color:rgba(255,255,255,.65)}
.counter .clock{margin-left:auto;font-family:var(--mono);font-size:27px;font-weight:600;color:#FCD34D}
.track{height:6px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:#FCD34D;border-radius:99px;transition:width .12s linear}
.coach{margin-top:9px;font-size:15px;color:rgba(255,255,255,.9);line-height:1.55;min-height:22px}
.statebadge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.16);padding:3px 8px;border-radius:99px;margin-left:8px}

/* กราฟแนวโน้ม */
.bars{display:flex;align-items:flex-end;gap:8px;height:118px;padding-top:6px}
.bars .b{flex:1;border-radius:7px 7px 3px 3px;position:relative;min-height:10px;display:flex;align-items:flex-start;justify-content:center}
.bars .b span{font-family:var(--mono);font-size:11px;color:#fff;padding-top:4px;font-weight:600}
.barx{display:flex;gap:8px;margin-top:7px}
.barx div{flex:1;text-align:center;font-size:11px;color:var(--ink3)}

/* คำอธิบายเหตุผล */
.evi{border-left:4px solid var(--accent);background:var(--accentb);border-radius:0 12px 12px 0;padding:13px 15px;margin:9px 0;font-size:16.5px;line-height:1.68}
.evi .rid{display:block;font-family:var(--mono);font-size:12px;color:var(--accent2);letter-spacing:.08em;margin-bottom:4px}
.evi .why{display:block;color:var(--ink2);font-size:15px;margin-top:5px}
.disc{background:var(--line2);border-radius:12px;padding:13px 15px;font-size:15px;color:var(--ink2);line-height:1.68;margin-top:11px}

/* คำถามเสริม */
.pick{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surf);border-radius:14px;
  padding:20px 18px;font-family:var(--sans);font-size:19px;margin-bottom:11px;cursor:pointer;color:var(--ink);min-height:64px;line-height:1.45}
.pick:active{border-color:var(--brand);background:var(--surf2)}
.field{margin-bottom:15px}
.field label{display:block;font-size:16px;color:var(--ink2);margin-bottom:7px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:16px;font-family:var(--sans);font-size:19px;background:var(--surf);color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--surf);border-radius:13px;padding:16px;font-family:var(--sans);font-size:18px;cursor:pointer;color:var(--ink);min-height:58px}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--surf2);color:var(--brand2);font-weight:600}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--surf2);border-radius:14px;padding:16px;cursor:pointer;font-size:16px;line-height:1.65}
.chk input{width:28px;height:28px;flex:none;margin-top:1px;accent-color:var(--brand)}

/* เคส/ตาราง */
.case{border-top:1px solid var(--line2);padding:12px 0}
.case:first-of-type{border-top:0}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px}
.case .who{font-weight:600;font-size:16px}
.case .meta{font-size:13.5px;color:var(--ink2);line-height:1.6}
.mini{display:flex;gap:8px;margin-top:10px}
.mini button{flex:1;border:0;border-radius:12px;padding:13px;font-family:var(--sans);font-size:15px;cursor:pointer;font-weight:600;min-height:48px}
.ok{background:var(--c4);color:#fff}
.no{background:var(--line2);color:var(--ink2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.kpi{background:var(--surf);border-radius:16px;padding:13px;box-shadow:var(--sh)}
.kpi .l{font-size:14px;color:var(--ink3);line-height:1.4}
.kpi .n{font-family:var(--mono);font-size:25px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.mixrow{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:15.5px}
.mixrow .lab{width:96px;color:var(--ink2)}
.mixrow .bar{flex:1;height:9px;background:var(--line2);border-radius:99px;overflow:hidden}
.mixrow .bar i{display:block;height:100%;border-radius:99px}
.mixrow .val{font-family:var(--mono);font-size:12px;width:40px;text-align:right}

/* แท็บล่าง */
.tabs{flex:none;display:flex;background:var(--surf);border-top:1px solid var(--line);padding:8px 6px calc(env(safe-area-inset-bottom) + 8px)}
.tabs button{flex:1;background:none;border:0;padding:9px 2px;font-family:var(--sans);font-size:13.5px;color:var(--ink3);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button[aria-selected="true"]{color:var(--brand);font-weight:600}
.tabs svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:var(--navy);color:#fff;border-radius:14px;padding:16px 18px;
  font-size:17px;line-height:1.55;opacity:0;transform:translateY(9px);transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
@keyframes csPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.75}}
#statusLight.pulse{animation:csPulse 1.1s ease-in-out infinite}
/* เคารพผู้ใช้ที่ตั้งค่าลดการเคลื่อนไหว (WCAG 2.3.3) */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="bar"><div id="barIn"></div><span class="chip" id="chip">DB</span></div>
  <div class="view" id="view"></div>
  <div class="tabs" id="tabs" hidden>
    <button data-go="assess" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.4"/></svg><b>ประเมิน</b></button>
    <button data-go="trend"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 15v-4M12 15V8M16 15v-6"/></svg><b>แนวโน้ม</b></button>
    <button data-go="cases"><svg viewBox="0 0 24 24"><path d="M5 4h14v16l-7-3-7 3z"/></svg><b>เคส</b></button>
    <button data-go="insurer"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><b>บริษัทประกัน</b></button>
    <button data-go="pilot" id="tabPilot" hidden><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/><circle cx="7" cy="9" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="17" cy="12" r="1.6"/></svg><b>วิจัย</b></button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="./cs-backend.js"></script>
<script>
"use strict";
var LOGO='<svg width="26" height="26" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="flex:none">'+
'<defs><linearGradient id="lgV" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#DBEAFE"/><stop offset="1" stop-color="#93C5FD"/></linearGradient>'+
'<linearGradient id="lgA" x1="42" y1="8" x2="58" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#F59E0B"/></linearGradient></defs>'+
'<path d="M32 5C24.5 10 16.5 12.4 10 12.6V33c0 14 10 22.6 22 27 12-4.4 22-13 22-27V12.6C47.5 12.4 39.5 10 32 5Z" stroke="url(#lgV)" stroke-width="4" stroke-linejoin="round"/>'+
'<path d="M17 35h7.5l3-6.5 4.5 11 3-4.5H47" stroke="url(#lgV)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>'+
'<path d="M46.5 9.5a13.5 13.5 0 0 1 8.6 8.4" stroke="url(#lgA)" stroke-width="3.6" stroke-linecap="round"/>'+
'<circle cx="42.6" cy="21.2" r="2.6" fill="url(#lgA)"/></svg>';

/* ============================================================
   ที่เก็บข้อมูล — คลาวด์แพลตฟอร์ม → เครื่องผู้ใช้ → หน่วยความจำ
   ============================================================ */
var MEM={};
var DB={
  mode:"temp",
  async get(k){
    if(window.storage){try{var r=await window.storage.get(k);this.mode="cloud";if(r)return JSON.parse(r.value)}catch(e){}}
    try{var s=localStorage.getItem("csv:"+k);if(this.mode!=="cloud")this.mode="local";if(s)return JSON.parse(s)}catch(e){}
    return MEM[k]||null;
  },
  async set(k,v){
    var s=JSON.stringify(v);MEM[k]=v;
    if(window.storage){try{await window.storage.set(k,s);this.mode="cloud";return}catch(e){}}
    try{localStorage.setItem("csv:"+k,s);this.mode="local"}catch(e){this.mode="temp"}
  },
  async del(k){
    if(window.storage){try{await window.storage.delete(k)}catch(e){}}
    try{localStorage.removeItem("csv:"+k)}catch(e){}
    delete MEM[k];
  },
  async putPool(rec){
    if(window.storage){try{await window.storage.set("pool:"+rec.uid,JSON.stringify(rec),true);return}catch(e){}}
    try{localStorage.setItem("csShared:pool:"+rec.uid,JSON.stringify(rec))}catch(e){}
  },
  async listPool(){
    var out=[];
    if(window.storage){
      try{
        var r=await window.storage.list("pool:",true);
        for(var i=0;i<(r.keys||[]).length;i++){try{var g=await window.storage.get(r.keys[i],true);if(g)out.push(JSON.parse(g.value))}catch(e){}}
        return out;
      }catch(e){}
    }
    try{for(var j=0;j<localStorage.length;j++){var k=localStorage.key(j);
      if(k&&k.indexOf("csShared:pool:")===0){try{out.push(JSON.parse(localStorage.getItem(k)))}catch(e){}}}}catch(e){}
    return out;
  }
};
function dbLabel(){
  var m;
  if(typeof CLOUD!=="undefined"&&CLOUD.session)m="DB · CLOUD ✓";
  else m="DB · "+(DB.mode==="cloud"?"CLOUD":(DB.mode==="local"?"LOCAL":"TEMP"));
  try{if(localStorage.getItem("csv:pilot")==="1")m+=" · โหมดวิจัย"}catch(e){}
  return m;
}

/* ============================================================
   ค่ากลาง — ชุดเดียวกับแอป เว็บ และโมเดลผู้ประกอบการ
   ============================================================ */
var CFG={
  ftsstCut:function(age){return age<60?10.0:(age<70?11.5:12.1);},
  ageBand:function(a){return a<55?"50–54":(a<60?"55–59":(a<66?"60–65":"66–70"));},
  ageMult:function(a){return a<55?1.00:(a<60?1.35:(a<66?1.80:2.30));},
  sexMult:{f:1.10,m:1.00},
  plans:[{id:"s",nm:"เริ่มต้น",benefit:10000,base:590},{id:"m",nm:"มาตรฐาน",benefit:15000,base:890},
         {id:"l",nm:"พรีเมียม",benefit:25000,base:1490},{id:"xl",nm:"สูงสุด",benefit:40000,base:2290}],
  discount:{4:.15,3:.08,2:0,1:0},
  tiers:{
    4:{nm:"เขียว — แข็งแรงดี",c:"var(--c4)",b:"t4",act:"ออกกำลังต่อเนื่อง ประเมินซ้ำทุก 3 เดือน"},
    3:{nm:"เหลือง — เฝ้าระวัง",c:"var(--c3)",b:"t3",act:"ฝึกทรงตัวสัปดาห์ละ 3 วัน ประเมินซ้ำทุก 2 เดือน"},
    2:{nm:"ส้ม — เสี่ยงปานกลาง",c:"var(--c2)",b:"t2",act:"Care Manager ติดต่อภายใน 7 วัน"},
    1:{nm:"แดง — เสี่ยงสูง",c:"var(--c1)",b:"t1",act:"พยาบาลประเมินที่บ้านภายใน 72 ชม."}
  }
};
function fmt(n){return Math.round(n).toLocaleString("th-TH")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* รหัสแฝงชื่อ (pseudonym) — ใช้แทนรหัสบัญชีจริงเมื่อส่งเข้าฐานข้อมูลกลาง
   หมายเหตุตามกฎหมาย: นี่คือการทำ pseudonymisation ไม่ใช่ anonymisation
   ข้อมูลที่ได้ยังเป็นข้อมูลส่วนบุคคลตาม PDPA เต็มที่ */
function pseudoId(s){
  var h=5381; s=String(s);
  for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}
  return "P-"+("0000000"+h.toString(36).toUpperCase()).slice(-7);
}

/* คำนวณอายุจากปีเกิด พ.ศ. (+เดือนเกิดถ้าระบุ) — เกณฑ์เวลากระโดดที่อายุ 60/70 พอดี
   จึงต้องไม่นับคนที่ยังไม่ถึงวันเกิดปีนี้ให้แก่เกินจริง */
function ageFrom(beYear,month){
  var now=new Date(), age=(now.getFullYear()+543)-beYear;
  if(month&&(now.getMonth()+1)<month)age--;
  return age;
}

/* ============================================================
   ชั้นวิเคราะห์ท่าทาง — ประมวลผลบนเครื่อง ไม่ส่งภาพออกจากอุปกรณ์
   ------------------------------------------------------------
   ตัวชี้วัดหลัก: ตำแหน่งสะโพกเทียบสัดส่วนลำตัว
     M = (ระยะข้อเท้า−สะโพก) ÷ (ระยะข้อเท้า−ไหล่)
   เลือกอัตราส่วนแทนพิกัดดิบ เพราะไม่ขึ้นกับระยะห่างจากกล้อง
   ส่วนสูงของผู้ใช้ หรือการวางมือถือสูงต่ำ
   ============================================================ */
var LM={LSH:11,RSH:12,LHIP:23,RHIP:24,LKNEE:25,RKNEE:26,LANK:27,RANK:28};

function midY(lm,a,b){return (lm[a].y+lm[b].y)/2}
function visOK(lm){
  var need=[LM.LSH,LM.RSH,LM.LHIP,LM.RHIP,LM.LKNEE,LM.RKNEE,LM.LANK,LM.RANK];
  var seen=0;
  for(var i=0;i<need.length;i++){var v=lm[need[i]];if(v&&(v.visibility===undefined||v.visibility>0.5))seen++}
  return seen/need.length;
}
function hipRatio(lm){
  var sh=midY(lm,LM.LSH,LM.RSH), hip=midY(lm,LM.LHIP,LM.RHIP), ank=midY(lm,LM.LANK,LM.RANK);
  var span=ank-sh;
  if(!isFinite(span)||Math.abs(span)<0.02)return null;
  return (ank-hip)/span;
}
function kneeAngle(lm){
  function ang(h,k,a){
    var v1={x:lm[h].x-lm[k].x,y:lm[h].y-lm[k].y}, v2={x:lm[a].x-lm[k].x,y:lm[a].y-lm[k].y};
    var d=v1.x*v2.x+v1.y*v2.y, m=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y);
    if(!m)return null;
    return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI;
  }
  var l=ang(LM.LHIP,LM.LKNEE,LM.LANK), r=ang(LM.RHIP,LM.RKNEE,LM.RANK);
  if(l==null&&r==null)return null;
  if(l==null)return r; if(r==null)return l;
  return (l+r)/2;
}

/* ---- ตัวนับจำนวนครั้ง: เครื่องสถานะพร้อม hysteresis กันการนับซ้ำจากการสั่น ---- */
function RepDetector(opts){
  opts=opts||{};
  this.sitRef=null; this.standRef=null;
  this.state="idle"; this.reps=0; this.stamps=[]; this.t0=null; this.done=false;
  this.target=opts.target||5;
  this.upFrac=opts.upFrac!==undefined?opts.upFrac:0.68;
  this.downFrac=opts.downFrac!==undefined?opts.downFrac:0.36;
  this.buf=[]; this.smoothN=opts.smoothN||5;
  /* จุดเริ่มจับเวลาจริง — เมื่อร่างกายเริ่มขยับลุกครั้งแรก ไม่ใช่ตอนกดปุ่ม
     มาตรฐาน FTSST จับเวลาตั้งแต่เริ่มเคลื่อนไหวจนลุกครบ 5 ครั้ง
     ถ้านับตั้งแต่กดปุ่ม เวลาที่นั่งรอจะถูกบวกเข้าไปด้วย ทำให้ผลแย่กว่าจริง */
  this.onsetFrac=opts.onsetFrac!==undefined?opts.onsetFrac:0.18;
  this.moveStart=null;
}
RepDetector.prototype.smooth=function(v){
  this.buf.push(v); if(this.buf.length>this.smoothN)this.buf.shift();
  var s=0; for(var i=0;i<this.buf.length;i++)s+=this.buf[i];
  return s/this.buf.length;
};
RepDetector.prototype.setRefs=function(sit,stand){this.sitRef=sit;this.standRef=stand};
RepDetector.prototype.start=function(t){this.state="sit";this.reps=0;this.stamps=[];this.t0=t;this.done=false;this.buf=[];this.moveStart=null};
/* เวลาที่ใช้จริง นับจากจังหวะเริ่มขยับ ไม่ใช่จากตอนกดปุ่ม */
RepDetector.prototype.elapsedAt=function(t){
  var base=this.moveStart!=null?this.moveStart:this.t0;
  return (t-base)/1000;
};
RepDetector.prototype.thresholds=function(){
  var range=this.standRef-this.sitRef;
  return {up:this.sitRef+range*this.upFrac, down:this.sitRef+range*this.downFrac, range:range};
};
RepDetector.prototype.push=function(raw,t){
  if(this.done||this.state==="idle"||this.sitRef==null||this.standRef==null)return null;
  var v=this.smooth(raw), th=this.thresholds();
  /* จับจังหวะ "เริ่มขยับลุก" ครั้งแรก → นาฬิกาเริ่มเดินตรงนี้
     ใช้เกณฑ์ต่ำ (18% ของช่วงนั่ง-ยืน) เพื่อจับตั้งแต่เริ่มโน้มตัวไปข้างหน้า */
  if(this.moveStart===null&&this.state==="sit"&&v>=this.sitRef+th.range*this.onsetFrac){
    this.moveStart=t;
    return {event:"onset"};
  }
  if(this.state==="sit"&&v>=th.up){
    if(this.moveStart===null)this.moveStart=t;   /* กันกรณีลุกเร็วจนข้ามเกณฑ์เริ่มขยับ */
    this.state="stand"; this.reps++; this.stamps.push(t);
    if(this.reps>=this.target){this.done=true;return{event:"finish",reps:this.reps,elapsed:this.elapsedAt(t)}}
    return {event:"rep",reps:this.reps};
  }
  if(this.state==="stand"&&v<=th.down){this.state="sit";return{event:"down",reps:this.reps}}
  return null;
};

/* ============================================================
   คะแนนและการวิเคราะห์แนวโน้ม

function ftsstPoints(sec,age){
  var cut=CFG.ftsstCut(age);
  if(sec==null)return 0;
  return sec<=cut?4 : sec<=cut+2?3 : sec<=cut+4.5?2 : sec<=60?1 : 0;
}
function scoreOf(d,age){
  var parts={ftsst:ftsstPoints(d.ftsst,age), balance:d.balance||0, falls:d.falls==null?0:d.falls,
              meds:d.meds==null?0:d.meds, adl:d.adl==null?0:d.adl};
  var s=parts.ftsst+parts.balance+parts.falls+parts.meds+parts.adl;
  return {score:s, max:12, tier:s>=10?4:s>=8?3:s>=5?2:1, parts:parts};
}

function trajectory(){
  var A=S.data.assessments, p=S.data.profile;
  if(!A.length||!p)return null;
  var last=A[A.length-1], first=A[0];
  var out={n:A.length,last:last,flags:[],level:"stable",span:daysBetween(first.at,last.at),
           sinceLast:daysBetween(last.at,nowISO())};
  var fts=A.filter(function(x){return x.ftsst!=null});
  var bestFt=fts.length?Math.min.apply(null,fts.map(function(x){return x.ftsst})):null;
  var bestScore=Math.max.apply(null,A.map(function(x){return x.score}));

  if(last.ftsst!=null&&bestFt!=null&&fts.length>1&&last.ftsst>bestFt){
    var d=last.ftsst-bestFt, pct=d/bestFt*100;
    if(d>=2.3||pct>=15){
      out.flags.push({id:"R1",sev:(pct>=30||d>=4)?2:1,
        text:"เวลาลุกนั่ง 5 ครั้งช้าลง "+pct.toFixed(0)+"% ("+bestFt.toFixed(1)+" → "+last.ftsst.toFixed(1)+" วินาที) เทียบกับผลที่ดีที่สุดของคุณเอง",
        why:"ส่วนต่าง "+d.toFixed(1)+" วินาที ถึงเกณฑ์การเปลี่ยนแปลงที่มีความหมายทางคลินิก (≥2.3 วินาที)"});
    }
  }
  if(last.ftsst!=null){
    var cut=CFG.ftsstCut(p.age), prevFt=null;
    for(var i=A.length-2;i>=0;i--){if(A[i].ftsst!=null){prevFt=A[i].ftsst;break}}
    if(last.ftsst>cut&&(prevFt==null||prevFt<=cut)){
      out.flags.push({id:"R2",sev:2,
        text:"เวลาลุกนั่งขึ้นเป็น "+last.ftsst.toFixed(1)+" วินาที สูงกว่าเกณฑ์ของช่วงอายุ "+CFG.ageBand(p.age)+" ปี ("+cut.toFixed(1)+" วินาที)",
        why:"เป็นการข้ามค่าตัดเกณฑ์ครั้งแรก จึงถือเป็นการเปลี่ยนสถานะ ไม่ใช่ความผันผวนปกติ"});
    }
  }
  if(A.length>1){
    var prev=A[A.length-2];
    if(last.parts.falls<prev.parts.falls)
      out.flags.push({id:"R3",sev:2,text:"มีการหกล้มเกิดขึ้นใหม่ในช่วง "+daysBetween(prev.at,last.at)+" วันที่ผ่านมา",
        why:"ผู้ที่ล้มแล้ว 1 ครั้งมีโอกาสล้มซ้ำสูงขึ้นชัดเจนใน 12 เดือนถัดไป"});
    if(last.parts.adl<prev.parts.adl)
      out.flags.push({id:"R6",sev:3,text:"ความสามารถทำกิจวัตรประจำวันลดลงจากการประเมินครั้งก่อน",
        why:"การลดลงของ ADL เป็นสัญญาณเริ่มต้นของภาวะพึ่งพิง ซึ่งเป็นเหตุการณ์ที่กรมธรรม์คุ้มครอง"});
  }
  if(last.score<=bestScore-2)
    out.flags.push({id:"R4",sev:last.score<=bestScore-3?2:1,
      text:"คะแนนรวมลดลง "+(bestScore-last.score)+" คะแนน จากค่าดีที่สุดของคุณ ("+bestScore+" → "+last.score+")",
      why:"เปรียบเทียบกับตัวคุณเองในอดีต ไม่ใช่กับค่าเฉลี่ยของคนอื่น"});
  if(last.parts.meds===0&&last.parts.balance<=1)
    out.flags.push({id:"R5",sev:2,text:"ใช้ยาตั้งแต่ 4 ชนิดขึ้นไป ร่วมกับผลทรงตัวที่ยังไม่ผ่านเกณฑ์",
      why:"สองปัจจัยนี้เมื่อเกิดร่วมกันเพิ่มความเสี่ยงหกล้มมากกว่าผลรวมของแต่ละปัจจัย"});
  /* กฎเฉพาะของการวัดด้วยกล้อง: ความสม่ำเสมอของจังหวะแต่ละครั้ง */
  if(last.cv!=null&&last.cv>=0.25)
    out.flags.push({id:"R7",sev:1,
      text:"จังหวะการลุกแต่ละครั้งไม่สม่ำเสมอ (ครั้งท้าย ๆ ช้ากว่าครั้งแรกอย่างชัดเจน)",
      why:"กล้องวัดเวลาแยกรายครั้งได้ ความแปรปรวน "+(last.cv*100).toFixed(0)+"% บ่งชี้ความล้าของกล้ามเนื้อขาเร็วกว่าปกติ"});

  var sev=out.flags.reduce(function(a,b){return a+b.sev},0);
  var hasADL=out.flags.some(function(f){return f.id==="R6"});
  out.level = (last.tier===1||hasADL||sev>=5)?"urgent" : (last.tier===2||sev>=3)?"decline" : sev>=1?"watch":"stable";
  out.nextDays=ENGINE.cadence[out.level];
  out.nextDate=new Date(Date.now()+out.nextDays*864e5).toISOString();
  out.referral = out.level==="urgent"?{nm:"ส่งต่อพยาบาลประเมินที่บ้าน",sla:"ภายใน 72 ชั่วโมง",need:true}
               : out.level==="decline"?{nm:"Care Manager โทรติดตาม",sla:"ภายใน 7 วัน",need:true}
               : out.level==="watch"?{nm:"แผนป้องกันด้วยตนเอง + เตือนประเมินซ้ำ",sla:"ไม่ต้องส่งต่อ",need:false}
                                     :{nm:"ดูแลตนเองตามแผนปกติ",sla:"ไม่ต้องส่งต่อ",need:false};
  return out;
}

/* สรุปสถิติตาม KPI ของการตรวจสอบเครื่องมือวัด */
function pilotStats(){
  var a=PLOG.all();
  var done=a.filter(function(r){return r.csTime!=null});
  var withRef=done.filter(function(r){return r.ref1!=null});
  var errs=withRef.map(function(r){return r.csTime-r.ref1});
  var abs=errs.map(function(e){return Math.abs(e)});
  function mean(x){return x.length?x.reduce(function(p,c){return p+c},0)/x.length:null}
  var m=mean(errs), sd=null;
  if(errs.length>1){sd=Math.sqrt(errs.reduce(function(p,c){return p+(c-m)*(c-m)},0)/(errs.length-1))}
  var repsOK=done.filter(function(r){return r.repsCorrect===true}).length;
  var fails=a.filter(function(r){return r.techFail}).length;
  var people={};a.forEach(function(r){if(r.pid)people[r.pid]=1});
  /* ความแปรปรวนเมื่อวัดซ้ำ: ส่วนเบี่ยงเบนของแต่ละคนที่วัด ≥2 รอบ */
  var byP={};done.forEach(function(r){if(!byP[r.pid])byP[r.pid]=[];byP[r.pid].push(r.csTime)});
  var retest=[];
  Object.keys(byP).forEach(function(k){
    var v=byP[k]; if(v.length<2)return;
    var mu=mean(v);
    retest.push(Math.sqrt(v.reduce(function(p,c){return p+(c-mu)*(c-mu)},0)/(v.length-1)));
  });
  return {
    n:a.length, nDone:done.length, nPeople:Object.keys(people).length, nRef:withRef.length,
    completion:a.length?done.length/a.length*100:null,
    repAcc:done.length?repsOK/done.length*100:null,
    mae:mean(abs), bias:m, sd:sd,
    techFailRate:a.length?fails/a.length*100:null,
    retestSD:mean(retest), nRetest:retest.length,
    setupMean:mean(done.filter(function(r){return r.setupSec}).map(function(r){return r.setupSec}))
  };
}
function pilotCSV(){
  var cols=["trial","participant","trial_no","datetime","method","cs_time_s","ref1_s","ref2_s",
            "error1_s","error2_s","cs_reps","reps_correct","cadence_cv","gaps_s",
            "sit_ref","stand_ref","setup_sec","tech_fail","notes"];
  var rows=PLOG.all().map(function(r,i){
    return [i+1, r.pid||"", r.trialNo||"", r.at||"", r.method||"",
      r.csTime!=null?r.csTime.toFixed(2):"", r.ref1!=null?r.ref1.toFixed(2):"", r.ref2!=null?r.ref2.toFixed(2):"",
      (r.csTime!=null&&r.ref1!=null)?(r.csTime-r.ref1).toFixed(2):"",
      (r.csTime!=null&&r.ref2!=null)?(r.csTime-r.ref2).toFixed(2):"",
      r.reps!=null?r.reps:"", r.repsCorrect===true?"1":(r.repsCorrect===false?"0":""),
      r.cv!=null?(r.cv).toFixed(4):"", r.gaps?r.gaps.join(" "):"",
      r.sitRef!=null?r.sitRef.toFixed(4):"", r.standRef!=null?r.standRef.toFixed(4):"",
      r.setupSec!=null?r.setupSec:"", r.techFail?"1":"0",
      (r.notes||"").replace(/[",\n]/g," ")];
  });
  return "﻿"+[cols].concat(rows).map(function(r){return r.join(",")}).join("\n");
}

async function cloudSync(rec,tr){
  if(!CLOUD.session||!CSBackend.isCloud())return;
  try{
    var a=await CSBackend.saveAssessment({
      at:rec.at,method:rec.method,ftsst:rec.ftsst,reps:rec.reps,cv:rec.cv,gaps:rec.gaps,
      score:rec.score,max:rec.max,tier:rec.tier,parts:rec.parts,
      verified:!!rec.verified,engine:ENGINE.version});
    rec.cloudId=a.id;
    try{var L=S.data.assessments;for(var i=L.length-1;i>=0;i--){if(L[i].at===rec.at){L[i].cloudId=a.id;break}}await DB.set("visionData",S.data)}catch(e){}
    if(tr){

        engine:ENGINE.version,flags:tr.flags.map(function(f){return{id:f.id,text:f.text,why:f.why}})});

}

function dialog(opts){
  var old=document.getElementById("csDlg"); if(old)old.remove();
  var wrap=document.createElement("div");
  wrap.id="csDlg";
  wrap.style.cssText="position:fixed;inset:0;background:rgba(15,27,51,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:22px";
  wrap.innerHTML='<div role="dialog" aria-modal="true" style="background:#fff;border-radius:22px;padding:24px;max-width:420px;width:100%;box-shadow:0 24px 60px rgba(15,27,51,.35)">'+
    '<h3 style="margin:0 0 8px;font-size:23px;line-height:1.4;color:#16233B">'+esc(opts.title)+'</h3>'+
    (opts.body?'<p style="margin:0 0 18px;font-size:18px;line-height:1.7;color:#5B6B84">'+opts.body+'</p>':'')+
    (opts.input?'<input id="dlgIn" inputmode="decimal" placeholder="'+esc(opts.placeholder||"")+'" style="width:100%;box-sizing:border-box;font-size:30px;font-family:inherit;padding:16px;border:1.5px solid #DFE7F2;border-radius:14px;text-align:center;margin-bottom:14px;color:#16233B">':'')+
    '<button id="dlgOk" style="display:block;width:100%;border:0;border-radius:14px;padding:19px;font-size:20px;font-weight:600;font-family:inherit;cursor:pointer;background:'+(opts.danger?"#DC2626":"#2563EB")+';color:#fff">'+esc(opts.ok||"ตกลง")+'</button>'+
    '<button id="dlgNo" style="display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-family:inherit;cursor:pointer;background:transparent;color:#5B6B84;margin-top:6px">'+esc(opts.cancel||"ยกเลิก")+'</button></div>';
  document.body.appendChild(wrap);
  var inp=document.getElementById("dlgIn");
  var prevFocus=document.activeElement;
  setTimeout(function(){(inp||document.getElementById("dlgOk")).focus()},60);
  function onKey(e){if(e.key==="Escape"){close();if(opts.onCancel)opts.onCancel()}}
  document.addEventListener("keydown",onKey);
  function close(){wrap.remove();document.removeEventListener("keydown",onKey);if(prevFocus&&prevFocus.focus)try{prevFocus.focus()}catch(e){}}
  document.getElementById("dlgNo").addEventListener("click",function(){close();if(opts.onCancel)opts.onCancel()});
  document.getElementById("dlgOk").addEventListener("click",function(){
    if(opts.input){opts.onOk(parseFloat(inp.value))}
    else{close();opts.onOk()}
  });
  if(inp)inp.addEventListener("keydown",function(e){if(e.key==="Enter")opts.onOk(parseFloat(inp.value))});
  return {close:close};
}

/* ============================================================
   ไฟสถานะ 3 สี + เสียงพูดภาษาไทย + ปรับขนาดตัวอักษร
   ------------------------------------------------------------
   ออกแบบสำหรับผู้สูงอายุ:
   - ไฟวงกลมใหญ่ 3 สี: เขียว=พร้อม/สำเร็จ เหลือง=กำลังเตรียม แดง=ติดปัญหา
   - เสียงพูดไทย (Web Speech API) นับครั้ง บอกสถานะ นับถอยหลัง
   - ปุ่ม ก+ / ก- ปรับขนาดตัวอักษรทั้งแอป จำค่าไว้ถาวร
   ============================================================ */

/* ---------- ไฟสถานะ ---------- */
var STATUS_COLORS={green:"#0E9F6E",yellow:"#F5B93E",red:"#DC2626"};
var STATUS_LAST=null;
function setStatus(color,text,speakText){
  var el=document.getElementById("statusLight");
  var tx=document.getElementById("statusText");
  if(el){
    el.style.background=STATUS_COLORS[color]||STATUS_COLORS.yellow;
    el.style.boxShadow="0 0 0 8px "+(STATUS_COLORS[color]||"#F5B93E")+"33, 0 4px 14px rgba(0,0,0,.3)";
    el.classList.toggle("pulse",color==="yellow");
  }
  if(tx)tx.textContent=text||"";
  /* พูดเฉพาะเมื่อสถานะเปลี่ยน กันเสียงรัวซ้ำ */
  var key=color+"|"+(speakText||text||"");
  if(key!==STATUS_LAST){STATUS_LAST=key; if(speakText!==false)speak(speakText||text)}
}
function statusHTML(){
  return '<div id="statusBar" style="display:flex;align-items:center;gap:14px;background:rgba(11,18,32,.78);backdrop-filter:blur(10px);border-radius:18px;padding:12px 16px;margin-top:10px">'+
    '<div id="statusLight" style="width:44px;height:44px;border-radius:50%;flex:none;background:#F5B93E;transition:background .25s"></div>'+
    '<div id="statusText" style="font-size:17px;font-weight:600;color:#fff;line-height:1.45;flex:1">กำลังเตรียมระบบ…</div></div>';
}

/* ---------- เสียงพูดภาษาไทย ---------- */
var VOICE={on:(function(){try{return localStorage.getItem("csv:voice")!=="off"}catch(e){return true}})()};
function speak(text,opts){
  if(!VOICE.on||!text)return;
  try{
    if(!("speechSynthesis" in window))return;
    opts=opts||{};
    if(opts.interrupt!==false)speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="th-TH"; u.rate=opts.rate||0.95; u.volume=1;
    var v=speechSynthesis.getVoices().filter(function(x){return /th/i.test(x.lang)});
    if(v.length)u.voice=v[0];
    speechSynthesis.speak(u);
  }catch(e){}
}
function voiceToggle(){
  VOICE.on=!VOICE.on;
  try{localStorage.setItem("csv:voice",VOICE.on?"on":"off")}catch(e){}
  if(VOICE.on)speak("เปิดเสียงแนะนำแล้ว");
  return VOICE.on;
}

/* ============================================================
   จับอัตโนมัติ (AutoCapture) — ไม่ต้องกดปุ่มเอง
   ------------------------------------------------------------
   ปัญหาที่แก้: ผู้สูงอายุที่อยู่คนเดียวต้องเดินมากดปุ่มบันทึก
   แต่พอเดินมาถึงมือถือ กล้องก็มองไม่เห็นตัวอีก กลายเป็นวงจรตัน

   วิธีทำงาน: เมื่อเงื่อนไข "พร้อม" ต่อเนื่องครบ holdMs
   ระบบจะพูดนับถอยหลัง 3-2-1 แล้วบันทึกให้เอง
   ถ้าระหว่างนับผู้ใช้หลุดออกจากกรอบ จะยกเลิกและเริ่มนับใหม่
   ปุ่มกดเองยังใช้ได้ตามปกติสำหรับคนที่มีผู้ช่วย
   ============================================================ */
function AutoCapture(opts){
  opts=opts||{};
  this.holdMs=opts.holdMs!==undefined?opts.holdMs:1600;  /* ต้องพร้อมต่อเนื่องเท่าไรก่อนเริ่มนับ */
  this.onFire=opts.onFire||function(){};
  this.readyText=opts.readyText||"พร้อมแล้ว";
  this.abortOnLost=opts.abortOnLost!==false;
  this.screen=opts.screen||null;      /* ยกเลิกอัตโนมัติถ้าเปลี่ยนหน้าจอ */
  this.readySince=null; this.counting=false; this.done=false; this.timer=null;
  this.enabled=opts.enabled!==false;
}
AutoCapture.prototype.update=function(ready){
  if(this.done||!this.enabled)return;
  if(this.counting){ if(this.abortOnLost&&!ready)this.abort(); return }
  if(!ready){this.readySince=null;return}
  if(this.readySince===null){this.readySince=performance.now();return}
  if(performance.now()-this.readySince>=this.holdMs)this.begin();
};
AutoCapture.prototype.begin=function(){
  var self=this; this.counting=true;
  var n=3, nm={3:"สาม",2:"สอง",1:"หนึ่ง"};
  setStatus("green",this.readyText+" — เตรียมตัว "+n,false);
  speak(this.readyText+" เตรียมตัว "+nm[n]);
  this.timer=setInterval(function(){
    if(self.screen&&S.screen!==self.screen){self.abort();return}
    n--;
    if(n>=1){setStatus("green","เตรียมตัว… "+n,false);speak(nm[n])}
    else{
      clearInterval(self.timer);self.timer=null;
      self.counting=false;self.done=true;
      self.onFire();
    }
  },1000);
};
AutoCapture.prototype.abort=function(){
  if(this.timer){clearInterval(this.timer);this.timer=null}
  this.counting=false;this.readySince=null;
};
AutoCapture.prototype.reset=function(){this.abort();this.done=false};

/* iOS/Android ต้องมี user gesture ก่อนถึงจะพูดได้ — ปลดล็อกตอนแตะครั้งแรก */
document.addEventListener("click",function unlock(){

/* ---------- ปรับขนาดตัวอักษรทั้งแอป ---------- */
var FONTSCALE=(function(){try{return parseFloat(localStorage.getItem("csv:fontScale"))||1}catch(e){return 1}})();
function applyFontScale(){
  document.documentElement.style.fontSize=(16*FONTSCALE)+"px";
  /* ไฟล์นี้ใช้ px เป็นหลัก จึง scale ที่ .phone ด้วย zoom สำหรับเนื้อหา */

function fontScaleSet(delta){
  FONTSCALE=Math.min(1.6,Math.max(1,Math.round((FONTSCALE+delta)*10)/10));
  try{localStorage.setItem("csv:fontScale",FONTSCALE)}catch(e){}
  applyFontScale();
  var b=document.getElementById("fsVal"); if(b)b.textContent=Math.round(FONTSCALE*100)+"%";
}

}
function bindFontBar(){
  var m=document.getElementById("fsMinus"),p=document.getElementById("fsPlus"),vb=document.getElementById("voiceBtn");

}

/* ============================================================
   ยืนยันตัวตนด้วยใบหน้า (Face Continuity)
   ------------------------------------------------------------
   วัตถุประสงค์: ยืนยันว่า "คนที่ทำการทดสอบคือเจ้าของบัญชีจริง"
   ไม่ใช่ระบบพิสูจน์ตัวตนแบบธนาคาร แต่กันการให้คนอื่นทำแทน

   วิธีทำงาน:
   1) ลงทะเบียนครั้งเดียว — วัดสัดส่วนใบหน้าเป็นตัวเลข 6 ค่า
   2) ระหว่างการทดสอบ ระบบตรวจซ้ำทุก ~2 วินาที ว่ายังเป็นคนเดิม
   3) เก็บ "ลายเซ็นเชิงสัดส่วน" ในเครื่องเท่านั้น ไม่เก็บภาพ ไม่อัปโหลด
   ⚠️ ข้อมูลชีวมิติเป็นข้อมูลอ่อนไหวตาม PDPA มาตรา 26 จึงขอความยินยอมแยก
      และผู้ใช้ปฏิเสธได้โดยยังใช้ระบบได้ตามปกติ
   ============================================================ */
var FACE=null, FACE_STATE="idle";
var FL={LEYE_OUT:33, REYE_OUT:263, LEYE_IN:133, REYE_IN:362, NOSE:1, NOSE_L:97, NOSE_R:326,
        MOUTH_L:61, MOUTH_R:291, CHIN:152, FOREHEAD:10};
var FACE_TOL=0.16;   /* ระยะที่ยอมรับว่าเป็นคนเดิม — ผ่อนปรนเพื่อลดการปฏิเสธผิดพลาด */

async function loadFaceModel(statusEl){
  if(FACE)return FACE;
  FACE_STATE="loading";
  if(statusEl)statusEl.textContent="กำลังโหลดตัวตรวจใบหน้า…";
  var mod=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
  var fs=await mod.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  FACE=await mod.FaceLandmarker.createFromOptions(fs,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},
    runningMode:"VIDEO",numFaces:1});
  FACE_STATE="ready";
  return FACE;
}
function fdist(a,b){return Math.hypot(a.x-b.x,a.y-b.y,(a.z||0)-(b.z||0))}
/* ลายเซ็นเชิงสัดส่วน — หารด้วยระยะระหว่างตา จึงไม่ขึ้นกับระยะห่างจากกล้อง */
function faceSignature(lm){
  var base=fdist(lm[FL.LEYE_OUT],lm[FL.REYE_OUT]);
  if(!base||base<1e-6)return null;
  return [fdist(lm[FL.LEYE_IN],lm[FL.REYE_IN])/base,
          fdist(lm[FL.NOSE],lm[FL.CHIN])/base,
          fdist(lm[FL.MOUTH_L],lm[FL.MOUTH_R])/base,
          fdist(lm[FL.NOSE_L],lm[FL.NOSE_R])/base,
          fdist(lm[FL.FOREHEAD],lm[FL.CHIN])/base,
          fdist(lm[FL.LEYE_OUT],lm[FL.MOUTH_L])/base];
}
function sigDist(a,b){
  if(!a||!b||a.length!==b.length)return 99;
  var s=0;for(var i=0;i<a.length;i++)s+=(a[i]-b[i])*(a[i]-b[i]);
  return Math.sqrt(s);
}
/* กุญแจผูกกับบัญชีคลาวด์ถ้าล็อกอินแล้ว — เครื่องเดียวหลายบัญชีไม่ปะปนกัน */
function faceKeyId(){
  try{if(CLOUD.session&&CSBackend.getProfile())return CSBackend.getProfile().id}catch(e){}
  return S.data.profile?S.data.profile.uid:"local";
}
function saveFaceSig(sig){
  try{localStorage.setItem("csv:faceSig:"+faceKeyId(),JSON.stringify(sig))}catch(e){}
  S.data.faceEnrolled=true;
  if(CLOUD.session)CSBackend.grantConsent("biometric_face","PDPA-1.0",
    {stored:"on-device-only",values:6,uploaded:false}).catch(function(){});
}
function loadFaceSig(){try{var s=localStorage.getItem("csv:faceSig:"+faceKeyId());return s?JSON.parse(s):null}catch(e){return null}}
function clearFaceSig(){
  try{localStorage.removeItem("csv:faceSig:"+faceKeyId())}catch(e){}
  S.data.faceEnrolled=false;
  if(CLOUD.session)CSBackend.revokeConsent("biometric_face").catch(function(){});
}
function faceEnabled(){return !!loadFaceSig()}

async function startFacePipeline(){
  var video=document.getElementById("vid"),canvas=document.getElementById("cv"),ctx=canvas.getContext("2d");
  var tag=document.getElementById("tag"),coach=document.getElementById("coach"),
      save=document.getElementById("fcSave"),chk=document.getElementById("fcConsent");
  var stream,cur=null;
  setStatus("yellow","กำลังเปิดกล้อง กรุณารอสักครู่");
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:480},height:{ideal:480}},audio:false})}
  catch(e){tag.textContent="เปิดกล้องไม่ได้";coach.textContent="ข้ามขั้นนี้ได้ ผลจะระบุว่าไม่ได้ยืนยันตัวตน";
    setStatus("red","เปิดกล้องไม่ได้ — ข้ามขั้นนี้ได้ กดปุ่มข้ามด้านล่าง");return}
  S.cam=stream;video.srcObject=stream;await video.play().catch(function(){});
  try{await loadFaceModel(tag)}
  catch(e){tag.textContent="โหลดตัวตรวจใบหน้าไม่สำเร็จ";coach.textContent="ข้ามขั้นนี้ได้ ต้องต่ออินเทอร์เน็ตครั้งแรก";return}
  tag.textContent="พร้อมแล้ว";
  function loop(){
    if(S.screen!=="face")return;
    var r=null;try{r=FACE.detectForVideo(video,performance.now())}catch(e){}
    var lm=r&&r.faceLandmarks&&r.faceLandmarks[0]?r.faceLandmarks[0]:null;
    if(canvas.width!==video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight}
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(lm){
      ctx.fillStyle="rgba(96,165,250,.85)";
      [FL.LEYE_OUT,FL.REYE_OUT,FL.NOSE,FL.MOUTH_L,FL.MOUTH_R,FL.CHIN].forEach(function(i){
        var p=lm[i];if(!p)return;
        ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,Math.max(3,canvas.width/120),0,6.3);ctx.fill();
      });
      var sg=faceSignature(lm);
      if(sg){cur=sg;tag.textContent="พบใบหน้าแล้ว";
        save.disabled=!chk.checked;
        if(chk.checked){
          coach.textContent="เห็นชัดแล้ว — ระบบจะบันทึกให้เองอัตโนมัติ";
          if(!AUTO.counting)setStatus("green","พบใบหน้าแล้ว — เตรียมบันทึกอัตโนมัติ",false);
        }else{
          coach.textContent="เห็นใบหน้าแล้ว — ติ๊กยินยอมด้านล่าง ระบบจะบันทึกให้เอง";
          setStatus("yellow","เห็นใบหน้าแล้ว — ติ๊กยินยอมด้านล่างก่อน");
        }
      }
    }else{tag.textContent="ยังไม่พบใบหน้า";coach.textContent="ขยับให้เห็นใบหน้าเต็มในกรอบ";save.disabled=true;
      setStatus("yellow","ยังไม่พบใบหน้า — ขยับให้เห็นใบหน้าเต็มในกรอบ")}
    AUTO.update(!!(cur&&lm&&chk.checked));
    RAF=requestAnimationFrame(loop);
  }
  var AUTO=new AutoCapture({screen:"face",holdMs:1800,readyText:"พบใบหน้าแล้ว",
    onFire:function(){doSaveFace()}});
  loop();
  chk.addEventListener("change",function(){save.disabled=!(this.checked&&cur);if(!this.checked)AUTO.abort()});
  save.addEventListener("click",function(){AUTO.abort();doSaveFace()});
  async function doSaveFace(){
    if(!cur||!chk.checked)return;
    saveFaceSig(cur);
    S.draft.identityVerified=true;
    audit("ลงทะเบียนใบหน้า","เก็บลายเซ็นเชิงสัดส่วน 6 ค่าไว้ในเครื่องผู้ใช้ ไม่เก็บภาพและไม่อัปโหลด","ผู้ใช้ให้ความยินยอมตามมาตรา 26");
    await saveAll();
    toast("บันทึกใบหน้าแล้ว");
    setStatus("green","บันทึกใบหน้าเรียบร้อย — ขั้นต่อไป สอบเทียบท่านั่งและท่ายืน",false);
    speak("บันทึกใบหน้าเรียบร้อย ขั้นตอนต่อไป สอบเทียบท่านั่งและท่ายืน");
    setTimeout(function(){go("calib")},2200);
  }
}

function drawPose(ctx,canvas,video,lm){
  if(canvas.width!==video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!lm)return;
  var pairs=[[11,12],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],[11,13],[13,15],[12,14],[14,16]];
  ctx.lineWidth=Math.max(3,canvas.width/150); ctx.strokeStyle="rgba(96,165,250,.9)"; ctx.lineCap="round";
  pairs.forEach(function(p){
    var a=lm[p[0]],b=lm[p[1]]; if(!a||!b)return;
    ctx.beginPath();ctx.moveTo(a.x*canvas.width,a.y*canvas.height);ctx.lineTo(b.x*canvas.width,b.y*canvas.height);ctx.stroke();
  });
  [11,12,23,24,25,26,27,28].forEach(function(i){
    var p=lm[i]; if(!p)return;
    ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,Math.max(4,canvas.width/110),0,6.3);
    ctx.fillStyle=(i===23||i===24)?"#FCD34D":"#DBEAFE";ctx.fill();
  });
}
function setupCalib(video,canvas,ctx){
  var step=0, sitVal=null, standVal=null, cur=null, armAt=0;
  var cap=document.getElementById("cap"), cstep=document.getElementById("cstep"), coach=document.getElementById("coach");
  var AUTO=new AutoCapture({screen:"calib",holdMs:2000,readyText:"พร้อมแล้ว",
    onFire:function(){doCapture()}});
  speak("ขั้นตอนสอบเทียบ กรุณานั่งบนเก้าอี้ ให้เห็นตัวเต็มในกล้อง ระบบจะบันทึกให้เองอัตโนมัติ");
  function loop(){
    if(S.screen!=="calib"){return}
    var r=null;
    try{r=POSE.detectForVideo(video,performance.now())}catch(e){}
    var lm=r&&r.landmarks&&r.landmarks[0]?r.landmarks[0]:null;
    drawPose(ctx,canvas,video,lm);
    if(lm){
      var q=visOK(lm), m=hipRatio(lm);
      if(q<0.85){coach.textContent="ขยับมือถือให้เห็นตั้งแต่ศีรษะถึงเท้า";cap.disabled=true;
        setStatus("yellow","ยังเห็นตัวไม่ครบ — ถอยมือถือให้เห็นตั้งแต่หัวถึงเท้า")}
      else if(m==null){coach.textContent="ยังจับสัดส่วนลำตัวไม่ได้ ลองถอยห่างอีกเล็กน้อย";cap.disabled=true;
        setStatus("yellow","ถอยห่างอีกนิด ให้เห็นทั้งตัว")}
      else{cur=m;cap.disabled=false;
        coach.textContent=step===0?"เห็นชัดแล้ว — นั่งนิ่ง ๆ ระบบจะบันทึกให้เอง":"เห็นชัดแล้ว — ยืนตรงนิ่ง ๆ ระบบจะบันทึกให้เอง";
        if(!AUTO.counting)setStatus("green",step===0?"เห็นตัวชัดแล้ว — นั่งนิ่ง ๆ ระบบกำลังจะบันทึก":"เห็นตัวชัดแล้ว — ยืนนิ่ง ๆ ระบบกำลังจะบันทึก",false);}
    }else{coach.textContent="ยังไม่พบคนในภาพ";cap.disabled=true;
      setStatus("yellow","ยังไม่พบคนในภาพ — เข้ามาในกรอบกล้อง")}
    /* หน่วงหลังบันทึกท่านั่ง เพื่อให้มีเวลาลุกขึ้นยืนก่อนเริ่มนับใหม่ */
    AUTO.update(cur!=null && !cap.disabled && performance.now()>=armAt);
    RAF=requestAnimationFrame(loop);
  }
  loop();
  cap.addEventListener("click",function(){AUTO.abort();doCapture()});
  function doCapture(){
    if(cur==null)return;
    if(step===0){
      sitVal=cur;step=1;
      cstep.textContent="ขั้นที่ 2 · ยืนขึ้นตรง ๆ หนึ่งครั้ง";
      cap.textContent="บันทึกท่ายืน";
      toast("บันทึกท่านั่งแล้ว");
      setStatus("green","บันทึกท่านั่งเรียบร้อย — ขั้นต่อไป ยืนขึ้นตรง ๆ",false);
      speak("บันทึกท่านั่งเรียบร้อย ขั้นตอนต่อไป กรุณายืนขึ้นตรง ๆ แล้วยืนนิ่ง ๆ");
      armAt=performance.now()+4000;   /* ให้เวลา 4 วินาทีลุกขึ้นยืน */
      AUTO.reset();
      return;
    }else{
      standVal=cur;
      if(standVal-sitVal<0.045){
        toast("ความต่างระหว่างท่านั่งกับท่ายืนน้อยเกินไป ลองใหม่โดยยืนให้ตรงสุด");
        setStatus("red","ท่านั่งกับท่ายืนต่างกันน้อยเกินไป — เริ่มใหม่ กรุณานั่งลงก่อน");
        speak("ท่านั่งกับท่ายืนต่างกันน้อยเกินไป เริ่มใหม่ กรุณานั่งลงก่อน");
        step=0;cstep.textContent="ขั้นที่ 1 · นั่งบนเก้าอี้ให้เห็นเต็มตัว";cap.textContent="บันทึกท่านั่ง";
        armAt=performance.now()+4000;AUTO.reset();return;
      }
      S.draft.sitRef=sitVal;S.draft.standRef=standVal;
      audit("สอบเทียบกล้อง","ค่าท่านั่ง "+sitVal.toFixed(3)+" ค่าท่ายืน "+standVal.toFixed(3)+" ช่วงห่าง "+(standVal-sitVal).toFixed(3));
      toast("สอบเทียบเรียบร้อย");
      setStatus("green","สอบเทียบเรียบร้อย — ขั้นต่อไป ทดสอบลุกนั่ง 5 ครั้ง",false);
      speak("สอบเทียบเรียบร้อย ขั้นตอนต่อไป ทดสอบลุกนั่ง ห้าครั้ง กรุณานั่งลงบนเก้าอี้");
      setTimeout(function(){go("test")},2400);
    }
  }
}
function setupTest(video,canvas,ctx){
  DET=new RepDetector({target:5});
  /* ตรวจใบหน้าเป็นระยะระหว่างทดสอบ กันการสลับคนกลางคัน */
  var faceRef=faceEnabled()?loadFaceSig():null;
  var frameN=0, faceChecks=0, faceFails=0;
  S.draft.identityChecks=0; S.draft.identityFails=0;
  DET.setRefs(S.draft.sitRef,S.draft.standRef);
  var repEl=document.getElementById("rep"),clk=document.getElementById("clk"),trk=document.getElementById("trk"),
      st=document.getElementById("st"),coach=document.getElementById("coach"),qual=document.getElementById("qual"),
      startBtn=document.getElementById("startBtn"),stopBtn=document.getElementById("stopBtn");
  var running=false, t0=0, lastEvt=0, AUTOSTART=null;
  function loop(){
    if(S.screen!=="test")return;
    var r=null;
    try{r=POSE.detectForVideo(video,performance.now())}catch(e){}
    var lm=r&&r.landmarks&&r.landmarks[0]?r.landmarks[0]:null;
    drawPose(ctx,canvas,video,lm);
    frameN++;
    /* ตรวจใบหน้าทุก ~60 เฟรม (≈2 วินาที) เฉพาะตอนกำลังจับเวลา */
    if(faceRef&&running&&FACE&&frameN%60===0){
      try{
        var fr=FACE.detectForVideo(video,performance.now());
        var flm=fr&&fr.faceLandmarks&&fr.faceLandmarks[0]?fr.faceLandmarks[0]:null;
        if(flm){
          var sg=faceSignature(flm);
          faceChecks++; S.draft.identityChecks=faceChecks;
          if(sigDist(sg,faceRef)>FACE_TOL){faceFails++; S.draft.identityFails=faceFails}
        }
      }catch(e){}
    }
    if(lm){
      var q=visOK(lm),m=hipRatio(lm),ka=kneeAngle(lm);
      qual.innerHTML="คุณภาพภาพ <b>"+Math.round(q*100)+"%</b>"+(ka!=null?" · เข่า "+Math.round(ka)+"°":"")+
        (faceRef?(faceFails>0?" · <b style='color:#FCA5A5'>ใบหน้าไม่ตรง</b>":(faceChecks?" · <b style='color:#6EE7B7'>ยืนยันตัวตนแล้ว</b>":" · รอตรวจใบหน้า")):"");
      if(m!=null&&running){
        var ev=DET.push(m,performance.now());
        st.textContent=DET.state==="stand"?"ยืน":"นั่ง";
        repEl.textContent=DET.reps;
        trk.style.width=(DET.reps/5*100)+"%";
        if(ev&&ev.event==="rep"){lastEvt=performance.now();
          coach.innerHTML="นับได้ "+ev.reps+" ครั้ง — นั่งลงให้สุดแล้วลุกต่อ<span class='statebadge'>"+(DET.state==="stand"?"ยืน":"นั่ง")+"</span>";
          setStatus("green","นับได้ "+ev.reps+" ครั้ง จาก 5 ครั้ง",false);
          speak(["","หนึ่ง","สอง","สาม","สี่","ห้า"][ev.reps]);}
        if(ev&&ev.event==="down")lastEvt=performance.now();
        if(ev&&ev.event==="finish"){finishTest(ev.elapsed);return}
      }else if(m!=null&&!running){
        var sitting=m<(S.draft.sitRef+S.draft.standRef)/2;
        st.textContent=sitting?"นั่ง":"ยืน";
        if(AUTOSTART&&!AUTOSTART.counting)
          setStatus(sitting?"green":"yellow",
            sitting?"เห็นท่านั่งแล้ว — นั่งนิ่ง ๆ ระบบกำลังจะเริ่มจับเวลา":"กรุณานั่งลงบนเก้าอี้ก่อน",false);
        if(AUTOSTART)AUTOSTART.update(sitting&&q>=0.8);
      }
      if(q<0.8)coach.textContent="เห็นตัวไม่ครบ — ขยับมือถือให้เห็นทั้งตัว";
    }else{qual.innerHTML="คุณภาพภาพ <b>—</b>"}
    if(running){
      var el=(performance.now()-t0)/1000;clk.innerHTML=el.toFixed(1)+'<span style="font-size:13px"> วิ</span>';
      /* ตาข่ายนิรภัย: นับไม่ขึ้นเกิน 20 วินาที → แนะทางออก ไม่ปล่อยให้ติดค้าง */
      if(performance.now()-lastEvt>20000){
        coach.innerHTML="ระบบนับไม่ขึ้นใช่ไหม — ลอง<b>ลุกให้สุด นั่งให้ก้นแตะเก้าอี้</b> หรือกดปุ่มด้านล่างเพื่อกรอกเวลาเอง";
        setStatus("red","ระบบนับไม่ขึ้น — ลุกให้สุด นั่งให้สุด หรือกดปุ่มกรอกเวลาเอง");
        stopBtn.hidden=false;
      }
    }
    RAF=requestAnimationFrame(loop);
  }
  loop();
  /* เริ่มจับเวลาเองอัตโนมัติเมื่อผู้ใช้นั่งนิ่งพร้อม — ไม่ต้องเดินมากดปุ่ม */
  AUTOSTART=new AutoCapture({screen:"test",holdMs:2500,readyText:"นั่งพร้อมแล้ว",
    abortOnLost:false,onFire:function(){beginTimer()}});
  speak("กรุณานั่งบนเก้าอี้ กอดอกไว้ ระบบจะเริ่มจับเวลาให้เองเมื่อพร้อม");
  function beginTimer(){
    if(running)return;
    AUTOSTART.abort();AUTOSTART.done=true;
    running=true;t0=performance.now();lastEvt=t0;DET.start(t0);
    startBtn.textContent="กำลังจับเวลา…";startBtn.disabled=true;
    stopBtn.hidden=false;
    setStatus("green","เริ่มได้เลย — นาฬิกาจะเริ่มเดินเมื่อคุณเริ่มลุก",false);speak("เริ่มได้เลย");
    coach.innerHTML="ลุกยืนให้สุดแล้วนั่งลงให้สุด ทำต่อเนื่อง<span class='statebadge'>เริ่มแล้ว</span>";
  }
  startBtn.addEventListener("click",function(){
    if(running)return;
    AUTOSTART.abort();
    beginTimer();
  });
  stopBtn.addEventListener("click",function(){
    var reps=DET?DET.reps:0;
    stopCam();
    audit("หยุดการทดสอบด้วยกล้องกลางคัน","ผู้ใช้หยุดเองขณะนับได้ "+reps+" ครั้ง แล้วเลือกกรอกเวลาเอง");
    askTime(function(n){
      S.draft.ftsst=n;S.draft.method="manual";S.draft.reps=5;S.draft.cv=null;S.draft.gaps=null;
      audit("บันทึกเวลาด้วยตนเอง","ผู้ใช้กรอกเวลา "+n.toFixed(1)+" วินาที");
      go("q",0);
    },function(){go("assess")});
  });
}
function finishTest(elapsed){
  stopCam();
  var gaps=[];
  for(var i=1;i<DET.stamps.length;i++)gaps.push((DET.stamps[i]-DET.stamps[i-1])/1000);
  var cv=null;
  if(gaps.length>1){
    var mean=gaps.reduce(function(a,b){return a+b},0)/gaps.length;
    var sd=Math.sqrt(gaps.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/gaps.length);
    cv=mean>0?sd/mean:null;
  }
  S.draft.ftsst=Math.round(elapsed*10)/10;
  S.draft.method="camera-pose";
  S.draft.reps=DET.reps;
  S.draft.cv=cv;
  S.draft.gaps=gaps.map(function(g){return Math.round(g*10)/10});
  /* สรุปผลยืนยันตัวตน: ผ่านเมื่อตรวจอย่างน้อย 1 ครั้งและไม่ตรงไม่เกิน 1 ครั้ง */
  var ck=S.draft.identityChecks||0, fl=S.draft.identityFails||0;
  S.draft.identityVerified=(faceEnabled()&&ck>=1&&fl<=1);
  audit("ผลการยืนยันตัวตนระหว่างทดสอบ", faceEnabled()
    ? ("ตรวจใบหน้า "+ck+" ครั้ง ไม่ตรง "+fl+" ครั้ง → "+(S.draft.identityVerified?"ยืนยันผ่าน":"ยืนยันไม่ผ่าน"))
    : "ผู้ใช้ไม่ได้ลงทะเบียนใบหน้า ผลนี้ไม่ได้ยืนยันตัวตน");
  audit("วัดด้วยกล้อง","ลุกนั่ง 5 ครั้งใน "+S.draft.ftsst.toFixed(1)+" วินาที · เวลาต่อครั้ง "+S.draft.gaps.join(", ")+" วินาที"+(cv!=null?" · ความแปรปรวน "+(cv*100).toFixed(0)+"%":""));
  speak("ครบห้าครั้ง เสร็จเรียบร้อย ใช้เวลา "+S.draft.ftsst.toFixed(0)+" วินาที เก่งมากค่ะ ขั้นตอนต่อไป ทดสอบการทรงตัว");
  toast("วัดเสร็จแล้ว "+S.draft.ftsst.toFixed(1)+" วินาที");
  if(PILOT){go("plog");return}
  setTimeout(function(){go("balance")},2400);
}

/* ============================================================
   ทดสอบการทรงตัว — ยืนเท้าชิด หลับตา 10 วินาที
   ------------------------------------------------------------
   กล้องวัด "ความโคลงเคลง" (postural sway) จากการขยับของจุดกึ่งกลางลำตัว
   หารด้วยความกว้างไหล่ เพื่อให้ค่าไม่ขึ้นกับระยะห่างจากกล้อง

   ⚠️ ค่าที่วัดได้เป็น "ข้อสังเกตจากกล้อง" ไม่ใช่การตัดสิน
   ผู้เอาประกันเป็นผู้ยืนยันความรู้สึกจริงอีกครั้งเสมอ
   และกระบวนการนี้จะถูกตรวจสอบโดยเจ้าหน้าที่ประกันภัยในภายหลัง
   ============================================================ */
var BAL_SECONDS=10;

/* จุดกึ่งกลางลำตัวและความกว้างไหล่ ใช้ทำให้ค่าไม่ขึ้นกับระยะกล้อง */
function trunkCenter(lm){
  var sh={x:(lm[LM.LSH].x+lm[LM.RSH].x)/2, y:(lm[LM.LSH].y+lm[LM.RSH].y)/2};
  var hp={x:(lm[LM.LHIP].x+lm[LM.RHIP].x)/2, y:(lm[LM.LHIP].y+lm[LM.RHIP].y)/2};
  return {x:(sh.x+hp.x)/2, y:(sh.y+hp.y)/2};
}
function shoulderWidth(lm){
  return Math.hypot(lm[LM.LSH].x-lm[LM.RSH].x, lm[LM.LSH].y-lm[LM.RSH].y);
}
/* ค่าโคลงเคลง = ส่วนเบี่ยงเบนมาตรฐานของตำแหน่งลำตัว หารความกว้างไหล่ */
function swayScore(samples){
  if(samples.length<8)return null;
  var n=samples.length, mx=0, my=0;
  samples.forEach(function(s){mx+=s.x;my+=s.y});
  mx/=n; my/=n;
  var vx=0, vy=0;
  samples.forEach(function(s){vx+=(s.x-mx)*(s.x-mx); vy+=(s.y-my)*(s.y-my)});
  return Math.sqrt(vx/n+vy/n);
}
/* แปลงค่าเป็นข้อสังเกต 3 ระดับ */
function swayLabel(v){
  if(v==null)return {nm:"วัดไม่ได้", cls:"", hint:"กล้องเห็นตัวไม่ครบตลอด 10 วินาที"};
  if(v<0.020)return {nm:"นิ่งมาก", cls:"t4", hint:"แทบไม่มีการโคลง"};
  if(v<0.045)return {nm:"โคลงเล็กน้อย", cls:"t3", hint:"มีการแกว่งบ้างตามปกติ"};
  if(v<0.080)return {nm:"โคลงปานกลาง", cls:"t2", hint:"แกว่งชัดเจน ควรมีที่จับใกล้มือ"};
  return {nm:"โคลงมาก", cls:"t1", hint:"แกว่งมาก ควรมีคนอยู่ข้าง ๆ เสมอ"};
}

async function startBalancePipeline(){
  var video=document.getElementById("vid"),canvas=document.getElementById("cv"),ctx=canvas.getContext("2d");
  var tag=document.getElementById("tag"),coach=document.getElementById("coach"),qual=document.getElementById("qual"),
      secEl=document.getElementById("bsec"),swayEl=document.getElementById("bsway"),trk=document.getElementById("btrk"),
      startBtn=document.getElementById("bStart");
  var stream;
  setStatus("yellow","กำลังเปิดกล้อง กรุณารอสักครู่");
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:854}},audio:false})}
  catch(e){tag.textContent="เปิดกล้องไม่ได้";setStatus("red","เปิดกล้องไม่ได้ — ตอบคำถามด้วยตนเองแทนได้");
    coach.textContent="กดปุ่มข้ามด้านล่างเพื่อตอบเอง";return}
  S.cam=stream;video.srcObject=stream;await video.play().catch(function(){});
  setStatus("yellow","กำลังโหลดระบบตรวจจับท่าทาง",false);
  try{await loadModel(tag)}
  catch(e){tag.textContent="โหลดโมเดลไม่สำเร็จ";setStatus("red","โหลดระบบไม่สำเร็จ — ตอบคำถามด้วยตนเองแทนได้");return}
  tag.textContent="ตรวจจับท่าทางแล้ว";

  var running=false, t0=0, samples=[], lostFrames=0, AUTOB=null;
  function finish(held){
    running=false;
    var sway=swayScore(samples);
    var lab=swayLabel(sway);
    S.draft.swayValue=sway;
    S.draft.swayHeld=held;
    S.draft.swayLabel=lab.nm;
    stopCam();
    audit("วัดการทรงตัวด้วยกล้อง",
      "ยืนได้ "+held.toFixed(1)+" วินาที จาก "+BAL_SECONDS+" วินาที · ค่าความโคลง "+(sway!=null?sway.toFixed(4):"วัดไม่ได้")+" ("+lab.nm+")");
    setStatus("green","วัดเสร็จแล้ว — ยืนได้ "+held.toFixed(0)+" วินาที · "+lab.nm,false);
    speak("วัดเสร็จเรียบร้อย ยืนได้ "+held.toFixed(0)+" วินาที ระบบสังเกตว่า "+lab.nm+" ขั้นตอนต่อไป กรุณายืนยันความรู้สึกของท่านเอง");
    setTimeout(function(){go("q",0)},2600);
  }
  function loop(){
    if(S.screen!=="balance")return;
    var r=null;try{r=POSE.detectForVideo(video,performance.now())}catch(e){}
    var lm=r&&r.landmarks&&r.landmarks[0]?r.landmarks[0]:null;
    drawPose(ctx,canvas,video,lm);
    if(lm){
      var q=visOK(lm);
      qual.innerHTML="คุณภาพภาพ <b>"+Math.round(q*100)+"%</b>";
      if(running){
        lostFrames=0;
        var w=shoulderWidth(lm);
        if(w>0.02){
          var c=trunkCenter(lm);
          samples.push({x:c.x/w, y:c.y/w});
        }
        var el=(performance.now()-t0)/1000;
        var left=Math.max(0,BAL_SECONDS-el);
        secEl.textContent=left.toFixed(0);
        trk.style.width=Math.min(100,el/BAL_SECONDS*100)+"%";
        var live=swayScore(samples.slice(-90));
        if(live!=null)swayEl.textContent=swayLabel(live).nm;
        if(el>=BAL_SECONDS){finish(BAL_SECONDS);return}
      }else{
        if(AUTOB&&!AUTOB.counting)
          setStatus(q>=0.85?"green":"yellow",
            q>=0.85?"เห็นตัวชัดแล้ว — ยืนเท้าชิด ระบบกำลังจะเริ่มนับ":"ถอยให้เห็นทั้งตัวก่อน",false);
        if(AUTOB)AUTOB.update(q>=0.85);
      }
    }else{
      qual.innerHTML="คุณภาพภาพ <b>—</b>";
      if(running){
        lostFrames++;
        /* หลุดกรอบนานเกิน ~2 วินาที = น่าจะก้าวออกหรือคว้าจับ → หยุดและบันทึกเท่าที่ทำได้ */
        if(lostFrames>60){
          var elp=(performance.now()-t0)/1000;
          coach.textContent="ตรวจไม่พบตัวในกรอบ — บันทึกเท่าที่ทำได้";
          finish(Math.min(elp,BAL_SECONDS));return;
        }
      }
    }
    RAF=requestAnimationFrame(loop);
  }
  loop();
  AUTOB=new AutoCapture({screen:"balance",holdMs:2200,readyText:"ยืนพร้อมแล้ว",
    abortOnLost:false,onFire:function(){begin()}});
  speak("กรุณายืนเท้าชิดกัน มือแนบลำตัว ยืนใกล้ที่จับ ระบบจะเริ่มนับให้เองเมื่อพร้อม");
  function begin(){
    if(running)return;
    running=true;t0=performance.now();samples=[];lostFrames=0;
    startBtn.disabled=true;startBtn.textContent="กำลังวัด…";
    setStatus("green","หลับตาได้เลย — ยืนนิ่ง ๆ 10 วินาที",false);
    speak("หลับตาได้เลย ยืนนิ่ง ๆ สิบวินาที");
    coach.innerHTML="หลับตา ยืนนิ่ง ๆ<span class='statebadge'>กำลังวัด</span>";
  }
  startBtn.addEventListener("click",function(){if(AUTOB)AUTOB.abort();begin()});
}

  '<p class="sub" style="margin:0 0 10px">หากพบว่าข้อมูลไม่ตรงกับความจริงในสาระสำคัญ บริษัทอาจใช้สิทธิ์ตามกฎหมายในการปฏิเสธการจ่ายสินไหมหรือบอกล้างสัญญาได้ ตามประมวลกฎหมายแพ่งและพาณิชย์ว่าด้วยการปกปิดข้อความจริงในสัญญาประกันภัย</p>'+
  '<p class="sub" style="margin:0;color:var(--c4)"><b>ตอบตามจริงไม่ทำให้เบี้ยแพงขึ้น</b> — ระบบนี้ใช้ผลตรวจลดเบี้ยได้ทางเดียว การตอบว่ามีความเสี่ยงทำให้ท่านได้รับการดูแลเร็วขึ้น ไม่ใช่ถูกลงโทษ</p></div>';
}

/* การ์ดแสดงสิ่งที่กล้องสังเกตได้ ก่อนให้ผู้ใช้ยืนยันด้วยตนเอง */
function cameraObs(){
  if(S.draft.swayValue===undefined)return "";
  if(S.draft.swayValue===null&&S.draft.swayHeld==null)return "";
  var lab=swayLabel(S.draft.swayValue);
  var held=S.draft.swayHeld;
  return '<div class="card" style="background:var(--surf2)">'+
  '<h3>สิ่งที่กล้องสังเกตได้</h3>'+
  '<div class="rowline"><span class="k">ยืนได้นาน</span><span class="v">'+(held!=null?held.toFixed(0)+" / "+BAL_SECONDS+" วินาที":"—")+'</span></div>'+
  '<div class="rowline"><span class="k">ความโคลงเคลง</span><span class="v"><span class="pill '+lab.cls+'">'+lab.nm+'</span></span></div>'+
  (S.draft.swayValue!=null?'<div class="rowline"><span class="k">ค่าที่วัดได้</span><span class="v">'+S.draft.swayValue.toFixed(4)+'</span></div>':'')+
  '<p class="sub" style="margin:10px 0 0">'+esc(lab.hint)+' — <b>นี่เป็นเพียงข้อสังเกตจากกล้อง ไม่ใช่คำตัดสิน</b> กรุณาเลือกคำตอบที่ตรงกับความรู้สึกจริงของท่านด้านล่าง ระบบจะบันทึกทั้งสองค่าไว้คู่กัน และเจ้าหน้าที่ประกันภัยจะตรวจสอบอีกครั้ง</p></div>';
}

/* ---------- หน้าคำถาม: รองรับทั้งแบบเลือกตอบ และรูบริกบาร์เธล ---------- */
function qV(i){
  i=i||0; var q=QS[i];

  /* ---- แบบรูบริก: ดัชนีบาร์เธล 10 รายการ ---- */
  if(q.barthel){
    head("ข้อ "+(i+1)+" จาก "+QS.length,"ความสามารถในการทำกิจวัตรประจำวัน","ติ๊กทีละรายการตามความเป็นจริง · ใช้เกณฑ์ดัชนีบาร์เธลเดียวกับระบบสาธารณสุขไทย");
    if(!S.draft.barthel)S.draft.barthel={};
    var b=S.draft.barthel;
    V.innerHTML='<div class="anim">'+
    '<div class="card" style="background:var(--surf2)"><h3>ทำไมต้องตอบทีละข้อ</h3>'+
    '<p class="sub" style="margin:0">ดัชนีบาร์เธล (Barthel ADL Index) ประเมิน 10 ด้าน รวม 20 คะแนน เป็นเกณฑ์เดียวกับที่ระบบสาธารณสุขไทยใช้ชี้ว่าใครอยู่ในภาวะพึ่งพิง · การตอบทีละด้านให้ผลแม่นกว่าการถามรวมข้อเดียวมาก</p></div>'+
    '<div id="bWrap"></div>'+
    '<div class="card" id="bSum"></div>'+
    '<button class="cta" id="bGo" disabled>บันทึกและดูผลการประเมิน</button>'+
    '<div class="disc">แบบคัดกรองนี้เป็น<b>ฉบับย่อเพื่อเฝ้าระวัง</b> การตัดสินว่าเข้าเกณฑ์ภาวะพึ่งพิงเพื่อรับสินไหม ต้องประเมินโดยทีมสหวิชาชีพที่ไปถึงบ้าน · กล้องวัดข้อนี้แทนไม่ได้ เพราะเป็นเรื่องการอาบน้ำและเข้าห้องน้ำซึ่งไม่ควรถ่ายภาพ</div></div>';

    function renderB(){
      document.getElementById("bWrap").innerHTML=BARTHEL.map(function(it,idx){
        return '<div class="card"><h3>'+(idx+1)+' · '+esc(it.nm)+'</h3>'+
        it.o.map(function(o){
          var on=b[it.k]===o[1];
          return '<button class="pick" data-k="'+it.k+'" data-v="'+o[1]+'" '+
            'style="'+(on?"border-color:var(--brand);background:var(--surf2);font-weight:600":"")+'">'+
            (on?"✓ ":"")+esc(o[0])+'<span style="float:right;font-family:var(--mono);color:var(--ink3)">'+o[1]+'</span></button>';
        }).join("")+'</div>';
      }).join("");
      var n=Object.keys(b).length, tot=barthelTotal(b), band=barthelBand(tot);
      var full=(n===BARTHEL.length);
      document.getElementById("bSum").innerHTML=
        '<h3>คะแนนรวม</h3>'+
        '<div class="rowline"><span class="k">ตอบแล้ว</span><span class="v">'+n+' / '+BARTHEL.length+' ด้าน</span></div>'+
        '<div class="rowline"><span class="k">คะแนนบาร์เธล</span><span class="v">'+tot+' / 20</span></div>'+
        (full?'<div class="rowline"><span class="k">ระดับ</span><span class="v"><span class="pill '+band.cls+'">'+band.nm+'</span></span></div>':
              '<p class="sub" style="margin:10px 0 0">กรุณาตอบให้ครบทุกด้านเพื่อสรุปผล</p>')+
        '<p class="sub" style="margin:10px 0 0">เกณฑ์: 12–20 ติดสังคม · 5–11 ติดบ้าน · 0–4 ติดเตียง</p>';
      document.getElementById("bGo").disabled=!full;
      /* ปุ่มตัวเลือกถูกสร้างใหม่ทุกครั้งที่ re-render จึงผูก listener ตรงนี้ได้ */
      V.querySelectorAll("[data-k]").forEach(function(btn){
        btn.addEventListener("click",function(){
          b[btn.dataset.k]=+btn.dataset.v;
          renderB();
        });
      });
    }
    renderB();
    /* ผูกปุ่มบันทึกเพียงครั้งเดียวนอก renderB — ไม่งั้น listener จะซ้อนทุกครั้งที่ติ๊ก
       และกดบันทึกครั้งเดียวจะบันทึกผลซ้ำหลายรายการ */
    document.getElementById("bGo").addEventListener("click",function(){
      if(this.disabled)return;
      this.disabled=true;
      var tot=barthelTotal(b), band=barthelBand(tot);
      S.draft.adl=band.adl;
      S.draft.barthelTotal=tot;
      S.draft.barthelBand=band.nm;
      audit("ประเมินกิจวัตรประจำวัน (Barthel ADL)",
        "คะแนน "+tot+"/20 · ระดับ "+band.nm+" · ตอบครบ "+BARTHEL.length+" ด้าน");
      finishAssess();
    });
    return;
  }

  /* ---- แบบเลือกตอบปกติ ---- */
  head("ข้อ "+(i+1)+" จาก "+QS.length,q.q,"ตอบตามความเป็นจริง ผลที่ตรงช่วยให้ระบบดูแลคุณได้ถูกต้อง");
  V.innerHTML='<div class="anim">'+
    (q.fromCamera?cameraObs():"")+
    q.o.map(function(o,k){
      return '<button class="pick" data-v="'+o[1]+'">'+esc(o[0])+'</button>'}).join("")+
    (q.verify?verifyNotice():"")+
    '<div class="disc">ข้อมูลชุดนี้รวมกับผลจากกล้อง เป็นคะแนนเต็ม 12</div></div>';
  V.querySelectorAll(".pick").forEach(function(b){
    b.addEventListener("click",function(){
      S.draft[q.k]=+b.dataset.v;
      if(i+1<QS.length)go("q",i+1); else finishAssess();
    });
  });
}
async function finishAssess(){
  var p=S.data.profile, r=scoreOf(S.draft,p.age);
  var rec={at:nowISO(),score:r.score,max:r.max,tier:r.tier,ftsst:S.draft.ftsst,parts:r.parts,
           method:S.draft.method,reps:S.draft.reps,cv:S.draft.cv,gaps:S.draft.gaps||null,
           verified:!!S.draft.identityVerified,
           idChecks:S.draft.identityChecks||0, idFails:S.draft.identityFails||0,
           sway:S.draft.swayValue!==undefined?S.draft.swayValue:null,
           swayHeld:S.draft.swayHeld!=null?S.draft.swayHeld:null,
           swayLabel:S.draft.swayLabel||null,
           barthel:S.draft.barthel||null,
           barthelTotal:S.draft.barthelTotal!=null?S.draft.barthelTotal:null,
           barthelBand:S.draft.barthelBand||null,
           /* แหล่งที่มาของคำตอบเชิงประวัติ — เริ่มต้นเป็น "ผู้ใช้กรอกเอง" เสมอ */
           src:{balance:"self_reported",falls:"self_reported",meds:"self_reported",adl:"self_reported"}};
  S.data.assessments.push(rec);
  audit("ให้คะแนนการประเมิน","คะแนน "+r.score+"/"+r.max+" ระดับ "+CFG.tiers[r.tier].nm+" · วิธีวัด: "+(rec.method==="camera-pose"?"กล้องตรวจจับท่าทาง":"จับเวลาเอง"));
  var tr=trajectory();
  if(tr){
    audit("วิเคราะห์แนวโน้มความเสี่ยง","ระดับ "+ENGINE.levelNm[tr.level]+" · กฎที่ทำงาน: "+(tr.flags.map(function(f){return f.id}).join(", ")||"ไม่มี")+" · นัดประเมินซ้ำใน "+tr.nextDays+" วัน");
    if(tr.referral.need){
      S.data.cases.push({id:"C"+Date.now().toString(36),at:nowISO(),uid:p.uid,name:p.name,age:p.age,sex:p.sex,
        level:tr.level,sla:tr.referral.sla,action:tr.referral.nm,
        reasons:tr.flags.map(function(f){return{id:f.id,text:f.text}}),
        status:"pending"});
      audit("สร้างเคสส่งต่อ",tr.referral.nm+" "+tr.referral.sla+" — สถานะ: รอผู้เชี่ยวชาญยืนยัน","ต้องมีพยาบาล/Care Manager ยืนยันก่อนดำเนินการ");
    }
  }
  await saveAll();
  cloudSync(rec,tr);   /* ซิงก์ขึ้นระบบกลางแบบไม่บล็อกผู้ใช้ */
  S.draft={};
  go("result",rec);
}

/* ---------- ป้ายแหล่งที่มาของข้อมูล ----------
   แยกให้ชัดว่าอะไรคือคำตอบที่ผู้ใช้กรอกเอง อะไรคือสิ่งที่ยืนยันกับเวชระเบียนแล้ว
   ค่าเริ่มต้นทุกคำตอบคือ "ยังไม่ยืนยัน" เสมอ */
function srcTag(v){
  return v==="verified_medical_record"
    ? '<span class="pill t4" style="font-size:10.5px;padding:2px 8px;margin-left:5px">ยืนยันแล้ว</span>'
    : '<span class="pill" style="font-size:10.5px;padding:2px 8px;margin-left:5px;background:var(--line2);color:var(--ink2)">ผู้ใช้กรอกเอง</span>';
}

/* ---------- ขอตรวจสอบกับประวัติการรักษา (Medical Record Verification) ----------
   หลักการ: ขอบเขตรายครั้ง ระบุโรงพยาบาล ข้อมูล และช่วงเวลา
   ไม่ใช่ใบยินยอมใบเดียวที่เปิดดูได้ทุกโรงพยาบาลตลอดชีวิต */
async function mrvV(){
  head("ตรวจสอบกับประวัติการรักษา","ยืนยันคำตอบที่กรอกเอง","ขอความยินยอมเฉพาะครั้ง ระบุโรงพยาบาลและช่วงเวลาชัดเจน","result");
  if(!CLOUD.session){
    V.innerHTML='<div class="anim"><div class="card"><h3>ต้องเชื่อมระบบกลางก่อน</h3>'+
    '<p class="sub" style="margin:0">การขอตรวจสอบกับสถานพยาบาลต้องมีบัญชีในระบบกลาง เพื่อบันทึกความยินยอมและติดตามสถานะคำขอได้</p></div>'+
    '<button class="ghostb" data-go="result">กลับ</button></div>';return;
  }
  var reqs=[];try{reqs=await CSBackend.listMedicalChecks()}catch(e){}
  var stNm={pending:"รอดำเนินการ",sent:"ส่งคำขอแล้ว",completed:"ตรวจสอบเสร็จ",cancelled:"ยกเลิกแล้ว"};
  V.innerHTML='<div class="anim">'+
  '<div class="card" style="background:var(--accentb)"><h3 style="color:var(--accent2)">ทำไมต้องมีขั้นตอนนี้</h3>'+
  '<p class="sub" style="margin:0">คำตอบเรื่องการหกล้มและยาประจำเป็นข้อมูลที่คุณกรอกเอง ระบบจึงระบุว่า <b>"ผู้ใช้กรอกเอง"</b> เสมอ · หากคุณยินยอม เราจะขอตรวจสอบกับสถานพยาบาลที่คุณระบุ เพื่อให้ข้อมูลมีน้ำหนักพอใช้ประกอบการรับประกันหรือการพิจารณาสินไหมได้</p></div>'+
  '<div class="card"><h3>ขอบเขตที่คุณอนุญาต</h3>'+
  '<div class="field"><label>สถานพยาบาล</label><input id="mHosp" placeholder="เช่น โรงพยาบาลประจำจังหวัด"></div>'+
  '<div class="field"><label>ช่วงเวลาที่อนุญาตให้ตรวจสอบ</label><input id="mPeriod" value="2568-2569" placeholder="เช่น 2568-2569"></div>'+
  '<div class="field"><label>ข้อมูลที่อนุญาต (เลือกได้หลายข้อ)</label>'+
  '<label class="chk" style="margin-bottom:8px"><input type="checkbox" id="mFalls" checked><span>ประวัติการหกล้ม</span></label>'+
  '<label class="chk" style="margin-bottom:8px"><input type="checkbox" id="mMeds" checked><span>รายการยาประจำ</span></label>'+
  '<label class="chk"><input type="checkbox" id="mAdl"><span>การประเมินกิจวัตรประจำวัน (ADL)</span></label></div>'+
  '<label class="chk" style="margin-top:12px"><input type="checkbox" id="mConsent"><span>ข้าพเจ้ายินยอมให้ตรวจสอบข้อมูลตามขอบเขตข้างต้นเท่านั้น และทราบว่าถอนความยินยอมได้ทุกเมื่อ</span></label></div>'+
  '<button class="cta" id="mGo">ยื่นคำขอตรวจสอบ</button>'+
  (reqs.length?'<div class="card"><h3>คำขอของคุณ</h3>'+reqs.map(function(r){
    return '<div class="rowline"><span class="k">'+esc(r.hospital)+'<br><span style="font-size:12px;color:var(--ink3)">'+(r.data_items||[]).join(" · ")+' · '+esc(r.period)+'</span></span>'+
    '<span class="v">'+(stNm[r.status]||r.status)+'</span></div>'}).join("")+
    '<button class="ghostb danger" id="mRevoke" style="margin:12px 0 0">ถอนความยินยอมและยกเลิกคำขอทั้งหมด</button></div>':'')+
  '<div class="disc">ระบบสร้าง<b>คำขอเฉพาะครั้ง</b> ไม่ใช่ใบยินยอมถาวร · ถอนความยินยอมเมื่อใด คำขอที่ยังไม่เสร็จจะถูกยกเลิกทันทีโดยอัตโนมัติ · แอปเตรียมข้อมูลคำขอให้ ส่วนหนังสือยินยอมที่มีผลทางกฎหมายต้องลงนามกับสถานพยาบาลตามระเบียบของแต่ละแห่ง</div></div>';

  document.getElementById("mGo").addEventListener("click",async function(){
    var h=document.getElementById("mHosp").value.trim();
    var pd=document.getElementById("mPeriod").value.trim();
    var items=[];
    if(document.getElementById("mFalls").checked)items.push("ประวัติหกล้ม");
    if(document.getElementById("mMeds").checked)items.push("ยาประจำ");
    if(document.getElementById("mAdl").checked)items.push("ADL");
    if(!h){toast("กรุณาระบุสถานพยาบาล");return}
    if(!items.length){toast("เลือกข้อมูลที่อนุญาตอย่างน้อย 1 รายการ");return}
    if(!document.getElementById("mConsent").checked){toast("กรุณาให้ความยินยอมก่อนยื่นคำขอ");return}
    this.disabled=true;this.textContent="กำลังยื่นคำขอ…";
    try{
      await CSBackend.grantConsent("medical_record_check","PDPA-1.0",{hospital:h,data:items,period:pd});
      var last=S.data.assessments[S.data.assessments.length-1];
      await CSBackend.requestMedicalCheck({hospital:h,items:items,period:pd,purpose:"underwriting",
        assessmentId:last&&last.cloudId?last.cloudId:null});
      audit("ยื่นคำขอตรวจสอบเวชระเบียน","สถานพยาบาล "+h+" · "+items.join(", ")+" · ช่วง "+pd);
      toast("ยื่นคำขอแล้ว — เจ้าหน้าที่จะดำเนินการต่อ");
      render();
    }catch(e){this.disabled=false;this.textContent="ยื่นคำขอตรวจสอบ";toast("ยื่นคำขอไม่สำเร็จ: "+(e.message||""))}
  });
  var rv=document.getElementById("mRevoke");
  if(rv)rv.addEventListener("click",function(){
    dialog({title:"ถอนความยินยอม",body:"คำขอที่ยังไม่เสร็จจะถูก<b>ยกเลิกทันที</b> และเราจะไม่ตรวจสอบข้อมูลกับสถานพยาบาลอีก",
      ok:"ถอนความยินยอม",cancel:"ไม่ถอน",danger:true,
      onOk:async function(){
        try{await CSBackend.revokeConsent("medical_record_check");
          audit("ถอนความยินยอมตรวจสอบเวชระเบียน","คำขอที่ค้างถูกยกเลิกทั้งหมด");
          toast("ถอนความยินยอมแล้ว");render()}
        catch(e){toast("ถอนไม่สำเร็จ")}
      }});

function casesV(){
  if(!S.roleAck){roleGateV("cases","พยาบาล / Care Manager");return}
  head("เคสรอตรวจสอบ","ผู้เชี่ยวชาญเป็นผู้ตัดสิน","ระบบรวบรวมหลักฐานและจัดลำดับความเร่งด่วน แต่ไม่ส่งต่อเองโดยอัตโนมัติ");

  if(!cs.length){
    V.innerHTML='<div class="anim"><div class="card"><p class="sub" style="margin:0">ยังไม่มีเคสในคิว — เคสจะถูกสร้างอัตโนมัติเมื่อผลประเมินเข้าเกณฑ์ถดถอยหรือเสี่ยงสูง</p></div>'+

  }
  V.innerHTML='<div class="anim"><div class="card">'+cs.map(function(c){
    var col=ENGINE.levelColor[c.level];
    return '<div class="case"><div class="top"><span class="who">'+esc(c.name)+' · '+c.age+' ปี</span>'+
    '<span class="pill" style="background:'+col+';color:#fff">'+ENGINE.levelNm[c.level]+'</span></div>'+
    '<div class="meta">'+esc(c.action)+' · <b>'+esc(c.sla)+'</b> · สร้างเมื่อ '+thDate(c.at)+' '+thTime(c.at)+'</div>'+
    c.reasons.map(function(r){return '<div class="evi" style="margin:7px 0 0"><span class="rid">กฎ '+r.id+'</span>'+esc(r.text)+'</div>'}).join("")+
    (c.status==="pending"
      ? '<div class="mini"><button class="ok" data-ok="'+c.id+'">ยืนยันส่งต่อ</button><button class="no" data-no="'+c.id+'">ยังไม่ส่งต่อ</button></div>'
      : '<div class="meta" style="margin-top:8px;color:'+(c.status==="approved"?"var(--c4)":"var(--ink3)")+'">'+
        (c.status==="approved"?"ผู้เชี่ยวชาญยืนยันส่งต่อแล้ว":"ผู้เชี่ยวชาญพิจารณาแล้วว่ายังไม่ต้องส่งต่อ")+' เมื่อ '+thDate(c.decidedAt)+'</div>')+
    '</div>'}).join("")+'</div>'+
  '<div class="disc">การกดปุ่มนี้แทนการตัดสินใจของพยาบาลหรือ Care Manager ในระบบจริง ผู้ใช้ทั่วไปไม่มีสิทธิ์เข้าถึงหน้านี้ · AI ไม่มีสิทธิ์ยืนยันเคสด้วยตนเองในทุกกรณี</div></div>';
  V.querySelectorAll("[data-ok],[data-no]").forEach(function(b){
    b.addEventListener("click",async function(){
      var ok=b.hasAttribute("data-ok"), id=b.dataset.ok||b.dataset.no;
      var c=S.data.cases.find(function(x){return x.id===id});
      if(!c)return;
      c.status=ok?"approved":"declined"; c.decidedAt=nowISO();
      audit(ok?"ผู้เชี่ยวชาญยืนยันส่งต่อ":"ผู้เชี่ยวชาญไม่ส่งต่อ","เคส "+id+" ของ "+c.name,"ตัดสินโดยผู้เชี่ยวชาญที่เป็นมนุษย์");
      await saveAll();
      toast(ok?"ยืนยันส่งต่อแล้ว":"บันทึกว่ายังไม่ส่งต่อ");
      render();
    });
  });
}

/* ---------- แดชบอร์ดบริษัทประกัน ---------- */
async function insurerV(){
  if(!S.roleAck){roleGateV("insurer","เจ้าหน้าที่บริษัทประกัน");return}
  head("บริษัทประกัน","ภาพรวมพอร์ต","ข้อมูลแบบแฝงชื่อ (pseudonymised) จากฐานข้อมูลกลาง ตามหลัก data minimization — ยังเป็นข้อมูลส่วนบุคคลตาม PDPA");
  V.innerHTML='<div class="anim"><div class="card"><p class="sub" style="margin:0">กำลังอ่านฐานข้อมูล…</p></div></div>';
  var pool=await DB.listPool();
  if(!pool.length){
    V.innerHTML='<div class="anim"><div class="card"><p class="sub" style="margin:0 0 12px">ยังไม่มีข้อมูลในฐานข้อมูลกลาง</p>'+
    '<button class="ghostb" id="seed" style="margin:0">เติมข้อมูลสาธิต 10 ราย</button></div></div>';
    document.getElementById("seed").addEventListener("click",async function(){await seed();toast("เติมข้อมูลสาธิตแล้ว");render()});
    return;
  }
  var n=pool.length;
  var mix={4:0,3:0,2:0,1:0};pool.forEach(function(r){if(mix[r.tier]!==undefined)mix[r.tier]++});
  var cam=pool.filter(function(r){return r.method==="camera-pose"}).length;
  var ref=pool.filter(function(r){return r.referred}).length;
  var fts=pool.filter(function(r){return r.ftsst});
  var avgFt=fts.length?fts.reduce(function(a,b){return a+b.ftsst},0)/fts.length:null;
  var disc=pool.filter(function(r){return CFG.discount[r.tier]>0}).length;
  var mixRows=[4,3,2,1].map(function(k){var t=CFG.tiers[k];
    return '<div class="mixrow"><span class="lab">'+t.nm.split(" — ")[0]+'</span>'+
    '<span class="bar"><i style="width:'+(mix[k]/n*100)+'%;background:'+t.c+'"></i></span>'+
    '<span class="val">'+mix[k]+' ราย</span></div>'}).join("");
  V.innerHTML='<div class="anim">'+
  '<div class="kpis">'+
  '<div class="kpi"><div class="l">สมาชิกในพอร์ต</div><div class="n">'+n+' ราย</div></div>'+
  '<div class="kpi"><div class="l">วัดด้วยกล้อง</div><div class="n">'+Math.round(cam/n*100)+'%</div></div>'+
  '<div class="kpi"><div class="l">เวลาลุกนั่งเฉลี่ย</div><div class="n">'+(avgFt?avgFt.toFixed(1)+" วิ":"—")+'</div></div>'+
  '<div class="kpi"><div class="l">เข้าเกณฑ์ส่งต่อ</div><div class="n">'+ref+' ราย</div></div></div>'+
  '<div class="card"><h3>การกระจายระดับสัญญาณ</h3>'+mixRows+
  '<p class="sub" style="margin:10px 0 0">พอร์ตที่มีสัดส่วนเขียว-เหลืองสูง หมายถึงต้นทุนสินไหมคาดการณ์ต่ำกว่า และเป็นผลจากการคัดกรองก่อนรับประกัน</p></div>'+
  '<div class="card"><h3>ผลต่อการตั้งราคา</h3>'+
  '<div class="rowline"><span class="k">ได้รับส่วนลดจากผลประเมิน</span><span class="v">'+disc+' ราย ('+Math.round(disc/n*100)+'%)</span></div>'+
  '<div class="rowline"><span class="k">ยังไม่ได้ส่วนลด</span><span class="v">'+(n-disc)+' ราย</span></div>'+
  '<p class="sub" style="margin:10px 0 0">ผลประเมิน<b>ลดเบี้ยได้ทางเดียว</b> ไม่มีเส้นทางในระบบที่เพิ่มเบี้ยหรือปฏิเสธความคุ้มครองจากคะแนนที่แย่ลง — ออกแบบเพื่อไม่ลงโทษผู้ที่ประเมินตนเองอย่างซื่อสัตย์</p></div>'+
  '<div class="card"><h3>รายการในพอร์ต</h3>'+
  pool.slice(0,12).map(function(r){var t=CFG.tiers[r.tier]||{nm:"—",b:""};
    return '<div class="rowline"><span class="k">'+esc(r.uid.slice(0,10))+' · '+esc(r.ageBand||"—")+' · '+(r.sex==="f"?"ญ":"ช")+'</span>'+
    '<span class="v"><span class="pill '+t.b+'">'+t.nm.split(" — ")[0]+'</span></span></div>'}).join("")+'</div>'+
  '<button class="ghostb" id="seed2">เติมข้อมูลสาธิต 10 ราย (สำหรับการนำเสนอ)</button>'+
  '<div class="disc">ต้องการโมเดลผลประกอบการเต็มรูปแบบ (เบี้ยรับ 5 ปี Loss Ratio ผลตอบแทน ทะเบียนความเสี่ยง)? เปิดไฟล์ CareSignal-Insurer-Model.html ที่มาพร้อมชุดนี้</div></div>';
  document.getElementById("seed2").addEventListener("click",async function(){await seed();toast("เติมข้อมูลสาธิตแล้ว");render()});
}
async function seed(){
  var band=["55–59","60–65","60–65","66–70","50–54","60–65","66–70","55–59","60–65","66–70"];
  var tiers=[4,4,3,2,4,3,1,4,3,2];
  var fts=[9.2,9.8,11.1,13.4,8.9,11.8,16.2,9.5,11.4,14.1];
  for(var i=0;i<10;i++){
    await DB.putPool({uid:"demo-"+String.fromCharCode(97+i),ageBand:band[i],sex:i%3===0?"m":"f",
      tier:tiers[i],score:tiers[i]===4?11:(tiers[i]===3?9:(tiers[i]===2?6:3)),ftsst:fts[i],
      lastAssess:new Date(Date.now()-i*3*864e5).toISOString(),nAssess:2+(i%3),
      level:tiers[i]===1?"urgent":(tiers[i]===2?"decline":(tiers[i]===3?"watch":"stable")),
      referred:tiers[i]<=2,method:"camera-pose",engine:ENGINE.version,demo:true,updated:nowISO()});
  }
}

/* PWA: ลงทะเบียน Service Worker — ใช้ออฟไลน์ได้หลังเปิดครั้งแรก + แจ้งเมื่อมีเวอร์ชันใหม่ */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("./sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){
      var nw=reg.installing; if(!nw)return;
      nw.addEventListener("statechange",function(){
        if(nw.state==="installed"&&navigator.serviceWorker.controller){
          nw.postMessage("SKIP_WAITING");
          if(typeof toast==="function")toast("อัปเดตเป็นเวอร์ชันใหม่แล้ว — มีผลเมื่อเปิดครั้งถัดไป");
        }
      });
    });
  }).catch(function(){});
}
