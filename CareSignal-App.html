<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com https://esm.sh https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- ล็อก layout ไว้ที่ 430 หน่วยแล้วให้เบราว์เซอร์ขยายเต็มจอจริง — ขนาดตัวอักษรเป็นสัดส่วนเดียวกันทุกเครื่อง -->
<meta name="viewport" content="width=430, viewport-fit=cover">
<meta name="description" content="แอปสมาชิก CareSignal — วัดสมรรถภาพด้วยกล้อง ดูแนวโน้ม สมัครประกัน LTC ที่เบี้ยลดได้ทางเดียวตามผลตรวจ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CareSignal">
<meta name="theme-color" content="#2563EB">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-64.png">
<title>CareSignal — แอปประเมินและประกันดูแลระยะยาว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6FB; --surf:#FFF; --surf2:#EAF0FE;
  --ink:#16233B; --ink2:#5B6B84; --ink3:#93A1B7;
  --line:#DFE7F2; --line2:#EDF2FA; --brand:#2563EB; --brand2:#1D4ED8;
  --accent:#F59E0B; --accent2:#B45309; --accentb:#FEF3C7;
  --c4:#0E9F6E; --c3:#C79200; --c2:#D97706; --c1:#DC2626;
  --c4b:#E3F6EF; --c3b:#FEF6DE; --c2b:#FDECD8; --c1b:#FEE9E9;
  --sans:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  --loop:"IBM Plex Sans Thai Looped","Prompt",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sh:0 1px 2px rgba(22,35,59,.04),0 6px 18px rgba(22,35,59,.05);
  --shx:0 2px 6px rgba(22,35,59,.07),0 18px 44px rgba(22,35,59,.11);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#D9DEE2;font-family:var(--sans);color:var(--ink);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:404px;height:860px;max-height:100vh;background:var(--bg);border-radius:42px;overflow:hidden;box-shadow:0 30px 80px rgba(22,35,59,.3);display:flex;flex-direction:column}
@media(max-width:470px),(max-height:720px){body{display:block;background:var(--bg)}.phone{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none}}
/* เมื่อติดตั้งเป็นแอป (PWA standalone/fullscreen) ให้เต็มจอเสมอ ไม่ว่าอุปกรณ์จะรายงานจอกว้างเท่าใด */
@media(display-mode:standalone),(display-mode:fullscreen){
  body{display:block;background:var(--bg)}
  .phone{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
}
.bar .brandrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar .brandrow svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.bar{flex:none;background:linear-gradient(135deg,var(--brand2),var(--brand) 62%,#3B82F6);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 20px 16px;position:relative}
.bar .kick{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#FCD34D;opacity:.95}
.bar h1{margin:3px 0 0;font-size:23px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.bar p{margin:6px 0 0;font-size:14px;opacity:.78;line-height:1.6}
.backb{background:none;border:0;color:#fff;font:inherit;font-size:14px;padding:0;margin-bottom:8px;opacity:.75;cursor:pointer}
.dbchip{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:16px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:rgba(245,158,11,.22);color:#FDE68A;padding:4px 9px;border-radius:99px}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 26px;-webkit-overflow-scrolling:touch}
.anim{animation:rise .32s cubic-bezier(.25,.9,.35,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.anim{animation:none}}
.tabs{flex:none;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:none;cursor:pointer;font-family:var(--sans);padding:11px 2px 13px;color:var(--ink3);font-size:12.5px;line-height:1.3;transition:color .18s;min-height:64px}
.tab svg{display:block;margin:0 auto 5px;width:27px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab b{display:block;font-weight:600;font-size:12.5px}
.tab[aria-selected="true"]{color:var(--brand)}
/* กล้อง — องค์ประกอบหลักของหน้าจอนี้ */
.stage{position:relative;border-radius:22px;overflow:hidden;background:#0B1220;aspect-ratio:3/4;margin-bottom:12px;box-shadow:var(--shx)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video{transform:scaleX(-1)}
.stage canvas{transform:scaleX(-1);pointer-events:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.hudtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hudtag{background:rgba(11,18,32,.62);backdrop-filter:blur(8px);color:#fff;font-size:11.5px;padding:6px 11px;border-radius:99px;line-height:1.4}
.hudtag b{color:#FCD34D}
.hudbot{background:rgba(11,18,32,.68);backdrop-filter:blur(10px);border-radius:16px;padding:12px 14px;color:#fff}
.counter{display:flex;align-items:baseline;gap:10px}
.counter .n{font-family:var(--mono);font-size:38px;font-weight:600;line-height:1;letter-spacing:-.03em}
.counter .of{font-size:14px;color:rgba(255,255,255,.6)}
.counter .clock{margin-left:auto;font-family:var(--mono);font-size:22px;font-weight:600;color:#FCD34D}
.track{height:6px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:#FCD34D;border-radius:99px;transition:width .12s linear}
.coach{margin-top:9px;font-size:12.5px;color:rgba(255,255,255,.85);line-height:1.5;min-height:19px}
.statebadge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.16);padding:3px 8px;border-radius:99px;margin-left:8px}


.acc{background:var(--surf);border-radius:20px;margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:20px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:12px;min-height:64px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"⌄";margin-left:auto;font-size:26px;line-height:1;color:var(--ink3);transition:transform .2s}
.acc[open]>summary::after{transform:rotate(180deg)}
.acc>summary .sm{display:block;font-size:14px;font-weight:400;color:var(--ink2);margin-top:3px}
.acc .accin{padding:0 20px 20px}
.bigrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line2)}
.bigrow:first-of-type{border-top:0}
.bigrow .ic{width:44px;height:44px;flex:none;border-radius:14px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:22px}
.bigrow .tx{flex:1;min-width:0}
.bigrow .tx b{display:block;font-size:16.5px;font-weight:600;line-height:1.4}
.bigrow .tx span{display:block;font-size:14px;color:var(--ink2);line-height:1.5;margin-top:2px}
.card{background:var(--surf);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:var(--sh)}
.card h2{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.card h3{margin:0 0 12px;font-size:17px;font-weight:600}
.sub{margin:0 0 14px;font-size:15px;color:var(--ink2);line-height:1.75}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.hero{background:var(--brand);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px;box-shadow:var(--shx)}
.hero .eyebrow{color:rgba(255,255,255,.45)}
.hero .score{font-family:var(--mono);font-size:48px;font-weight:600;line-height:1;letter-spacing:-.03em}
.hero .of{font-size:15px;opacity:.45;font-family:var(--mono)}
.hero .state{margin-top:10px;display:inline-block;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:99px;color:#fff}
.hero .note{margin:14px 0 0;font-size:12.5px;opacity:.72;line-height:1.6}
.senior{font-family:var(--loop)}
.senior .qtext{font-size:21px;font-weight:600;line-height:1.5;margin:0 0 6px;letter-spacing:-.01em}
.senior .qhelp{font-size:15px;color:var(--ink2);line-height:1.65;margin:0 0 18px}
.pick{display:block;width:100%;text-align:left;font-family:var(--loop);font-size:17px;padding:16px 19px;margin-bottom:10px;border:2px solid var(--line);border-radius:16px;background:var(--surf);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.pick:active{transform:scale(.985)}
.pick[aria-pressed="true"]{border-color:var(--brand);background:var(--surf2);color:var(--brand2);font-weight:600}
.cta{display:block;width:100%;border:0;border-radius:18px;background:var(--brand);color:#fff;font-family:var(--loop);font-size:20px;font-weight:600;padding:20px;min-height:64px;cursor:pointer;transition:transform .1s}
.cta:active{transform:scale(.99)}
.cta.loop{font-family:var(--loop);font-size:18px;padding:18px}
.cta.go{background:var(--c4)}
.cta.stop{background:var(--c2)}
.cta[disabled]{opacity:.45;cursor:default}
.ghostb{display:block;width:100%;border:2px solid var(--line);border-radius:16px;background:var(--surf);color:var(--ink);font-family:var(--sans);font-size:17px;font-weight:500;padding:17px;margin-top:10px;cursor:pointer;min-height:58px}
.clock{font-family:var(--mono);font-size:56px;font-weight:600;text-align:center;letter-spacing:-.04em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.clock small{font-size:18px;opacity:.4;font-weight:500}
.hint{text-align:center;font-size:13.5px;color:var(--ink2);margin:0 0 16px;line-height:1.6}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input,.field select{width:100%;font-family:var(--loop);font-size:17px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-color:var(--brand)}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-family:var(--loop);font-size:16px;padding:13px;border:2px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--surf2);color:var(--brand2);font-weight:600}
.rowline{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:14px 0;border-top:1px solid var(--line2);font-size:16px}
.rowline:first-of-type{border-top:0}
.rowline .k{color:var(--ink2)}
.rowline .v{font-family:var(--mono);font-weight:600;color:var(--accent2)}
.tierpill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px}
.t4{background:var(--c4b);color:var(--c4)}.t3{background:var(--c3b);color:var(--c3)}.t2{background:var(--c2b);color:var(--c2)}.t1{background:var(--c1b);color:var(--c1)}
.hrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.hrow:first-child{border-top:0}
.hrow .dt{font-family:var(--mono);font-size:11px;color:var(--ink3);width:74px;flex:none;line-height:1.4}
.hrow .sc{font-family:var(--mono);font-size:19px;font-weight:600;width:44px;flex:none}
.trend{display:flex;align-items:flex-end;gap:5px;height:64px;margin:14px 0 4px}
.trend .b{flex:1;border-radius:5px 5px 0 0;min-height:6px;position:relative}
.trend .b span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.planbox{border:2px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
.planbox[aria-pressed="true"]{border-color:var(--brand);background:var(--surf2)}
.planbox .nm{font-weight:600;font-size:15px}
.planbox .bn{font-size:12.5px;color:var(--ink2);margin-top:2px}
.planbox .pr{float:right;font-family:var(--mono);font-weight:600;font-size:16px}
.bignum{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em}
.toast{position:absolute;left:20px;right:20px;bottom:88px;background:var(--ink);color:#fff;font-size:13.5px;padding:13px 17px;border-radius:14px;box-shadow:var(--shx);opacity:0;transform:translateY(8px);transition:.28s;pointer-events:none;z-index:50;line-height:1.5}
.toast.on{opacity:1;transform:none}
.warncard{border-radius:20px;padding:18px;margin-bottom:12px;border:1px solid var(--line);background:var(--surf);box-shadow:var(--sh)}
.warncard .lvl{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;color:#fff}
.warncard h3{margin:12px 0 8px;font-size:16.5px;letter-spacing:-.01em}
.evi{border-left:3px solid var(--accent);background:var(--accentb);border-radius:0 12px 12px 0;padding:10px 13px;margin:8px 0;font-size:13.5px;line-height:1.6}
.evi .why{display:block;color:var(--ink2);font-size:12px;margin-top:4px}
.evi .rid{font-family:var(--mono);font-size:10px;color:var(--accent2);letter-spacing:.08em}
.disc{background:var(--line2);border-radius:12px;padding:10px 13px;font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:12px}
.pitem{border-top:1px solid var(--line2);padding:13px 0}
.pitem:first-of-type{border-top:0}
.pitem b{display:block;font-size:14.5px;margin-bottom:3px}
.pitem .hw{font-size:13px;color:var(--ink2);line-height:1.6}
.pitem .rs{display:inline-block;font-size:11.5px;color:var(--accent2);background:var(--accentb);border-radius:8px;padding:3px 9px;margin-top:6px}
.pitem .sc{display:block;font-size:11px;color:var(--ink3);margin-top:5px}
.logline{font-family:var(--mono);font-size:11px;border-top:1px solid var(--line2);padding:8px 0;color:var(--ink2);line-height:1.55}
.logline b{color:var(--ink);font-weight:600}
.chk{display:flex;gap:11px;align-items:flex-start;background:var(--surf2);border-radius:14px;padding:13px;cursor:pointer;font-size:13px;line-height:1.6}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--brand)}
.notice{background:var(--accentb);border:1px solid rgba(245,158,11,.35);border-radius:14px;padding:12px 15px;font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:12px}
.danger{color:var(--c1)}
:focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:2px;border-radius:8px}
@keyframes csPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.75}}
#statusLight.pulse{animation:csPulse 1.1s ease-in-out infinite}
/* เคารพผู้ใช้ที่ตั้งค่าลดการเคลื่อนไหว (WCAG 2.3.3) */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ============================================================
   กล้องเต็มจอ — ทุกหน้าที่วัดผ่านกล้อง
   วิดีโอเต็มหน้าจอ ไม่มีข้อความด้านบน สถานะและปุ่มทั้งหมดอยู่แถบล่าง
   ============================================================ */
body.camfs{overflow:hidden}
body.camfs .stage{position:fixed;inset:0;z-index:70;border-radius:0;aspect-ratio:auto;margin:0;box-shadow:none;width:100vw;height:100vh;height:100dvh}
body.camfs .stage video,body.camfs .stage canvas{width:100%;height:100%;object-fit:cover}
body.camfs .hudtop{display:none}
.camdock{position:fixed;left:0;right:0;bottom:0;z-index:72;display:flex;flex-direction:column;gap:8px;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(11,18,32,0) 0%,rgba(11,18,32,.82) 34%,rgba(11,18,32,.94) 100%)}
.camdock .hudbot{background:transparent;backdrop-filter:none;border-radius:0;padding:0 0 2px}
.camdock #statusBar{margin:0}
.camdock .cta{margin:0;width:100%;padding:13px}
.camdock .btnrow{display:flex;gap:8px}
.camdock .btnrow .ghostb{margin:0;flex:1;width:auto;padding:11px 8px;font-size:13.5px}
.camdock .coach{font-size:13.5px;margin-top:4px}
.camdock #statusBar{padding:8px 12px;font-size:13px}
/* บีบทุกอย่างในแถบล่างให้เตี้ย — จอส่วนใหญ่ต้องเป็นภาพกล้อง */
.camdock{gap:6px}
.camdock .hudbot .counter .n{font-size:34px;line-height:1.05}
.camdock .hudbot .counter{margin:0}
.camdock .track{margin:5px 0 0;height:5px}
.camdock .bchips{margin:0 0 5px}
.camdock .bchips span{padding:4px 0;font-size:11.5px}
.camdock .ghostb{background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.28)}
.bchips{display:flex;gap:6px;margin:0 0 8px}
.bchips span{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:5px 0;border-radius:9px;
  background:rgba(255,255,255,.14);color:#cbd5e1}
.bchips span.on{background:#F59E0B;color:#1a1300}
.bchips span.ok{background:#0E9F6E;color:#fff}
.bchips span.bad{background:#DC2626;color:#fff}
</style>
</head>
<body>
<div class="phone">
  <header class="bar" id="bar">
    <span class="dbchip" id="dbchip">DB · –</span>
    <div id="barIn"></div>
  </header>
  <main class="scroll" id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg><b>หน้าแรก</b></button>
    <button class="tab" data-go="assessIntro"><svg viewBox="0 0 24 24"><path d="M12 21c-1 0-8-4.5-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 11c0 5.5-7 10-8 10z"/></svg><b>ตรวจร่างกาย</b></button>
    <button class="tab" data-go="policy"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><b>ประกันของฉัน</b></button>
    <button class="tab" data-go="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg><b>ตั้งค่า</b></button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

var STATUS_COLORS={green:"#0E9F6E",yellow:"#F5B93E",red:"#DC2626"};
var STATUS_LAST=null;
function setStatus(color,text,speakText){
  var el=document.getElementById("statusLight");
  var tx=document.getElementById("statusText");
  if(el){
    el.style.background=STATUS_COLORS[color]||STATUS_COLORS.yellow;
    el.style.boxShadow="0 0 0 8px "+(STATUS_COLORS[color]||"#F5B93E")+"33, 0 4px 14px rgba(0,0,0,.3)";
    el.classList.toggle("pulse",color==="yellow");
  }
  if(tx)tx.textContent=text||"";
  var key=color+"|"+(speakText||text||"");
  if(key!==STATUS_LAST){STATUS_LAST=key; if(speakText!==false)speak(speakText||text)}
}
/* ============================================================
   โหมดกล้องเต็มจอ
   ------------------------------------------------------------
   เรียกตอนเริ่มไปป์ไลน์กล้องทุกตัว: ขยายวิดีโอเต็มหน้าจอ ซ่อน
   ป้ายด้านบน แล้วย้ายแถบตัวเลข/สถานะ/ปุ่มทั้งหมดของหน้านั้น
   ลงมารวมเป็นแถบเดียวด้านล่าง (ข้อกำหนด: บนจอมีแต่ภาพกล้อง)
   camExit() ถูกเรียกใน go() เสมอ จึงไม่มีทางค้างข้ามหน้า
   ============================================================ */
function camFullscreen(){
  if(document.getElementById("camdock"))return;
  var st=document.querySelector(".stage"); if(!st)return;
  document.body.classList.add("camfs");
  /* ต้องย้ายเวทีกล้องขึ้นไปเป็นลูกของ body ตรง ๆ — เพราะคอนเทนเนอร์ .anim
     ใช้ transform ตอนแอนิเมชัน ซึ่งทำให้ position:fixed ยึดกับกล่องนั้นแทน
     viewport แล้ววิดีโอจะไม่เต็มจอ (สูงเป็นศูนย์) */
  st.id="camstage";
  document.body.appendChild(st);
  var dock=document.createElement("div"); dock.className="camdock"; dock.id="camdock";
  var hb=st.querySelector(".hudbot"); if(hb)dock.appendChild(hb);
  var sb=document.getElementById("statusBar"); if(sb)dock.appendChild(sb);
  /* ปุ่มหลักเต็มแถว ปุ่มรองอัดแถวเดียวกัน — แถบล่างจะได้ไม่กินพื้นที่วิดีโอ */
  V.querySelectorAll(".cta").forEach(function(b){dock.appendChild(b)});
  var gh=V.querySelectorAll(".ghostb");
  if(gh.length){
    var row=document.createElement("div"); row.className="btnrow";
    gh.forEach(function(b){row.appendChild(b)});
    dock.appendChild(row);
  }
  document.body.appendChild(dock);
}
function camExit(){
  var d=document.getElementById("camdock"); if(d)d.remove();
  var st=document.getElementById("camstage"); if(st)st.remove();
  document.body.classList.remove("camfs");
}

var VOICE={on:(function(){try{return localStorage.getItem("cs:voice")!=="off"}catch(e){return true}})()};
function speak(text,opts){
  if(!VOICE.on||!text)return;
  try{
    if(!("speechSynthesis" in window))return;
    opts=opts||{};
    if(opts.interrupt!==false)speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="th-TH"; u.rate=opts.rate||0.95; u.volume=1;
    var v=speechSynthesis.getVoices().filter(function(x){return /th/i.test(x.lang)});
    if(v.length)u.voice=v[0];
    speechSynthesis.speak(u);
  }catch(e){}
}
function voiceToggle(){
  VOICE.on=!VOICE.on;
  try{localStorage.setItem("cs:voice",VOICE.on?"on":"off")}catch(e){}
  if(VOICE.on)speak("เปิดเสียงแนะนำแล้ว");
  return VOICE.on;
}

/* ============================================================
   จับอัตโนมัติ (AutoCapture) — ไม่ต้องกดปุ่มเอง
   แก้ปัญหา: ผู้สูงอายุที่อยู่คนเดียวต้องเดินมากดปุ่มบันทึก
   แต่พอเดินมาถึงมือถือ กล้องก็มองไม่เห็นตัวอีก กลายเป็นวงจรตัน
   ============================================================ */
function AutoCapture(opts){
  opts=opts||{};
  this.holdMs=opts.holdMs!==undefined?opts.holdMs:1600;
  this.onFire=opts.onFire||function(){};
  this.readyText=opts.readyText||"พร้อมแล้ว";
  this.abortOnLost=opts.abortOnLost!==false;
  this.screen=opts.screen||null;
  this.readySince=null; this.counting=false; this.done=false; this.timer=null;
  this.enabled=opts.enabled!==false;
}
AutoCapture.prototype.update=function(ready){
  if(this.done||!this.enabled)return;
  if(this.counting){ if(this.abortOnLost&&!ready)this.abort(); return }
  if(!ready){this.readySince=null;return}
  if(this.readySince===null){this.readySince=performance.now();return}
  if(performance.now()-this.readySince>=this.holdMs)this.begin();
};
AutoCapture.prototype.begin=function(){
  var self=this; this.counting=true;
  var n=3, nm={3:"สาม",2:"สอง",1:"หนึ่ง"};
  setStatus("green",this.readyText+" — เตรียมตัว "+n,false);
  speak(this.readyText+" เตรียมตัว "+nm[n]);
  this.timer=setInterval(function(){
    if(self.screen&&S.screen!==self.screen){self.abort();return}
    n--;
    if(n>=1){setStatus("green","เตรียมตัว… "+n,false);speak(nm[n])}
    else{clearInterval(self.timer);self.timer=null;self.counting=false;self.done=true;self.onFire()}
  },1000);
};
AutoCapture.prototype.abort=function(){
  if(this.timer){clearInterval(this.timer);this.timer=null}
  this.counting=false;this.readySince=null;
};
AutoCapture.prototype.reset=function(){this.abort();this.done=false};

var MEM={};
var DB={
  mode:"memory",
  async get(k){
    if(window.storage){try{var r=await window.storage.get(k);this.mode="cloud";return r?JSON.parse(r.value):null}catch(e){this.mode="cloud";return null}}
    try{var v=localStorage.getItem("cs:"+k);this.mode="local";return v?JSON.parse(v):null}catch(e){this.mode="memory";return MEM[k]||null}
  },
  async set(k,val){
    var s=JSON.stringify(val);
    if(window.storage){try{await window.storage.set(k,s);this.mode="cloud";return true}catch(e){}}
    try{localStorage.setItem("cs:"+k,s);this.mode="local";return true}catch(e){MEM[k]=val;this.mode="memory";return true}
  },
  async setShared(k,val){ /* ข้อมูลสรุปแบบแฝงชื่อ (pseudonymised) แชร์ให้แดชบอร์ด Care Manager / บริษัทประกัน
                             หมายเหตุ: ข้อมูลแฝงชื่อยังเป็นข้อมูลส่วนบุคคลตาม PDPA — ไม่ใช่ anonymised */
    if(window.storage){try{await window.storage.set(k,JSON.stringify(val),true);return true}catch(e){}}
    try{localStorage.setItem("csShared:"+k,JSON.stringify(val));return true}catch(e){return false}
  },
  async del(k){
    if(window.storage){try{await window.storage.delete(k)}catch(e){}}
    try{localStorage.removeItem("cs:"+k)}catch(e){}
    delete MEM[k];
  }
};
function dbLabel(){var m=DB.mode;return "DB · "+(m==="cloud"?"CLOUD":(m==="local"?"LOCAL":"TEMP"))}

function fmt(n){return Math.round(n).toLocaleString("th-TH")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function todayISO(){return new Date().toISOString()}
/* รหัสแฝงชื่อ (pseudonym) — ใช้แทนรหัสบัญชีจริงเมื่อส่งเข้าฐานข้อมูลกลาง
   หมายเหตุตามกฎหมาย: นี่คือ pseudonymisation ไม่ใช่ anonymisation
   ข้อมูลที่ได้ยังเป็นข้อมูลส่วนบุคคลตาม PDPA เต็มที่ */
function pseudoId(s){
  var h=5381; s=String(s);
  for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}
  return "P-"+("0000000"+h.toString(36).toUpperCase()).slice(-7);
}
function thDate(iso){var d=new Date(iso);return d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"})}
/* คำนวณอายุจากปีเกิด พ.ศ. (+เดือนเกิดถ้าระบุ) — เกณฑ์เวลากระโดดที่อายุ 60/70 พอดี
   จึงต้องไม่นับคนที่ยังไม่ถึงวันเกิดปีนี้ให้แก่เกินจริง */
function ageFrom(beYear,month){
  var now=new Date(), age=(now.getFullYear()+543)-beYear;
  if(month&&(now.getMonth()+1)<month)age--;
  return age;
}
var TH_MONTHS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

  if(S.data.sharePool && S.data.profile){
    var p=S.data.profile, last=S.data.assessments[S.data.assessments.length-1]||null;
    var pid=pseudoId(p.uid);
    await DB.setShared("pool:"+pid,{
      uid:pid, ageBand:CFG.ageBand(p.age), sex:p.sex,
      tier:last?last.tier:null, score:last?last.score:null,
      lastAssess:last?last.at:null,
      firstAssess:S.data.assessments.length?S.data.assessments[0].at:null,
      nAssess:S.data.assessments.length,
      durSec:last&&last.durSec?last.durSec:null,
      level:(function(){try{var x=trajectory();return x?x.level:null}catch(e){return null}})(),
      referred:(function(){try{var x=trajectory();return x?!!x.referral.need:false}catch(e){return false}})(),
      consentAt:S.data.consent?S.data.consent.at:null,
      engine:ENGINE.version,

}

/* ============================================================
   คำนวณเบี้ย — ตรรกะเดียวกับเว็บและโมเดลผู้ประกอบการ
   ============================================================ */
function premiumFor(planId,age,sex,tier,pay){
  var p=CFG.plans.find(function(x){return x.id===planId});
  var gross=p.base*CFG.ageMult(age)*CFG.sexMult[sex];
  var d=tier?CFG.discount[tier]:0;
  var net=gross*(1-d);
  var loy=loyaltyBaht(planId);
  net=Math.max(net-loy, gross*0.75);   /* เพดานรวมส่วนลดไม่เกิน 25% เพื่อคุมต้นทุน */
  if(pay==="y"){net=net*12*(1-CFG.yearlyOff)}
  return {plan:p, gross:Math.round(gross), net:Math.round(net), disc:d, loyalty:loy};
}

var FACE=null, FACE_STATE="idle";

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y,(a.z||0)-(b.z||0))}
/* ลายเซ็นเชิงสัดส่วน — ไม่ขึ้นกับระยะห่างจากกล้องหรือขนาดภาพ */
function faceSignature(lm){
  var base=dist(lm[FL.LEYE_OUT],lm[FL.REYE_OUT]);
  if(!base||base<1e-6)return null;
  return [
    dist(lm[FL.LEYE_IN],lm[FL.REYE_IN])/base,
    dist(lm[FL.NOSE],lm[FL.CHIN])/base,
    dist(lm[FL.MOUTH_L],lm[FL.MOUTH_R])/base,
    dist(lm[FL.NOSE_L],lm[FL.NOSE_R])/base,
    dist(lm[FL.FOREHEAD],lm[FL.CHIN])/base,
    dist(lm[FL.LEYE_OUT],lm[FL.MOUTH_L])/base
  ];
}
function sigDist(a,b){
  if(!a||!b||a.length!==b.length)return 99;
  var s=0; for(var i=0;i<a.length;i++)s+=(a[i]-b[i])*(a[i]-b[i]);
  return Math.sqrt(s);
}

/* ============================================================
   ชั้นวิเคราะห์ท่าทาง — ประมวลผลบนเครื่อง ไม่ส่งภาพออกจากอุปกรณ์
   ------------------------------------------------------------
   ตัวชี้วัดหลัก: ตำแหน่งสะโพกเทียบสัดส่วนลำตัว
     M = (ระยะข้อเท้า−สะโพก) ÷ (ระยะข้อเท้า−ไหล่)
   เลือกอัตราส่วนแทนพิกัดดิบ เพราะไม่ขึ้นกับระยะห่างจากกล้อง
   ส่วนสูงของผู้ใช้ หรือการวางมือถือสูงต่ำ
   ============================================================ */
var LM={LSH:11,RSH:12,LHIP:23,RHIP:24,LKNEE:25,RKNEE:26,LANK:27,RANK:28};

function midY(lm,a,b){return (lm[a].y+lm[b].y)/2}
function visOK(lm){
  var need=[LM.LSH,LM.RSH,LM.LHIP,LM.RHIP,LM.LKNEE,LM.RKNEE,LM.LANK,LM.RANK];
  var seen=0;
  for(var i=0;i<need.length;i++){var v=lm[need[i]];if(v&&(v.visibility===undefined||v.visibility>0.5))seen++}
  return seen/need.length;
}
function hipRatio(lm){
  var sh=midY(lm,LM.LSH,LM.RSH), hip=midY(lm,LM.LHIP,LM.RHIP), ank=midY(lm,LM.LANK,LM.RANK);
  var span=ank-sh;
  if(!isFinite(span)||Math.abs(span)<0.02)return null;
  return (ank-hip)/span;
}
function kneeAngle(lm){
  function ang(h,k,a){
    var v1={x:lm[h].x-lm[k].x,y:lm[h].y-lm[k].y}, v2={x:lm[a].x-lm[k].x,y:lm[a].y-lm[k].y};
    var d=v1.x*v2.x+v1.y*v2.y, m=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y);
    if(!m)return null;
    return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI;
  }
  var l=ang(LM.LHIP,LM.LKNEE,LM.LANK), r=ang(LM.RHIP,LM.RKNEE,LM.RANK);
  if(l==null&&r==null)return null;
  if(l==null)return r; if(r==null)return l;
  return (l+r)/2;
}

/* ---- ตัวนับจำนวนครั้ง: เครื่องสถานะพร้อม hysteresis กันการนับซ้ำจากการสั่น ---- */
function RepDetector(opts){
  opts=opts||{};
  this.sitRef=null; this.standRef=null;
  this.state="idle"; this.reps=0; this.stamps=[]; this.t0=null; this.done=false;
  this.target=opts.target||5;
  this.upFrac=opts.upFrac!==undefined?opts.upFrac:0.68;
  this.downFrac=opts.downFrac!==undefined?opts.downFrac:0.36;
  this.buf=[]; this.smoothN=opts.smoothN||5;
}
RepDetector.prototype.smooth=function(v){
  this.buf.push(v); if(this.buf.length>this.smoothN)this.buf.shift();
  var s=0; for(var i=0;i<this.buf.length;i++)s+=this.buf[i];
  return s/this.buf.length;
};
RepDetector.prototype.setRefs=function(sit,stand){this.sitRef=sit;this.standRef=stand};
RepDetector.prototype.start=function(t){this.state="sit";this.reps=0;this.stamps=[];this.t0=t;this.done=false;this.buf=[]};
RepDetector.prototype.thresholds=function(){
  var range=this.standRef-this.sitRef;
  return {up:this.sitRef+range*this.upFrac, down:this.sitRef+range*this.downFrac, range:range};
};
RepDetector.prototype.push=function(raw,t){
  if(this.done||this.state==="idle"||this.sitRef==null||this.standRef==null)return null;
  var v=this.smooth(raw), th=this.thresholds();
  if(this.state==="sit"&&v>=th.up){
    this.state="stand"; this.reps++; this.stamps.push(t);
    if(this.reps>=this.target){this.done=true;return{event:"finish",reps:this.reps,elapsed:(t-this.t0)/1000}}
    return {event:"rep",reps:this.reps};
  }
  if(this.state==="stand"&&v<=th.down){this.state="sit";return{event:"down",reps:this.reps}}
  return null;
};


/* ============================================================
   คะแนนประเมิน (ย่อจาก SPPB + FRAT ให้ทำเองที่บ้านได้)
   ============================================================ */
function scoreDraft(dr,age){
  var s=0, parts={};
  /* 1) ลุกนั่ง 5 ครั้ง (FTSST) — 0-4 คะแนน */
  var cut=CFG.ftsstCut(age);
  var f=dr.ftsst;
  var pf = f==null?0 : f<=cut?4 : f<=cut+2?3 : f<=cut+4.5?2 : f<=60?1:0;
  parts.ftsst=pf; s+=pf;
  /* 2) ยืนทรงตัว — 0-3 */
  parts.balance=dr.balance||0; s+=parts.balance;
  /* 3) ประวัติหกล้ม 12 เดือน — 0-2 (ไม่ล้ม=2) */
  parts.falls=dr.falls==null?0:dr.falls; s+=parts.falls;
  /* 4) การใช้ยา ≥4 ชนิด — 0-1 */
  parts.meds=dr.meds==null?0:dr.meds; s+=parts.meds;
  /* 5) ทำกิจวัตรเองได้ (ADL อย่างย่อ) — 0-2 */
  parts.adl=dr.adl==null?0:dr.adl; s+=parts.adl;
  var max=12;
  var tier = s>=10?4 : s>=8?3 : s>=5?2 : 1;
  return {score:s, max:max, tier:tier, parts:parts};
}

function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}

/* ---- วิเคราะห์เส้นทางความเสี่ยงเฉพาะบุคคล ---- */
function hasADLFlag(out){return out.flags.some(function(f){return f.id==="R6"})}
function trajectory(){
  var A=S.data.assessments, p=S.data.profile;
  if(!A.length||!p)return null;
  var last=A[A.length-1], first=A[0];
  var out={n:A.length,last:last,flags:[],level:"stable",span:daysBetween(first.at,last.at),
           sinceLast:daysBetween(last.at,todayISO())};
  var fts=A.filter(function(x){return x.ftsst!=null});
  var bestFt=fts.length?Math.min.apply(null,fts.map(function(x){return x.ftsst})):null;
  var bestScore=Math.max.apply(null,A.map(function(x){return x.score}));

  if(last.ftsst!=null&&bestFt!=null&&fts.length>1&&last.ftsst>bestFt){
    var d=last.ftsst-bestFt, pct=d/bestFt*100;
    if(d>=2.3||pct>=15){
      out.flags.push({id:"R1",sev:(pct>=30||d>=4)?2:1,
        text:"เวลาลุกนั่ง 5 ครั้งช้าลง "+pct.toFixed(0)+"% ("+bestFt.toFixed(1)+" → "+last.ftsst.toFixed(1)+" วินาที) เทียบกับผลที่ดีที่สุดของคุณเอง",
        why:"ส่วนต่าง "+d.toFixed(1)+" วินาที ถึงเกณฑ์การเปลี่ยนแปลงที่มีความหมายทางคลินิก (≥2.3 วินาที)"});
    }
  }
  if(last.ftsst!=null){
    var cut=CFG.ftsstCut(p.age), prevFt=null;
    for(var i=A.length-2;i>=0;i--){if(A[i].ftsst!=null){prevFt=A[i].ftsst;break}}
    if(last.ftsst>cut&&(prevFt==null||prevFt<=cut)){
      out.flags.push({id:"R2",sev:2,
        text:"เวลาลุกนั่งขึ้นเป็น "+last.ftsst.toFixed(1)+" วินาที สูงกว่าเกณฑ์ของช่วงอายุ "+CFG.ageBand(p.age)+" ปี ("+cut.toFixed(1)+" วินาที)",
        why:"เป็นการข้ามค่าตัดเกณฑ์ครั้งแรก จึงถือเป็นการเปลี่ยนสถานะ ไม่ใช่ความผันผวนปกติ"});
    }
  }
  if(A.length>1){
    var prev=A[A.length-2];
    if(last.parts.falls<prev.parts.falls)
      out.flags.push({id:"R3",sev:2,text:"มีการหกล้มเกิดขึ้นใหม่ในช่วง "+daysBetween(prev.at,last.at)+" วันที่ผ่านมา",
        why:"ผู้ที่ล้มแล้ว 1 ครั้งมีโอกาสล้มซ้ำสูงขึ้นชัดเจนใน 12 เดือนถัดไป"});
    if(last.parts.adl<prev.parts.adl)
      out.flags.push({id:"R6",sev:3,text:"ความสามารถทำกิจวัตรประจำวันลดลงจากการประเมินครั้งก่อน",
        why:"การลดลงของ ADL เป็นสัญญาณเริ่มต้นของภาวะพึ่งพิง ซึ่งเป็นเหตุการณ์ที่กรมธรรม์คุ้มครอง"});
  }
  if(last.score<=bestScore-2)
    out.flags.push({id:"R4",sev:last.score<=bestScore-3?2:1,
      text:"คะแนนรวมลดลง "+(bestScore-last.score)+" คะแนน จากค่าดีที่สุดของคุณ ("+bestScore+" → "+last.score+")",
      why:"เปรียบเทียบกับตัวคุณเองในอดีต ไม่ใช่กับค่าเฉลี่ยของคนอื่น"});
  if(last.parts.meds===0&&last.parts.balance<=1)
    out.flags.push({id:"R5",sev:2,text:"ใช้ยาตั้งแต่ 4 ชนิดขึ้นไป ร่วมกับผลทรงตัวที่ยังไม่ผ่านเกณฑ์",
      why:"สองปัจจัยนี้เมื่อเกิดร่วมกันเพิ่มความเสี่ยงหกล้มมากกว่าผลรวมของแต่ละปัจจัย"});
  /* กฎเฉพาะของการวัดด้วยกล้อง: ความสม่ำเสมอของจังหวะแต่ละครั้ง */
  if(last.cv!=null&&last.cv>=0.25)
    out.flags.push({id:"R7",sev:1,
      text:"จังหวะการลุกแต่ละครั้งไม่สม่ำเสมอ (ครั้งท้าย ๆ ช้ากว่าครั้งแรกอย่างชัดเจน)",
      why:"กล้องวัดเวลาแยกรายครั้งได้ ความแปรปรวน "+(last.cv*100).toFixed(0)+"% บ่งชี้ความล้าของกล้ามเนื้อขาเร็วกว่าปกติ"});

  /* R8 — การทรงตัวถดถอยเป็นรายท่า (CDC 4-Stage Balance Test)
     เหตุผลที่ต้องแยกจาก R4: คะแนนรวมอาจไม่ขยับเลยเพราะช่วงคะแนนทรงตัวหยาบ
     แต่การที่เคยยืนต่อเท้าได้ครบ 10 วินาทีแล้ววันนี้ทำไม่ได้ คือการสูญเสียที่ชัดเจน */
  var bals=A.filter(function(x){return x.balPassed!=null});
  if(last.balPassed!=null&&bals.length>1){
    var bestBal=Math.max.apply(null,bals.map(function(x){return x.balPassed}));
    if(last.balPassed<bestBal){
      var lostN=bestBal-last.balPassed;
      out.flags.push({id:"R8",sev:(last.balPassed<=1||lostN>=2)?2:1,
        text:"การทรงตัวถดถอย "+lostN+" ท่า — เคยยืนผ่าน "+bestBal+" จาก 4 ท่า ครั้งนี้ผ่าน "+last.balPassed+" ท่า"+
             (BAL_STAGES[last.balPassed]?" (ท่าที่ทำไม่ได้: "+BAL_STAGES[last.balPassed].nm+")":""),
        why:"ท่ายืนของ 4-Stage Balance Test เรียงจากง่ายไปยาก การทำท่าที่เคยผ่านไม่ได้ จึงเป็นการสูญเสียความสามารถ ไม่ใช่ความผันผวนของการวัด"});
    }
  }
  /* R9 — คะแนนบาร์เธลลดลงแม้ยังอยู่ระดับเดิม
     เหตุผล: R6 จับเฉพาะตอนข้ามระดับ (ติดสังคม → ติดบ้าน) ซึ่งช้าเกินไป
     คนที่ตกจาก 20 เหลือ 14 คะแนน ยังเป็น "ติดสังคม" อยู่ แต่เสียความสามารถไป 6 คะแนนแล้ว */
  var bars=A.filter(function(x){return x.barthelTotal!=null});
  if(last.barthelTotal!=null&&bars.length>1){
    var bestBar=Math.max.apply(null,bars.map(function(x){return x.barthelTotal}));
    var dBar=bestBar-last.barthelTotal;
    if(dBar>=2&&!hasADLFlag(out))
      out.flags.push({id:"R9",sev:dBar>=4?2:1,
        text:"คะแนนดัชนีบาร์เธลลดลง "+dBar+" คะแนน ("+bestBar+" → "+last.barthelTotal+" จาก 20) โดยยังไม่ข้ามระดับ",
        why:"เป็นการเตือนล่วงหน้าก่อนจะตกไปสู่ระดับพึ่งพิงที่สูงขึ้น ซึ่งเป็นจุดที่กรมธรรม์เริ่มจ่ายสินไหม"});
  }

  /* R10 — TUG ช้ากว่าเกณฑ์คัดกรอง CDC (12 วินาที นับตั้งแต่เริ่มลุกจนนั่งลง)
     ใช้เฉพาะรอบที่ระบบยืนยันว่าเดินครบระยะ 3 เมตร มิฉะนั้นเวลาจะสั้น/ยาวเกินจริง */
  if(last.tug!=null&&last.tug>=12&&last.tugDistanceOk!==false)
    out.flags.push({id:"R10",sev:last.tug>=15?2:1,
      text:"ลุกเดิน 3 เมตรแล้วกลับมานั่ง ใช้เวลา "+last.tug.toFixed(1)+" วินาที (เกณฑ์คัดกรอง 12 วินาที)",
      why:"CDC STEADI ใช้ 12 วินาทีเป็นจุดคัดกรองความเสี่ยงหกล้ม — เป็นจุดเริ่มเฝ้าระวัง ไม่ใช่คำวินิจฉัย"});

  var sev=out.flags.reduce(function(a,b){return a+b.sev},0);
  var hasADL=out.flags.some(function(f){return f.id==="R6"});
  out.level = (last.tier===1||hasADL||sev>=5)?"urgent" : (last.tier===2||sev>=3)?"decline" : sev>=1?"watch":"stable";
  out.nextDays=ENGINE.cadence[out.level];
  out.nextDate=new Date(Date.now()+out.nextDays*864e5).toISOString();
  out.referral = out.level==="urgent"?{nm:"ส่งต่อพยาบาลประเมินที่บ้าน",sla:"ภายใน 72 ชั่วโมง",need:true}
               : out.level==="decline"?{nm:"Care Manager โทรติดตาม",sla:"ภายใน 7 วัน",need:true}
               : out.level==="watch"?{nm:"แผนป้องกันด้วยตนเอง + เตือนประเมินซ้ำ",sla:"ไม่ต้องส่งต่อ",need:false}
                                     :{nm:"ดูแลตนเองตามแผนปกติ",sla:"ไม่ต้องส่งต่อ",need:false};
  return out;
}
function nextDueDays(flags,tier){
  var sev=flags.filter(function(f){return f.id!=="R7"}).reduce(function(a,b){return a+b.sev},0);
  if(tier===1||sev>=5)return ENGINE.cadence.urgent;
  if(tier===2||sev>=3)return ENGINE.cadence.decline;
  if(sev>=1)return ENGINE.cadence.watch;
  return ENGINE.cadence.stable;
}

function preventionPlan(){
  var tr=trajectory(); if(!tr) return null;
  var last=tr.last, p=S.data.profile, picks=[];
  function add(dom,reason){var it=PREV_LIB.find(function(x){return x.dom===dom});if(it&&!picks.some(function(x){return x.id===it.id}))picks.push(Object.assign({},it,{reason:reason}))}
  if(last.parts.ftsst<=2) add("ftsst","คะแนนลุกนั่งของคุณอยู่ที่ "+last.parts.ftsst+"/4"+(last.ftsst?" ("+last.ftsst.toFixed(1)+" วินาที)":""));
  else if(tr.flags.some(function(f){return f.id==="R1"})) add("ftsst","เวลาลุกนั่งของคุณช้าลงจากเดิม แม้คะแนนยังอยู่ในเกณฑ์");
  if(last.parts.balance<=1) add("balance","คะแนนทรงตัว "+last.parts.balance+"/3");
  if(last.parts.falls<2) add("falls","มีประวัติหกล้มในรอบ 12 เดือน");
  if(last.parts.meds===0) add("meds","ใช้ยาตั้งแต่ 4 ชนิดขึ้นไป");
  if(last.parts.adl<2) add("adl","คะแนนกิจวัตรประจำวัน "+last.parts.adl+"/2");
  add("general","แนะนำกับทุกคนในช่วงอายุ "+CFG.ageBand(p.age)+" ปี");
  return {level:tr.level, items:picks, tr:tr};
}

/* ---------- กล่องโต้ตอบในแอป — แทน prompt()/confirm() ของเบราว์เซอร์ ----------
   เหตุผล: dialog ของเบราว์เซอร์ตัวอักษรเล็ก ปรับขนาดไม่ได้ และถูกบล็อกในบางบริบท
   กล่องนี้ตัวอักษรใหญ่ ปุ่มใหญ่ สอดคล้องกับการออกแบบเพื่อผู้สูงอายุทั้งแอป */
function dialog(opts){
  var old=document.getElementById("csDlg"); if(old)old.remove();
  var wrap=document.createElement("div");
  wrap.id="csDlg";
  wrap.style.cssText="position:fixed;inset:0;background:rgba(15,27,51,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:22px";
  wrap.innerHTML='<div role="dialog" aria-modal="true" style="background:#fff;border-radius:22px;padding:24px;max-width:420px;width:100%;box-shadow:0 24px 60px rgba(15,27,51,.35)">'+
    '<h3 style="margin:0 0 8px;font-size:23px;line-height:1.4">'+esc(opts.title)+'</h3>'+
    (opts.body?'<p style="margin:0 0 18px;font-size:18px;line-height:1.7;color:#5B6B84">'+opts.body+'</p>':'')+
    (opts.input?'<input id="dlgIn" inputmode="decimal" placeholder="'+esc(opts.placeholder||"")+'" style="width:100%;box-sizing:border-box;font-size:30px;font-family:inherit;padding:16px;border:1.5px solid #DFE7F2;border-radius:14px;text-align:center;margin-bottom:14px">':'')+
    '<button id="dlgOk" style="display:block;width:100%;border:0;border-radius:14px;padding:19px;font-size:20px;font-weight:600;font-family:inherit;cursor:pointer;background:'+(opts.danger?"#DC2626":"#2563EB")+';color:#fff">'+esc(opts.ok||"ตกลง")+'</button>'+
    '<button id="dlgNo" style="display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-family:inherit;cursor:pointer;background:transparent;color:#5B6B84;margin-top:6px">'+esc(opts.cancel||"ยกเลิก")+'</button></div>';
  document.body.appendChild(wrap);
  var inp=document.getElementById("dlgIn");
  var prevFocus=document.activeElement;
  setTimeout(function(){(inp||document.getElementById("dlgOk")).focus()},60);
  function onKey(e){if(e.key==="Escape"){close();if(opts.onCancel)opts.onCancel()}}
  document.addEventListener("keydown",onKey);
  function close(){wrap.remove();document.removeEventListener("keydown",onKey);if(prevFocus&&prevFocus.focus)try{prevFocus.focus()}catch(e){}}
  document.getElementById("dlgNo").addEventListener("click",function(){close();if(opts.onCancel)opts.onCancel()});
  document.getElementById("dlgOk").addEventListener("click",function(){
    if(opts.input){opts.onOk(parseFloat(inp.value))}
    else{close();opts.onOk()}
  });
  if(inp)inp.addEventListener("keydown",function(e){if(e.key==="Enter")opts.onOk(parseFloat(inp.value))});
  return {close:close};
}

/* ---------- เชื่อมระบบกลาง: สมัคร / เข้าสู่ระบบ ---------- */
async function cloudRegisterApp(phone,pin,p){
  if(!CSBackend.isCloud())return false;
  try{
    await CSBackend.signUpUser(phone,pin);
    await new Promise(function(r){setTimeout(r,800)});
    await CSBackend.updateProfile({display_name:p.name,birth_year_be:p.birthYear,
      birth_month:p.birthMonth,sex:p.sex,phone:phone});
    await CSBackend.grantConsent("assessment","PDPA-1.0");
    await CSBackend.grantConsent("share_pool","PDPA-1.0");
    CLOUD.session=true;
    return true;
  }catch(e){console.warn("cloud register",e);return false}
}

/* ---------- เนื้อหาคำอธิบายเหตุผล (ใช้ร่วมกันหลายหน้า) ---------- */
function warnBody(tr){
  tr=tr||trajectory(); if(!tr)return "";
  var body;
  if(tr.flags.length){
    body=tr.flags.slice(0,3).map(function(f){
      return '<div class="evi"><span class="rid">ข้อสังเกตที่ '+f.id.replace("R","")+'</span>'+esc(f.text)+
             '<span class="why">เพราะ: '+esc(f.why)+'</span></div>';
    }).join("");
  }else{
    body='<div class="evi">ไม่พบสัญญาณถดถอย เมื่อเทียบผลตรวจย้อนหลัง '+tr.n+' ครั้งของคุณ<span class="why">เพราะ: ไม่มีข้อสังเกตใดเข้าเงื่อนไขเตือน</span></div>';

  '<div class="rowline"><span class="k">ควรตรวจอีกครั้งภายใน</span><span class="v">'+tr.nextDays+' วัน</span></div>'+
  '<div class="rowline"><span class="k">การดูแลที่แนะนำ</span><span class="v">'+esc(tr.referral.sla)+'</span></div>'+

function drawPose(ctx,canvas,video,lm){
  if(canvas.width!==video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!lm)return;
  var pairs=[[11,12],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],[11,13],[13,15],[12,14],[14,16]];
  ctx.lineWidth=Math.max(3,canvas.width/150); ctx.strokeStyle="rgba(96,165,250,.9)"; ctx.lineCap="round";
  pairs.forEach(function(p){
    var a=lm[p[0]],b=lm[p[1]]; if(!a||!b)return;
    ctx.beginPath();ctx.moveTo(a.x*canvas.width,a.y*canvas.height);ctx.lineTo(b.x*canvas.width,b.y*canvas.height);ctx.stroke();
  });
  [11,12,23,24,25,26,27,28].forEach(function(i){
    var p=lm[i]; if(!p)return;
    ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,Math.max(4,canvas.width/110),0,6.3);
    ctx.fillStyle=(i===23||i===24)?"#FCD34D":"#DBEAFE";ctx.fill();
  });
}

    }else{

        setStatus("red","ท่านั่งกับท่ายืนต่างกันน้อยเกินไป — เริ่มใหม่ กรุณานั่งลงก่อน");
        speak("ท่านั่งกับท่ายืนต่างกันน้อยเกินไป เริ่มใหม่ กรุณานั่งลงก่อน");
        step=0;cstep.textContent="ขั้นที่ 1 · นั่งบนเก้าอี้ให้เห็นเต็มตัว";cap.textContent="บันทึกท่านั่ง";
        armAt=performance.now()+4000;AUTO.reset();return;
      }
      S.draft.sitRef=sitVal;S.draft.standRef=standVal;
      audit("สอบเทียบกล้อง","ค่าท่านั่ง "+sitVal.toFixed(3)+" ค่าท่ายืน "+standVal.toFixed(3)+" ช่วงห่าง "+(standVal-sitVal).toFixed(3));
      toast("สอบเทียบเรียบร้อย");
      setStatus("green","สอบเทียบเรียบร้อย — ขั้นต่อไป ทดสอบลุกนั่ง 5 ครั้ง",false);
      speak("สอบเทียบเรียบร้อย ขั้นตอนต่อไป ทดสอบลุกนั่ง ห้าครั้ง กรุณานั่งลงบนเก้าอี้");
      setTimeout(function(){go("camtest")},2400);
    }
  }
}

          setStatus("green","นับได้ "+ev.reps+" ครั้ง จาก 5 ครั้ง",false);

  function beginTimer(){
    if(running)return;

    startBtn.textContent="กำลังจับเวลา…";startBtn.disabled=true;
    stopBtn.hidden=false;
    setStatus("green","เริ่ม! ลุก-นั่งให้ครบ 5 ครั้ง",false);speak("เริ่มได้เลย");
    coach.innerHTML="ลุกยืนให้สุดแล้วนั่งลงให้สุด ทำต่อเนื่อง<span class='statebadge'>เริ่มแล้ว</span>";
  }
  startBtn.addEventListener("click",function(){
    if(running)return;
    AUTOSTART.abort();
    beginTimer();
  });
  stopBtn.addEventListener("click",function(){
    var reps=DET?DET.reps:0;
    stopCam();
    audit("หยุดการทดสอบด้วยกล้องกลางคัน","ผู้ใช้หยุดเองขณะนับได้ "+reps+" ครั้ง แล้วเลือกกรอกเวลาเอง");
    askTime(function(n){
      S.draft.ftsst=n;S.draft.method="manual";S.draft.reps=5;S.draft.cv=null;S.draft.gaps=null;
      audit("บันทึกเวลาด้วยตนเอง","ผู้ใช้กรอกเวลา "+n.toFixed(1)+" วินาที");
      go("tug");
    },function(){go("assessIntro")});
  });
}
function finishTest(elapsed){
  stopCam();
  var gaps=[];
  for(var i=1;i<DET.stamps.length;i++)gaps.push((DET.stamps[i]-DET.stamps[i-1])/1000);
  var cv=null;
  if(gaps.length>1){
    var mean=gaps.reduce(function(a,b){return a+b},0)/gaps.length;
    var sd=Math.sqrt(gaps.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/gaps.length);
    cv=mean>0?sd/mean:null;
  }
  S.draft.ftsst=Math.round(elapsed*10)/10;
  S.draft.method="camera-pose";
  S.draft.reps=DET.reps;
  S.draft.cv=cv;
  S.draft.gaps=gaps.map(function(g){return Math.round(g*10)/10});
  /* สรุปผลการยืนยันตัวตน: ผ่านเมื่อมีการตรวจอย่างน้อย 1 ครั้งและไม่พบความไม่ตรงเกิน 1 ครั้ง */
  var ck=S.draft.identityChecks||0, fl=S.draft.identityFails||0;
  S.draft.identityVerified = (faceEnabled() && ck>=1 && fl<=1);
  audit("ผลการยืนยันตัวตนระหว่างทดสอบ", faceEnabled()
    ? ("ตรวจใบหน้า "+ck+" ครั้ง ไม่ตรง "+fl+" ครั้ง → "+(S.draft.identityVerified?"ยืนยันผ่าน":"ยืนยันไม่ผ่าน ผลนี้ไม่นำไปคิดส่วนลด"))
    : "ผู้ใช้ไม่ได้ลงทะเบียนใบหน้า ผลนี้ไม่นำไปคิดส่วนลด");
  audit("วัดด้วยกล้อง","ลุกนั่ง 5 ครั้งใน "+S.draft.ftsst.toFixed(1)+" วินาที · เวลาต่อครั้ง "+S.draft.gaps.join(", ")+" วินาที"+(cv!=null?" · ความแปรปรวน "+(cv*100).toFixed(0)+"%":""));
  speak("ครบห้าครั้ง เสร็จเรียบร้อย เก่งมากค่ะ ต่อไปเป็นการทดสอบลุกเดินสามเมตร");
  toast("วัดเสร็จแล้ว "+S.draft.ftsst.toFixed(1)+" วินาที");
  go("tug");
}



/* ============================================================
   การทดสอบลุกเดิน 3 เมตร (Timed Up and Go)
   ------------------------------------------------------------
   จับเวลาตั้งแต่ลุกจากเก้าอี้ เดินไป 3 เมตร หมุนกลับ จนนั่งลง
   กล้องตรวจ 2 จุด: จังหวะที่ลุกขึ้น (เริ่มจับ) และจังหวะที่นั่งลง (หยุด)
   ระหว่างเดินออกนอกเฟรม ระบบรอโดยไม่นับผิด
   เกณฑ์อ้างอิง: ใช้เวลา ≥12 วินาที สัมพันธ์กับความเสี่ยงหกล้มที่สูงขึ้น
   ============================================================ */

/* ============================================================
   ตัวช่วยที่ใช้ร่วมกับ CareSignal-Vision — คัดมาบรรทัดต่อบรรทัด
   เพื่อให้ผลวัดจากสองแอปเทียบกันได้ตรง ๆ
   ============================================================ */
function trunkCenter(lm){
  var sh={x:(lm[LM.LSH].x+lm[LM.RSH].x)/2, y:(lm[LM.LSH].y+lm[LM.RSH].y)/2};
  var hp={x:(lm[LM.LHIP].x+lm[LM.RHIP].x)/2, y:(lm[LM.LHIP].y+lm[LM.RHIP].y)/2};
  return {x:(sh.x+hp.x)/2, y:(sh.y+hp.y)/2};
}
function shoulderWidth(lm){
  return Math.hypot(lm[LM.LSH].x-lm[LM.RSH].x, lm[LM.LSH].y-lm[LM.RSH].y);
}
/* ค่าโคลงเคลง = ส่วนเบี่ยงเบนมาตรฐานของตำแหน่งลำตัว หารความกว้างไหล่ */
function swayScore(samples){
  if(samples.length<8)return null;
  var n=samples.length, mx=0, my=0;
  samples.forEach(function(s){mx+=s.x;my+=s.y});
  mx/=n; my/=n;
  var vx=0, vy=0;
  samples.forEach(function(s){vx+=(s.x-mx)*(s.x-mx); vy+=(s.y-my)*(s.y-my)});
  return Math.sqrt(vx/n+vy/n);
}
/* แปลงค่าเป็นข้อสังเกต 3 ระดับ */
function swayLabel(v){
  /* หน่วย: สัดส่วนของความยาวลำตัว (ไหล่→สะโพก) — เปลี่ยนจากความกว้างไหล่
     ตั้งแต่เอนจิน 1.4.1 เพราะไม่เพี้ยนเมื่อหันข้างให้กล้อง */
  if(v==null)return {nm:"วัดไม่ได้", cls:"", hint:"กล้องเห็นตัวไม่ครบตลอด 10 วินาที"};
  if(v<0.012)return {nm:"นิ่งมาก", cls:"t4", hint:"แทบไม่มีการโคลง"};
  if(v<0.028)return {nm:"โคลงเล็กน้อย", cls:"t3", hint:"มีการแกว่งบ้างตามปกติ"};
  if(v<0.050)return {nm:"โคลงปานกลาง", cls:"t2", hint:"แกว่งชัดเจน ควรมีที่จับใกล้มือ"};
  return {nm:"โคลงมาก", cls:"t1", hint:"แกว่งมาก ควรมีคนอยู่ข้าง ๆ เสมอ"};
}


/* ============================================================
   BalanceEngine — เครื่องมือตรวจจับเฉพาะกิจของ 4-Stage Balance Test
   ------------------------------------------------------------
   บทเรียนจากสองรุ่นก่อน:
   รุ่นแรกใช้ความกว้างไหล่เป็นหน่วย → หันข้างแล้วค่าเพี้ยน
   รุ่นสองใช้การจำแนกชื่อท่าจากเท้าเป็นเงื่อนไขบังคับ → เมื่อกล้อง
   เห็นเท้าไม่ชัด (มือถือวางต่ำ แสงน้อย กางเกงคลุมข้อเท้า)
   ค่าเท้าเป็น null ระบบจึงไม่เริ่มนับเลย และวัดความโคลงไม่ได้ทั้งชุด

   สิ่งที่การทดสอบต้องการจริงตาม CDC มีสามอย่าง:
   (1) ยืนนิ่งครบ 10 วินาที (2) หยุดเมื่อ "ขยับเท้า" (3) ค่าความโคลง
   ทั้งหมดวัดได้จาก "ลำตัว" ซึ่งกล้องเห็นเสมอ เครื่องยนต์นี้จึงยึด
   ลำตัวเป็นหลัก (ไหล่+สะโพก) และใช้ข้อมูลเท้าเฉพาะเมื่อมองเห็น
   เพื่อเพิ่มความแม่น ไม่ใช่เป็นเงื่อนไขบังคับ — จึงไม่มีทางค้าง
   หน่วยวัดทุกค่า = ความยาวลำตัว (ไหล่→สะโพก) ซึ่งไม่เปลี่ยน
   ไม่ว่าหันหน้าหรือหันข้างให้กล้อง
   ============================================================ */
function BalanceEngine(stage){
  this.stage=stage;                 /* 0-3 = เท้าชิด กึ่งต่อเท้า ต่อเท้า ขาเดียว */
  this.state="search";              /* search/steady → hold */
  this.c=null; this.torso=null;
  this.stillN=0; this.lostN=0; this.badN=0;
  this.refC=null; this.refFeet=null; this.refLift=null;
  this.samples=[]; this.liftWarned=false; this.lastLm=null;
}
BalanceEngine.prototype._read=function(lm){
  if(!lm)return null;
  function vis(i){var p=lm[i];return p&&(p.visibility===undefined||p.visibility>0.4)}
  if(!(vis(LM.LSH)&&vis(LM.RSH)&&vis(LM.LHIP)&&vis(LM.RHIP)))return null;
  var sh={x:(lm[LM.LSH].x+lm[LM.RSH].x)/2,y:(lm[LM.LSH].y+lm[LM.RSH].y)/2};
  var hp={x:(lm[LM.LHIP].x+lm[LM.RHIP].x)/2,y:(lm[LM.LHIP].y+lm[LM.RHIP].y)/2};
  var torso=Math.hypot(sh.x-hp.x,sh.y-hp.y);
  if(!isFinite(torso)||torso<0.04)return null;
  var f=null;
  if(vis(LM.LANK)&&vis(LM.RANK)){
    f={lx:lm[LM.LANK].x/torso, ly:lm[LM.LANK].y/torso,
       rx:lm[LM.RANK].x/torso, ry:lm[LM.RANK].y/torso,
       lift:Math.abs(lm[LM.LANK].y-lm[LM.RANK].y)/torso};
  }
  return {c:{x:(sh.x+hp.x)/2/torso, y:(sh.y+hp.y)/2/torso}, torso:torso, feet:f};
};
BalanceEngine.prototype.frame=function(lm){
  this.lastLm=lm;
  var r=this._read(lm);
  if(!r){
    this.lostN++; this.stillN=0;
    return {seen:false, lost:this.lostN, ready:false,
            fail:this.state==="hold"&&this.lostN>75,
            why:"กล้องมองไม่เห็นตัวนานเกินไป", sway:this.liveSway()};
  }
  this.lostN=0;
  var prev=this.c;
  this.c=prev?{x:prev.x*0.7+r.c.x*0.3, y:prev.y*0.7+r.c.y*0.3}:r.c;
  this.torso=this.torso?this.torso*0.9+r.torso*0.1:r.torso;
  var mv=prev?Math.hypot(this.c.x-prev.x,this.c.y-prev.y):9;

  if(this.state!=="hold"){
    /* ก่อนเริ่ม ต้องการแค่ "เห็นตัว + ยืนนิ่ง" — เงื่อนไขเดียว ไม่มีทางค้าง */
    if(mv<0.02)this.stillN++; else this.stillN=0;
    var ready=this.stillN>=12;                     /* นิ่งราวครึ่งวินาที */
    this.state=ready?"steady":"search";
    return {seen:true, ready:ready, feet:r.feet, sway:null,
            liftNow:r.feet?r.feet.lift:null};
  }

  /* ---- ระหว่างจับเวลา 10 วินาที ---- */
  this.samples.push({x:this.c.x,y:this.c.y});
  var res={seen:true, ready:true, fail:false, why:null,
           sway:this.liveSway(), stepped:false, remind:null};

  if(r.feet&&this.refFeet){
    if(this.stage===3){
      /* ขาเดียว: เท้าที่ยกแกว่งได้ตามธรรมชาติ ล้มเหลวเมื่อเท้ากลับลงพื้น */
      if(this.refLift!=null&&this.refLift>0.15&&
         r.feet.lift<Math.min(0.12,this.refLift*0.45))this.badN++;
      else this.badN=0;
      res.why="เท้าที่ยกลงแตะพื้น";
    }else{
      var d=Math.max(Math.hypot(r.feet.lx-this.refFeet.lx,r.feet.ly-this.refFeet.ly),
                     Math.hypot(r.feet.rx-this.refFeet.rx,r.feet.ry-this.refFeet.ry));
      if(d>0.45)this.badN++; else this.badN=0;     /* ~ครึ่งช่วงลำตัว = ก้าวจริง */
      res.why="ขยับเท้าออกจากตำแหน่งเดิม";
    }
  }else{
    /* มองไม่เห็นเท้า: ใช้การเลื่อนข้างของลำตัวแทนการตรวจก้าว */
    if(this.refC&&Math.abs(this.c.x-this.refC.x)>0.6)this.badN++; else this.badN=0;
    res.why="ตัวเลื่อนจากตำแหน่งเดิมมาก (น่าจะมีการก้าวขา)";
  }
  if(this.badN>=10){res.fail=true;res.stepped=true}

  /* ท่าขาเดียวแต่ยังไม่ยกเท้า: เตือนด้วยเสียงครั้งเดียว ไม่ตัดคะแนน */
  if(this.stage===3&&r.feet&&!this.liftWarned&&this.samples.length>50&&r.feet.lift<0.10){
    this.liftWarned=true;
    res.remind="อย่าลืมยกเท้าข้างหนึ่งขึ้นจากพื้นด้วยนะ";
  }
  return res;
};
BalanceEngine.prototype.beginHold=function(){
  this.state="hold"; this.samples=[]; this.badN=0; this.lostN=0;
  var r=this._read(this.lastLm);
  this.refC=r?r.c:this.c;
  this.refFeet=r?r.feet:null;
  this.refLift=r&&r.feet?r.feet.lift:null;
};
BalanceEngine.prototype._sd=function(arr){
  if(arr.length<8)return null;
  var mx=0,my=0;arr.forEach(function(p){mx+=p.x;my+=p.y});mx/=arr.length;my/=arr.length;
  var v=0;arr.forEach(function(p){v+=(p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my)});
  return Math.sqrt(v/arr.length);
};
BalanceEngine.prototype.liveSway=function(){return this._sd(this.samples.slice(-90))};
BalanceEngine.prototype.finalSway=function(){return this._sd(this.samples)};

/* ============================================================
   TugTracker — ตรวจการเดินไป-กลับ 3 เมตรของ TUG ด้วยกล้องตัวเดียว
   ------------------------------------------------------------
   ผู้ใช้วางป้ายจุดเริ่ม (ข้างเก้าอี้) และป้ายจุดกลับที่ 3 เมตร
   กล้องไม่จำเป็นต้องเห็นป้าย — ใช้ขนาดตัวในภาพเป็นมาตรวัดแทน:
   เดินออกห่าง → ตัวเล็กลง · ถึงจุดกลับ → เล็กสุด · เดินกลับ → ใหญ่ขึ้น
   - "เดินครบรอบ" ยืนยันเมื่อขนาดเล็กสุด ≤ 82% ของขนาดตอนยืนที่เก้าอี้
   - การเดินตรง วัดจากการเบี่ยงซ้าย-ขวาของกึ่งกลางไหล่ หน่วยเป็น
     ความกว้างไหล่ ณ ระยะนั้น จึงเทียบได้ทุกระยะห่างจากกล้อง
   ============================================================ */
function TugTracker(refs){
  this.sitRef=refs.sitRef; this.standRef=refs.standRef;
  /* CDC ให้เริ่มจับเวลาเมื่อผู้ประเมินพูดว่า "เริ่ม" ไม่ใช่ตอนที่ผู้รับการ
     ประเมินขยับ ระบบจึงบันทึกเวลาสัญญาณเริ่มไว้ที่ goAt แล้วเก็บเวลา
     ที่เริ่มขยับจริงไว้ต่างหาก เพื่อรายงานเวลาตอบสนองแยกได้ */
  this.goAt=null;
  this.state="waiting"; this.t0=null; this.tTurn=null; this.t1=null;
  this.buf=[]; this.onsetFrac=0.18;
  this.s0=null; this.s0buf=[]; this.sMin=null; this.sw=null;
  this.cx0=null; this.maxDrift=0; this.driftSum=0; this.driftN=0;
}
TugTracker.prototype.pushFrame=function(raw,sw,cx,t){
  /* แกนลุก-นั่ง: ตรรกะเดียวกับตัวจับ TUG เดิม (เริ่มนับตั้งแต่เริ่มโน้มตัวลุก) */
  this.buf.push(raw); if(this.buf.length>5)this.buf.shift();
  var v=this.buf.reduce(function(a,b){return a+b},0)/this.buf.length;
  var range=this.standRef-this.sitRef;
  var onset=this.sitRef+range*this.onsetFrac;
  var up=this.sitRef+range*0.68, down=this.sitRef+range*0.36;
  /* ขนาดตัวในภาพ ปรับเรียบด้วย EMA กันกระตุกรายเฟรม */
  if(sw&&sw>0.01)this.sw=this.sw==null?sw:this.sw*0.8+sw*0.2;

  if(this.state==="waiting"&&v>=onset){this.state="rising";this.t0=t;return{event:"onset"}}
  if(this.state==="rising"&&v>=up){this.state="standing";this.s0buf=[];return{event:"stand"}}
  if(this.state==="standing"){
    /* เก็บขนาดตอนยืนตรงหน้าเก้าอี้ ~15 เฟรม ใช้มัธยฐานเป็นฐานเทียบ */
    if(this.sw!=null)this.s0buf.push(this.sw);
    if(this.s0buf.length>=15){
      this.s0buf.sort(function(a,b){return a-b});
      this.s0=this.s0buf[Math.floor(this.s0buf.length/2)];
      this.sMin=this.s0; this.cx0=cx;
      this.state="walkOut"; return {event:"walk"};
    }
    return null;
  }
  if((this.state==="walkOut"||this.state==="walkBack")&&this.sw!=null&&this.s0){
    if(this.sw<this.sMin)this.sMin=this.sw;
    if(cx!=null&&this.cx0!=null){
      var d=Math.abs(cx-this.cx0)/this.sw;
      if(d>this.maxDrift)this.maxDrift=d;
      this.driftSum+=d; this.driftN++;
    }
    /* จุดกลับ: ตัวเล็กลงพอสมควรแล้ว และเริ่มกลับมาใหญ่ขึ้นต่อเนื่อง */
    if(this.state==="walkOut"&&this.sMin<=this.s0*0.90&&this.sw>=this.sMin*1.07){
      this.state="walkBack"; this.tTurn=t; return {event:"turn"};
    }
  }
  if((this.state==="walkOut"||this.state==="walkBack")&&v<=down&&this.t0&&(t-this.t0)>4000){
    this.state="done"; this.t1=t;
    var base=this.goAt!=null?this.goAt:this.t0;
    return {event:"finish",
      elapsed:(t-base)/1000,
      reaction:this.goAt!=null?(this.t0-this.goAt)/1000:null,
      out:this.tTurn?(this.tTurn-base)/1000:null,
      back:this.tTurn?(this.t1-this.tTurn)/1000:null,
      distanceOk:this.s0!=null&&this.sMin<=this.s0*0.82,
      turnSeen:this.tTurn!=null,
      drift:this.driftN?{max:this.maxDrift,avg:this.driftSum/this.driftN}:null};
  }
  return null;
};
/* แปลผลการเดินตรงเป็นข้อสังเกต (หน่วย: เท่าของความกว้างไหล่) */
function gaitLabel(d){
  if(!d)return {nm:"วัดไม่ได้",cls:""};
  if(d.max<0.8)return {nm:"เดินตรงดี",cls:"t4"};
  if(d.max<1.6)return {nm:"เบี่ยงเล็กน้อย",cls:"t3"};
  return {nm:"เบี่ยงมาก ควรเฝ้าระวัง",cls:"t1"};
}

var BAL_STAGES=[

  if(passed>=3)return {score:2, nm:"ทรงตัวดี — ยืนต่อเท้าได้ครบ"};

function barthelTotal(a){var t=0;BARTHEL.forEach(function(it){if(a[it.k]!=null)t+=a[it.k]});return t}

function barthelEst20(sf){return Math.round(sf*20/BARTHEL_MAX)}
function barthelBand(t){
  if(t>=12)return {nm:"ติดสังคม — พึ่งตนเองได้", cls:"t4", adl:2};

  return {nm:"ติดเตียง — พึ่งพิงระดับสูง", cls:"t1", adl:0};
}
function TugDetector(refs){
  this.sitRef=refs.sitRef; this.standRef=refs.standRef;
  this.state="waiting"; this.t0=null; this.t1=null; this.buf=[];
  this.onsetFrac=0.18;   /* เกณฑ์ "เริ่มขยับลุก" — จุดที่นาฬิกาเริ่มเดินจริง */
}
TugDetector.prototype.push=function(raw,t){
  this.buf.push(raw); if(this.buf.length>5)this.buf.shift();
  var v=this.buf.reduce(function(a,b){return a+b},0)/this.buf.length;
  var range=this.standRef-this.sitRef;
  var onset=this.sitRef+range*this.onsetFrac;
  var up=this.sitRef+range*0.68, down=this.sitRef+range*0.36;
  /* เริ่มจับเวลาตั้งแต่เริ่มโน้มตัวลุก ไม่ใช่ตอนยืนสุด
     ถ้ารอจนยืนสุด เวลาช่วงลุกจากเก้าอี้จะหายไป ทำให้ค่าต่ำกว่าจริง */
  if(this.state==="waiting"&&v>=onset){this.state="rising";this.t0=t;return{event:"onset"}}
  if(this.state==="rising"&&v>=up){this.state="walking";return{event:"start"}}
  /* จบเมื่อกลับมานั่งสุด — ตามมาตรฐาน CDC จับจนนั่งลงเรียบร้อย */
  if(this.state==="walking"&&v<=down&&this.t0&&(t-this.t0)>3000){
    this.state="done";this.t1=t;return{event:"finish",elapsed:(t-this.t0)/1000};
  }
  return null;
};

async function startTugPipeline(){
  camFullscreen();
  var video=document.getElementById("vid"),canvas=document.getElementById("cv"),ctx=canvas.getContext("2d");
  var tag=document.getElementById("tag"),coach=document.getElementById("coach"),
      clk=document.getElementById("tugclk"),phaseEl=document.getElementById("tphase"),
      startBtn=document.getElementById("tugStart");
  var stream;
  setStatus("yellow","กำลังเปิดกล้อง กรุณารอสักครู่");
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:854}},audio:false})}
  catch(e){tag.textContent="เปิดกล้องไม่ได้";setStatus("red","เปิดกล้องไม่ได้ — ข้ามขั้นนี้ได้");return}
  S.cam=stream;video.srcObject=stream;/* บางเบราว์เซอร์ play() ค้างไม่ resolve เมื่อหน้าจอถูกซ่อนหรือสตรีมผิดปกติ
     ใส่เพดานเวลาไว้ 1.5 วินาที เพื่อไม่ให้การทดสอบค้างตั้งแต่เปิดกล้อง */
  await Promise.race([video.play().catch(function(){}),new Promise(function(r){setTimeout(r,1500)})]);
  try{await loadModel(tag)}catch(e){tag.textContent="โหลดโมเดลไม่สำเร็จ";setStatus("red","โหลดระบบไม่สำเร็จ — ข้ามขั้นนี้ได้");return}
  tag.textContent="พร้อมแล้ว";

  /* phase: waitSit → arming → active → done */
  var phase="waitSit", TUG=null, seatedN=0, cdTimer=null, introDone=false;
  var sitRef=S.draft.sitRef, standRef=S.draft.standRef, range=standRef-sitRef;
  var PH={waitSit:"รอท่านนั่ง",arming:"นับถอยหลัง",waiting:"พร้อม",rising:"กำลังลุก",
          standing:"ยืนแล้ว",walkOut:"ขาไป",walkBack:"ขากลับ",done:"เสร็จ"};

  function clearCd(){ if(cdTimer){clearInterval(cdTimer);cdTimer=null} }

  /* ---------- นับ 3-2-1 แล้วปล่อยสัญญาณเริ่ม ---------- */
  function countdown(){
    if(phase!=="waitSit")return;
    phase="arming"; startBtn.disabled=true; startBtn.textContent="กำลังนับถอยหลัง…";
    phaseEl.textContent=PH.arming;
    var n=3, w={3:"สาม",2:"สอง",1:"หนึ่ง"};

      if(S.screen!=="tug"){clearCd();return}
      n--;

      else { clearCd(); begin(); }
    },1000);
  }
  function begin(){
    phase="active";
    TUG=new TugTracker({sitRef:sitRef,standRef:standRef});
    /* CDC ให้เริ่มจับเวลาที่สัญญาณ "เริ่ม" ไม่ใช่ตอนผู้รับการประเมินขยับ */

    setStatus("green","เริ่ม — ลุกขึ้นแล้วเดินไปที่ป้าย",false);
    coach.textContent="เริ่ม — ลุกขึ้น เดินไปที่ป้าย หมุนกลับ แล้วมานั่งลง";
    speak("เริ่ม ลุกขึ้น เดินไปที่ป้าย หมุนกลับ แล้วกลับมานั่งลง");
  }

  function loop(){
    if(S.screen!=="tug")return;
    var r=null;try{r=POSE.detectForVideo(video,performance.now())}catch(e){}
    var lm=r&&r.landmarks&&r.landmarks[0]?r.landmarks[0]:null;
    drawPose(ctx,canvas,video,lm);
    var m=lm?hipRatio(lm):null;

    if(phase==="waitSit"){
      /* รอให้กลับมานั่งเก้าอี้จริง ๆ ก่อน จึงจะประกาศพร้อมทดสอบ */
      var seated = m!=null && m<=sitRef+range*0.22;
      if(seated)seatedN++; else seatedN=0;
      phaseEl.textContent=PH.waitSit;
      if(!lm){
        setStatus("yellow","ขยับให้กล้องเห็นทั้งตัวและเก้าอี้",false);
      }else if(seated){
        setStatus("green","เห็นแล้วว่าท่านนั่งอยู่ — เตรียมเริ่ม",false);
        coach.textContent="เห็นแล้วว่าท่านนั่งอยู่ — กำลังจะเริ่ม";
      }else{
        setStatus("yellow","วางป้ายให้ครบ แล้วกลับมานั่งที่เก้าอี้",false);
        coach.textContent="วางป้ายให้ครบ แล้วกลับมานั่งพิงพนักเก้าอี้";
      }
      if(seatedN>=45){ countdown(); }   /* นั่งนิ่งราว 1.8 วินาที */
    }
    else if(phase==="active"&&lm&&m!=null){
      var sw=shoulderWidth(lm), cx=(lm[LM.LSH].x+lm[LM.RSH].x)/2;
      var ev=TUG.pushFrame(m,sw,cx,performance.now());
      phaseEl.textContent=PH[TUG.state]||"—";
      if(ev&&ev.event==="walk"){coach.textContent="เดินไปให้ถึงป้ายจุดกลับ 3 เมตร";speak("เดินไปที่ป้ายได้เลย")}
      if(ev&&ev.event==="turn"){coach.textContent="ถึงจุดกลับแล้ว — เดินกลับมานั่งลง";speak("ถึงจุดกลับแล้ว เดินกลับมานั่งลงได้เลย")}
      if(ev&&ev.event==="finish"){ finishTug(ev); return }
    }

    if(phase==="active"&&TUG&&TUG.goAt!=null)
      clk.textContent=((performance.now()-TUG.goAt)/1000).toFixed(1);
    if(phase==="active"&&TUG&&TUG.goAt!=null&&performance.now()-TUG.goAt>75000)
      coach.textContent="หากนั่งลงแล้วระบบไม่หยุด กดข้ามขั้นนี้ได้ — คะแนนส่วนอื่นยังครบ";
    RAF=requestAnimationFrame(loop);
  }
  loop();

  startBtn.addEventListener("click",function(){ if(phase==="waitSit")countdown(); });

  if(!introDone){
    introDone=true;
    setStatus("yellow","วางป้าย 2 จุด แล้วกลับมานั่งเก้าอี้",false);
    speak("การทดสอบลุกเดินสามเมตร กรุณาวางป้ายจุดเริ่มไว้ที่เก้าอี้ และป้ายจุดกลับให้ห่างสามเมตร "+
          "เมื่อวางเสร็จแล้ว กลับมานั่งพิงพนักเก้าอี้ ระบบจะบอกเองเมื่อพร้อมทดสอบ");
  }
}

function finishTug(ev){
  stopCam();
  S.draft.tug=Math.round(ev.elapsed*10)/10;
  S.draft.tugOut=ev.out!=null?Math.round(ev.out*10)/10:null;
  S.draft.tugBack=ev.back!=null?Math.round(ev.back*10)/10:null;
  S.draft.tugDistanceOk=!!ev.distanceOk;
  S.draft.tugDrift=ev.drift?Math.round(ev.drift.max*100)/100:null;
  S.draft.tugReaction=ev.reaction!=null?Math.round(ev.reaction*10)/10:null;
  var g=gaitLabel(ev.drift);
  audit("วัดลุกเดิน 3 เมตร (TUG ไป-กลับ ตามโปรโตคอล CDC)",
    "รวม "+S.draft.tug.toFixed(1)+" วิ (จับเวลาตั้งแต่สัญญาณเริ่ม)"+
    (S.draft.tugReaction!=null?" · เวลาตอบสนอง "+S.draft.tugReaction.toFixed(1)+" วิ":"")+
    (S.draft.tugOut!=null?" · ขาไป "+S.draft.tugOut.toFixed(1)+" วิ · ขากลับ "+S.draft.tugBack.toFixed(1)+" วิ":"")+
    " · "+(ev.distanceOk?"เดินครบระยะ":"ระยะอาจไม่ครบ 3 เมตร — ไม่นำมาคัดกรอง")+
    " · การเดิน: "+g.nm);
  setStatus(S.draft.tug>=12?"yellow":"green",
    "เสร็จสิ้น — ใช้เวลา "+S.draft.tug.toFixed(1)+" วินาที · "+g.nm,false);
  speak("เสร็จสิ้น บันทึกเรียบร้อยแล้ว ใช้เวลา "+Math.round(ev.elapsed)+" วินาที "+
        (ev.distanceOk?"เดินครบระยะ":"ระยะเดินอาจไม่ครบสามเมตร")+
        " ขั้นตอนต่อไป ทดสอบการทรงตัวสี่ท่า");
  toast("ลุกเดิน "+S.draft.tug.toFixed(1)+" วิ · "+g.nm);
  setTimeout(function(){ if(S.screen==="tug")go("balance") },3200);
}

async function startBalancePipeline(){
  camFullscreen();
  var video=document.getElementById("vid"),canvas=document.getElementById("cv"),ctx=canvas.getContext("2d");
  var tag=document.getElementById("tag"),coach=document.getElementById("coach"),
      secEl=document.getElementById("bsec"),swayEl=document.getElementById("bsway"),trk=document.getElementById("btrk"),
      startBtn=document.getElementById("bStart"),retryBtn=document.getElementById("bRetry");
  var stream;
  setStatus("yellow","กำลังเปิดกล้อง กรุณารอสักครู่");
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:854}},audio:false})}
  catch(e){setStatus("red","เปิดกล้องไม่ได้ — กดปุ่มหยุดเพื่อตอบด้วยตนเอง");
    coach.textContent="เปิดกล้องไม่ได้ — กดปุ่มหยุดด้านล่างเพื่อตอบเอง";return}
  S.cam=stream;video.srcObject=stream;
  await Promise.race([video.play().catch(function(){}),new Promise(function(r){setTimeout(r,1500)})]);
  setStatus("yellow","กำลังโหลดระบบตรวจจับท่าทาง",false);
  try{await loadModel(tag)}
  catch(e){setStatus("red","โหลดระบบไม่สำเร็จ — กดปุ่มหยุดเพื่อตอบด้วยตนเอง");return}

  /* phase: setup → arming → holding → between → done */
  var stage=0, phase="intro", results=[], attempts=[0,0,0,0];
  var ENG=null, t0=0, cdTimer=null;

  function chip(i,cls,txt){
    var el=document.getElementById("bc"+i); if(!el)return;
    el.className=cls||""; if(txt)el.textContent=txt;
  }
  function clearCd(){ if(cdTimer){clearInterval(cdTimer);cdTimer=null} }

  function announce(retry){
    var st=BAL_STAGES[stage];
    phase="setup"; ENG=new BalanceEngine(stage);
    secEl.textContent=BAL_SECONDS; trk.style.width="0%"; swayEl.textContent="—";
    startBtn.hidden=false; startBtn.disabled=false;
    startBtn.textContent="เริ่มท่าที่ "+(stage+1)+" เอง (ไม่ต้องรอกล้อง)";
    retryBtn.hidden=true;
    chip(stage,"on");
    coach.innerHTML='<b>ท่าที่ '+(stage+1)+' · '+esc(st.nm)+'</b><br>'+esc(st.how);
    setStatus("yellow","ท่าที่ "+(stage+1)+" จาก 4 — "+st.nm,false);
    speak((retry?"ลองท่านี้ใหม่อีกครั้ง ":"ต่อไป ")+"ท่าที่ "+(stage+1)+" จาก 4 ท่า "+st.nm+" "+st.how+
          " เมื่อจัดท่าเรียบร้อยแล้ว ยืนนิ่ง ๆ ระบบจะนับถอยหลังให้เอง");
  }

  function countdown(){
    if(phase!=="setup")return;
    phase="arming"; startBtn.disabled=true; startBtn.textContent="กำลังนับถอยหลัง…";
    var n=3, w={3:"สาม",2:"สอง",1:"หนึ่ง"};
    setStatus("green","เตรียมตัว "+n,false);
    coach.textContent="เตรียมตัว "+n;
    speak("พร้อมแล้ว เตรียมตัว สาม");
    clearCd();
    cdTimer=setInterval(function(){
      if(S.screen!=="balance"){clearCd();return}
      n--;
      if(n>=1){setStatus("green","เตรียมตัว "+n,false);coach.textContent="เตรียมตัว "+n;speak(w[n])}
      else{clearCd();beginHold()}
    },1000);
  }
  function beginHold(){
    phase="holding"; t0=performance.now();
    ENG.beginHold();
    attempts[stage]++;
    coach.innerHTML='<b>'+esc(BAL_STAGES[stage].nm)+'</b> — ยืนนิ่ง ๆ อย่าขยับเท้า';
    setStatus("green","เริ่ม — ยืนนิ่ง 10 วินาที ลืมตาไว้",false);
    speak("เริ่ม ยืนนิ่ง ๆ สิบวินาที");
  }

  function endStage(held,reason){
    if(phase!=="holding")return;
    phase="between"; clearCd();
    var ok=held>=BAL_SECONDS-0.3;
    results[stage]={held:Math.round(held*10)/10, sway:ENG.finalSway(),
                    stage:BAL_STAGES[stage].nm, attempts:attempts[stage], reason:reason||null};
    chip(stage, ok?"ok":"bad");
    startBtn.hidden=true;

    if(ok){
      setStatus("green","ท่าที่ "+(stage+1)+" ผ่าน — บันทึกเรียบร้อยแล้ว",false);
      coach.innerHTML='<b>ท่าที่ '+(stage+1)+' ผ่าน</b> — บันทึกเรียบร้อยแล้ว';
      speak("ครบสิบวินาที ท่าที่ "+(stage+1)+" ผ่าน บันทึกเรียบร้อยแล้ว");
      stage++;
      if(stage>=BAL_STAGES.length){setTimeout(function(){finishAll("ทำครบทุกท่า")},2600);return}
      setTimeout(function(){ if(S.screen==="balance")announce(false) },2600);
      return;
    }
    setStatus("yellow","ท่าที่ "+(stage+1)+" ยืนได้ "+held.toFixed(1)+" วินาที",false);
    coach.innerHTML='<b>ยืนได้ '+held.toFixed(1)+' วินาที</b> — '+esc(reason||"ยังไม่ครบ 10 วินาที");
    speak("ยืนได้ "+held.toFixed(0)+" วินาที ยังไม่ครบสิบวินาที ถ้าคิดว่าทำได้ กดปุ่มทำท่านี้ใหม่ หรือรอสักครู่ระบบจะสรุปผลให้");
    if(attempts[stage]<2){
      retryBtn.hidden=false;
      var wait=setTimeout(function(){ if(phase==="between")doFinishFail() },12000);
      retryBtn.onclick=function(){clearTimeout(wait);retryBtn.hidden=true;announce(true)};
    }else{
      setTimeout(doFinishFail,2600);
    }
    function doFinishFail(){
      for(var i=stage+1;i<BAL_STAGES.length;i++)chip(i,"",""+(i+1)+" ไม่ได้ทำ");
      finishAll("หยุดที่ท่าที่ "+(stage+1)+" เพราะยืนไม่ครบ 10 วินาที");
    }
  }

  function finishAll(reason){
    phase="done"; clearCd();
    var passed=0;
    results.forEach(function(r){ if(r&&r.held>=BAL_SECONDS-0.3)passed++ });
    var sc=balanceScore(passed);
    S.draft.balStages=results;
    S.draft.balPassed=passed;
    S.draft.balScoreHint=sc.score;
    S.draft.balLabel=sc.nm;
    var lastOk=results.filter(function(r){return r&&r.sway!=null}).pop();
    S.draft.swayValue=lastOk?lastOk.sway:null;
    S.draft.swayHeld=results.length?(results[results.length-1]||{}).held:null;
    S.draft.swayLabel=lastOk?swayLabel(lastOk.sway).nm:null;
    stopCam();
    audit("ทดสอบการทรงตัว 4 ท่า (CDC 4-Stage Balance Test)",
      results.map(function(r,i){return r?((i+1)+"."+BAL_STAGES[i].nm+" "+r.held.toFixed(1)+" วิ"+(r.attempts>1?" (ลอง "+r.attempts+" ครั้ง)":"")):null})
             .filter(Boolean).join(" · ")+
      " · ผ่าน "+passed+"/4 ท่า · "+sc.nm+(reason?" · "+reason:""));
    setStatus(passed>=3?"green":(passed>=2?"yellow":"red"),
      "ทดสอบเสร็จสมบูรณ์ — ยืนผ่าน "+passed+" จาก 4 ท่า · "+sc.nm,false);
    coach.innerHTML='<b>ทดสอบเสร็จสมบูรณ์</b> — ยืนผ่าน '+passed+' จาก 4 ท่า';
    speak("การทดสอบการทรงตัวเสร็จสมบูรณ์ ยืนผ่าน "+passed+" จาก 4 ท่า บันทึกเรียบร้อยแล้ว ขั้นตอนต่อไป กรุณายืนยันความรู้สึกของท่านเอง");
    setTimeout(function(){ if(S.screen==="balance")go("assessQ",0) },3400);
  }

  function loop(){
    if(S.screen!=="balance")return;
    var r=null;try{r=POSE.detectForVideo(video,performance.now())}catch(e){}
    var lm=r&&r.landmarks&&r.landmarks[0]?r.landmarks[0]:null;
    drawPose(ctx,canvas,video,lm);

    if(phase==="setup"&&ENG){
      var g=ENG.frame(lm);
      if(!g.seen)setStatus("yellow","ถอยให้กล้องเห็นทั้งตัว",false);
      else if(g.ready){countdown();RAF=requestAnimationFrame(loop);return}
      else setStatus("yellow","ยืนนิ่ง ๆ ในท่า "+BAL_STAGES[stage].nm+" — ระบบกำลังจะเริ่มนับ",false);
    }
    else if(phase==="holding"&&ENG){
      var h=ENG.frame(lm);
      var el=(performance.now()-t0)/1000;
      secEl.textContent=Math.max(0,BAL_SECONDS-el).toFixed(0);
      trk.style.width=Math.min(100,el/BAL_SECONDS*100)+"%";
      if(h.sway!=null)swayEl.textContent=swayLabel(h.sway).nm;
      if(h.remind)speak(h.remind);
      if(h.fail){endStage(Math.min(el,BAL_SECONDS),h.why);return}
      if(el>=BAL_SECONDS){endStage(BAL_SECONDS,null);return}
      if(!h.seen&&h.lost>30)coach.textContent="ขยับให้กล้องเห็นตัว…";
    }
    RAF=requestAnimationFrame(loop);
  }
  loop();

  startBtn.addEventListener("click",function(){ if(phase==="setup")countdown(); });

  phase="intro";
  setStatus("yellow","ยืนห่างกล้อง 2–3 เมตร ให้เห็นทั้งตัว",false);
  coach.textContent="ยืนห่างกล้อง 2–3 เมตร ให้เห็นตั้งแต่ศีรษะถึงเท้า";
  speak("การทดสอบการทรงตัวมีสี่ท่า ท่าละสิบวินาที ลืมตาตลอด ไม่ต้องจับสิ่งใด "+
        "ยืนห่างจากกล้องประมาณสองถึงสามเมตร ให้เห็นทั้งตัว หันหน้าหรือหันข้างก็ได้");
  setTimeout(function(){ if(S.screen==="balance")announce(false) },6000);
}

   - บัญชีที่เชื่อมระบบกลางแล้ว: ข้อมูลอยู่บนเซิร์ฟเวอร์ ออกได้ปลอดภัย
     ล้างสำเนาในเครื่องทิ้งเพื่อไม่ให้คนถัดไปที่ใช้เครื่องนี้เห็นข้อมูล

     ออกจากระบบ = ลบทิ้งถาวร จึงต้องเตือนตรง ๆ ก่อน ไม่ใช่ปล่อยให้
     กดแล้วข้อมูลหายโดยไม่รู้ตัว

function logoutFlow(){
  var cloud = (typeof CLOUD!=="undefined" && CLOUD.session);
  dialog({
    title: cloud ? "ออกจากระบบ" : "ออกจากระบบ (บัญชีออฟไลน์)",
    body: cloud
      ? "ข้อมูลของท่าน<b>ยังอยู่บนระบบกลาง</b> เข้าใหม่ด้วยเบอร์โทรและรหัส 4 หลักได้ทุกเมื่อ<br><br>ระบบจะล้างสำเนาข้อมูลในเครื่องนี้ เพื่อไม่ให้คนถัดไปที่ใช้เครื่องนี้เห็นข้อมูลของท่าน"
      : "บัญชีนี้<b>ไม่ได้เชื่อมกับระบบกลาง</b> ข้อมูลทั้งหมดอยู่ในเครื่องนี้ที่เดียว<br><br><b style=\"color:var(--c1)\">หากออกจากระบบตอนนี้ ผลตรวจทั้งหมดจะหายถาวร กู้คืนไม่ได้</b><br><br>หากต้องการเก็บข้อมูลไว้ ให้กดยกเลิก แล้วสมัครใหม่พร้อมกรอกเบอร์โทรเพื่อเชื่อมระบบกลางก่อน",
    ok: cloud ? "ออกจากระบบ" : "ออกจากระบบ และลบข้อมูลในเครื่อง",
    cancel: "ยกเลิก · ใช้งานต่อ",
    danger: !cloud,
    onOk: async function(){
      audit("ออกจากระบบ", cloud ? "ผู้ใช้ออกจากระบบ · ข้อมูลยังอยู่บนระบบกลาง"
                                : "ผู้ใช้ออกจากระบบบัญชีออฟไลน์ · ข้อมูลในเครื่องถูกลบ");
      if(cloud){ try{ await CSBackend.signOut() }catch(e){} }
      if(typeof CLOUD!=="undefined"){ CLOUD.session=false; }
      try{ clearFaceSig() }catch(e){}
      try{ await DB.del("careSignalData") }catch(e){}
      S.data=blankData(); S.draft={};
      stopCam();
      toast(cloud ? "ออกจากระบบแล้ว" : "ออกจากระบบและลบข้อมูลในเครื่องแล้ว");
      go("welcome");
    }
  });
}
/* ปุ่มออกจากระบบ ใช้ซ้ำได้ทุกหน้า */
function logoutBtnHTML(){
  return '<button class="ghostb" id="csLogout" style="margin-top:6px">ออกจากระบบ</button>';
}
function bindLogoutBtn(){
  var b=document.getElementById("csLogout");
  if(b)b.addEventListener("click",logoutFlow);
}

/* ---------- ติดตั้งเป็นแอปบนมือถือ (Add to Home Screen) ---------- */
(function(){
  var BOTTOM="92px";
  if(matchMedia("(display-mode: standalone)").matches||navigator.standalone)return;
  try{if(localStorage.getItem("csA2HS")==="no")return}catch(e){}
  var defer=null, isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  function show(){
    if(document.getElementById("csA2HS"))return;
    var b=document.createElement("div");
    b.id="csA2HS";
    b.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc("+BOTTOM+" + env(safe-area-inset-bottom));z-index:998;display:flex;gap:10px;align-items:center;background:#0F1B33;color:#fff;border-radius:99px;padding:9px 10px 9px 18px;font-size:14px;font-family:inherit;box-shadow:0 12px 32px rgba(15,27,51,.4);max-width:92vw";
    b.innerHTML='<span>📲 ติดตั้งเป็นแอป ใช้ได้แม้ไม่มีเน็ต</span>'+
      '<button id="csA2HSgo" style="border:0;border-radius:99px;padding:9px 16px;font-size:14px;font-weight:600;font-family:inherit;background:#2563EB;color:#fff;cursor:pointer">ติดตั้ง</button>'+
      '<button id="csA2HSx" aria-label="ปิด" style="border:0;background:transparent;color:#93A1B7;font-size:16px;cursor:pointer;padding:6px">✕</button>';
    document.body.appendChild(b);
    document.getElementById("csA2HSx").addEventListener("click",function(){b.remove();try{localStorage.setItem("csA2HS","no")}catch(e){}});
    document.getElementById("csA2HSgo").addEventListener("click",function(){
      if(defer){defer.prompt();defer.userChoice.then(function(){b.remove()});defer=null;return}
      var o=document.createElement("div");
      o.style.cssText="position:fixed;inset:0;background:rgba(15,27,51,.55);z-index:999;display:flex;align-items:flex-end;justify-content:center;padding:22px";
      o.innerHTML='<div style="background:#fff;border-radius:22px;padding:24px;max-width:420px;width:100%;color:#16233B">'+
        '<h3 style="margin:0 0 10px;font-size:19px">ติดตั้งบน iPhone / iPad</h3>'+
        '<p style="margin:0 0 6px;font-size:15.5px;line-height:1.8;color:#5B6B84">1. แตะปุ่ม <b>แชร์</b> (สี่เหลี่ยมมีลูกศรขึ้น) ในแถบล่างของ Safari<br>2. เลื่อนหา <b>“เพิ่มลงหน้าจอโฮม”</b><br>3. แตะ <b>เพิ่ม</b> — ไอคอน CareSignal จะอยู่บนหน้าจอเหมือนแอปทั่วไป</p>'+
        '<button style="display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;font-family:inherit;background:#2563EB;color:#fff;margin-top:12px;cursor:pointer">เข้าใจแล้ว</button></div>';
      document.body.appendChild(o);
      o.querySelector("button").addEventListener("click",function(){o.remove()});
      o.addEventListener("click",function(e){if(e.target===o)o.remove()});
    });
  }
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();defer=e;show()});
  window.addEventListener("appinstalled",function(){var b=document.getElementById("csA2HS");if(b)b.remove()});
  if(isIOS)setTimeout(show,2500);
})();

/* PWA: ลงทะเบียน Service Worker — ใช้ออฟไลน์ได้หลังเปิดครั้งแรก + แจ้งเมื่อมีเวอร์ชันใหม่ */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("./sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){
      var nw=reg.installing; if(!nw)return;
      nw.addEventListener("statechange",function(){
        if(nw.state==="installed"&&navigator.serviceWorker.controller){
          nw.postMessage("SKIP_WAITING");
          if(typeof toast==="function")toast("อัปเดตเป็นเวอร์ชันใหม่แล้ว — มีผลเมื่อเปิดครั้งถัดไป");
        }
      });
    });
  }).catch(function(){});
}
