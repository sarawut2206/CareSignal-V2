<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563EB">
<title>CareSignal — แอปประเมินและประกันดูแลระยะยาว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6FB; --surf:#FFF; --surf2:#EAF0FE;
  --ink:#16233B; --ink2:#5B6B84; --ink3:#93A1B7;
  --line:#DFE7F2; --line2:#EDF2FA; --brand:#2563EB; --brand2:#1D4ED8;
  --accent:#F59E0B; --accent2:#B45309; --accentb:#FEF3C7;
  --c4:#0E9F6E; --c3:#C79200; --c2:#D97706; --c1:#DC2626;
  --c4b:#E3F6EF; --c3b:#FEF6DE; --c2b:#FDECD8; --c1b:#FEE9E9;
  --sans:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  --loop:"IBM Plex Sans Thai Looped","Prompt",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sh:0 1px 2px rgba(22,35,59,.04),0 6px 18px rgba(22,35,59,.05);
  --shx:0 2px 6px rgba(22,35,59,.07),0 18px 44px rgba(22,35,59,.11);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#D9DEE2;font-family:var(--sans);color:var(--ink);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:404px;height:860px;max-height:100vh;background:var(--bg);border-radius:42px;overflow:hidden;box-shadow:0 30px 80px rgba(22,35,59,.3);display:flex;flex-direction:column}
@media(max-width:470px),(max-height:720px){body{display:block;background:var(--bg)}.phone{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none}}
.bar .brandrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar .brandrow svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.bar{flex:none;background:linear-gradient(135deg,var(--brand2),var(--brand) 62%,#3B82F6);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 20px 16px;position:relative}
.bar .kick{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#FCD34D;opacity:.95}
.bar h1{margin:3px 0 0;font-size:23px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.bar p{margin:6px 0 0;font-size:14px;opacity:.78;line-height:1.6}
.backb{background:none;border:0;color:#fff;font:inherit;font-size:14px;padding:0;margin-bottom:8px;opacity:.75;cursor:pointer}
.dbchip{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:16px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:rgba(245,158,11,.22);color:#FDE68A;padding:4px 9px;border-radius:99px}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 26px;-webkit-overflow-scrolling:touch}
.anim{animation:rise .32s cubic-bezier(.25,.9,.35,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.anim{animation:none}}
.tabs{flex:none;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:none;cursor:pointer;font-family:var(--sans);padding:11px 2px 13px;color:var(--ink3);font-size:12.5px;line-height:1.3;transition:color .18s;min-height:64px}
.tab svg{display:block;margin:0 auto 5px;width:27px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab b{display:block;font-weight:600;font-size:12.5px}
.tab[aria-selected="true"]{color:var(--brand)}
/* กล้อง — องค์ประกอบหลักของหน้าจอนี้ */
.stage{position:relative;border-radius:22px;overflow:hidden;background:#0B1220;aspect-ratio:3/4;margin-bottom:12px;box-shadow:var(--shx)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video{transform:scaleX(-1)}
.stage canvas{transform:scaleX(-1);pointer-events:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.hudtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hudtag{background:rgba(11,18,32,.62);backdrop-filter:blur(8px);color:#fff;font-size:11.5px;padding:6px 11px;border-radius:99px;line-height:1.4}
.hudtag b{color:#FCD34D}
.hudbot{background:rgba(11,18,32,.68);backdrop-filter:blur(10px);border-radius:16px;padding:12px 14px;color:#fff}
.counter{display:flex;align-items:baseline;gap:10px}
.counter .n{font-family:var(--mono);font-size:38px;font-weight:600;line-height:1;letter-spacing:-.03em}
.counter .of{font-size:14px;color:rgba(255,255,255,.6)}
.counter .clock{margin-left:auto;font-family:var(--mono);font-size:22px;font-weight:600;color:#FCD34D}
.track{height:6px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:#FCD34D;border-radius:99px;transition:width .12s linear}
.coach{margin-top:9px;font-size:12.5px;color:rgba(255,255,255,.85);line-height:1.5;min-height:19px}
.statebadge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.16);padding:3px 8px;border-radius:99px;margin-left:8px}


.acc{background:var(--surf);border-radius:20px;margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:20px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:12px;min-height:64px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"⌄";margin-left:auto;font-size:26px;line-height:1;color:var(--ink3);transition:transform .2s}
.acc[open]>summary::after{transform:rotate(180deg)}
.acc>summary .sm{display:block;font-size:14px;font-weight:400;color:var(--ink2);margin-top:3px}
.acc .accin{padding:0 20px 20px}
.bigrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line2)}
.bigrow:first-of-type{border-top:0}
.bigrow .ic{width:44px;height:44px;flex:none;border-radius:14px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:22px}
.bigrow .tx{flex:1;min-width:0}
.bigrow .tx b{display:block;font-size:16.5px;font-weight:600;line-height:1.4}
.bigrow .tx span{display:block;font-size:14px;color:var(--ink2);line-height:1.5;margin-top:2px}
.card{background:var(--surf);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:var(--sh)}
.card h2{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.card h3{margin:0 0 12px;font-size:17px;font-weight:600}
.sub{margin:0 0 14px;font-size:15px;color:var(--ink2);line-height:1.75}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.hero{background:var(--brand);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px;box-shadow:var(--shx)}
.hero .eyebrow{color:rgba(255,255,255,.45)}
.hero .score{font-family:var(--mono);font-size:48px;font-weight:600;line-height:1;letter-spacing:-.03em}
.hero .of{font-size:15px;opacity:.45;font-family:var(--mono)}
.hero .state{margin-top:10px;display:inline-block;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:99px;color:#fff}
.hero .note{margin:14px 0 0;font-size:12.5px;opacity:.72;line-height:1.6}
.senior{font-family:var(--loop)}
.senior .qtext{font-size:21px;font-weight:600;line-height:1.5;margin:0 0 6px;letter-spacing:-.01em}
.senior .qhelp{font-size:15px;color:var(--ink2);line-height:1.65;margin:0 0 18px}
.pick{display:block;width:100%;text-align:left;font-family:var(--loop);font-size:17px;padding:16px 19px;margin-bottom:10px;border:2px solid var(--line);border-radius:16px;background:var(--surf);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.pick:active{transform:scale(.985)}
.pick[aria-pressed="true"]{border-color:var(--brand);background:var(--surf2);color:var(--brand2);font-weight:600}
.cta{display:block;width:100%;border:0;border-radius:18px;background:var(--brand);color:#fff;font-family:var(--loop);font-size:20px;font-weight:600;padding:20px;min-height:64px;cursor:pointer;transition:transform .1s}
.cta:active{transform:scale(.99)}
.cta.loop{font-family:var(--loop);font-size:18px;padding:18px}
.cta.go{background:var(--c4)}
.cta.stop{background:var(--c2)}
.cta[disabled]{opacity:.45;cursor:default}
.ghostb{display:block;width:100%;border:2px solid var(--line);border-radius:16px;background:var(--surf);color:var(--ink);font-family:var(--sans);font-size:17px;font-weight:500;padding:17px;margin-top:10px;cursor:pointer;min-height:58px}
.clock{font-family:var(--mono);font-size:56px;font-weight:600;text-align:center;letter-spacing:-.04em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.clock small{font-size:18px;opacity:.4;font-weight:500}
.hint{text-align:center;font-size:13.5px;color:var(--ink2);margin:0 0 16px;line-height:1.6}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input,.field select{width:100%;font-family:var(--loop);font-size:17px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-color:var(--brand)}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-family:var(--loop);font-size:16px;padding:13px;border:2px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--surf2);color:var(--brand2);font-weight:600}
.rowline{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:14px 0;border-top:1px solid var(--line2);font-size:16px}
.rowline:first-of-type{border-top:0}
.rowline .k{color:var(--ink2)}
.rowline .v{font-family:var(--mono);font-weight:600;color:var(--accent2)}
.tierpill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px}
.t4{background:var(--c4b);color:var(--c4)}.t3{background:var(--c3b);color:var(--c3)}.t2{background:var(--c2b);color:var(--c2)}.t1{background:var(--c1b);color:var(--c1)}
.hrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.hrow:first-child{border-top:0}
.hrow .dt{font-family:var(--mono);font-size:11px;color:var(--ink3);width:74px;flex:none;line-height:1.4}
.hrow .sc{font-family:var(--mono);font-size:19px;font-weight:600;width:44px;flex:none}
.trend{display:flex;align-items:flex-end;gap:5px;height:64px;margin:14px 0 4px}
.trend .b{flex:1;border-radius:5px 5px 0 0;min-height:6px;position:relative}
.trend .b span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.planbox{border:2px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
.planbox[aria-pressed="true"]{border-color:var(--brand);background:var(--surf2)}
.planbox .nm{font-weight:600;font-size:15px}
.planbox .bn{font-size:12.5px;color:var(--ink2);margin-top:2px}
.planbox .pr{float:right;font-family:var(--mono);font-weight:600;font-size:16px}
.bignum{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em}
.toast{position:absolute;left:20px;right:20px;bottom:88px;background:var(--ink);color:#fff;font-size:13.5px;padding:13px 17px;border-radius:14px;box-shadow:var(--shx);opacity:0;transform:translateY(8px);transition:.28s;pointer-events:none;z-index:50;line-height:1.5}
.toast.on{opacity:1;transform:none}
.warncard{border-radius:20px;padding:18px;margin-bottom:12px;border:1px solid var(--line);background:var(--surf);box-shadow:var(--sh)}
.warncard .lvl{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;color:#fff}
.warncard h3{margin:12px 0 8px;font-size:16.5px;letter-spacing:-.01em}
.evi{border-left:3px solid var(--accent);background:var(--accentb);border-radius:0 12px 12px 0;padding:10px 13px;margin:8px 0;font-size:13.5px;line-height:1.6}
.evi .why{display:block;color:var(--ink2);font-size:12px;margin-top:4px}
.evi .rid{font-family:var(--mono);font-size:10px;color:var(--accent2);letter-spacing:.08em}
.disc{background:var(--line2);border-radius:12px;padding:10px 13px;font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:12px}
.pitem{border-top:1px solid var(--line2);padding:13px 0}
.pitem:first-of-type{border-top:0}
.pitem b{display:block;font-size:14.5px;margin-bottom:3px}
.pitem .hw{font-size:13px;color:var(--ink2);line-height:1.6}
.pitem .rs{display:inline-block;font-size:11.5px;color:var(--accent2);background:var(--accentb);border-radius:8px;padding:3px 9px;margin-top:6px}
.pitem .sc{display:block;font-size:11px;color:var(--ink3);margin-top:5px}
.logline{font-family:var(--mono);font-size:11px;border-top:1px solid var(--line2);padding:8px 0;color:var(--ink2);line-height:1.55}
.logline b{color:var(--ink);font-weight:600}
.chk{display:flex;gap:11px;align-items:flex-start;background:var(--surf2);border-radius:14px;padding:13px;cursor:pointer;font-size:13px;line-height:1.6}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--brand)}
.notice{background:var(--accentb);border:1px solid rgba(245,158,11,.35);border-radius:14px;padding:12px 15px;font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:12px}
.danger{color:var(--c1)}
:focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>
<div class="phone">
  <header class="bar" id="bar">
    <span class="dbchip" id="dbchip">DB · –</span>
    <div id="barIn"></div>
  </header>
  <main class="scroll" id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg><b>หน้าแรก</b></button>
    <button class="tab" data-go="assessIntro"><svg viewBox="0 0 24 24"><path d="M12 21c-1 0-8-4.5-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 11c0 5.5-7 10-8 10z"/></svg><b>ตรวจร่างกาย</b></button>
    <button class="tab" data-go="policy"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><b>ประกันของฉัน</b></button>
    <button class="tab" data-go="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg><b>ตั้งค่า</b></button>
  </nav>
  <div class="toast" id="toast"></div>
</div>

<script>
var LOGO='<svg width="30" height="30" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="flex:none"><defs><linearGradient id="lgAg" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1D4ED8"/><stop offset=".55" stop-color="#2563EB"/><stop offset="1" stop-color="#38BDF8"/></linearGradient><linearGradient id="lgAa" x1="42" y1="8" x2="58" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#B45309"/></linearGradient></defs><path d="M32 5C24.5 10 16.5 12.4 10 12.6V33c0 14 10 22.6 22 27 12-4.4 22-13 22-27V12.6C47.5 12.4 39.5 10 32 5Z" stroke="url(#lgAg)" stroke-width="4" stroke-linejoin="round"/><path d="M32 27.5c-2.6-4.2-8.4-5.6-11.6-1.9-3 3.5-1.5 9 3.1 13.1L32 46l8.5-7.3c4.6-4.1 6.1-9.6 3.1-13.1-3.2-3.7-9-2.3-11.6 1.9Z" stroke="url(#lgAg)" stroke-width="3.6" stroke-linejoin="round"/><path d="M17 35h7.5l3-6.5 4.5 11 3-4.5H47" stroke="url(#lgAg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M46.5 9.5a13.5 13.5 0 0 1 8.6 8.4" stroke="url(#lgAa)" stroke-width="3.6" stroke-linecap="round"/><path d="M44.5 15.2a7.5 7.5 0 0 1 4.9 4.7" stroke="url(#lgAa)" stroke-width="3.4" stroke-linecap="round"/><circle cx="42.6" cy="21.2" r="2.6" fill="url(#lgAa)"/></svg>';

/* ============================================================
   ฐานข้อมูล — Storage adapter 3 ชั้น
   1) window.storage (Claude artifact persistent storage)
   2) localStorage (เมื่อ deploy บนเว็บเซิร์ฟเวอร์จริง)
   3) หน่วยความจำชั่วคราว (fallback สุดท้าย)
   โครงนี้ออกแบบให้สลับเป็น REST API ของ backend จริงได้ทันที
   ============================================================ */
var MEM={};
var DB={
  mode:"memory",
  async get(k){
    if(window.storage){try{var r=await window.storage.get(k);this.mode="cloud";return r?JSON.parse(r.value):null}catch(e){this.mode="cloud";return null}}
    try{var v=localStorage.getItem("cs:"+k);this.mode="local";return v?JSON.parse(v):null}catch(e){this.mode="memory";return MEM[k]||null}
  },
  async set(k,val){
    var s=JSON.stringify(val);
    if(window.storage){try{await window.storage.set(k,s);this.mode="cloud";return true}catch(e){}}
    try{localStorage.setItem("cs:"+k,s);this.mode="local";return true}catch(e){MEM[k]=val;this.mode="memory";return true}
  },
  async setShared(k,val){ /* ข้อมูลสรุปนิรนาม แชร์ให้แดชบอร์ด Care Manager / บริษัทประกัน */
    if(window.storage){try{await window.storage.set(k,JSON.stringify(val),true);return true}catch(e){}}
    try{localStorage.setItem("csShared:"+k,JSON.stringify(val));return true}catch(e){return false}
  },
  async del(k){
    if(window.storage){try{await window.storage.delete(k)}catch(e){}}
    try{localStorage.removeItem("cs:"+k)}catch(e){}
    delete MEM[k];
  }
};
function dbLabel(){var m=DB.mode;return "DB · "+(m==="cloud"?"CLOUD":(m==="local"?"LOCAL":"TEMP"))}

/* ============================================================
   ค่ากลางของระบบ — ใช้ชุดเดียวกับเว็บไซต์และโมเดลผู้ประกอบการ
   ============================================================ */
var CFG={
  ftsstCut:function(age){return age<60?10.0:(age<70?11.5:12.1);}, /* วินาที — เกณฑ์งานวิจัยไทย */
  plans:[
    {id:"s", nm:"เริ่มต้น",  benefit:10000, prev:3000,  base:590},
    {id:"m", nm:"มาตรฐาน", benefit:15000, prev:5000,  base:890, pop:true},
    {id:"l", nm:"พรีเมียม", benefit:25000, prev:8000,  base:1490},
    {id:"xl",nm:"สูงสุด",   benefit:40000, prev:12000, base:2290}
  ],
  ageMult:function(a){return a<55?1.00:(a<60?1.35:(a<66?1.80:2.30));},
  ageBand:function(a){return a<55?"50–54":(a<60?"55–59":(a<66?"60–65":"66–70"));},
  sexMult:{f:1.10,m:1.00},
  discount:{4:.15,3:.08,2:0,1:0}, /* หลักการ: ผลประเมิน "ลด" เบี้ยได้เท่านั้น ไม่มีบวก ไม่มีปฏิเสธ */
  yearlyOff:.08,

   คำนวณเบี้ย — ตรรกะเดียวกับเว็บและโมเดลผู้ประกอบการ
   ============================================================ */
function premiumFor(planId,age,sex,tier,pay){
  var p=CFG.plans.find(function(x){return x.id===planId});
  var gross=p.base*CFG.ageMult(age)*CFG.sexMult[sex];
  var d=tier?CFG.discount[tier]:0;
  var net=gross*(1-d);
  var loy=loyaltyBaht(planId);
  net=Math.max(net-loy, gross*0.75);   /* เพดานรวมส่วนลดไม่เกิน 25% เพื่อคุมต้นทุน */
  if(pay==="y"){net=net*12*(1-CFG.yearlyOff)}
  return {plan:p, gross:Math.round(gross), net:Math.round(net), disc:d, loyalty:loy};
}

/* ============================================================
   ส่วนลดต่อเนื่อง + ระยะรอคอยที่ลดได้จากการมีข้อมูลต่อเนื่อง
   ------------------------------------------------------------
   หลักการที่ยืมมาจากตลาด: ประกาศส่วนลดเป็น "บาทต่อรอบ" ไม่ใช่ % ของเบี้ย
   บริษัทจึงคำนวณเพดานต้นทุนล่วงหน้าได้แน่นอน และผู้ใช้เข้าใจทันทีว่าประหยัดกี่บาท
   ============================================================ */
function loyaltyPoints(){
  var A=S.data.assessments||[], now=Date.now(), pts=0, detail=[];
  var in90=A.filter(function(x){return (now-new Date(x.at))/864e5<=90});
  if(in90.length>=1){pts+=2;detail.push(["ตรวจร่างกายใน 3 เดือนที่ผ่านมา","+2"])}
  else detail.push(["ตรวจร่างกายใน 3 เดือนที่ผ่านมา","0"]);
  if(in90.length>=2){pts+=1;detail.push(["ตรวจซ้ำอีกครั้งเพื่อยืนยัน","+1"])}
  else detail.push(["ตรวจซ้ำอีกครั้งเพื่อยืนยัน","0"]);
  var last=A[A.length-1];
  if(last&&last.tier>=3){pts+=1;detail.push(["ผลตรวจอยู่ในเกณฑ์ดี","+1"])}
  else detail.push(["ผลตรวจอยู่ในเกณฑ์ดี","0"]);
  if(A.length>=4){pts+=1;detail.push(["ตรวจมาแล้วอย่างน้อย 4 ครั้ง","+1"])}
  else detail.push(["ตรวจมาแล้วอย่างน้อย 4 ครั้ง","0"]);
  return {pts:pts, need:CFG.loyaltyNeed, ok:pts>=CFG.loyaltyNeed, detail:detail};
}
function loyaltyBaht(planId){
  var L=loyaltyPoints();
  return L.ok ? (CFG.loyalty[planId]||0) : 0;
}
/* ระยะรอคอยกลุ่มเรื้อรังที่เหลือ — ยิ่งมีข้อมูลต่อเนื่อง ยิ่งสั้นลง */
function chronicWait(){
  var n=(S.data.assessments||[]).length;
  var cut=Math.min(n*CFG.terms.chronicCutPerAssess, CFG.terms.chronicCutMax);
  return {days:CFG.terms.waitChronic-cut, cut:cut, n:n};
}

/* ============================================================
   ชั้นวิเคราะห์ท่าทาง — ประมวลผลบนเครื่อง ไม่ส่งภาพออกจากอุปกรณ์
   ------------------------------------------------------------
   ตัวชี้วัดหลัก: ตำแหน่งสะโพกเทียบสัดส่วนลำตัว
     M = (ระยะข้อเท้า−สะโพก) ÷ (ระยะข้อเท้า−ไหล่)
   เลือกอัตราส่วนแทนพิกัดดิบ เพราะไม่ขึ้นกับระยะห่างจากกล้อง
   ส่วนสูงของผู้ใช้ หรือการวางมือถือสูงต่ำ
   ============================================================ */
var LM={LSH:11,RSH:12,LHIP:23,RHIP:24,LKNEE:25,RKNEE:26,LANK:27,RANK:28};

function midY(lm,a,b){return (lm[a].y+lm[b].y)/2}
function visOK(lm){
  var need=[LM.LSH,LM.RSH,LM.LHIP,LM.RHIP,LM.LKNEE,LM.RKNEE,LM.LANK,LM.RANK];
  var seen=0;
  for(var i=0;i<need.length;i++){var v=lm[need[i]];if(v&&(v.visibility===undefined||v.visibility>0.5))seen++}
  return seen/need.length;
}
function hipRatio(lm){
  var sh=midY(lm,LM.LSH,LM.RSH), hip=midY(lm,LM.LHIP,LM.RHIP), ank=midY(lm,LM.LANK,LM.RANK);
  var span=ank-sh;
  if(!isFinite(span)||Math.abs(span)<0.02)return null;
  return (ank-hip)/span;
}
function kneeAngle(lm){
  function ang(h,k,a){
    var v1={x:lm[h].x-lm[k].x,y:lm[h].y-lm[k].y}, v2={x:lm[a].x-lm[k].x,y:lm[a].y-lm[k].y};
    var d=v1.x*v2.x+v1.y*v2.y, m=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y);
    if(!m)return null;
    return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI;
  }
  var l=ang(LM.LHIP,LM.LKNEE,LM.LANK), r=ang(LM.RHIP,LM.RKNEE,LM.RANK);
  if(l==null&&r==null)return null;
  if(l==null)return r; if(r==null)return l;
  return (l+r)/2;
}

/* ---- ตัวนับจำนวนครั้ง: เครื่องสถานะพร้อม hysteresis กันการนับซ้ำจากการสั่น ---- */
function RepDetector(opts){
  opts=opts||{};
  this.sitRef=null; this.standRef=null;
  this.state="idle"; this.reps=0; this.stamps=[]; this.t0=null; this.done=false;
  this.target=opts.target||5;
  this.upFrac=opts.upFrac!==undefined?opts.upFrac:0.68;
  this.downFrac=opts.downFrac!==undefined?opts.downFrac:0.36;
  this.buf=[]; this.smoothN=opts.smoothN||5;
}
RepDetector.prototype.smooth=function(v){
  this.buf.push(v); if(this.buf.length>this.smoothN)this.buf.shift();
  var s=0; for(var i=0;i<this.buf.length;i++)s+=this.buf[i];
  return s/this.buf.length;
};
RepDetector.prototype.setRefs=function(sit,stand){this.sitRef=sit;this.standRef=stand};
RepDetector.prototype.start=function(t){this.state="sit";this.reps=0;this.stamps=[];this.t0=t;this.done=false;this.buf=[]};
RepDetector.prototype.thresholds=function(){
  var range=this.standRef-this.sitRef;
  return {up:this.sitRef+range*this.upFrac, down:this.sitRef+range*this.downFrac, range:range};
};
RepDetector.prototype.push=function(raw,t){
  if(this.done||this.state==="idle"||this.sitRef==null||this.standRef==null)return null;
  var v=this.smooth(raw), th=this.thresholds();
  if(this.state==="sit"&&v>=th.up){
    this.state="stand"; this.reps++; this.stamps.push(t);
    if(this.reps>=this.target){this.done=true;return{event:"finish",reps:this.reps,elapsed:(t-this.t0)/1000}}
    return {event:"rep",reps:this.reps};
  }
  if(this.state==="stand"&&v<=th.down){this.state="sit";return{event:"down",reps:this.reps}}
  return null;
};


/* ============================================================
   คะแนนประเมิน (ย่อจาก SPPB + FRAT ให้ทำเองที่บ้านได้)
   ============================================================ */
function scoreDraft(dr,age){
  var s=0, parts={};
  /* 1) ลุกนั่ง 5 ครั้ง (FTSST) — 0-4 คะแนน */
  var cut=CFG.ftsstCut(age);
  var f=dr.ftsst;
  var pf = f==null?0 : f<=cut?4 : f<=cut+2?3 : f<=cut+4.5?2 : f<=60?1:0;
  parts.ftsst=pf; s+=pf;
  /* 2) ยืนทรงตัว — 0-3 */
  parts.balance=dr.balance||0; s+=parts.balance;
  /* 3) ประวัติหกล้ม 12 เดือน — 0-2 (ไม่ล้ม=2) */
  parts.falls=dr.falls==null?0:dr.falls; s+=parts.falls;
  /* 4) การใช้ยา ≥4 ชนิด — 0-1 */
  parts.meds=dr.meds==null?0:dr.meds; s+=parts.meds;
  /* 5) ทำกิจวัตรเองได้ (ADL อย่างย่อ) — 0-2 */
  parts.adl=dr.adl==null?0:dr.adl; s+=parts.adl;
  var max=12;
  var tier = s>=10?4 : s>=8?3 : s>=5?2 : 1;
  return {score:s, max:max, tier:tier, parts:parts};
}


/* ============================================================
   CareSignal Decision Engine v1.2 — Explainable Rule-Based
   ------------------------------------------------------------
   ประกาศตามหลัก Responsible AI:
   ระบบนี้เป็น "ระบบสนับสนุนการตัดสินใจแบบกฎที่อธิบายได้"
   (Explainable Rule-Based Clinical Decision Support)
   ไม่ใช่แบบจำลอง machine learning และไม่ใช่การวินิจฉัยทางการแพทย์
   กฎทุกข้อ derive จากวรรณกรรมที่อ้างอิงได้ และแสดงเหตุผลทุกครั้งที่ทำงาน
   ชั้น ML จะเปิดใช้เมื่อมีข้อมูลนำร่องครบเกณฑ์และผ่านการ validate เท่านั้น
   ============================================================ */
var ENGINE={
  version:"1.2.0",
  kind:"rule-based-explainable",
  rules:{
    R1:{nm:"เวลาลุกนั่งช้าลงอย่างมีนัยสำคัญ", src:"MCID ของ Five-Times Sit-to-Stand ในผู้สูงอายุ ≈ 2.3 วินาที (Meretta 2006; Goldberg 2012)"},
    R2:{nm:"ข้ามเกณฑ์เสี่ยงตามอายุ", src:"ค่าตัดเกณฑ์ประชากรไทย 10.0/11.5/12.1 วินาที (Poncumhak 2014; Intaruk 2021)"},
    R3:{nm:"มีเหตุหกล้มใหม่", src:"การหกล้ม 1 ครั้งเพิ่มโอกาสล้มซ้ำใน 12 เดือน (WHO Falls Prevention 2021)"},
    R4:{nm:"คะแนนรวมถดถอยจากค่าดีที่สุดของตนเอง", src:"เปรียบเทียบกับ personal best แทนค่าเฉลี่ยประชากร เพื่อลดอคติระหว่างกลุ่ม"},
    R5:{nm:"ใช้ยาหลายชนิดร่วมกับการทรงตัวบกพร่อง", src:"Polypharmacy (≥4 ชนิด) ร่วมกับ balance impairment เพิ่มความเสี่ยงล้มแบบทวีคูณ (Beers Criteria; STOPPFall 2021)"},
    R6:{nm:"สูญเสียความสามารถทำกิจวัตร", src:"การลดลงของ ADL/IADL เป็นสัญญาณเริ่มต้นภาวะพึ่งพิง (Lawton IADL; Barthel Index)"},
    R9:{nm:"ลุกเดิน 3 เมตรช้ากว่าเกณฑ์", src:"เวลาที่ใช้ตั้งแต่ 12 วินาทีขึ้นไปในการทดสอบ Timed Up and Go สัมพันธ์กับความเสี่ยงหกล้มที่สูงขึ้น (Makizako 2017; Physiopedia)"},
    R8:{nm:"จังหวะการลุกไม่สม่ำเสมอ", src:"กล้องวัดเวลาแยกรายครั้งได้ ความแปรปรวนสะท้อนความล้าของกล้ามเนื้อขา (npj Digital Medicine 2023 — ค่าทางจลนศาสตร์ไวกว่าการดูเวลารวมอย่างเดียว)"},
    R7:{nm:"เกินกำหนดประเมินซ้ำ", src:"กติกาภายในระบบ ตามระดับความเสี่ยงที่คำนวณได้"}
  },
  cadence:{stable:90, watch:45, decline:21, urgent:7},
  levelNm:{stable:"คงที่", watch:"เฝ้าสังเกต", decline:"ถดถอย", urgent:"ต้องดูแลเร่งด่วน"},
  levelColor:{stable:"var(--c4)", watch:"var(--c3)", decline:"var(--c2)", urgent:"var(--c1)"}
};

function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}

/* ---- วิเคราะห์เส้นทางความเสี่ยงเฉพาะบุคคล ---- */
function trajectory(){
  var A=S.data.assessments, p=S.data.profile;
  if(!A.length) return null;
  var last=A[A.length-1], first=A[0];
  var out={n:A.length, last:last, flags:[], level:"stable", ftsstPct:null, ftsstDelta:null,
           span:daysBetween(first.at,last.at), sinceLast:daysBetween(last.at,todayISO())};

  /* baseline = ค่าที่ดีที่สุดของผู้ใช้เอง (ไม่ใช่ค่าเฉลี่ยประชากร → ลดอคติระหว่างกลุ่ม) */
  var ftsstVals=A.filter(function(x){return x.ftsst!=null});
  var bestFt = ftsstVals.length? Math.min.apply(null,ftsstVals.map(function(x){return x.ftsst})) : null;
  var bestScore = Math.max.apply(null,A.map(function(x){return x.score}));

  /* R1 — ความเร็วการเสื่อมถอยของ FTSST */
  if(last.ftsst!=null && bestFt!=null && ftsstVals.length>1 && last.ftsst>bestFt){
    var d=last.ftsst-bestFt, pct=d/bestFt*100;
    out.ftsstDelta=d; out.ftsstPct=pct;
    if(d>=2.3 || pct>=15){
      out.flags.push({id:"R1", sev:pct>=30||d>=4?2:1,
        text:"เวลาลุกนั่ง 5 ครั้งช้าลง "+pct.toFixed(0)+"% ("+bestFt.toFixed(1)+" → "+last.ftsst.toFixed(1)+" วินาที) เทียบกับผลที่ดีที่สุดของคุณเอง",
        why:"ส่วนต่าง "+d.toFixed(1)+" วินาที ถึงเกณฑ์การเปลี่ยนแปลงที่มีความหมายทางคลินิก (≥2.3 วินาที)"});
    }
  }
  /* R2 — ข้ามเกณฑ์ตามอายุ */
  if(last.ftsst!=null){
    var cut=CFG.ftsstCut(p.age);
    var prevFt=null;
    for(var i=A.length-2;i>=0;i--){if(A[i].ftsst!=null){prevFt=A[i].ftsst;break}}
    if(last.ftsst>cut && (prevFt==null || prevFt<=cut)){
      out.flags.push({id:"R2", sev:2,
        text:"เวลาลุกนั่งขึ้นเป็น "+last.ftsst.toFixed(1)+" วินาที สูงกว่าเกณฑ์ของช่วงอายุ "+CFG.ageBand(p.age)+" ปี ("+cut.toFixed(1)+" วินาที)",
        why:"เป็นการข้ามค่าตัดเกณฑ์ครั้งแรก จึงถือเป็นสัญญาณเปลี่ยนสถานะ ไม่ใช่ความผันผวนปกติ"});
    }
  }
  /* R3 — เหตุหกล้มใหม่ */
  if(A.length>1){
    var prev=A[A.length-2];
    if(last.parts.falls<prev.parts.falls){
      out.flags.push({id:"R3", sev:2,
        text:"มีการหกล้มเกิดขึ้นใหม่ในช่วง "+daysBetween(prev.at,last.at)+" วันที่ผ่านมา",
        why:"ผู้ที่ล้มแล้ว 1 ครั้งมีโอกาสล้มซ้ำสูงขึ้นชัดเจนใน 12 เดือนถัดไป"});
    }
    if(last.parts.adl<prev.parts.adl){
      out.flags.push({id:"R6", sev:3,
        text:"ความสามารถทำกิจวัตรประจำวันลดลงจากการประเมินครั้งก่อน",
        why:"การลดลงของ ADL เป็นสัญญาณเริ่มต้นของภาวะพึ่งพิง ซึ่งเป็นเหตุการณ์ที่กรมธรรม์คุ้มครอง"});
    }
  }
  /* R4 — คะแนนรวมถดถอย */
  if(last.score<=bestScore-2){
    out.flags.push({id:"R4", sev:last.score<=bestScore-3?2:1,
      text:"คะแนนรวมลดลง "+(bestScore-last.score)+" คะแนน จากค่าดีที่สุดของคุณ ("+bestScore+" → "+last.score+")",
      why:"เปรียบเทียบกับตัวคุณเองในอดีต ไม่ใช่กับค่าเฉลี่ยของคนอื่น"});
  }
  /* R5 — ยาหลายชนิด + ทรงตัวบกพร่อง */
  if(last.parts.meds===0 && last.parts.balance<=1){
    out.flags.push({id:"R5", sev:2,
      text:"ใช้ยาตั้งแต่ 4 ชนิดขึ้นไป ร่วมกับผลทรงตัวที่ยังไม่ผ่านเกณฑ์",
      why:"สองปัจจัยนี้เมื่อเกิดร่วมกันเพิ่มความเสี่ยงหกล้มมากกว่าผลรวมของแต่ละปัจจัย"});
  }
  /* R9 — ลุกเดิน 3 เมตรช้ากว่าเกณฑ์ */
  if(last.tug!=null&&last.tug>=12){
    out.flags.push({id:"R9", sev:last.tug>=15?2:1,
      text:"ลุกเดิน 3 เมตรแล้วกลับมานั่ง ใช้เวลา "+last.tug.toFixed(1)+" วินาที",
      why:"เวลาตั้งแต่ 12 วินาทีขึ้นไปสัมพันธ์กับความเสี่ยงหกล้มที่สูงขึ้นในผู้สูงอายุ"});
  }
  /* R8 — จังหวะไม่สม่ำเสมอ (เฉพาะเมื่อวัดด้วยกล้อง) */
  if(last.cv!=null&&last.cv>=0.25){
    out.flags.push({id:"R8", sev:1,
      text:"จังหวะการลุกแต่ละครั้งไม่สม่ำเสมอ ครั้งท้าย ๆ ช้ากว่าครั้งแรกอย่างชัดเจน",
      why:"กล้องจับเวลาแยกรายครั้งได้ ความแปรปรวน "+(last.cv*100).toFixed(0)+"% บ่งชี้ว่ากล้ามเนื้อขาล้าเร็วกว่าปกติ"});
  }
  /* R7 — เกินกำหนด */
  var due=nextDueDays(out.flags,last.tier);
  if(out.sinceLast>due){
    out.flags.push({id:"R7", sev:1,
      text:"เลยกำหนดประเมินซ้ำมาแล้ว "+(out.sinceLast-due)+" วัน",
      why:"ข้อมูลที่เก่ากว่ากำหนดทำให้ระบบประเมินความเสี่ยงปัจจุบันได้แม่นยำน้อยลง"});
  }

  /* ระดับรวม */
  var sev=out.flags.reduce(function(a,b){return a+b.sev},0);
  var hasADL=out.flags.some(function(f){return f.id==="R6"});
  if(last.tier===1 || hasADL || sev>=5) out.level="urgent";
  else if(last.tier===2 || sev>=3) out.level="decline";
  else if(sev>=1) out.level="watch";
  else out.level="stable";

  out.nextDays=ENGINE.cadence[out.level];
  out.nextDate=new Date(Date.now()+out.nextDays*864e5).toISOString();
  out.referral = out.level==="urgent" ? {nm:"ส่งต่อพยาบาลประเมินที่บ้าน", sla:"ภายใน 72 ชั่วโมง", need:true}
               : out.level==="decline" ? {nm:"Care Manager โทรติดตาม", sla:"ภายใน 7 วัน", need:true}
               : out.level==="watch"   ? {nm:"แผนป้องกันด้วยตนเอง + เตือนประเมินซ้ำ", sla:"ไม่ต้องส่งต่อ", need:false}
                                       : {nm:"ดูแลตนเองตามแผนปกติ", sla:"ไม่ต้องส่งต่อ", need:false};
  return out;
}
function nextDueDays(flags,tier){
  var sev=flags.filter(function(f){return f.id!=="R7"}).reduce(function(a,b){return a+b.sev},0);
  if(tier===1||sev>=5)return ENGINE.cadence.urgent;
  if(tier===2||sev>=3)return ENGINE.cadence.decline;
  if(sev>=1)return ENGINE.cadence.watch;
  return ENGINE.cadence.stable;
}

function preventionPlan(){
  var tr=trajectory(); if(!tr) return null;
  var last=tr.last, p=S.data.profile, picks=[];
  function add(dom,reason){var it=PREV_LIB.find(function(x){return x.dom===dom});if(it&&!picks.some(function(x){return x.id===it.id}))picks.push(Object.assign({},it,{reason:reason}))}
  if(last.parts.ftsst<=2) add("ftsst","คะแนนลุกนั่งของคุณอยู่ที่ "+last.parts.ftsst+"/4"+(last.ftsst?" ("+last.ftsst.toFixed(1)+" วินาที)":""));
  else if(tr.flags.some(function(f){return f.id==="R1"})) add("ftsst","เวลาลุกนั่งของคุณช้าลงจากเดิม แม้คะแนนยังอยู่ในเกณฑ์");
  if(last.parts.balance<=1) add("balance","คะแนนทรงตัว "+last.parts.balance+"/3");
  if(last.parts.falls<2) add("falls","มีประวัติหกล้มในรอบ 12 เดือน");
  if(last.parts.meds===0) add("meds","ใช้ยาตั้งแต่ 4 ชนิดขึ้นไป");
  if(last.parts.adl<2) add("adl","คะแนนกิจวัตรประจำวัน "+last.parts.adl+"/2");
  add("general","แนะนำกับทุกคนในช่วงอายุ "+CFG.ageBand(p.age)+" ปี");
  return {level:tr.level, items:picks, tr:tr};
}

function drawPose(ctx,canvas,video,lm){
  if(canvas.width!==video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!lm)return;
  var pairs=[[11,12],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],[11,13],[13,15],[12,14],[14,16]];
  ctx.lineWidth=Math.max(3,canvas.width/150); ctx.strokeStyle="rgba(96,165,250,.9)"; ctx.lineCap="round";
  pairs.forEach(function(p){
    var a=lm[p[0]],b=lm[p[1]]; if(!a||!b)return;
    ctx.beginPath();ctx.moveTo(a.x*canvas.width,a.y*canvas.height);ctx.lineTo(b.x*canvas.width,b.y*canvas.height);ctx.stroke();
  });
  [11,12,23,24,25,26,27,28].forEach(function(i){
    var p=lm[i]; if(!p)return;
    ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,Math.max(4,canvas.width/110),0,6.3);
    ctx.fillStyle=(i===23||i===24)?"#FCD34D":"#DBEAFE";ctx.fill();
  });
}

function finishTest(elapsed){
  stopCam();
  var gaps=[];
  for(var i=1;i<DET.stamps.length;i++)gaps.push((DET.stamps[i]-DET.stamps[i-1])/1000);
  var cv=null;
  if(gaps.length>1){
    var mean=gaps.reduce(function(a,b){return a+b},0)/gaps.length;
    var sd=Math.sqrt(gaps.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/gaps.length);
    cv=mean>0?sd/mean:null;
  }
  S.draft.ftsst=Math.round(elapsed*10)/10;
  S.draft.method="camera-pose";
  S.draft.reps=DET.reps;
  S.draft.cv=cv;
  S.draft.gaps=gaps.map(function(g){return Math.round(g*10)/10});
  audit("วัดด้วยกล้อง","ลุกนั่ง 5 ครั้งใน "+S.draft.ftsst.toFixed(1)+" วินาที · เวลาต่อครั้ง "+S.draft.gaps.join(", ")+" วินาที"+(cv!=null?" · ความแปรปรวน "+(cv*100).toFixed(0)+"%":""));
  toast("วัดเสร็จแล้ว "+S.draft.ftsst.toFixed(1)+" วินาที");
  go("tug");
}



/* ============================================================
   การทดสอบลุกเดิน 3 เมตร (Timed Up and Go)
   ------------------------------------------------------------
   จับเวลาตั้งแต่ลุกจากเก้าอี้ เดินไป 3 เมตร หมุนกลับ จนนั่งลง
   กล้องตรวจ 2 จุด: จังหวะที่ลุกขึ้น (เริ่มจับ) และจังหวะที่นั่งลง (หยุด)
   ระหว่างเดินออกนอกเฟรม ระบบรอโดยไม่นับผิด
   เกณฑ์อ้างอิง: ใช้เวลา ≥12 วินาที สัมพันธ์กับความเสี่ยงหกล้มที่สูงขึ้น
   ============================================================ */
function TugDetector(refs){
  this.sitRef=refs.sitRef; this.standRef=refs.standRef;
  this.state="waiting"; this.t0=null; this.t1=null; this.buf=[];
}
TugDetector.prototype.push=function(raw,t){
  this.buf.push(raw); if(this.buf.length>5)this.buf.shift();
  var v=this.buf.reduce(function(a,b){return a+b},0)/this.buf.length;
  var range=this.standRef-this.sitRef;
  var up=this.sitRef+range*0.68, down=this.sitRef+range*0.36;
  if(this.state==="waiting"&&v>=up){this.state="walking";this.t0=t;return{event:"start"}}
  if(this.state==="walking"&&v<=down&&this.t0&&(t-this.t0)>3000){
    this.state="done";this.t1=t;return{event:"finish",elapsed:(t-this.t0)/1000};
  }
  return null;
};

async function startTugPipeline(){
  var video=document.getElementById("vid"), canvas=document.getElementById("cv"), ctx=canvas.getContext("2d");
  var tag=document.getElementById("tag"), coach=document.getElementById("coach"), clk=document.getElementById("tugclk");
  var stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:854}},audio:false}); }
  catch(e){ tag.textContent="เปิดกล้องไม่ได้"; coach.textContent="ข้ามขั้นนี้ได้เลย ไม่กระทบคะแนนรวม"; return; }
  S.cam=stream; video.srcObject=stream; await video.play().catch(function(){});
  try{ await loadModel(tag); }catch(e){ tag.textContent="โหลดโมเดลไม่สำเร็จ"; coach.textContent="ข้ามขั้นนี้ได้เลย"; return; }
  tag.textContent="พร้อมแล้ว";
  var TUG=new TugDetector({sitRef:S.draft.sitRef,standRef:S.draft.standRef});
  var running=false, t0=0;
  function loop(){
    if(S.screen!=="tug")return;
    var r=null;
    try{r=POSE.detectForVideo(video,performance.now())}catch(e){}
    var lm=r&&r.landmarks&&r.landmarks[0]?r.landmarks[0]:null;
    drawPose(ctx,canvas,video,lm);
    if(running){
      if(lm){
        var m=hipRatio(lm);
        if(m!=null){
          var ev=TUG.push(m,performance.now());
          if(ev&&ev.event==="start"){coach.textContent="เริ่มแล้ว — เดินไปให้ถึงจุดหมายแล้วกลับมานั่ง"}
          if(ev&&ev.event==="finish"){finishTug(ev.elapsed);return}
        }
      }else{ coach.textContent="กำลังรอคุณเดินกลับมา…" }
      clk.textContent=((performance.now()-t0)/1000).toFixed(1);
    }
    RAF=requestAnimationFrame(loop);
  }
  loop();
  document.getElementById("tugStart").addEventListener("click",function(){
    if(running)return;
    running=true; t0=performance.now();
    this.textContent="กำลังจับเวลา…"; this.disabled=true;
    coach.textContent="ลุกขึ้นได้เลย";
  });
}
function finishTug(sec){
  stopCam();
  S.draft.tug=Math.round(sec*10)/10;
  audit("วัดลุกเดิน 3 เมตรด้วยกล้อง","ใช้เวลา "+S.draft.tug.toFixed(1)+" วินาที");
  toast("วัดเสร็จแล้ว "+S.draft.tug.toFixed(1)+" วินาที");

}

  '<div class="card"><h3>ความโปร่งใสและสิทธิของคุณ</h3><p class="sub">ดูได้ว่าระบบใช้กฎอะไร ตัดสินใจอะไรกับข้อมูลของคุณบ้าง และระบบทำอะไรไม่ได้</p><button class="ghostb" data-go="ai">ดูว่าระบบทำงานกับข้อมูลของฉันอย่างไร</button></div>'+'<button class="ghostb danger" id="wipe">ถอนความยินยอมและลบข้อมูลทั้งหมด (PDPA)</button></div>';
  document.getElementById("shareOn").addEventListener("click",async function(){S.data.sharePool=true;await saveAll();toast("เปิดการแชร์ข้อมูลสรุปแล้ว");render()});
  document.getElementById("shareOff").addEventListener("click",async function(){S.data.sharePool=false;await saveAll();toast("ปิดการแชร์แล้ว — ข้อมูลอยู่กับคุณเท่านั้น");render()});
  document.getElementById("wipe").addEventListener("click",async function(){
    if(!confirm("ลบบัญชี ผลประเมิน กรมธรรม์ และประวัติชำระทั้งหมด? กู้คืนไม่ได้"))return;
    await DB.del("careSignalData");
    S.data=blankData();S.draft={};
    toast("ลบข้อมูลเรียบร้อยตามสิทธิ PDPA");
    go("welcome");
  });
}

/* ---------- นำทาง ---------- */
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");
  if(g){go(g.dataset.go)}
});
(async function(){
  await loadAll();
  go(S.data.profile?"home":"welcome");
})();
</script>
