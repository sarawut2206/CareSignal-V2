<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://esm.sh https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="CareSignal Staff — แอปเจ้าหน้าที่: คิวเคสของ Care Manager และพอร์ตความเสี่ยงของบริษัทประกัน เข้าได้เฉพาะบัญชีเจ้าหน้าที่ที่ได้รับสิทธิ์">
<meta name="theme-color" content="#16337A">
<link rel="manifest" href="./manifest-staff.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-64.png">
<title>CareSignal Staff — แอปเจ้าหน้าที่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ธีมเจ้าหน้าที่ — น้ำเงินเข้มทั้งแอป (ตามที่ผู้ใช้กำหนดสี)
   เหตุผล: ให้เจ้าหน้าที่รู้ทันทีว่ากำลังถืออยู่ "แอปงาน" ไม่ใช่
   แอปสมาชิกซึ่งพื้นสว่าง — ลดโอกาสสาธิตผิดแอปต่อหน้าลูกค้า
   ============================================================ */
:root{
  --blue1:#24509F; --blue2:#1A3A85; --blue3:#12295F;
  --surf:rgba(255,255,255,.07); --surf2:rgba(255,255,255,.11);
  --ink:#F2F6FF; --ink2:#B9C7E8; --ink3:#8FA3CF;
  --line:rgba(255,255,255,.17); --line2:rgba(255,255,255,.10);
  --gold:#F5B93E; --goldink:#231a02;
  --c4:#22B57F; --c3:#E3B341; --c2:#F08A3C; --c1:#F0524C;
  --sans:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sh:0 2px 6px rgba(0,10,40,.25),0 12px 30px rgba(0,10,40,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background:#16337A;
  background:radial-gradient(130% 90% at 50% 28%, var(--blue1) 0%, var(--blue2) 55%, var(--blue3) 100%) fixed}
.phone{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.bar{background:rgba(0,12,45,.35);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px)}
.bar b{font-size:16px;letter-spacing:-.01em}
.bar b i{color:var(--gold);font-style:normal}
.chip{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:99px;letter-spacing:.06em}
.view{flex:1;padding:18px 16px calc(86px + env(safe-area-inset-bottom))}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:14px;backdrop-filter:blur(6px)}
h1{font-size:21px;letter-spacing:-.02em;margin:2px 0 4px;color:#fff}
h3{font-size:15.5px;margin:0 0 10px;color:#fff}
.sub{font-size:13.5px;color:var(--ink2);margin:0 0 4px}
.kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.hd{padding:6px 18px 18px}
.hd p{color:var(--ink2);font-size:13px;margin:4px 0 0}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;font-family:inherit;font-size:16px;padding:13px;border:1.5px solid var(--line);border-radius:13px;background:rgba(0,14,50,.35);color:#fff}
.field input::placeholder{color:var(--ink3)}
.cta{display:block;width:100%;border:0;border-radius:15px;background:var(--gold);color:var(--goldink);font-family:inherit;font-size:16.5px;font-weight:700;padding:15px;cursor:pointer;margin:6px 0;box-shadow:0 6px 18px rgba(0,10,40,.35)}
.cta:disabled{opacity:.6}
.ghostb{display:block;width:100%;border:1.5px solid var(--line);border-radius:15px;background:rgba(255,255,255,.06);color:var(--ink);font-family:inherit;font-size:14.5px;padding:12px;cursor:pointer;margin:8px 0}
.tabs[hidden]{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(9,25,66,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line2);display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;font-family:inherit;font-size:11.5px;color:var(--ink3);padding:9px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button[aria-selected="true"]{color:var(--gold);font-weight:600}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;color:#fff}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line2);font-size:13.5px}
.rowline:last-child{border-bottom:0}
.rowline .k{color:var(--ink2)}
.rowline .v{font-family:var(--mono);font-weight:600;text-align:right;color:#fff}
.case{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surf2)}
.case .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.case .who{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.flag{font-size:12.5px;color:var(--ink2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:6px 0}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow button{flex:1;border-radius:11px;font-family:inherit;font-size:13.5px;font-weight:600;padding:10px;cursor:pointer}
.ok{border:0;background:var(--c4);color:#fff}
.no{border:1.5px solid var(--line);background:transparent;color:var(--ink2)}
.empty{text-align:center;color:var(--ink3);font-size:14px;padding:28px 10px}
.notice{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:13px;padding:13px 15px;font-size:13px;color:var(--ink2);margin-bottom:14px}
.notice b{color:#fff}
.tiny{font-size:11.5px;color:var(--ink2);line-height:1.65;margin:10px 0 0}
/* ---------- แถบขั้นตอนตาม STEADI ----------
   บอกว่าเคสอยู่ช่วงไหนของวงจร ทบทวน → ติดต่อ/วางแผน → ส่งต่อ → ติดตาม
   เจ้าหน้าที่จะได้รู้ทันทีว่า "งานถัดไปเป็นงานประเภทไหน" ไม่ต้องอ่านสถานะดิบ */
.stagebar{display:flex;gap:4px;margin:8px 0 10px}
.stg{flex:1;text-align:center;font-size:11px;padding:6px 3px;border-radius:9px;
  background:rgba(255,255,255,.06);color:var(--ink3);border:1px solid var(--line2);line-height:1.3}
.stg[data-on="1"]{background:var(--gold);color:var(--goldink);font-weight:700;border-color:var(--gold)}
.stg[data-on="done"]{background:rgba(34,181,127,.18);color:var(--c4);border-color:rgba(34,181,127,.4)}
/* ป้ายความสำคัญ: ต้องมีไอคอน + ข้อความ + การกระทำเสมอ ไม่ใช้สีลำพัง
   เพราะผู้ใช้ที่แยกสีได้ยากจะอ่านไม่ออกว่าเคสไหนด่วน */
.prio{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;
  font-size:11.5px;font-weight:700;color:#fff}
.prioact{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.5}
.grp{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.05em;margin:16px 0 6px}
/* ---------- การ์ดงานหนึ่งชิ้น ----------
   แถวหนึ่ง = งานหนึ่งชิ้นที่ต้องลงมือทำ ไม่ใช่รายชื่อคน
   เจ้าหน้าที่เปิดหน้าเดียวแล้วรู้ว่าวันนี้ต้องทำอะไรบ้าง */
.work{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);
  border-radius:13px;padding:13px 15px;margin-bottom:10px;background:var(--surf2)}
.work .wm{flex:1;min-width:0}
.work .wt{font-weight:600;font-size:14.5px;color:#fff;margin-bottom:3px}
.work .ww{font-size:12.5px;color:var(--ink2)}
.work .wd{text-align:right;white-space:nowrap;font-size:12px}
.work .wd b{display:block;font-family:var(--mono);font-size:13px}
.work[data-late="1"]{border-color:rgba(240,82,76,.55);background:rgba(240,82,76,.10)}
.work .claim{border:0;border-radius:10px;background:var(--gold);color:var(--goldink);
  font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 13px;cursor:pointer;margin-top:7px}
.demoprog{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.demoprog .dp{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--ink3);white-space:nowrap}
.demoprog .dp[data-st="done"]{background:rgba(34,181,127,.18);border-color:rgba(34,181,127,.45);color:var(--c4)}
.demoprog .dp[data-st="now"]{background:var(--gold);border-color:var(--gold);color:var(--goldink);font-weight:700}
.demopanel{border:1.5px dashed var(--gold);background:rgba(245,185,62,.08);border-radius:14px;
  padding:14px 16px;margin-bottom:14px}
.demopanel h3{color:var(--gold);margin:0 0 4px;font-size:15px}
.demopanel .btnrow{margin-top:10px}
.sheet{position:fixed;inset:0;background:rgba(4,12,36,.72);backdrop-filter:blur(4px);z-index:200;
  display:grid;place-items:start center;padding:20px;overflow:auto}
.sheet .card{max-width:640px;width:100%;margin:0 0 40px}
.sheet h3{margin:0 0 4px}
.pkg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.pkg .pk{background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:11px;padding:10px 12px}
.pkg .pk .l{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.pkg .pk .v{font-family:var(--mono);font-size:15px;font-weight:700;color:#fff;margin-top:2px}
.pkg .pk .v.w{color:var(--c2)}
.pkg .pk .t{font-size:11.5px;color:var(--ink2)}
.qs{margin:8px 0}
.qs label{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line2);cursor:pointer}
.qs input[type=checkbox]{margin-top:4px;flex:none}
.tl{position:relative;padding-left:22px;margin:6px 0}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:6px 0 10px;font-size:13px}
.tl .ev::before{content:"";position:absolute;left:-19px;top:10px;width:10px;height:10px;border-radius:99px;
  background:var(--ink3);border:2px solid var(--blue2)}
.tl .ev[data-k="signal"]::before{background:var(--c1)}
.tl .ev[data-k="refer"]::before{background:var(--gold)}
.tl .ev[data-k="review"]::before{background:var(--c4)}
.tl .ev[data-k="consent"]::before{background:#8B5CF6}
.tl .ev[data-k="followup"]::before{background:var(--c3)}
.tl .ev .at{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.tl .ev b{display:block;color:#fff;font-size:13.5px}
.tl .ev span{color:var(--ink2)}
.rv{border:1.5px solid var(--c4);background:rgba(34,181,127,.10);border-radius:13px;padding:13px 15px;margin:10px 0;font-size:13.5px}
.rv b{color:var(--c4);display:block;margin-bottom:4px}
.rv .row{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.rv .row span:nth-child(odd){color:var(--ink3)}
.orgbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;
  background:rgba(255,255,255,.07);border:1px solid var(--line2);border-radius:11px;
  padding:8px 12px;margin-bottom:12px;color:var(--ink2)}
.orgbar b{color:#fff}
.orgbar button{margin-left:auto;border:1px solid var(--line);background:none;color:var(--gold);
  font-family:inherit;font-size:12px;padding:4px 10px;border-radius:9px;cursor:pointer}
.mstat{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.6}
.mstat b{color:#fff}
.mstat .bad{color:var(--c2)}
.consent{border:1.5px solid var(--gold);background:rgba(245,185,62,.10);border-radius:13px;
  padding:13px 15px;margin:10px 0;font-size:13.5px}
.consent b{color:var(--gold);display:block;margin-bottom:4px}
.consent .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.consent button{border:0;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:13px;
  font-weight:700;cursor:pointer;background:var(--gold);color:var(--goldink)}
.consent button.wait{background:rgba(255,255,255,.14);color:var(--ink)}
.consent .cd{font-family:var(--mono);font-size:12.5px;color:var(--ink2);margin-top:6px}
.locked{filter:blur(4px);pointer-events:none;user-select:none}
.newtag{display:inline-block;font-size:10.5px;font-weight:700;background:var(--gold);
  color:var(--goldink);padding:1px 7px;border-radius:99px;margin-left:6px}
.warnbox{background:rgba(240,82,76,.16);border:1px solid rgba(240,82,76,.5);border-radius:13px;padding:13px 15px;font-size:13.5px;color:#FFD9D7;margin-bottom:14px}
.warnbox b{color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(86px + env(safe-area-inset-bottom));background:#fff;color:#12295F;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,10,40,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mixbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:8px 0 4px;background:rgba(255,255,255,.1)}
.mixbar i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px;color:var(--ink)}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line2)}
th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
td.num{font-family:var(--mono);white-space:nowrap}
.tblwrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;cursor:pointer}
.kpi[aria-pressed="true"]{border-color:var(--gold);background:rgba(245,185,62,.14)}
.kpi b{display:block;font-size:22px;font-family:var(--mono);color:#fff;line-height:1.2}
.kpi span{font-size:11px;color:var(--ink2);line-height:1.3;display:block;margin-top:2px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink2);
  font-family:inherit;font-size:13px;padding:9px;border-radius:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--goldink);border-color:var(--gold);font-weight:600}
.spark{display:block;width:100%;height:44px;margin:2px 0 6px}
/* ============================================================
   โครงจอกว้าง — เจ้าหน้าที่ทำงานบนคอมพิวเตอร์เป็นหลัก
   ------------------------------------------------------------
   เดิมคอนโซลถูกบีบไว้ที่ 520px เหมือนแอปมือถือ พอเปิดบนจอคอม
   จะเหลือแถบแคบกลางจอ ดูไม่เป็นระบบงานจริง
   ตั้งแต่ 1040px ขึ้นไปจึงเปลี่ยนเป็นแถบเมนูข้าง + พื้นที่ทำงานกว้าง
   แบบโปรแกรมบริหารคลินิก ส่วนบนมือถือยังเป็นแท็บล่างเหมือนเดิม
   ============================================================ */
.side{display:none}
@media(min-width:1040px){
  .phone{max-width:1400px;display:grid;
    grid-template-columns:236px minmax(0,1fr);
    grid-template-areas:"bar bar" "side hd" "side view";
    grid-template-rows:auto auto 1fr;align-items:start}
  .bar{grid-area:bar;padding:12px 24px}
  .hd{grid-area:hd;padding:20px 28px 10px}
  .view{grid-area:view;padding:6px 28px 40px}
  .tabs{display:none}
  .side{grid-area:side;display:block;position:sticky;top:0;align-self:stretch;
    background:rgba(0,12,45,.30);border-right:1px solid var(--line2);
    padding:20px 12px;min-height:calc(100dvh - 52px)}
  .side[hidden]{display:none}
  .side .sgrp{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink3);font-weight:600;margin:16px 10px 6px}
  .side .sgrp:first-child{margin-top:0}
  .side button{display:flex;align-items:center;gap:10px;width:100%;border:0;cursor:pointer;
    background:none;font-family:inherit;font-size:14px;color:var(--ink2);
    padding:10px 12px;border-radius:11px;text-align:left;margin-bottom:2px}
  .side button:hover{background:rgba(255,255,255,.07);color:#fff}
  .side button[aria-selected="true"]{background:var(--gold);color:var(--goldink);font-weight:700}
  .side button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  .side .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;
    background:rgba(255,255,255,.14);padding:1px 7px;border-radius:99px}
  .side button[aria-selected="true"] .cnt{background:rgba(0,0,0,.2)}
  /* การ์ดเรียงหลายคอลัมน์บนจอกว้าง ไม่ยืดเป็นแถบยาวอ่านยาก */
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:0 16px;align-items:start}
  .wide{grid-column:1/-1}
}
/* ---------- ตารางแบบระบบงาน ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--ink3);font-size:10.5px;
  letter-spacing:.05em;text-transform:uppercase;padding:8px 7px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 7px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{font-family:var(--mono);text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto;margin:0 -4px}
/* ---------- ท่อสถานะการส่งต่อ ---------- */
.pipe{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.pipe .pn{flex:1 0 118px;background:var(--surf2);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;text-align:left}
.pipe .pn .pl{font-size:11.5px;color:var(--ink2);line-height:1.35;min-height:31px}
.pipe .pn .pv{font-family:var(--mono);font-size:21px;font-weight:700;color:#fff;margin-top:4px}
.pipe .pn .pt{font-size:10.5px;color:var(--ink3);margin-top:2px}
.pipe .pn[data-alert="1"]{border-color:rgba(240,82,76,.6);background:rgba(240,82,76,.12)}
.chip2{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--ink2);margin:0 4px 4px 0}
.linkbtn{border:0;background:none;color:var(--gold);font-family:inherit;font-size:12.5px;cursor:pointer;padding:0}
/* ---------- หน้าเปิดแอป ----------
   ใช้สีเดียวกับ background_color ใน manifest เพื่อให้ต่อจาก splash ของระบบ
   ได้เนียน ไม่กะพริบขาว-น้ำเงิน และบอกสถานะว่ากำลังทำอะไรอยู่ */
.boot{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;background:#16337A;color:#fff;
  padding:24px;text-align:center}
.boot img{width:92px;height:92px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.35))}
.boot .bt{font-size:21px;font-weight:700;letter-spacing:-.01em}
.boot .bt i{color:#F5B93E;font-style:normal}
.boot .bs{font-size:14px;color:#B9C7E8;line-height:1.6;max-width:280px}
.boot .bar{width:132px;height:5px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.boot .bar i{display:block;width:40%;height:100%;border-radius:99px;background:#F5B93E;
  animation:bootslide 1.15s ease-in-out infinite}
@keyframes bootslide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
@media(prefers-reduced-motion:reduce){.boot .bar i{animation:none;width:100%}}
/* ============================================================
   มุมมองวอร์ด — คอนโซลเต็มจอสำหรับจอใหญ่ที่เคาน์เตอร์พยาบาล
   ------------------------------------------------------------
   ต่างจากหน้าคิวเคสเดิมตรงที่หน้านั้นออกแบบให้เลื่อนอ่านทีละเคสบนมือถือ
   ส่วนหน้านี้ออกแบบให้ "ยืนดูจากระยะสองเมตรแล้วรู้ทันทีว่าต้องไปที่ใครก่อน"
   จึงใช้การ์ดกริดหนาแน่น แถบสีตามระดับ และแถบสถานะวงจรงานอยู่บนสุด

   ทำไมต้องเต็มจอไม่ใช้กรอบ .phone เดิม: กรอบเดิมกว้างสุด 520px ซึ่งเหมาะกับ
   การถือมือถือ แต่คอนโซลที่เคาน์เตอร์คือจอ 24-32 นิ้ว ถ้าใช้กรอบเดิมจะเหลือ
   พื้นที่ว่างสองข้างมหาศาลและเห็นเคสได้ครั้งละไม่กี่ใบ
   ============================================================ */
.ward{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:#0E1B3D;color:#EAF0FF;font-size:14px}
.ward *{box-sizing:border-box}

/* ---------- แถบบน ---------- */
.wtop{display:flex;align-items:center;gap:0;background:#fff;color:#16233B;flex:none;
  border-bottom:3px solid #12295F}
.wtop .brand{display:flex;align-items:center;gap:9px;padding:10px 18px;border-right:1px solid #E3EAF6}
.wtop .brand b{font-size:17px;letter-spacing:-.01em}
.wtop .brand b i{color:#D97706;font-style:normal}
.wtop .stat{display:flex;align-items:center;gap:7px;padding:10px 18px;border-right:1px solid #E3EAF6;
  font-size:14.5px;white-space:nowrap}
.wtop .stat u{text-decoration:none;font-weight:700;font-size:17px}
.wtop .clock{margin-left:auto;text-align:right;padding:8px 16px;line-height:1.25}
.wtop .clock .d{font-size:12.5px;color:#5B6B84}
.wtop .clock .t{font-size:24px;font-weight:700;letter-spacing:-.02em}
.wtop .port{background:#12295F;color:#fff;padding:12px 26px;font-size:20px;font-weight:700;
  border-radius:0 0 0 26px;white-space:nowrap}

/* ---------- แถบวงจรงาน ---------- */
.wflow{display:flex;gap:0;background:#0A1530;flex:none;overflow-x:auto}
.wflow button{flex:1;min-width:132px;background:transparent;border:0;border-bottom:3px solid transparent;
  color:#9FB2DA;font:inherit;padding:9px 10px;cursor:pointer;text-align:center;white-space:nowrap}
.wflow button b{display:block;font-size:19px;line-height:1.1;color:#fff}
.wflow button span{font-size:12px}
.wflow button[aria-pressed="true"]{background:rgba(255,255,255,.07);border-bottom-color:#F5B301;color:#fff}
.wflow button:disabled{opacity:.45;cursor:default}

/* ---------- พื้นที่กลาง ---------- */
.wbody{flex:1;display:grid;grid-template-columns:1fr 268px;gap:0;min-height:0}
.wgrid{overflow:auto;padding:12px;display:grid;gap:10px;align-content:start;
  grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.wempty{grid-column:1/-1;padding:40px;text-align:center;color:#9FB2DA}

/* ---------- การ์ดเคส ---------- */
.wcard{background:#fff;color:#16233B;border-radius:9px;overflow:hidden;text-align:left;
  border:0;font:inherit;cursor:pointer;display:flex;flex-direction:column;
  box-shadow:0 1px 3px rgba(0,0,0,.25)}
.wcard:hover{box-shadow:0 0 0 2px #F5B301,0 2px 8px rgba(0,0,0,.3)}
.wcard .hd{display:flex;align-items:stretch;gap:0}
.wcard .code{background:#12295F;color:#fff;padding:5px 9px;font-weight:700;font-size:13px;letter-spacing:.01em}
.wcard .lv{flex:1;padding:5px 9px;font-size:12px;font-weight:700;color:#fff;text-align:right;white-space:nowrap}
.wcard .bd{padding:8px 10px 9px}
.wcard .nm{font-weight:700;font-size:15px;line-height:1.3}
.wcard .sub{font-size:12px;color:#5B6B84;margin-top:1px}
.wcard .act{font-size:12.5px;color:#16233B;margin-top:6px;font-weight:600}
.wcard .due{font-size:12px;margin-top:3px}
.wcard .ics{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.wcard .ics span{font-size:11px;background:#EEF3FB;color:#3A5480;border-radius:5px;padding:2px 6px}
.wcard .ics span.on{background:#FEF3C7;color:#92400E}

/* ---------- พาเนลขวา ---------- */
.wside{background:#0A1530;border-left:1px solid rgba(255,255,255,.1);overflow:auto;padding:12px}
.wside h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8FA3CF}
.wside .box{background:rgba(255,255,255,.06);border-radius:9px;padding:11px;margin-bottom:12px}
.wsum{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.wsum div{background:rgba(255,255,255,.05);border-radius:7px;padding:8px 9px}
.wsum b{display:block;font-size:21px;line-height:1.1}
.wsum span{font-size:11.5px;color:#9FB2DA}
.wnote{font-size:12.5px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);line-height:1.5}
.wnote:last-child{border-bottom:0}
.wnote b{display:block;font-size:12px;color:#F5B301}

/* ---------- แถบล่าง ---------- */
.wtabs{display:flex;gap:0;background:#D8DEE9;flex:none;padding:5px 8px;align-items:center}
.wtabs button{background:#fff;border:1px solid #B9C4D6;color:#16233B;font:inherit;font-size:13.5px;
  padding:7px 15px;margin-right:6px;border-radius:4px;cursor:pointer}
.wtabs button[aria-pressed="true"]{background:#12295F;color:#fff;border-color:#12295F;font-weight:600}
.wtabs .sp{margin-left:auto}
.wtabs .exit{background:#12295F;color:#fff;border-color:#12295F}

/* แถบสรุประดับความเสี่ยงสำหรับจอแคบ — พาเนลขวาถูกซ่อนบนมือถือ
   ตัวเลขสี่ตัวนี้จึงต้องมีที่อยู่ใหม่ ไม่ใช่หายไปเฉย ๆ */
.wstrip{display:none}
@media(max-width:900px){
  .wbody{grid-template-columns:1fr}
  .wside{display:none}
  .wtop .port{display:none}
  .wtop .clock .d{display:none}
  .wtop .clock .t{font-size:19px}
  .wtop .brand{padding:8px 12px}
  .wtop .brand b{font-size:15px}
  .wtop .stat{padding:8px 12px;font-size:13px}
  .wflow button{min-width:96px;padding:8px 6px}
  .wflow button b{font-size:17px}
  .wflow button span{font-size:11px}
  .wgrid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;padding:9px}
  .wcard .nm{font-size:14px}
  .wstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:9px 9px 0;flex:none}
  .wstrip div{background:rgba(255,255,255,.07);border-radius:8px;padding:7px 6px;text-align:center}
  .wstrip b{display:block;font-size:18px;line-height:1.15}
  .wstrip span{font-size:10.5px;color:#9FB2DA}
  .wtabs{overflow-x:auto}
  .wtabs button{white-space:nowrap;font-size:12.5px;padding:7px 11px}
}

</style>
</head>

<script>window.CS_AUTH_SCOPE="staff";/* แอปเจ้าหน้าที่ใช้ช่อง session แยกจากแอปสมาชิกเสมอ */</script>
<script src="./cs-demo.js?v=2"></script>
<script src="./cs-backend.js?v=4"></script>

<script>
/* ============================================================
   CareSignal Staff — แอปเจ้าหน้าที่ (แยกจากแอปผู้เอาประกันโดยสิ้นเชิง)
   ------------------------------------------------------------
   ผู้ใช้: Care Manager / พยาบาล → คิวเคสส่งต่อ
          เจ้าหน้าที่บริษัทประกัน → พอร์ตความเสี่ยงแบบแฝงชื่อ
   ไม่มีข้อมูลสาธิตในแอปนี้ — ทุกแถวมาจากฐานข้อมูลกลางจริง และสิทธิ์
   ถูกบังคับด้วย Row Level Security ฝั่งเซิร์ฟเวอร์ ประตูหน้าจอเป็นเพียง
   ชั้นการใช้งาน ไม่ใช่ชั้นความปลอดภัย
   ============================================================ */
var V=document.getElementById("view"), TABS=document.getElementById("tabs");
var ST={screen:"login", role:null, email:null, name:null};
var LV_NM={stable:"คงที่",watch:"เฝ้าสังเกต",decline:"ถดถอย",urgent:"เร่งด่วน"};
var LV_C ={stable:"var(--c4)",watch:"var(--c3)",decline:"var(--c2)",urgent:"var(--c1)"};
var ROLE_NM={care_manager:"Care Manager / ผู้ประสานงาน",insurer:"เจ้าหน้าที่บริษัทประกัน",
  admin:"ผู้ดูแลระบบ",pharmacist:"เภสัชกร",physio:"นักกายภาพบำบัด",doctor:"แพทย์",nurse:"พยาบาล"};
/* วิชาชีพที่รับเคสส่งต่อ — เห็นเฉพาะรายการที่ส่งมาถึงวิชาชีพตน (บังคับด้วย RLS)
   ต่างจากผู้ประสานงานซึ่งเห็นทั้งพอร์ตเพราะต้องจัดสรรงาน */
var CLINICIANS=["pharmacist","physio","doctor","nurse"];
function isClinician(){ return CLINICIANS.indexOf(ST.role)>=0 }

/* ============================================================
   ประตูเข้าคอนโซล
   ------------------------------------------------------------
   บทบาทเจ้าหน้าที่ไม่ได้มาจากการสมัคร แต่มาจากรหัสที่ผู้ดูแลระบบออกให้
   บัญชีที่ยังไม่ได้แลกรหัสจะค้างอยู่ที่บทบาท user และมาหยุดที่หน้ากรอกรหัส
   จุดตัดสินจริงอยู่ที่ฐานข้อมูล ไม่ใช่หน้าจอนี้ — แก้โค้ดหน้าเว็บให้ข้ามไป
   ก็ยังอ่านข้อมูลไม่ได้ เพราะ RLS ตัดสินจากบทบาทที่บันทึกไว้เท่านั้น
   ============================================================ */
var CONSOLE_ROLES=["care_manager","insurer","admin","pharmacist","physio","doctor","nurse"];
function mayConsole(r){ return CONSOLE_ROLES.indexOf(r)>=0 }

/* ใช้ร่วมกันสามทาง: ล็อกอินใหม่ · เปิดแอปทั้งที่ session ยังอยู่ · เพิ่งแลกรหัสสำเร็จ
   รวมไว้ที่เดียวเพราะเดิมทางล็อกอินลืมกรองเมนูตามบทบาท ทำให้เห็นแท็บที่กดไม่ได้ */
async function enterConsole(role, em, nm, land){
  ST.role=role; ST.email=em||ST.email; ST.name=nm||em||ST.name;
  chip(); TABS.hidden=false; SIDE.hidden=false; navForRole(); navCounts();
  if(role!=="insurer"){
    try{ ST.org=await CSBackend.myOrg() }catch(e){}
    if(!ST.org){
      var org=await orgPrompt();
      try{ await CSBackend.startWorkSession(org); ST.org=org }
      catch(e){ toast("บันทึกหน่วยบริการไม่สำเร็จ") }
    }
  }
  /* ผู้ประสานงานและผู้ดูแลระบบเริ่มที่บอร์ดวันนี้ วิชาชีพเริ่มที่งานของตน
     บริษัทประกันเริ่มที่ภาพรวมระดับกลุ่ม เพราะไม่มีสิทธิ์ดูรายบุคคล */
  go(land||(role==="insurer"?"port":(role==="care_manager"||role==="admin"?"ward":"mine")));
}

function redeemV(em){
  head("กรอกรหัสเข้าใช้งาน","บัญชีนี้ยังไม่ได้รับสิทธิ์ — ต้องใช้รหัสที่ผู้ดูแลระบบออกให้");
  ST.screen="redeem"; TABS.hidden=true; SIDE.hidden=true;
  V.innerHTML='<div class="card"><h3>รหัสเข้าใช้งานจากผู้ดูแลระบบ</h3>'+
    '<p class="sub" style="margin:0 0 14px">'+esc(em||ST.email||"บัญชีนี้")+' เข้าสู่ระบบแล้ว '+
    'แต่ยังไม่ได้รับบทบาท ผู้ดูแลระบบขององค์กรจะออกรหัสให้หนึ่งใบ พร้อมกำหนดชื่อผู้ใช้และบทบาทไว้ล่วงหน้า '+
    'กรอกรหัสนั้นที่นี่เพื่อเปิดใช้งาน</p>'+
    '<div class="field"><label>รหัสเข้าใช้งาน</label>'+
    '<input id="rdCode" autocomplete="off" placeholder="AB2C-D3EF-GH4J" '+
    'style="font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase"></div>'+
    '<button class="cta" id="rdGo">ยืนยันรหัส</button>'+

      '<input id="mfaCode" inputmode="numeric" maxlength="6" placeholder="000000" style="width:100%;box-sizing:border-box;font-size:30px;letter-spacing:.35em;text-align:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;font-family:var(--mono);margin-bottom:12px">'+
      '<button id="mfaGo" class="cta" style="margin:0 0 8px">ยืนยัน</button>'+
      '<button id="mfaNo" class="ghostb" style="margin:0">ยกเลิก</button></div>';
    document.body.appendChild(w);
    w.querySelector("#mfaGo").addEventListener("click",function(){var c=w.querySelector("#mfaCode").value.trim();w.remove();resolve(/^\d{6}$/.test(c)?c:null)});
    w.querySelector("#mfaNo").addEventListener("click",function(){w.remove();resolve(null)});

  });
}

async function doLogin(){
  var em=(document.getElementById("lEm").value||"").trim();
  var pw=document.getElementById("lPw").value||"";
  if(!em||!pw){toast("กรอกอีเมลและรหัสผ่าน");return}
  var b=document.getElementById("lGo"); b.disabled=true; b.textContent="กำลังตรวจสอบ…";
  try{
    try{await CSBackend.signOut()}catch(e0){}
    await CSBackend.signInStaff(em,pw);
    var f=await CSBackend.mfaFactors();
    var vf=(f.totp||[]).filter(function(x){return x.status==="verified"});
    if(vf.length){
      var code=await mfaPrompt();
      if(!code){await CSBackend.signOut();toast("ยกเลิกการเข้าสู่ระบบ");loginV();return}
      await CSBackend.mfaVerify(vf[0].id,code);
    }
    var pr=await CSBackend.loadProfile();
    var cu=await CSBackend.currentUser();
    if(!pr||!cu||pr.id!==cu.id){
      try{await CSBackend.signOut()}catch(e1){}
      toast("พบ session ซ้อนจากแท็บอื่น — ปิดแท็บอื่นแล้วลองใหม่");loginV();return;
    }
    /* ยังไม่มีบทบาทเจ้าหน้าที่ = ยังไม่ได้แลกรหัสที่ผู้ดูแลระบบออกให้
       ไม่ตัด session ทิ้งตรงนี้ เพราะการแลกรหัสต้องทำในนามบัญชีที่เข้าสู่ระบบแล้ว
       แต่ยังไม่เปิดเมนูใดให้จนกว่ารหัสจะตรง */
    if(!mayConsole(pr.role)){
      ST.email=em; ST.name=pr.display_name||em;
      redeemV(em); return;
    }
    ST.role=pr.role; ST.email=em; ST.name=pr.display_name||em;
    /* หมวดที่เลือกเป็นการนำทาง — ถ้าไม่ตรงกับบทบาทจริงในฐานข้อมูล ให้บอกตรง ๆ
       ไม่ใช่ปล่อยให้ผู้ใช้งงว่าทำไมเมนูไม่เหมือนที่คาด */
    if(ST.pickedCat&&ST.pickedCat!==ST.role){
      toast("บัญชีนี้มีบทบาทจริงเป็น "+(ROLE_NM[ST.role]||ST.role)+" — ระบบใช้บทบาทจากฐานข้อมูล");
    }else{
      toast("เข้าสู่ระบบแล้ว · "+(ROLE_NM[ST.role]||ST.role)+(vf.length?" · ผ่าน MFA":""));
    }
    /* หน่วยบริการและการกรองเมนูอยู่ในเส้นทางร่วม ไม่ทำซ้ำที่นี่ */
    await enterConsole(pr.role, em, pr.display_name);
  }catch(e){
    toast("เข้าสู่ระบบไม่สำเร็จ: "+(e.message||""));
    b.disabled=false; b.textContent="เข้าสู่ระบบ";
  }
}

/* บาง webview และ PWA บล็อก prompt() — ถ้าเรียกตรงแล้วโยน error
   ตัวจัดการเหตุการณ์ทั้งก้อนจะตายเงียบ ปุ่มจะกดไม่ติดโดยไม่มีคำอธิบาย
   ห่อไว้เพื่อให้ "บันทึกโดยไม่มีโน้ต" ยังทำงานได้เสมอ */
function ask(msg,required){
  var v=null;
  try{ v=window.prompt(msg) }catch(e){ v=null }
  if(v===null&&required)return null;
  return v||"";
}
/* จับสถานะดิบ 9 แบบเข้ากลุ่มงาน 4 กลุ่มตามวงจร STEADI
   เจ้าหน้าที่คิดเป็น "ประเภทงาน" ไม่ได้คิดเป็นชื่อสถานะ */
var STAGES=[
  {k:"review", nm:"ทบทวนสัญญาณ",  ic:"🔎", of:["new","reviewing"]},
  {k:"plan",   nm:"ติดต่อ/วางแผน", ic:"📞", of:["contacted","care_plan_agreed"]},
  {k:"refer",  nm:"ส่งต่อ",        ic:"➡️", of:["referred","appointment_booked","service_completed"]},
  {k:"follow", nm:"ติดตามผล",      ic:"🔁", of:["follow_up_due","intervention"]}
];
function stageOf(status){
  for(var i=0;i<STAGES.length;i++)if(STAGES[i].of.indexOf(status)>=0)return STAGES[i];
  return {k:"closed",nm:"ปิดแล้ว",ic:"✓"};
}
function stageBar(status){
  var cur=stageOf(status), idx=STAGES.findIndex(function(x){return x.k===cur.k});
  return '<div class="stagebar" role="list" aria-label="ขั้นตอนของเคส">'+
    STAGES.map(function(x,i){
      var on = i===idx ? "1" : (idx>i ? "done" : "0");
      return '<div class="stg" data-on="'+on+'" role="listitem">'+x.ic+'<br>'+esc(x.nm)+'</div>';
    }).join("")+'</div>';
}

function slaText(c){
  if(c.contacted_at)return {txt:"ติดต่อแล้ว",cls:"var(--c4)"};

  if(c.unreachable)return {txt:"ติดต่อไม่ได้ "+(c.attempts||0)+" ครั้ง",cls:"var(--c3)"};
  if(h<0)return {txt:"เกินกำหนด "+Math.abs(h)+" ชม.",cls:"var(--c1)"};

function nextAction(c){
  if(c.next_action)return c.next_action;
  var s=(c.signals||[])[0];
  if(c.med_review_open)return "ส่งเภสัชกรทบทวนยา";
  if(!c.contacted_at)return "โทรติดต่อ";
  if(c.ref_open)return "ติดตามผลการส่งต่อ";

  if(s&&s.dest)return "ประสานส่งต่อ "+(DEST_NM[s.dest]||s.dest);
  return "ทบทวนเคส";

/* ============================================================
   มุมมองวอร์ด — คอนโซลเต็มจอสำหรับจอใหญ่ที่เคาน์เตอร์
   ------------------------------------------------------------
   ใช้ข้อมูลชุดเดียวกับหน้าคิวเคส (CSBackend.cmWorklist) ไม่มีการคำนวณ
   ระดับความเสี่ยงหรือลำดับใหม่ — เปลี่ยนแค่วิธีแสดงผล เพื่อไม่ให้เกิด
   ความจริงสองชุดที่ขัดกันระหว่างสองหน้าจอ

   แถบวงจรงานด้านบนสะท้อนขั้นตอนจริงของระบบ ไม่ใช่ภาพประกอบ
   กดที่ขั้นไหนก็กรองเห็นเฉพาะเคสที่ค้างอยู่ขั้นนั้น
   ============================================================ */
var WARD={on:false,stage:"all",timer:null};

function wardStageCounts(rows){
  var c={all:rows.length};
  STAGES.forEach(function(s){c[s.k]=0});
  c.closed=0;
  rows.forEach(function(r){var k=stageOf(r.status).k;c[k]=(c[k]||0)+1});
  return c;
}
/* ชื่อระดับแบบสั้นสำหรับการ์ดในกริด — ชื่อเต็มยาวเกินจนตกบรรทัด
   ทำให้การ์ดสูงไม่เท่ากันและอ่านเป็นตารางไม่ได้ ความหมายเต็มอยู่ในพาเนลขวา */
var WARD_LV={urgent:"ด่วน",decline:"ทบทวน",watch:"เฝ้าดู",stable:"ตามรอบ"};
function wardLevelColor(lv){
  return {urgent:"#DC2626",decline:"#EA580C",watch:"#D97706",stable:"#059669"}[lv]||"#64748B";
}
function wardClock(){
  var d=new Date();
  var wd=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"][d.getDay()];
  var p=function(n){return (n<10?"0":"")+n};
  return {d:"วัน"+wd+" "+d.getDate()+"/"+(d.getMonth()+1)+"/"+(d.getFullYear()+543),
          t:p(d.getHours())+":"+p(d.getMinutes())};
}

/* บอร์ดวันนี้เป็นหน้าจอหลักของผู้ประสานงาน ไม่ใช่ของแถมหลังปุ่ม
   เหตุผล: เปิดคอนโซลมาแล้วต้องเห็นภาพรวมทั้งพอร์ตก่อน ว่าวันนี้ใครต้องมาก่อน
   แล้วค่อยเจาะเข้าคิวเคสเมื่อจะลงมือทำทีละราย
   ข้อมูลชุดเดียวกับคิวเคส (cmWorklist) ไม่มีการคำนวณลำดับใหม่ */

function renderQueue(){
  var rows=WL.rows;
  var k={
    newRed:   rows.filter(function(c){return c.level==="urgent"&&c.status==="new"}).length,
    dueToday: rows.filter(function(c){return !c.contacted_at&&new Date(c.due_at)-Date.now()<86400000}).length,
    overdue:  rows.filter(function(c){return c.overdue}).length,
    ref:      rows.filter(function(c){return c.ref_open>0}).length,
    med:      rows.filter(function(c){return c.med_review_open>0}).length,
    unreach:  rows.filter(function(c){return c.unreachable}).length,
    fu:       rows.filter(function(c){return c.fu_due>0}).length
  };
  var tile=function(id,n,label,col){
    return '<button class="kpi" data-f="'+id+'" aria-pressed="'+(WL.filter===id)+'">'+
      '<b style="color:'+(n?col:"var(--ink3)")+'">'+n+'</b><span>'+label+'</span></button>';
  };
  var html='<div class="kpis">'+
    tile("newRed",k.newRed,"เคสแดงใหม่","var(--c1)")+
    tile("dueToday",k.dueToday,"ต้องติดต่อวันนี้","var(--c2)")+
    tile("overdue",k.overdue,"เกินกำหนด","var(--c1)")+
    tile("ref",k.ref,"รอผลส่งต่อ","var(--c3)")+
    tile("med",k.med,"รอทบทวนยา","var(--c3)")+
    tile("unreach",k.unreach,"ติดต่อไม่ได้","var(--ink2)")+
  '</div>'+
  '<div class="seg"><button data-tab="cases" aria-pressed="'+(WL.tab==="cases")+'">คิวเคส ('+rows.length+')</button>'+
    '<button data-tab="fu" aria-pressed="'+(WL.tab==="fu")+'">งานติดตาม ('+k.fu+')</button></div>';

  var list=rows.slice();
  if(WL.tab==="fu")list=list.filter(function(c){return c.fu_due>0});
  if(WL.filter==="newRed")   list=list.filter(function(c){return c.level==="urgent"&&c.status==="new"});
  if(WL.filter==="dueToday") list=list.filter(function(c){return !c.contacted_at&&new Date(c.due_at)-Date.now()<86400000});
  if(WL.filter==="overdue")  list=list.filter(function(c){return c.overdue});
  if(WL.filter==="ref")      list=list.filter(function(c){return c.ref_open>0});
  if(WL.filter==="med")      list=list.filter(function(c){return c.med_review_open>0});
  if(WL.filter==="unreach")  list=list.filter(function(c){return c.unreachable});
  /* เรียงตามขั้นตอนก่อน แล้วค่อยตามลำดับความสำคัญที่ฐานข้อมูลคำนวณไว้ */
  var ORDER=STAGES.map(function(x){return x.k}).concat(["closed"]);
  list.sort(function(a,b){
    var d=ORDER.indexOf(stageOf(a.status).k)-ORDER.indexOf(stageOf(b.status).k);
    return d!==0?d:(a.priority-b.priority);
  });

  if(!list.length){
    html+='<div class="card"><div class="empty">'+(rows.length?"ไม่มีเคสในกลุ่มนี้":"ไม่มีเคสค้าง 🎉<br><span style=\"font-size:12.5px\">เมื่อสมาชิกประเมินแล้วพบสัญญาณระดับเหลืองขึ้นไป ระบบจะเปิดเคสที่นี่ทันที</span>")+'</div></div>';
  }
  /* จัดกลุ่มตามขั้นตอนของวงจร แทนการเรียงยาวเป็นแถวเดียว
     เจ้าหน้าที่ทำงานเป็นชุด ๆ ได้ เช่น โทรทั้งกลุ่มติดต่อ แล้วค่อยไปกลุ่มส่งต่อ */
  var curGroup=null;
  list.forEach(function(c){
    var sl=slaText(c), step=caseStep(c.status), stg=stageOf(c.status);
    if(stg.k!==curGroup){
      curGroup=stg.k;
      var n=list.filter(function(x){return stageOf(x.status).k===stg.k}).length;
      html+='<div class="grp">'+stg.ic+' '+esc(stg.nm)+' ('+n+')</div>';
    }
    var sigs=(c.signals||[]).slice(0,3).map(function(f){
      return '<span class="chip2">'+esc(f.k||f.id||"")+' '+esc(f.nm||SIG_NM[f.k]||f.text||"")+'</span>';
    }).join("");
    html+='<div class="case"><div class="top">'+
      prioPill(c.level)+
      '<span class="who">'+esc(c.pseudonym||"—")+' · '+esc(c.display_name||"")+(c.age?" · "+c.age+" ปี":"")+'</span>'+
      '<span style="margin-left:auto;font-size:11.5px;color:var(--ink3)">'+thDate(c.opened_at)+'</span></div>'+
      '<div class="prioact">'+esc((PRIO[c.level]||PRIO.watch).act)+'</div>'+
      (sigs?'<div style="margin:6px 0">'+sigs+'</div>':'')+
      '<div class="rowline"><span class="k">งานถัดไป</span><span class="v" style="font-family:inherit;font-weight:600;text-align:right">'+esc(nextAction(c))+'</span></div>'+
      '<div class="rowline"><span class="k">กำหนด</span><span class="v" style="color:'+sl.cls+'">'+esc(sl.txt)+'</span></div>'+
      '<div class="rowline"><span class="k">สถานะ</span><span class="v" style="font-family:inherit;font-weight:500">'+esc(step?step.nm:c.status)+'</span></div>'+
      (c.phone?'<div class="rowline"><span class="k">โทร</span><span class="v"><a href="tel:'+esc(c.phone)+'" style="color:var(--gold)">'+esc(c.phone)+'</a>'+
        (c.carer_phone?' · ผู้ดูแล <a href="tel:'+esc(c.carer_phone)+'" style="color:var(--gold)">'+esc(c.carer_phone)+'</a>':'')+'</span></div>':'')+
      '<div class="btnrow" style="flex-wrap:wrap">'+
        '<button class="ok" data-open="'+c.id+'" data-uid="'+c.user_id+'" style="flex:1 1 100%">เปิดรายละเอียดเคส</button></div>'+
      (stg.k==="review"||stg.k==="plan"
        ? '<div class="btnrow" style="flex-wrap:wrap;margin-top:6px">'+
            CONTACT_RESULTS.slice(0,2).concat(CONTACT_RESULTS[4]).map(function(r){
              return '<button class="'+r.cls+'" data-log="'+c.id+'" data-res="'+r.k+'" style="flex:1 1 30%;font-size:12.5px;padding:8px">'+esc(r.nm)+'</button>'}).join("")+
          '</div>'
        : '')+
      '</div>';
  });
  html+='<div class="notice">เคสเปิดอัตโนมัติจากสัญญาณเสี่ยง ระบบจัดลำดับและอธิบายเหตุผลเท่านั้น — <b>การตัดสินใจทางคลินิกและการส่งต่อทุกครั้งเป็นของคุณ</b> · ทุกการติดต่อและเลื่อนสถานะบันทึกชื่อผู้ทำใน audit log ที่ลบไม่ได้ · ระบบไม่วินิจฉัยโรค ไม่สั่งปรับยา และไม่ตัดสินการจ่ายสินไหม</div>';
  V.innerHTML=html;

  V.querySelectorAll("[data-f]").forEach(function(b){b.addEventListener("click",function(){
    WL.filter=(WL.filter===b.dataset.f)?"all":b.dataset.f; renderQueue();

  V.querySelectorAll("[data-tab]").forEach(function(b){b.addEventListener("click",function(){

    caseDetailV(b.dataset.open,b.dataset.uid);

    var c=WL.rows.filter(function(x){return x.id===b.dataset.log})[0]; if(!c)return;

/* ============================================================
   หน้ารายละเอียดเคส — ข้อมูลพอสำหรับ "ประสานงาน" ไม่ใช่โชว์คะแนน
   ============================================================ */
function spark(vals,color,invert){
  /* กราฟเส้นสั้น ๆ พอให้เห็นทิศทาง ไม่ต้องมีแกนหรือตัวเลขรก */
  var v=vals.filter(function(x){return x!=null});
  if(v.length<2)return '<div style="font-size:12px;color:var(--ink3)">ยังมีข้อมูลไม่พอวาดแนวโน้ม</div>';
  var mn=Math.min.apply(null,v), mx=Math.max.apply(null,v), rg=(mx-mn)||1;
  var w=280,h=40,step=w/(v.length-1);
  var pts=v.map(function(x,i){return (i*step).toFixed(1)+","+(h-((x-mn)/rg)*h).toFixed(1)}).join(" ");
  var worse=invert?(v[v.length-1]<v[0]):(v[v.length-1]>v[0]);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts+'" fill="none" stroke="'+(worse?"var(--c1)":"var(--c4)")+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '</svg>';
}

/* ---------- ชั้นวัดผล — รายงานเชิงกลุ่ม ----------
   บนมือถือเอาเฉพาะตัวเลขที่นับได้จริง ไม่ใส่แบบจำลอง ROI
   เพราะการจำลองต้องมีคำอธิบายกำกับยาว ซึ่งอ่านบนจอเล็กแล้วคนจะข้าม
   แล้วเข้าใจว่าเป็นผลจริง — ไปดูบนเว็บที่มีพื้นที่อธิบายครบแทน */
function outcomeCard(o){
  var py=+o.person_years||0, rateOK=py>=5;   /* ฐานเวลาน้อยเกินไป อัตราจะเพี้ยน */
  var per100=function(n){return rateOK?(n/py*100).toFixed(1)+" / 100 คน-ปี":n+" ครั้ง"};
  var pc=function(a,b){return b?Math.round(a/b*100):0};
  return '<div class="card"><h3>ผลลัพธ์ของโปรแกรม (ทั้งพอร์ต)</h3>'+
    '<div class="rowline"><span class="k">ประเมินใน 30 วัน</span><span class="v">'+pc(o.n_active_30d,o.n_members)+'% ('+o.n_active_30d+'/'+o.n_members+' ราย)</span></div>'+
    '<div class="rowline"><span class="k">ทำตามนัดติดตาม</span><span class="v">'+pc(o.n_fu_done,o.n_fu_due)+'% ('+o.n_fu_done+'/'+o.n_fu_due+')</span></div>'+
    '<div class="rowline"><span class="k">ส่งต่อแล้วไปพบจริง</span><span class="v">'+pc(o.n_ref_completed,o.n_ref_confirmed)+'% ('+o.n_ref_completed+'/'+o.n_ref_confirmed+')</span></div>'+
    '<div class="rowline"><span class="k">ระดับดีขึ้น / แย่ลง</span><span class="v">'+o.n_improved+' / '+o.n_worsened+' ราย</span></div>'+
    '<div class="rowline"><span class="k">เคสที่เปิด / ยังทำงานอยู่</span><span class="v">'+o.case_total+' / '+o.case_working+'</span></div>'+
    '<div class="rowline"><span class="k">ติดต่อได้ภายในกำหนด</span><span class="v">'+pc(o.case_contacted_in_sla,o.case_contacted)+'%'+(o.case_overdue?' · เกินกำหนด '+o.case_overdue:'')+'</span></div>'+
    '<div class="rowline"><span class="k">หกล้มที่รายงาน</span><span class="v">'+per100(o.ev_fall)+'</span></div>'+
    '<div class="rowline"><span class="k">เข้าโรงพยาบาล</span><span class="v">'+per100(o.ev_hospital)+'</span></div>'+
    '<p class="tiny">'+(rateOK?"":"ฐานเวลาในโปรแกรมยังน้อย ("+py.toFixed(2)+" คน-ปี) จึงแสดงเป็นจำนวนครั้งแทนอัตรา · ")+
    'ตัวเลขทั้งหมดนับจริงจากฐานข้อมูล เป็นค่ารวมของพอร์ต ไม่มีข้อมูลรายบุคคล · '+
    'รายงานนี้ไม่มีตัวเลขเบี้ยหรือค่าสินไหม — ระบบไม่ทำเรื่องราคาและไม่ตัดสินการเคลม</p></div>';
}

/* ============================================================
   คิวทบทวนยา — ขั้น human-in-the-loop ของ Medication Pipeline
   ------------------------------------------------------------
   คำขอเปิดอัตโนมัติจากฐานข้อมูลเมื่อพบยากลุ่มเสี่ยงหกล้ม ยาไม่รู้จัก
   หรือใช้ยาหลายรายการ เภสัชกร/พยาบาลเห็นรูปซองยา + รายการที่ระบบ
   จัดกลุ่มไว้ แล้ว "ยืนยัน" หรือ "แก้" ทีละรายการ ทุกการแก้บันทึก
   ชื่อผู้แก้ ระบบไม่มีปุ่ม "สั่งหยุดยา" — มีแต่ข้อสรุปเพื่อส่งแพทย์
   ============================================================ */
/* ============================================================
   คิวยาที่ระบบจัดกลุ่มไม่ได้
   ------------------------------------------------------------
   ยาที่ทั้งฐานในเครื่องและทะเบียนตำรับยาของ อย. ตอบไม่ได้ จะมาอยู่ที่นี่
   พร้อมข้อความที่กล้องอ่านได้และรูปฉลาก (ถ้าผู้เอาประกันยินยอมให้เก็บ)

   เมื่อเภสัชกรจัดกลุ่มแล้ว ระบบจำชื่อนั้นไว้ในตารางชื่อพ้อง
   คนถัดไปที่ถ่ายยาตัวเดียวกันจะได้คำตอบทันทีโดยไม่ต้องรอเภสัชกรอีกรอบ
   — งานหนึ่งครั้งของเภสัชกรจึงมีผลกับทุกคนในระบบ ไม่ใช่แค่เคสตรงหน้า
   ============================================================ */
function unknownQueueHtml(list){
  if(!list||!list.length) return '';
  var opts=Object.keys(CSMeds.FRID).map(function(k){
    return '<option value="'+k+'">'+esc(CSMeds.FRID[k].nm)+'</option>'}).join("");
  var h='<div class="card"><h3 style="margin:0 0 4px">ยาที่รอจัดกลุ่ม '+list.length+' รายการ</h3>'+
    '<p class="tiny" style="margin:0 0 10px">ระบบอ่านชื่อได้แต่จัดกลุ่มไม่ได้ · เมื่อท่านจัดกลุ่มแล้ว ระบบจะจำไว้ใช้กับผู้เอาประกันคนอื่นที่ใช้ยาตัวเดียวกัน</p>';
  list.forEach(function(r){
    var pr=r.profiles||{};
    h+='<div class="flag" data-dq="'+r.id+'" style="border-left-color:var(--c3)">'+
      '<b>'+esc(r.guess_name||"ไม่ทราบชื่อ")+'</b>'+
      ' <span class="tiny">· '+esc(pr.pseudonym||"—")+' · '+thDate(r.created_at)+'</span>'+
      (r.photo_path?'<div data-dqimg="'+r.id+'" class="tiny" style="margin-top:6px">กำลังเปิดรูปฉลาก…</div>':'<div class="tiny" style="margin-top:6px;color:var(--ink3)">ไม่มีรูปฉลาก — ผู้เอาประกันไม่ได้ยินยอมให้เก็บรูป</div>')+
      (r.label_text?'<details style="margin-top:6px"><summary class="tiny">ข้อความที่กล้องอ่านได้</summary><pre class="tiny" style="white-space:pre-wrap">'+esc(String(r.label_text).slice(0,400))+'</pre></details>':'')+
      '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'+
        '<input data-dqinn="'+r.id+'" placeholder="ตัวยาสำคัญ เช่น diazepam" style="flex:1;min-width:130px;font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:rgba(0,14,50,.35);color:#fff">'+
        '<select data-dqgrp="'+r.id+'" style="flex:1;min-width:150px;font-family:inherit;font-size:12.5px;padding:6px;border:1px solid var(--line);border-radius:8px;background:rgba(0,14,50,.35);color:#fff">'+opts+'</select>'+
        '<button class="ok" data-dqok="'+r.id+'" style="flex:0 0 auto;padding:6px 12px;font-size:12.5px;border-radius:8px">บันทึกการจัดกลุ่ม</button>'+
        '<button class="no" data-dqno="'+r.id+'" style="flex:0 0 auto;padding:6px 10px;font-size:12.5px;border-radius:8px">ไม่ใช่ยา</button>'+
      '</div></div>';
  });
  return h+'</div>';
}

function bindUnknownQueue(){
  /* ลิงก์รูปเป็น signed URL อายุสั้น จึงขอตอนเปิดหน้า ไม่ฝังไว้ใน HTML ล่วงหน้า */
  V.querySelectorAll("[data-dqimg]").forEach(async function(el){
    var row=el.closest("[data-dq]"); if(!row)return;
    var id=row.dataset.dq;
    var rec=(bindUnknownQueue.map||{})[id];
    if(!rec||!rec.photo_path){el.textContent="";return}
    try{
      var url=await CSBackend.medPhotoUrl(rec.photo_path);
      el.innerHTML=url?'<a href="'+url+'" target="_blank" rel="noopener" style="color:var(--gold)">เปิดดูรูปฉลากยา</a>'
        :'<span style="color:var(--ink3)">เปิดรูปไม่ได้ — อาจหมดสิทธิ์เข้าถึงแล้ว</span>';
    }catch(e){ el.innerHTML='<span style="color:var(--ink3)">เปิดรูปไม่ได้</span>' }
  });
  V.querySelectorAll("[data-dqok]").forEach(function(b){b.addEventListener("click",async function(){
    var id=b.dataset.dqok;
    var inn=V.querySelector('[data-dqinn="'+id+'"]').value.trim();
    var grp=V.querySelector('[data-dqgrp="'+id+'"]').value;
    if(!inn){toast("กรุณาระบุตัวยาสำคัญ");return}
    var atc=CSMeds.BY_INN[inn.toLowerCase()]?CSMeds.BY_INN[inn.toLowerCase()].atc:null;
    b.disabled=true;
    try{ await CSBackend.resolveUnknownDrug(id,inn.toLowerCase(),grp,atc,null);
         toast("จัดกลุ่มแล้ว — ระบบจะจำชื่อนี้ไว้ใช้ครั้งต่อไป"); medsV() }
    catch(e){ toast("บันทึกไม่สำเร็จ"); b.disabled=false }
  })});
  V.querySelectorAll("[data-dqno]").forEach(function(b){b.addEventListener("click",async function(){
    b.disabled=true;
    try{ await CSBackend.resolveUnknownDrug(b.dataset.dqno,null,"unknown",null,"เภสัชกรระบุว่าไม่ใช่ยา");
         toast("บันทึกแล้ว"); medsV() }
    catch(e){ toast("บันทึกไม่สำเร็จ"); b.disabled=false }
  })});
}

var REC_NM={consult_doctor:"แนะนำพบแพทย์ทบทวนยา",monitor:"เฝ้าสังเกตอาการ",no_action:"ไม่พบประเด็น",adjusted_by_doctor:"แพทย์ปรับยาแล้ว"};
async function medsV(){
  head("ทบทวนยา","คำขอที่ระบบเปิดเมื่อพบยากลุ่มเสี่ยงหกล้ม ยาไม่รู้จัก หรือใช้ยาหลายรายการ");
  /* เดิมเงื่อนไขนี้ไม่มี pharmacist ทั้งที่เมนูเปิดให้เภสัชกรเข้า
     ผลคือเภสัชกรกดเข้ามาแล้วเจอข้อความว่า "หน้านี้เฉพาะเภสัชกร" แล้วเข้าไม่ได้
     สิทธิ์จริงคุมอยู่ที่ฐานข้อมูลอีกชั้นหนึ่งแล้ว (ต้องมีการส่งต่อ + ความยินยอมรายครั้ง) */
  if(["care_manager","admin","pharmacist"].indexOf(ST.role)<0){
    V.innerHTML='<div class="warnbox"><b>หน้านี้สำหรับเภสัชกรและผู้ประสานงาน</b><br>บัญชีของคุณ ('+esc(ROLE_NM[ST.role]||ST.role)+') เข้าดูรายการยารายบุคคลไม่ได้</div>';
    return;
  }
  V.innerHTML='<div class="empty">กำลังโหลด…</div>';
  var q=[]; try{q=await CSBackend.medReviewQueue()}catch(e){}
  var uq=[]; try{uq=await CSBackend.unknownDrugQueue()}catch(e){}
  bindUnknownQueue.map={}; uq.forEach(function(r){bindUnknownQueue.map[r.id]=r});
  var html=unknownQueueHtml(uq);
  if(!q.length){
    V.innerHTML=html+'<div class="card"><div class="empty">ไม่มีคำขอทบทวนยาค้าง 🎉</div></div>'+
      '<div class="notice">ระบบเปิดคำขอเองเมื่อสมาชิกบันทึกยากลุ่มเสี่ยงสูงอย่างน้อย 1 รายการ · กลุ่มเสี่ยงปานกลางตั้งแต่ 2 · ยาที่ระบบไม่รู้จัก · หรือใช้ยารวมตั้งแต่ 5 รายการ</div>';
    bindUnknownQueue(); return;
  }
  html+='<div class="notice"><b>ระบบไม่สั่งหยุด ลด หรือเพิ่มยา</b> — หน้านี้ให้ยืนยันหรือแก้การจัดกลุ่มที่ระบบทำไว้ และบันทึกข้อสรุปเพื่อส่งต่อแพทย์ ทุกการแก้บันทึกชื่อผู้ทำใน audit log<br><span class="tiny" style="margin-top:6px;display:block">รายการที่ขึ้นว่า <b>ยังไม่จัดกลุ่ม</b> คือยาที่ทั้งฐานในเครื่อง 170 ตัวยา และ<b>ทะเบียนตำรับยาของ อย.</b> ยังจัดกลุ่มให้ไม่ได้ (ทะเบียนเก่าหลายรายการไม่มีรหัส ATC บันทึกไว้) ไม่ได้แปลว่ายานั้นมีปัญหา — ระบบเลือกส่งให้ท่านจัดกลุ่มแทนการเดา · ยังไม่ได้เชื่อม TMT ของ สมสท.</span></div>';
  q.forEach(function(r){
    var pr=r.profiles||{}, sm=r.summary||{};
    html+='<div class="case" data-rv="'+r.id+'"><div class="top">'+
      '<span class="pill" style="background:'+(sm.high>0?"var(--c1)":sm.unknown>0?"var(--c3)":"var(--c2)")+'">'+
        (sm.high>0?"เสี่ยงสูง":sm.unknown>0?"มียาไม่รู้จัก":"หลายรายการ")+'</span>'+
      '<span class="who">'+esc(pr.pseudonym||"—")+' · '+esc(pr.display_name||"")+'</span>'+
      '<span style="margin-left:auto;font-size:11.5px;color:var(--ink3)">'+thDate(r.requested_at)+'</span></div>'+
      '<div class="rowline"><span class="k">เหตุผล</span><span class="v" style="font-family:inherit;font-weight:500;text-align:right">'+esc(r.reason||"—")+'</span></div>'+
      '<div class="cbox" data-uid="'+r.user_id+'"></div>'+
      '<div class="medlist" data-uid="'+r.user_id+'" data-rv="'+r.id+'"><div class="empty" style="padding:10px">กำลังโหลดรายการยา…</div></div>'+
      '<div class="field" style="margin-top:8px"><label>ข้อสรุปของเภสัชกร</label><textarea data-out="'+r.id+'" rows="2" style="width:100%;font-family:inherit;font-size:14px;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:rgba(0,14,50,.35);color:#fff" placeholder="เช่น พบ diazepam ร่วมกับ amitriptyline — แนะนำให้แพทย์พิจารณาทบทวน"></textarea></div>'+
      '<div class="btnrow" style="flex-wrap:wrap">'+Object.keys(REC_NM).map(function(k){
        return '<button class="'+(k==="no_action"?"no":"ok")+'" data-close="'+r.id+'" data-rec="'+k+'" style="flex:1 1 45%">'+esc(REC_NM[k])+'</button>'}).join("")+'</div></div>';
  });
  V.innerHTML=html;
  bindUnknownQueue();
  /* โหลดรายการยาแต่ละคน */
  /* กล่องขอความยินยอม — ต้องผ่านก่อนจึงเห็นรายการยา
     ถ้ายังไม่ได้รับอนุญาต ฐานข้อมูลคืนศูนย์แถวอยู่แล้ว กล่องนี้อธิบายว่าเพราะอะไร */
  V.querySelectorAll(".cbox").forEach(function(cb){
    var uid=cb.dataset.uid;
    consentBox(cb, uid, null, function(){
      var ml=V.querySelector('.medlist[data-uid="'+uid+'"]'); if(ml) loadMeds(ml);
    });
  });
  V.querySelectorAll(".medlist").forEach(loadMeds);
  async function loadMeds(box){
    var meds=[]; try{meds=await CSBackend.medsOf(box.dataset.uid)}catch(e){}
    if(!meds.length){box.innerHTML='<div class="empty" style="padding:10px">'+
      (isClinician()?"ยังเปิดดูรายการยาไม่ได้ — รอความยินยอมจากผู้เอาประกัน":"ไม่พบรายการยาที่ยังใช้อยู่")+
      '</div>';return}
    var rows=await Promise.all(meds.map(async function(x){
      var lv=x.frid_level, col=lv===2?"var(--c1)":lv===1?"var(--c2)":lv===0?"var(--c4)":"var(--ink3)";

/* ============================================================
   ติดตามการส่งต่อ (Referral Tracker)
   ------------------------------------------------------------
   สถานะ "ส่งต่อแล้ว" อย่างเดียวพิสูจน์อะไรไม่ได้ — ต้องรู้ว่าปลายทาง
   รับเคสหรือยัง นัดหมายหรือยัง ได้รับบริการจริงหรือไม่ และค้างอยู่ขั้นไหนนานเท่าใด
   หน้านี้จึงแสดงเป็นท่อสถานะพร้อมเวลาเฉลี่ยที่ค้างในแต่ละขั้น
   เพื่อชี้จุดติดขัดว่าอยู่ตรงไหนของกระบวนการ
   ============================================================ */
var REF_PIPE=[
  {k:"pending",         nm:"ส่งคำขอแล้ว",        t:"รอปลายทางรับเคส",   at:"created_at"},
  {k:"acknowledged",    nm:"ปลายทางรับเคส",      t:"รอพิจารณา",         at:"acknowledged_at"},
  {k:"approved",        nm:"อนุมัติแล้ว",         t:"รอนัดหมาย",         at:"decided_at"},
  {k:"booked",          nm:"นัดหมายแล้ว",         t:"รอถึงวันนัด",        at:"booked_at"},
  {k:"completed",       nm:"รับบริการแล้ว",       t:"รอบันทึกผล",        at:"completed_at"},
  {k:"outcome_recorded",nm:"บันทึกผลแล้ว",        t:"ปิดครบวงจร",        at:"completed_at"}
];
var REF_END={declined:"ปลายทางปฏิเสธ", unreachable:"ติดต่อไม่ได้", review_returned:"ผลทบทวนส่งกลับแล้ว"};
var DEST_NM={doctor:"แพทย์",pharmacist:"เภสัชกร",physio:"นักกายภาพบำบัด",
             nurse:"พยาบาล",family:"ครอบครัว",community:"ทีมชุมชน"};
/* ขีดเวลาที่ถือว่าค้างนานเกินไปในแต่ละขั้น (วัน) — ใช้ชี้จุดติดขัด ไม่ใช่เกณฑ์ทางคลินิก */
var REF_LIMIT={pending:2, acknowledged:3, approved:7, booked:30, completed:7};

function daysSince(iso){ if(!iso) return null; return (Date.now()-new Date(iso))/864e5 }
/* เวลาที่อยู่ในขั้นปัจจุบัน นับจาก timestamp ล่าสุดที่มีของขั้นนั้น */
function timeInStage(r){
  var st=REF_PIPE.filter(function(p){return p.k===r.status})[0];
  if(!st) return null;
  return daysSince(r[st.at]||r.created_at);
}
function dayTxt(d){
  if(d===null||d===undefined) return "—";
  if(d<1) return Math.max(1,Math.round(d*24))+" ชม.";
  return Math.round(d)+" วัน";
}

/* ============================================================
   ขอความยินยอมรายครั้ง — ตามแนวระบบ Health Link
   ------------------------------------------------------------
   สามสถานะเหมือนกัน: ขอความยินยอม → รอผู้เอาประกัน → ตรวจสอบความยินยอม
   ผู้เอาประกันมีเวลา 5 นาทีในการกดอนุญาตจากแอปของตน
   ถ้าไม่ทันต้องกดขอใหม่ · เมื่ออนุญาตแล้วสิทธิ์หมดอายุเองใน 8 ชั่วโมง
   สิทธิ์จริงบังคับที่ฐานข้อมูล การซ่อนบนหน้าจอเป็นเพียงการบอกผู้ใช้
   ============================================================ */
function mmss(ms){
  if(ms<0) ms=0;
  var t=Math.round(ms/1000);
  return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
}
/* วาดกล่องความยินยอมตามสถานะปัจจุบัน แล้วผูกปุ่ม */
async function consentBox(host, memberId, referralId, onGranted){
  if(!isClinician()){ host.innerHTML=""; return true }   /* ผู้ประสานงานไม่ต้องขอ */
  var a=null; try{ a=await CSBackend.checkAccess(memberId) }catch(e){}

  if(a&&a.live){
    var left=new Date(a.access_until)-Date.now();
    host.innerHTML='<div class="consent"><b>✓ ผู้เอาประกันอนุญาตให้เปิดดูข้อมูลแล้ว</b>'+
      'สิทธิ์นี้หมดอายุเองใน '+Math.round(left/36e5)+' ชั่วโมง — เมื่อหมดอายุต้องขอใหม่'+
      '<div class="cd">อนุญาตเมื่อ '+thDate(a.decided_at)+'</div></div>';
    return true;
  }

  if(a&&a.status==="pending"&&new Date(a.expires_at)>Date.now()){
    host.innerHTML='<div class="consent"><b>⏳ รอผู้เอาประกันยืนยัน</b>'+
      'ระบบส่งคำขอไปที่แอปของผู้เอาประกันแล้ว — ท่านมีเวลาให้ผู้เอาประกันกดอนุญาต '+
      '<span data-cd></span> หากไม่ทันให้กดขอใหม่'+
      '<div class="btns"><button class="wait" data-check>ตรวจสอบความยินยอม</button></div></div>';
    var cd=host.querySelector("[data-cd]"), exp=new Date(a.expires_at);
    var t=setInterval(function(){
      var l=exp-Date.now();
      if(l<=0){ clearInterval(t); consentBox(host,memberId,referralId,onGranted); return }
      cd.textContent="เหลือ "+mmss(l);
    },1000);
    cd.textContent="เหลือ "+mmss(exp-Date.now());
    host.querySelector("[data-check]").addEventListener("click",async function(){
      clearInterval(t);
      var b=this; b.disabled=true; b.textContent="กำลังตรวจสอบ…";
      var n=await CSBackend.checkAccess(memberId);
      await consentBox(host,memberId,referralId,onGranted);
      if(n&&n.live&&onGranted) onGranted();
      else if(!n||!n.live) toast("ผู้เอาประกันยังไม่ได้กดอนุญาต");
    });
    return false;
  }

  /* ตรวจสถานะสมาชิกก่อน — Health Link ให้ตรวจสถานะการเป็นสมาชิกก่อนจึงส่งคำขอได้
     ถ้ายังไม่ได้ให้ความยินยอมหลักไว้ ระบบจะไม่มีช่องทางส่งคำขอไปถึง */
  var ms=null; try{ ms=await CSBackend.checkMembership(memberId) }catch(e){}
  var why = a&&a.status==="denied" ? "ผู้เอาประกันไม่อนุญาตในครั้งก่อน — ขอใหม่ได้"
          : a&&a.status==="expired" ? "คำขอครั้งก่อนหมดเวลา — กดขอใหม่"
          : "ต้องได้รับอนุญาตจากผู้เอาประกันก่อนจึงเปิดดูรายการยาและผลประเมินย้อนหลังได้";
  var canAsk = !ms || ms.can_request;
  var msLine = ms
    ? '<div class="mstat">สถานะสมาชิก: <b>'+(ms.enrolled?"ลงทะเบียนแล้ว":"ยังไม่ลงทะเบียน")+'</b>'+
      ' · ความยินยอมหลัก: <b class="'+(ms.consented?"":"bad")+'">'+(ms.consented?"ให้ไว้แล้ว":"ยังไม่ได้ให้")+'</b>'+
      (ms.can_request?' · ช่องทางแจ้ง: <b>'+esc(ms.channel)+'</b>'
                     :'<br><span class="bad">ยังส่งคำขอไม่ได้ — ผู้เอาประกันต้องเปิดใช้งานและให้ความยินยอมหลักในแอปก่อน</span>')+
      '</div>' : '';
  host.innerHTML='<div class="consent"><b>🔒 ยังไม่ได้รับความยินยอม</b>'+esc(why)+ msLine +
    '<div class="btns"><button data-ask'+(canAsk?'':' disabled')+'>ขอความยินยอม</button></div>'+
    '<div class="cd">รายการส่งต่อและงานที่ต้องทำยังดูได้ตามปกติ — ที่ต้องขอคือข้อมูลคลินิกรายบุคคล'+
    (ST.org?'<br>คำขอจะระบุว่ามาจาก '+esc(ST.org):'')+'</div></div>';
  if(!canAsk) return false;
  host.querySelector("[data-ask]").addEventListener("click",async function(){
    var b=this; b.disabled=true; b.textContent="กำลังส่งคำขอ…";
    try{
      await CSBackend.requestAccess(memberId, referralId, "medications",
        "ทบทวนข้อมูลเพื่อดำเนินการตามที่ได้รับส่งต่อ");
      toast("ส่งคำขอแล้ว — รอผู้เอาประกันกดอนุญาตในแอป");
      await consentBox(host,memberId,referralId,onGranted);
    }catch(e){ toast("ส่งคำขอไม่สำเร็จ: "+(e.message||e)); b.disabled=false; b.textContent="ขอความยินยอม" }
  });
  return false;
}


/* ============================================================
   หน่วยบริการที่ปฏิบัติงาน — ตามขั้นตอนของระบบ Health Link
   ------------------------------------------------------------
   Health Link: "เมื่อยืนยันตัวตนสำเร็จ ระบบจะกลับมาที่หน้าเว็บไซต์
   เพื่อให้เลือกหน่วยบริการสุขภาพที่ท่านประจำอยู่"
   เหตุผล: ผู้ให้บริการคนหนึ่งอาจทำงานหลายแห่ง และระบบต้องตอบได้ว่า
   ตอนที่เปิดดูข้อมูลคนไข้ เขาปฏิบัติงานอยู่ที่ใด
   หน่วยบริการที่เลือกจะถูกบันทึกติดไปกับคำขอความยินยอมทุกใบ
   ============================================================ */
function orgPrompt(){
  return new Promise(function(resolve){
    var w=document.createElement("div");
    w.style.cssText="position:fixed;inset:0;background:rgba(4,12,36,.72);backdrop-filter:blur(4px);"+
      "display:grid;place-items:center;z-index:200;padding:20px";
    w.innerHTML='<div class="card" style="max-width:440px;width:100%;margin:0">'+
      '<div class="kick">ขั้นตอนสุดท้ายก่อนเริ่มงาน</div>'+
      '<h3 style="margin:4px 0 6px">เลือกหน่วยบริการที่ท่านปฏิบัติงานอยู่</h3>'+
      '<p class="sub">ระบบบันทึกหน่วยบริการไว้กับทุกคำขอเปิดดูข้อมูล เพื่อให้ตรวจย้อนได้ '+
      'และเพื่อให้ผู้เอาประกันเห็นว่าคำขอมาจากที่ใด</p>'+
      '<div class="field"><label>หน่วยบริการ / หน่วยงาน</label>'+
      '<input id="orgIn" list="orgList" placeholder="เช่น โรงพยาบาลส่งเสริมสุขภาพตำบลบางแค" autocomplete="off">'+
      '<datalist id="orgList"></datalist></div>'+
      '<button class="cta" id="orgGo">ยืนยันและเริ่มงาน</button>'+
      '<p class="tiny" style="margin:8px 0 0">เลือกผิดสามารถเปลี่ยนได้ภายหลังจากแถบด้านบน</p></div>';
    document.body.appendChild(w);
    var input=w.querySelector("#orgIn");
    CSBackend.myOrgHistory().then(function(list){
      w.querySelector("#orgList").innerHTML=list.map(function(o){
        return '<option value="'+esc(o)+'">'}).join("");
      if(list.length) input.value=list[0];
      input.focus();
    }).catch(function(){input.focus()});
    function done(){
      var v=(input.value||"").trim();
      if(!v){ toast("กรุณาระบุหน่วยบริการ"); return }
      w.remove(); resolve(v);
    }
    w.querySelector("#orgGo").addEventListener("click",done);
    input.addEventListener("keydown",function(e){if(e.key==="Enter")done()});
  });
}
/* แถบบอกหน่วยบริการปัจจุบัน ติดบนสุดของทุกหน้าที่ทำงานกับเคส */
function orgBarHTML(){

}

}

function n2(x){ return (x===null||x===undefined)?"—":(+x).toFixed(1) }
function trendTxt(a,b,higherWorse){
  if(a==null||b==null) return "";
  var d=b-a; if(Math.abs(d)<0.05) return "คงที่";
  var worse = higherWorse ? d>0 : d<0;
  return worse ? "แย่ลง" : "ดีขึ้น";
}
function pkgHTML(p){
  if(!p) return '<div class="empty" style="padding:10px">ยังไม่มีข้อมูลประเมิน</div>';
  var m=p.mobility||{}, adl=p.adl||{}, meds=p.medications||[], falls=p.falls||{};
  var high=meds.filter(function(x){return x.frid_level===2}).length;
  function pk(l,v,t,warn){ return '<div class="pk"><div class="l">'+l+'</div><div class="v'+(warn?' w':'')+'">'+v+'</div>'+(t?'<div class="t">'+t+'</div>':'')+'</div>' }
  return '<div class="pkg">'+
    pk("หกล้ม 12 เดือน", (falls.n12!=null?falls.n12+" ครั้ง":"—"), falls.injury?"มีบาดเจ็บ":"", falls.n12>=2)+
    pk("TUG", n2(m.tug_first)+" → "+n2(m.tug_last)+" วิ", trendTxt(m.tug_first,m.tug_last,true), trendTxt(m.tug_first,m.tug_last,true)==="แย่ลง")+
    pk("FTSST", n2(m.ftsst_first)+" → "+n2(m.ftsst_last)+" วิ", trendTxt(m.ftsst_first,m.ftsst_last,true), trendTxt(m.ftsst_first,m.ftsst_last,true)==="แย่ลง")+
    pk("ADL", (adl.first??"—")+" → "+(adl.last??"—"), trendTxt(adl.first,adl.last,false), trendTxt(adl.first,adl.last,false)==="แย่ลง")+
    pk("ยาที่ใช้", meds.length+" รายการ", high?"กลุ่มเสี่ยงสูง "+high:"", high>0)+
    pk("ประเมินแล้ว", (m.n_assessments||0)+" ครั้ง", m.last_at?"ล่าสุด "+thDate(m.last_at).split(" ")[0]:"")+
    (p.home&&p.home.hazards?pk("อันตรายในบ้าน", p.home.hazards.length+" ข้อ",
        p.home.helper==="alone"?"อยู่คนเดียว":p.home.helper==="day"?"มีคนบางเวลา":p.home.helper==="full"?"มีคนอยู่ด้วย":"",
        p.home.hazards.length>=3||(p.home.hazards.length>=1&&p.home.helper==="alone")):"")+
  '</div>'+
  '<p class="tiny">ข้อมูลนี้เป็นสำเนา ณ เวลาส่ง — ปลายทางเห็นสิ่งเดียวกับที่ท่านเห็นตอนตัดสินใจส่ง</p>';
}

    '<div class="field"><label>กำหนดตอบกลับภายใน</label><select id="rDue" style="width:100%;font-family:inherit;font-size:15px;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,14,50,.35);color:#fff">'+
      '<option value="24"'+(c.level==="urgent"?" selected":"")+'>24 ชั่วโมง</option><option value="48"'+(c.level==="decline"?" selected":"")+'>48 ชั่วโมง</option><option value="72"'+(c.level==="watch"?" selected":"")+'>72 ชั่วโมง</option><option value="168">7 วัน</option></select></div>'+
    '<div class="btnrow"><button class="no" id="rCancel">ยกเลิก</button><button class="ok" id="rSend">ส่งต่อพร้อมชุดข้อมูล</button></div>'+
    '<p class="tiny">ระบบบันทึกว่าใครส่ง ส่งเมื่อใด และปลายทางต้องตอบภายในเมื่อใด · ผู้เชี่ยวชาญต้องขอความยินยอมผู้เอาประกันก่อนเปิดดูรายละเอียด</p></div>';

  w.querySelector("#rSend").addEventListener("click",async function(){

        (c.signals||[]).map(function(x){return x.k}), qs, +w.querySelector("#rDue").value);
      toast("ส่งต่อแล้ว พร้อมชุดข้อมูลและคำถาม "+qs.length+" ข้อ"); w.remove(); caseDetailV(caseId,userId);

  });
}

var NEXT_NM={sufficient:"ข้อมูลเพียงพอ ไม่ต้องทำเพิ่ม",need_more_info:"ขอข้อมูลเพิ่มเติม",
  book_assessment:"นัดประเมินต่อ",refer_doctor:"ส่งต่อแพทย์",follow_plan:"ติดตามตามแผน"};
function reviewSheet(r, onDone){
  var pkg=r.package, qs=r.questions||[];
  var w=document.createElement("div"); w.className="sheet";
  w.innerHTML='<div class="card"><div class="kick">ส่งผลทบทวนกลับ</div><h3>'+esc((r.profiles||{}).pseudonym||"")+' · '+esc((r.profiles||{}).display_name||"")+'</h3>'+
    '<p class="sub">เหตุผล: '+esc(r.action||"")+(r.reply_due?' · กำหนดตอบ '+thDate(r.reply_due):'')+'</p>'+
    (pkg?'<h4 style="margin:10px 0 4px;font-size:14px">ข้อมูลประกอบที่ส่งมา</h4>'+pkgHTML(pkg):'')+
    (qs.length?'<h4 style="margin:10px 0 4px;font-size:14px">คำถามจากผู้ประสานงาน</h4><ol style="margin:0 0 8px 18px;font-size:13.5px;color:var(--ink2)">'+qs.map(function(q){return '<li>'+esc(q)+'</li>'}).join("")+'</ol>':'')+
    '<div class="field"><label>ข้อค้นพบ *</label><textarea id="rvF" rows="3" placeholder="สิ่งที่ท่านพบจากการทบทวน"></textarea></div>'+
    '<div class="field"><label>คำแนะนำ</label><textarea id="rvR" rows="2" placeholder="สิ่งที่แนะนำให้ทำ (ระบบไม่สั่งหยุดหรือปรับยา — ความเห็นนี้เป็นของท่าน)"></textarea></div>'+
    '<div class="field"><label>ขั้นตอนถัดไป *</label><select id="rvN" style="width:100%;font-family:inherit;font-size:15px;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,14,50,.35);color:#fff">'+
      Object.keys(NEXT_NM).map(function(k){return '<option value="'+k+'">'+esc(NEXT_NM[k])+'</option>'}).join("")+'</select></div>'+
    '<div class="field"><label>หมายเหตุถึงผู้ประสานงาน</label><input id="rvX" placeholder="ไม่บังคับ"></div>'+
    '<div class="btnrow"><button class="no" id="rvC">ยกเลิก</button><button class="ok" id="rvS">ส่งผลกลับผู้ประสานงาน</button></div>'+
    '<p class="tiny">ผลนี้จะไปตั้งงานถัดไปของเคสให้ผู้ประสานงานเห็นทันที และบันทึกชื่อท่านในบันทึกตรวจสอบ</p></div>';
  w.querySelectorAll("textarea").forEach(function(t){t.style.cssText="width:100%;font-family:inherit;font-size:14px;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:rgba(0,14,50,.35);color:#fff"});
  document.body.appendChild(w);
  w.querySelector("#rvC").addEventListener("click",function(){w.remove()});
  w.querySelector("#rvS").addEventListener("click",async function(){
    var f=w.querySelector("#rvF").value.trim();
    if(f.length<5){toast("เขียนข้อค้นพบอย่างน้อย 1 ประโยค");return}
    var b=this; b.disabled=true;
    try{ await CSBackend.returnReview(r.id,f,w.querySelector("#rvR").value.trim(),w.querySelector("#rvN").value,w.querySelector("#rvX").value.trim());
      toast("ส่งผลกลับแล้ว"); w.remove(); if(onDone) onDone(); }
    catch(e){ toast("ส่งไม่สำเร็จ: "+(e.message||e)); b.disabled=false }
  });
}
function reviewHTML(r){
  var v=r.review; if(!v) return "";
  return '<div class="rv"><b>✓ ผลทบทวนส่งกลับแล้ว · '+thDate(r.reviewed_at)+'</b><div class="row">'+
    '<span>ข้อค้นพบ</span><span>'+esc(v.finding||"")+'</span>'+
    (v.recommend?'<span>คำแนะนำ</span><span>'+esc(v.recommend)+'</span>':'')+
    '<span>ขั้นตอนถัดไป</span><span><b style="color:#fff;display:inline">'+esc(NEXT_NM[v.next_step]||v.next_step)+'</b></span>'+
    (v.note?'<span>หมายเหตุ</span><span>'+esc(v.note)+'</span>':'')+'</div></div>';
}

   ไทม์ไลน์เคส — ทุกฝ่ายเห็นว่าข้อมูลเดินทางไปถึงไหนแล้ว
   ดึงจากข้อมูลจริงทุกตารางที่ฐานข้อมูล ไม่มีทางเพี้ยนจากของจริง

function timelineHTML(rows){
  if(!rows||!rows.length) return '<div class="empty" style="padding:8px">ยังไม่มีเหตุการณ์</div>';
  return '<div class="tl">'+rows.map(function(e){
    return '<div class="ev" data-k="'+esc(e.kind)+'"><div class="at">'+thDate(e.at)+'</div><b>'+esc(e.title)+'</b>'+(e.detail?'<span>'+esc(e.detail)+'</span>':'')+'</div>';
  }).join("")+'</div>';
}


/* ============================================================
   โหมดสาธิตฝั่งคอนโซล
   ------------------------------------------------------------
   จำลอง "การตอบกลับของคน" เท่านั้น — ผู้เชี่ยวชาญรับเคส ทบทวน ส่งผลกลับ
   การตัดสินว่าเคสนี้ระดับใดยังมาจากเอนจินจริงที่ฝั่งผู้เอาประกัน
   ไม่มีการเขียนฐานข้อมูลใด ๆ ในโหมดนี้
   ============================================================ */
function demoOn(){ return !!(window.CSDemo && CSDemo.on()) }

/* แปลงสถานการณ์เป็นเคสหน้าตาเหมือนของจริง เพื่อให้หน้าจอเดิมใช้ได้ทันที */
function demoCase(){
  var sc = CSDemo.current(); if(!sc) return null;
  var st = CSDemo.state();
  var last = sc.assessments[sc.assessments.length-1];
  var lvl  = sc.key==="red" ? "urgent" : sc.key==="yellow" ? "watch"
           : sc.key==="safety" ? "urgent" : "stable";
  var sig  = sc.key==="red"    ? [{k:"S2",nm:"หกล้มซ้ำ"},{k:"S3",nm:"ความเสี่ยงจากยา"},
                                  {k:"S5",nm:"การเคลื่อนไหวถดถอย"},{k:"S7",nm:"ธงความปลอดภัย (บ้าน)"}]
           : sc.key==="yellow" ? [{k:"S7",nm:"รู้สึกไม่มั่นคง เกือบหกล้ม"}]
           : sc.key==="safety" ? [{k:"S7",nm:"หยุดการทดสอบเพื่อความปลอดภัย"}] : [];
  var refNm = {none:"ยังไม่ส่งต่อ",requested:"ส่งคำขอแล้ว",accepted:"ปลายทางรับเคสแล้ว",reviewed:"ผลทบทวนส่งกลับแล้ว"};
  return {
    id:"CS-DEMO-"+sc.key.toUpperCase(), user_id:"demo-"+sc.key, demo:true,
    pseudonym:"P-DEMO", display_name:sc.member.name, age:sc.member.age,
    level:lvl, status: st.refStatus==="reviewed" ? "intervention"
                     : st.refStatus!=="none" ? "referred" : "reviewing",
    signals:sig, opened_at:last.at, due_at:new Date(Date.now()+ (lvl==="urgent"?24:72)*36e5).toISOString(),
    sla_hours: lvl==="urgent"?24:72, attempts:0, unreachable:false,
    next_action: st.refStatus==="reviewed" ? "ปรับแผนดูแลตามผลที่ผู้เชี่ยวชาญส่งกลับ"
               : st.refStatus!=="none" ? "รอ"+refNm[st.refStatus]
               : "ทบทวนสัญญาณและติดต่อผู้เอาประกัน",
    refStatus: st.refStatus, review: st.review, scenario: sc
  };
}

/* แผงควบคุม — ให้ผู้สาธิตเดินเรื่องได้โดยไม่ต้องรอฝั่งอื่นตอบจริง */

    'หรือกดปุ่มด้านล่างเพื่อโหลดเคสแดง (เส้นทางหลักของการนำเสนอ)</p>'+
    '<div class="btnrow"><button class="ok" data-dload="red">โหลดเคสแดง</button>'+
    '<button class="no" data-dload="yellow">เคสเหลือง</button></div></div>';
  var st = c.refStatus;
  return '<div class="demopanel"><h3>โหมดสาธิต · '+esc(c.scenario.label)+'</h3>'+
    '<p class="tiny" style="margin:0">'+esc(c.display_name)+' · '+c.age+' ปี · '+
    'สถานะการส่งต่อ: <b style="color:#fff">'+
      ({none:"ยังไม่ส่ง",requested:"ส่งคำขอแล้ว รอปลายทางรับ",accepted:"ปลายทางรับเคสแล้ว",
        reviewed:"ผลทบทวนส่งกลับแล้ว"}[st])+'</b></p>'+
    '<div class="btnrow" style="flex-wrap:wrap">'+
      (st==="none"      ? '<button class="ok" data-dnext>ส่งต่อเภสัชกร (จำลอง)</button>' : '')+
      (st==="requested" ? '<button class="ok" data-dnext>จำลองเภสัชกรรับเคส</button>' : '')+
      (st==="accepted"  ? '<button class="ok" data-dnext>จำลองผลทบทวนส่งกลับ</button>' : '')+
      (st==="reviewed"  ? '<button class="ok" data-doutcome>แสดงผลลัพธ์หลังติดตาม</button>' : '')+
      '<button class="no" data-dreset>เริ่มสาธิตใหม่</button>'+
    '</div>'+
    '<p class="tiny" style="margin:8px 0 0">ปุ่มเหล่านี้จำลองเฉพาะการตอบกลับของคน — '+
    'ระดับความเสี่ยงและปลายทางมาจากเอนจินจริง · ไม่มีการบันทึกลงฐานข้อมูล</p></div>';
}
function bindDemoPanel(reRender){
  V.querySelectorAll("[data-dload]").forEach(function(b){b.addEventListener("click",function(){
    CSDemo.load(b.dataset.dload); CSDemo.step("review"); toast("โหลดแล้ว"); reRender();
  })});

/* ผลลัพธ์หลังติดตาม — ต้องติดป้ายว่าเป็นตัวอย่าง ไม่ใช่ผลการศึกษา */
function demoOutcomeSheet(){

  function row(l,a,b,better){

      '<b style="color:'+(good?"var(--c4)":"var(--c2)")+'">'+b+'</b></span></div>';

    '<h3>เทียบก่อนและหลัง</h3>'+

    'ไม่ใช่ผลการศึกษา และไม่ใช่หลักฐานว่าระบบลดการหกล้มได้</div>'+
    row("ลุกเดิน 3 เมตร (วินาที)",o.before.tug,o.after.tug,"down")+
    row("ลุกนั่ง 5 ครั้ง (วินาที)",o.before.ftsst,o.after.ftsst,"down")+
    row("กิจวัตรประจำวัน (Barthel)",o.before.barthel,o.after.barthel,"up")+
    '<div class="rowline"><span class="k">หกล้มหลังเริ่มดูแล</span><span class="v">'+o.after.fallsSince+' ครั้ง</span></div>'+
    '<h3 style="margin:14px 0 6px;font-size:14px">สิ่งที่ทีมดูแลทำไปแล้ว</h3>'+

  w.querySelector("#doClose").addEventListener("click",function(){ w.remove() });

async function mineV(){
  var rn=ROLE_NM[ST.role]||ST.role;
  head("งานของฉัน", isClinician()
    ? "เคสที่ส่งต่อมาถึง"+rn+" — เห็นเฉพาะรายการที่ส่งมาถึงวิชาชีพของท่าน"
    : "เคสที่ท่านรับผิดชอบ และเคสที่ยังไม่มีผู้รับผิดชอบ");
  if(ST.role==="insurer"){
    V.innerHTML='<div class="warnbox"><b>หน้านี้เฉพาะทีมดูแล</b><br>บัญชีบริษัทประกันดูภาพรวมระดับกลุ่มได้ที่หน้าพอร์ต</div>';
    return;
  }
  V.innerHTML='<div class="empty">กำลังโหลด…</div>';
  var rows=[]; try{ rows=await CSBackend.myWork() }catch(e){}

  /* โหมดสาธิต: ใส่เคสจำลองไว้หัวรายการ ไม่แตะฐานข้อมูล */
  if(demoOn()){
    var dc=demoCase();
    if(dc) rows=[{kind:"case",ref_id:dc.id,user_id:dc.user_id,pseudonym:dc.pseudonym,
      display_name:dc.display_name,level:dc.level,status:dc.status,task:dc.next_action,
      due_at:dc.due_at,assigned_to:null,unclaimed:false,overdue:false,signals:dc.signals,demo:true}].concat(rows);
  }

  if(!rows.length){
    V.innerHTML=(demoOn()?CSDemo.progressHTML()+demoPanelHTML():"")+
      '<div class="card"><div class="empty">ไม่มีงานค้างในความรับผิดชอบของท่าน 🎉</div></div>'+
      '<div class="notice">'+(isClinician()
        ? 'เมื่อผู้ประสานงานส่งเคสมาถึง<b>'+esc(rn)+'</b> รายการจะขึ้นที่นี่ทันที ท่านกด <b>รับเคส</b> เพื่อบันทึกว่าท่านเป็นผู้ดำเนินการ'
        : 'เคสจะขึ้นที่นี่เมื่อระบบพบสัญญาณเสี่ยง — ดูเคสทั้งพอร์ตได้ที่เมนู <b>คิวงาน</b>')+
      '</div>';
    if(demoOn()) bindDemoPanel(mineV);
    return;
  }

  var now=Date.now();
  var late  = rows.filter(function(r){return r.overdue});
  var today = rows.filter(function(r){return !r.overdue && r.due_at && new Date(r.due_at)-now < 864e5});
  var later = rows.filter(function(r){return !r.overdue && !(r.due_at && new Date(r.due_at)-now < 864e5)});
  var mine  = rows.filter(function(r){return !r.unclaimed});
  var free  = rows.filter(function(r){return r.unclaimed});

  function dueTxt(r){
    if(!r.due_at) return {t:"ไม่กำหนด",c:"var(--ink3)"};
    var h=(new Date(r.due_at)-now)/36e5;
    /* Math.round ต้องครอบตัวเลข ไม่ใช่ครอบข้อความที่ต่อแล้ว มิฉะนั้นได้ NaN */
    if(h<0){ var a=-h;
      return {t:"เกิน "+(a>=24?Math.round(a/24)+" วัน":Math.round(a)+" ชม."),c:"var(--c1)"} }
    if(h<24) return {t:"เหลือ "+Math.round(h)+" ชม.",c:"var(--c2)"};
    return {t:"เหลือ "+Math.round(h/24)+" วัน",c:"var(--ink2)"};
  }
  function card(r){
    var d=dueTxt(r), pr=PRIO[r.level]||PRIO.watch;
    return '<div class="work" data-late="'+(r.overdue?1:0)+'" data-open="'+esc(r.kind)+':'+esc(r.ref_id)+'">'+
      '<div class="wm">'+
        '<div class="wt">'+esc(r.task||"ทบทวนและดำเนินการ")+
          (r.unclaimed?'<span class="newtag">ยังไม่มีผู้รับ</span>':'')+'</div>'+
        '<div class="ww">'+pr.ic+' '+esc(pr.nm)+' · '+esc(r.pseudonym||"—")+
          (r.display_name?' · '+esc(r.display_name):'')+
          ' · '+(r.kind==="referral"?"รายการส่งต่อ":"เคส")+'</div>'+
        (r.unclaimed&&r.kind==="referral"
          ? '<button class="claim" data-claim="'+esc(r.ref_id)+'">รับเคสนี้</button>' : '')+
      '</div>'+
      '<div class="wd"><b style="color:'+d.c+'">'+esc(d.t)+'</b>'+
        '<span style="color:var(--ink3)">'+esc(thDate(r.due_at).split(" ")[0])+'</span></div>'+
    '</div>';
  }

  var html=(demoOn()?CSDemo.progressHTML()+demoPanelHTML():"")+orgBarHTML()+'<div class="pipe">'+
    '<div class="pn" data-alert="'+(late.length?1:0)+'"><div class="pl">เกินกำหนด</div>'+
      '<div class="pv">'+late.length+'</div><div class="pt">ต้องจัดการก่อน</div></div>'+
    '<div class="pn"><div class="pl">ครบกำหนดวันนี้</div>'+
      '<div class="pv">'+today.length+'</div><div class="pt">ภายใน 24 ชม.</div></div>'+
    '<div class="pn"><div class="pl">ที่ท่านรับไว้</div>'+
      '<div class="pv">'+mine.length+'</div><div class="pt">อยู่ในมือท่าน</div></div>'+
    '<div class="pn"><div class="pl">ยังไม่มีผู้รับ</div>'+
      '<div class="pv">'+free.length+'</div><div class="pt">รอคนรับไปทำ</div></div></div>';

  [["⚠️ เกินกำหนด",late],["📅 ครบกำหนดวันนี้",today],["🗓 กำหนดถัดไป",later]].forEach(function(g){
    if(!g[1].length) return;
    html+='<div class="grp">'+g[0]+' ('+g[1].length+')</div>'+g[1].map(card).join("");
  });
  html+='<p class="tiny">รายการนี้กรองที่ฐานข้อมูลด้วยบัญชีที่ล็อกอิน — '+
    'ท่านเห็นเฉพาะงานในความรับผิดชอบของท่าน ไม่ใช่การซ่อนไว้ที่หน้าจอ</p>';
  V.innerHTML=html; bindOrgBar();
  if(demoOn()) bindDemoPanel(mineV);

  /* กดรับเคส */
  V.querySelectorAll("[data-claim]").forEach(function(b){
    b.addEventListener("click",async function(e){
      e.stopPropagation();
      b.disabled=true; b.textContent="กำลังรับ…";
      try{ await CSBackend.claimReferral(b.dataset.claim); toast("รับเคสแล้ว"); mineV() }
      catch(err){ toast("รับเคสไม่สำเร็จ: "+(err.message||err)); b.disabled=false; b.textContent="รับเคสนี้" }
    });
  });
  /* กดที่การ์ดเพื่อเปิดรายละเอียด (เฉพาะเคส — รายการส่งต่อดูที่หน้าติดตามการส่งต่อ) */
  V.querySelectorAll("[data-open]").forEach(function(el){
    el.addEventListener("click",function(){
      var v=el.dataset.open.split(":");
      if(v[0]==="case") caseDetailV(v[1]); else go("refer");
    });
  });
}

function bindInviteUI(reload){
  var mk=document.getElementById("ivMake");
  if(mk)mk.addEventListener("click",async function(){
    var u=(document.getElementById("ivUser").value||"").trim();
    if(!u){ toast("กรอกชื่อผู้ใช้ก่อน"); return }
    mk.disabled=true; mk.textContent="กำลังออกรหัส…";
    try{
      var res=await CSBackend.issueInvite(u,
        document.getElementById("ivRole").value,
        (document.getElementById("ivName").value||"").trim(),
        (document.getElementById("ivNote").value||"").trim(),
        parseInt(document.getElementById("ivDays").value,10)||30);
      /* เก็บไว้ในตัวแปรชั่วคราวเพื่อแสดงต่อ เพราะ reload จะวาดหน้าใหม่ทั้งหน้า */
      ST.lastInvite={u:u,code:res&&res.code};
      toast("ออกรหัสแล้ว");
      if(reload) await reload();
      showLastInvite();
    }catch(e){
      toast("ออกรหัสไม่สำเร็จ: "+(e.message||e));
      mk.disabled=false; mk.textContent="ออกรหัส";
    }
  });
  showLastInvite();
  V.querySelectorAll("[data-revoke]").forEach(function(b){
    b.addEventListener("click",async function(){
      if(!confirm("ยกเลิกรหัสนี้?\nผู้ที่ยังไม่ได้ใช้จะใช้รหัสนี้ไม่ได้อีก"))return;
      b.disabled=true;
      try{ await CSBackend.revokeInvite(b.dataset.revoke); toast("ยกเลิกแล้ว"); usersV() }
      catch(e){ toast("ยกเลิกไม่สำเร็จ: "+(e.message||e)); b.disabled=false }
    });
  });
}

    'color:#fff;user-select:all">'+esc(li.code)+'</div>'+
