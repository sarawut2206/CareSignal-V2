<style>
/* ============================================================
   ธีมเจ้าหน้าที่ — น้ำเงินเข้มทั้งแอป (ตามที่ผู้ใช้กำหนดสี)
   เหตุผล: ให้เจ้าหน้าที่รู้ทันทีว่ากำลังถืออยู่ "แอปงาน" ไม่ใช่
   แอปสมาชิกซึ่งพื้นสว่าง — ลดโอกาสสาธิตผิดแอปต่อหน้าลูกค้า
   ============================================================ */
:root{
  --blue1:#24509F; --blue2:#1A3A85; --blue3:#12295F;
  --surf:rgba(255,255,255,.07); --surf2:rgba(255,255,255,.11);
  --ink:#F2F6FF; --ink2:#B9C7E8; --ink3:#8FA3CF;
  --line:rgba(255,255,255,.17); --line2:rgba(255,255,255,.10);
  --gold:#F5B93E; --goldink:#231a02;
  --c4:#22B57F; --c3:#E3B341; --c2:#F08A3C; --c1:#F0524C;
  --sans:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sh:0 2px 6px rgba(0,10,40,.25),0 12px 30px rgba(0,10,40,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background:#16337A;
  background:radial-gradient(130% 90% at 50% 28%, var(--blue1) 0%, var(--blue2) 55%, var(--blue3) 100%) fixed}
.phone{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.bar{background:rgba(0,12,45,.35);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px)}
.bar b{font-size:16px;letter-spacing:-.01em}
.bar b i{color:var(--gold);font-style:normal}
.chip{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:99px;letter-spacing:.06em}
.view{flex:1;padding:18px 16px calc(86px + env(safe-area-inset-bottom))}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:14px;backdrop-filter:blur(6px)}
h1{font-size:21px;letter-spacing:-.02em;margin:2px 0 4px;color:#fff}
h3{font-size:15.5px;margin:0 0 10px;color:#fff}
.sub{font-size:13.5px;color:var(--ink2);margin:0 0 4px}
.kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.hd{padding:6px 18px 18px}
.hd p{color:var(--ink2);font-size:13px;margin:4px 0 0}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;font-family:inherit;font-size:16px;padding:13px;border:1.5px solid var(--line);border-radius:13px;background:rgba(0,14,50,.35);color:#fff}
.field input::placeholder{color:var(--ink3)}
.cta{display:block;width:100%;border:0;border-radius:15px;background:var(--gold);color:var(--goldink);font-family:inherit;font-size:16.5px;font-weight:700;padding:15px;cursor:pointer;margin:6px 0;box-shadow:0 6px 18px rgba(0,10,40,.35)}
.cta:disabled{opacity:.6}
.ghostb{display:block;width:100%;border:1.5px solid var(--line);border-radius:15px;background:rgba(255,255,255,.06);color:var(--ink);font-family:inherit;font-size:14.5px;padding:12px;cursor:pointer;margin:8px 0}
.tabs[hidden]{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(9,25,66,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line2);display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;font-family:inherit;font-size:11.5px;color:var(--ink3);padding:9px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button[aria-selected="true"]{color:var(--gold);font-weight:600}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;color:#fff}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line2);font-size:13.5px}
.rowline:last-child{border-bottom:0}
.rowline .k{color:var(--ink2)}
.rowline .v{font-family:var(--mono);font-weight:600;text-align:right;color:#fff}
.case{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surf2)}
.case .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.case .who{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.flag{font-size:12.5px;color:var(--ink2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:6px 0}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow button{flex:1;border-radius:11px;font-family:inherit;font-size:13.5px;font-weight:600;padding:10px;cursor:pointer}
.ok{border:0;background:var(--c4);color:#fff}
.no{border:1.5px solid var(--line);background:transparent;color:var(--ink2)}
.empty{text-align:center;color:var(--ink3);font-size:14px;padding:28px 10px}
.notice{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:13px;padding:13px 15px;font-size:13px;color:var(--ink2);margin-bottom:14px}
.notice b{color:#fff}
.tiny{font-size:11.5px;color:var(--ink2);line-height:1.65;margin:10px 0 0}
.warnbox{background:rgba(240,82,76,.16);border:1px solid rgba(240,82,76,.5);border-radius:13px;padding:13px 15px;font-size:13.5px;color:#FFD9D7;margin-bottom:14px}
.warnbox b{color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(86px + env(safe-area-inset-bottom));background:#fff;color:#12295F;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,10,40,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mixbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:8px 0 4px;background:rgba(255,255,255,.1)}
.mixbar i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px;color:var(--ink)}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line2)}
th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
td.num{font-family:var(--mono);white-space:nowrap}
.tblwrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;cursor:pointer}
.kpi[aria-pressed="true"]{border-color:var(--gold);background:rgba(245,185,62,.14)}
.kpi b{display:block;font-size:22px;font-family:var(--mono);color:#fff;line-height:1.2}
.kpi span{font-size:11px;color:var(--ink2);line-height:1.3;display:block;margin-top:2px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink2);
  font-family:inherit;font-size:13px;padding:9px;border-radius:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--goldink);border-color:var(--gold);font-weight:600}
.spark{display:block;width:100%;height:44px;margin:2px 0 6px}
.chip2{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--ink2);margin:0 4px 4px 0}
.linkbtn{border:0;background:none;color:var(--gold);font-family:inherit;font-size:12.5px;cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="phone">
  <div class="bar"><b>Care<i>Signal</i> Staff</b><span class="chip" id="chip">ยังไม่เข้าสู่ระบบ</span></div>
  <div class="hd" id="hd"><div class="kick">STAFF CONSOLE</div><h1 id="hdT">แอปเจ้าหน้าที่</h1><p id="hdP">คิวเคสและพอร์ตความเสี่ยง — เฉพาะบัญชีที่ได้รับสิทธิ์</p></div>
  <div class="view" id="view"></div>
  <div class="tabs" id="tabs" hidden>
    <button data-go="queue" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M5 4h14v16l-7-3-7 3z"/></svg><b>คิวเคส</b></button>
    <button data-go="meds"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="10" rx="2"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/><path d="M12 12v4"/></svg><b>ทบทวนยา</b></button>
    <button data-go="port"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><b>พอร์ต</b></button>
    <button data-go="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.4-3.4 4-5 7-5s5.6 1.6 7 5"/></svg><b>ฉัน</b></button>
  </div>

</div>

<script>window.CS_AUTH_SCOPE="staff";/* แอปเจ้าหน้าที่ใช้ช่อง session แยกจากแอปสมาชิกเสมอ */</script>
<script src="./cs-backend.js?v=212"></script>
<script src="./cs-meds.js?v=1"></script>
<script>
/* ============================================================
   CareSignal Staff — แอปเจ้าหน้าที่ (แยกจากแอปผู้เอาประกันโดยสิ้นเชิง)
   ------------------------------------------------------------
   ผู้ใช้: Care Manager / พยาบาล → คิวเคสส่งต่อ
          เจ้าหน้าที่บริษัทประกัน → พอร์ตความเสี่ยงแบบแฝงชื่อ
   ไม่มีข้อมูลสาธิตในแอปนี้ — ทุกแถวมาจากฐานข้อมูลกลางจริง และสิทธิ์
   ถูกบังคับด้วย Row Level Security ฝั่งเซิร์ฟเวอร์ ประตูหน้าจอเป็นเพียง
   ชั้นการใช้งาน ไม่ใช่ชั้นความปลอดภัย
   ============================================================ */
var V=document.getElementById("view"), TABS=document.getElementById("tabs");
var ST={screen:"login", role:null, email:null, name:null};
var LV_NM={stable:"คงที่",watch:"เฝ้าสังเกต",decline:"ถดถอย",urgent:"เร่งด่วน"};
var LV_C ={stable:"var(--c4)",watch:"var(--c3)",decline:"var(--c2)",urgent:"var(--c1)"};
var ROLE_NM={care_manager:"Care Manager / พยาบาล",insurer:"เจ้าหน้าที่บริษัทประกัน",admin:"ผู้ดูแลระบบ"};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove("on")},2800)}
function head(t,p){document.getElementById("hdT").textContent=t;document.getElementById("hdP").textContent=p||""}
function chip(){document.getElementById("chip").textContent=ST.role?("บทบาท · "+(ST.role==="care_manager"?"CM":ST.role.toUpperCase())):"ยังไม่เข้าสู่ระบบ"}
function thDate(iso){if(!iso)return "—";try{var d=new Date(iso);return d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"})+" "+d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}catch(e){return iso}}

function mfaPrompt(){
  return new Promise(function(resolve){
    var w=document.createElement("div");
    w.style.cssText="position:fixed;inset:0;background:rgba(15,27,51,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px";
    w.innerHTML='<div style="background:#fff;border-radius:20px;padding:26px;max-width:380px;width:100%">'+
      '<h3 style="margin:0 0 8px;font-size:18px">🔐 ยืนยันตัวตนสองชั้น</h3>'+
      '<p style="margin:0 0 14px;font-size:13.5px;color:var(--ink2)">เปิดแอป Authenticator แล้วกรอกรหัส 6 หลักของบัญชีนี้</p>'+
      '<input id="mfaCode" inputmode="numeric" maxlength="6" placeholder="000000" style="width:100%;box-sizing:border-box;font-size:30px;letter-spacing:.35em;text-align:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;font-family:var(--mono);margin-bottom:12px">'+
      '<button id="mfaGo" class="cta" style="margin:0 0 8px">ยืนยัน</button>'+
      '<button id="mfaNo" class="ghostb" style="margin:0">ยกเลิก</button></div>';
    document.body.appendChild(w);
    w.querySelector("#mfaGo").addEventListener("click",function(){var c=w.querySelector("#mfaCode").value.trim();w.remove();resolve(/^\d{6}$/.test(c)?c:null)});
    w.querySelector("#mfaNo").addEventListener("click",function(){w.remove();resolve(null)});
    setTimeout(function(){var el=w.querySelector("#mfaCode");if(el)el.focus()},80);
  });
}

/* ---------- เข้าสู่ระบบ ---------- */
function loginV(){
  ST.screen="login"; TABS.hidden=true;
  head("เข้าสู่ระบบเจ้าหน้าที่","เฉพาะบัญชีที่ผู้ดูแลระบบกำหนดบทบาทแล้วเท่านั้น");
  V.innerHTML='<div class="card">'+
    '<div class="field"><label>อีเมลเจ้าหน้าที่</label><input id="lEm" type="email" autocomplete="username" placeholder="name@company.com"></div>'+
    '<div class="field"><label>รหัสผ่าน</label><input id="lPw" type="password" autocomplete="current-password" placeholder="••••••••"></div>'+
    '<button class="cta" id="lGo">เข้าสู่ระบบ</button></div>'+
    '<div class="notice"><b>สำหรับเจ้าหน้าที่เท่านั้น</b> — ผู้เอาประกันและครอบครัวใช้แอป CareSignal (แอปสมาชิก) ไม่ใช่แอปนี้ · บัญชีใหม่ต้องให้ผู้ดูแลระบบกำหนดบทบาทก่อนจึงเข้าได้ (ฐานข้อมูลบล็อกการเลื่อนบทบาทด้วยตนเอง)</div>'+
    '<div class="card"><h3>ความปลอดภัย</h3>'+
    '<p class="sub" style="margin:0">สิทธิ์ข้อมูลบังคับด้วย Row Level Security บนฐานข้อมูล · ทุกการเปิดดูและการตัดสินเคสถูกบันทึกลง audit log ที่แก้ไขไม่ได้ · รองรับ MFA (ตั้งค่าจากแดชบอร์ดบนเว็บ)</p></div>';
  document.getElementById("lGo").addEventListener("click",doLogin);
  document.getElementById("lPw").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
}
async function doLogin(){
  var em=(document.getElementById("lEm").value||"").trim();
  var pw=document.getElementById("lPw").value||"";
  if(!em||!pw){toast("กรอกอีเมลและรหัสผ่าน");return}
  var b=document.getElementById("lGo"); b.disabled=true; b.textContent="กำลังตรวจสอบ…";
  try{
    try{await CSBackend.signOut()}catch(e0){}
    await CSBackend.signInStaff(em,pw);
    var f=await CSBackend.mfaFactors();
    var vf=(f.totp||[]).filter(function(x){return x.status==="verified"});
    if(vf.length){
      var code=await mfaPrompt();
      if(!code){await CSBackend.signOut();toast("ยกเลิกการเข้าสู่ระบบ");loginV();return}
      await CSBackend.mfaVerify(vf[0].id,code);
    }
    var pr=await CSBackend.loadProfile();
    var cu=await CSBackend.currentUser();
    if(!pr||!cu||pr.id!==cu.id){
      try{await CSBackend.signOut()}catch(e1){}
      toast("พบ session ซ้อนจากแท็บอื่น — ปิดแท็บอื่นแล้วลองใหม่");loginV();return;
    }
    if(["care_manager","insurer","admin"].indexOf(pr.role)<0){
      try{await CSBackend.signOut()}catch(e2){}
      head("เข้าสู่ระบบเจ้าหน้าที่","บัญชีนี้ยังไม่ได้รับสิทธิ์");
      V.innerHTML='<div class="warnbox"><b>บัญชีนี้ไม่ใช่บัญชีเจ้าหน้าที่</b><br>'+esc(em)+' มีบทบาท '+esc(pr.role||"ยังไม่กำหนด")+' — แจ้งผู้ดูแลระบบให้กำหนดบทบาท care_manager หรือ insurer ก่อน</div>'+
        '<button class="ghostb" id="back">กลับไปเข้าสู่ระบบ</button>';
      document.getElementById("back").addEventListener("click",loginV);
      return;
    }
    ST.role=pr.role; ST.email=em; ST.name=pr.display_name||em;
    chip(); TABS.hidden=false;
    toast("เข้าสู่ระบบแล้ว · "+(ROLE_NM[ST.role]||ST.role)+(vf.length?" · ผ่าน MFA":""));
    go(ST.role==="insurer"?"port":"queue");
  }catch(e){
    toast("เข้าสู่ระบบไม่สำเร็จ: "+(e.message||""));
    b.disabled=false; b.textContent="เข้าสู่ระบบ";
  }
}

/* ============================================================
   Care Manager — Action Dashboard
   ------------------------------------------------------------
   หน้านี้ตอบคำถามเดียว: "วันนี้ต้องทำอะไรกับใคร"
   จึงไม่ใช่หน้าดูกราฟ แต่เป็นคิวงานที่กดทำได้ทันที

   ลำดับความสำคัญคิดที่ฐานข้อมูล (view cm_worklist) ตามลำดับ
   แดงก่อน → เกินกำหนดติดต่อ → ใกล้ครบกำหนด → ติดต่อไม่ได้ไว้ท้าย
   เหตุผลที่ไม่เรียงบนหน้าจอ: เจ้าหน้าที่หลายคนต้องเห็นลำดับเดียวกัน
   ============================================================ */
var CASE_STEPS=[
  {k:"new",          nm:"เคสใหม่",           next:"reviewing",    btn:"รับเคสนี้"},
  {k:"reviewing",    nm:"กำลังทบทวน",        next:"contacted",    btn:"ติดต่อได้แล้ว"},
  {k:"contacted",    nm:"ติดต่อแล้ว",         next:"referred",     btn:"ส่งต่อผู้เชี่ยวชาญ"},
  {k:"referred",     nm:"ส่งต่อแล้ว",         next:"intervention", btn:"เริ่มการดูแล"},
  {k:"intervention", nm:"อยู่ระหว่างดูแล",    next:"follow_up_due",btn:"ถึงกำหนดติดตาม"},
  {k:"follow_up_due",nm:"ถึงกำหนดติดตาม",    next:"stable",       btn:"ดีขึ้น/คงที่ — ปิดเคส"}
];
/* บาง webview และ PWA บล็อก prompt() — ถ้าเรียกตรงแล้วโยน error
   ตัวจัดการเหตุการณ์ทั้งก้อนจะตายเงียบ ปุ่มจะกดไม่ติดโดยไม่มีคำอธิบาย
   ห่อไว้เพื่อให้ "บันทึกโดยไม่มีโน้ต" ยังทำงานได้เสมอ */
function ask(msg,required){
  var v=null;
  try{ v=window.prompt(msg) }catch(e){ v=null }
  if(v===null&&required)return null;
  return v||"";
}
function caseStep(k){for(var i=0;i<CASE_STEPS.length;i++)if(CASE_STEPS[i].k===k)return CASE_STEPS[i];return null}
var SIG_NM={S1:"หกล้มครั้งใหม่",S2:"หกล้มซ้ำ/บาดเจ็บ",S3:"ความเสี่ยงจากยา",

            S7:"ธงแดงด้านความปลอดภัย"};
var DEST_NM={doctor:"แพทย์",pharmacist:"เภสัชกร",physio:"นักกายภาพบำบัด",
             nurse:"พยาบาล/ผู้จัดการดูแล",family:"ครอบครัว",community:"เครือข่ายชุมชน"};
/* ผลการติดต่อ — คำที่ใช้ตรงกับสิ่งที่เกิดจริงหน้างาน */

];
var WL={rows:[],filter:"all",tab:"cases"};

function slaText(c){
  if(c.contacted_at)return {txt:"ติดต่อแล้ว",cls:"var(--c4)"};
  var h=Math.round((new Date(c.due_at).getTime()-Date.now())/3600000);
  if(c.unreachable)return {txt:"ติดต่อไม่ได้ "+(c.attempts||0)+" ครั้ง",cls:"var(--c3)"};
  if(h<0)return {txt:"เกินกำหนด "+Math.abs(h)+" ชม.",cls:"var(--c1)"};
  return {txt:"ต้องติดต่อภายใน "+h+" ชม.",cls:h<=12?"var(--c2)":"var(--ink2)"};
}
/* งานถัดไปที่ควรทำ — มาจากสัญญาณที่แรงที่สุดของเคส */
function nextAction(c){
  if(c.next_action)return c.next_action;
  var s=(c.signals||[])[0];
  if(c.med_review_open)return "ส่งเภสัชกรทบทวนยา";
  if(!c.contacted_at)return "โทรติดต่อ";
  if(c.ref_open)return "ติดตามผลการส่งต่อ";
  if(c.fu_due)return "โทรติดตามตามนัด";
  if(s&&s.dest)return "ประสานส่งต่อ "+(DEST_NM[s.dest]||s.dest);
  return "ทบทวนเคส";
}

/* ============================================================
   หน้ารายละเอียดเคส — ข้อมูลพอสำหรับ "ประสานงาน" ไม่ใช่โชว์คะแนน
   ============================================================ */
function spark(vals,color,invert){
  /* กราฟเส้นสั้น ๆ พอให้เห็นทิศทาง ไม่ต้องมีแกนหรือตัวเลขรก */
  var v=vals.filter(function(x){return x!=null});
  if(v.length<2)return '<div style="font-size:12px;color:var(--ink3)">ยังมีข้อมูลไม่พอวาดแนวโน้ม</div>';
  var mn=Math.min.apply(null,v), mx=Math.max.apply(null,v), rg=(mx-mn)||1;
  var w=280,h=40,step=w/(v.length-1);
  var pts=v.map(function(x,i){return (i*step).toFixed(1)+","+(h-((x-mn)/rg)*h).toFixed(1)}).join(" ");
  var worse=invert?(v[v.length-1]<v[0]):(v[v.length-1]>v[0]);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts+'" fill="none" stroke="'+(worse?"var(--c1)":"var(--c4)")+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '</svg>';
}

/* ---------- ชั้นวัดผล — รายงานเชิงกลุ่ม ----------
   บนมือถือเอาเฉพาะตัวเลขที่นับได้จริง ไม่ใส่แบบจำลอง ROI
   เพราะการจำลองต้องมีคำอธิบายกำกับยาว ซึ่งอ่านบนจอเล็กแล้วคนจะข้าม
   แล้วเข้าใจว่าเป็นผลจริง — ไปดูบนเว็บที่มีพื้นที่อธิบายครบแทน */
function outcomeCard(o){
  var py=+o.person_years||0, rateOK=py>=5;   /* ฐานเวลาน้อยเกินไป อัตราจะเพี้ยน */
  var per100=function(n){return rateOK?(n/py*100).toFixed(1)+" / 100 คน-ปี":n+" ครั้ง"};
  var pc=function(a,b){return b?Math.round(a/b*100):0};
  return '<div class="card"><h3>ผลลัพธ์ของโปรแกรม (ทั้งพอร์ต)</h3>'+
    '<div class="rowline"><span class="k">ประเมินใน 30 วัน</span><span class="v">'+pc(o.n_active_30d,o.n_members)+'% ('+o.n_active_30d+'/'+o.n_members+' ราย)</span></div>'+
    '<div class="rowline"><span class="k">ทำตามนัดติดตาม</span><span class="v">'+pc(o.n_fu_done,o.n_fu_due)+'% ('+o.n_fu_done+'/'+o.n_fu_due+')</span></div>'+
    '<div class="rowline"><span class="k">ส่งต่อแล้วไปพบจริง</span><span class="v">'+pc(o.n_ref_completed,o.n_ref_confirmed)+'% ('+o.n_ref_completed+'/'+o.n_ref_confirmed+')</span></div>'+
    '<div class="rowline"><span class="k">ระดับดีขึ้น / แย่ลง</span><span class="v">'+o.n_improved+' / '+o.n_worsened+' ราย</span></div>'+
    '<div class="rowline"><span class="k">เคสที่เปิด / ยังทำงานอยู่</span><span class="v">'+o.case_total+' / '+o.case_working+'</span></div>'+
    '<div class="rowline"><span class="k">ติดต่อได้ภายในกำหนด</span><span class="v">'+pc(o.case_contacted_in_sla,o.case_contacted)+'%'+(o.case_overdue?' · เกินกำหนด '+o.case_overdue:'')+'</span></div>'+
    '<div class="rowline"><span class="k">หกล้มที่รายงาน</span><span class="v">'+per100(o.ev_fall)+'</span></div>'+
    '<div class="rowline"><span class="k">เข้าโรงพยาบาล</span><span class="v">'+per100(o.ev_hospital)+'</span></div>'+
    '<p class="tiny">'+(rateOK?"":"ฐานเวลาในโปรแกรมยังน้อย ("+py.toFixed(2)+" คน-ปี) จึงแสดงเป็นจำนวนครั้งแทนอัตรา · ")+
    'ตัวเลขทั้งหมดนับจริงจากฐานข้อมูล เป็นค่ารวมของพอร์ต ไม่มีข้อมูลรายบุคคล · '+
    'รายงานนี้ไม่มีตัวเลขเบี้ยหรือค่าสินไหม — ระบบไม่ทำเรื่องราคาและไม่ตัดสินการเคลม</p></div>';
}

    if(!meds.length){box.innerHTML='<div class="empty" style="padding:10px">ไม่พบรายการยาที่ยังใช้อยู่</div>';return}
    var rows=await Promise.all(meds.map(async function(x){
      var lv=x.frid_level, col=lv===2?"var(--c1)":lv===1?"var(--c2)":lv===0?"var(--c4)":"var(--ink3)";
      var g=CSMeds.FRID[x.frid_group]; var gn=g?g.nm:(x.frid_group==="unknown"||!x.frid_group?"ยังไม่จัดกลุ่ม":x.frid_group);
      var url=x.photo_path?await CSBackend.medPhotoUrl(x.photo_path):null;
      var opts=Object.keys(CSMeds.FRID).map(function(k){return '<option value="'+k+'"'+(k===x.frid_group?" selected":"")+'>'+esc(CSMeds.FRID[k].nm)+'</option>'}).join("");
      return '<div class="flag" style="border-left-color:'+col+'">'+
        '<b>'+esc(x.inn||x.brand_text||"ไม่ระบุชื่อ")+'</b>'+(x.dose_text?' '+esc(x.dose_text):'')+(x.freq_text?' · '+esc(x.freq_text):'')+
        (x.atc?' <span style="color:var(--ink3);font-size:11px">'+esc(x.atc)+'</span>':'')+
        '<br><span style="color:'+col+'">'+esc(gn)+'</span>'+
        ' <span style="color:var(--ink3);font-size:11px">· '+esc(x.source==="photo_ocr"?"อ่านจากรูป":x.source==="purpose_only"?"ระบุแค่วัตถุประสงค์":"พิมพ์เอง")+
        (x.match_conf!=null?" "+Math.round(x.match_conf*100)+"%":"")+(x.purpose?" · "+esc(x.purpose):"")+
        (x.confirmed_by==="pharmacist"?" · <b style='color:var(--c4)'>เภสัชกรยืนยันแล้ว</b>":"")+'</span>'+
        (url?'<br><a href="'+url+'" target="_blank" rel="noopener" style="color:var(--gold);font-size:12px">เปิดดูรูปซองยา</a>':'')+
        '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">'+
          '<input data-inn="'+x.id+'" value="'+esc(x.inn||"")+'" placeholder="ตัวยาสำคัญ" style="flex:1;min-width:120px;font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:rgba(0,14,50,.35);color:#fff">'+
          '<select data-grp="'+x.id+'" style="flex:1;min-width:140px;font-family:inherit;font-size:12.5px;padding:6px;border:1px solid var(--line);border-radius:8px;background:rgba(0,14,50,.35);color:#fff">'+opts+'</select>'+
          '<button class="ok" data-fix="'+x.id+'" style="flex:0 0 auto;padding:6px 12px;font-size:12.5px;border-radius:8px">ยืนยัน/แก้</button>'+
          '<button class="no" data-stop="'+x.id+'" style="flex:0 0 auto;padding:6px 10px;font-size:12.5px;border-radius:8px">เลิกใช้แล้ว</button></div></div>';
    }));
    box.innerHTML=rows.join("");
    box.querySelectorAll("[data-fix]").forEach(function(b){b.addEventListener("click",async function(){
      var id=b.dataset.fix, inn=box.querySelector('[data-inn="'+id+'"]').value.trim()||null, grp=box.querySelector('[data-grp="'+id+'"]').value;
      var lv=CSMeds.FRID[grp]?CSMeds.FRID[grp].lv:null;
      var atc=inn&&CSMeds.BY_INN[inn]?CSMeds.BY_INN[inn].atc:null;
      b.disabled=true;
      try{await CSBackend.pharmacistFix(id,{inn:inn,atc:atc,frid_group:grp,frid_level:lv});toast("บันทึกแล้ว");medsV()}
      catch(e){toast("บันทึกไม่สำเร็จ");b.disabled=false}
    })});
    box.querySelectorAll("[data-stop]").forEach(function(b){b.addEventListener("click",async function(){
      b.disabled=true;
      try{await CSBackend.pharmacistFix(b.dataset.stop,{active:false,review_note:"เภสัชกรระบุว่าเลิกใช้แล้ว"});toast("บันทึกว่าเลิกใช้แล้ว");medsV()}
      catch(e){toast("ไม่สำเร็จ");b.disabled=false}
    })});
  });
  V.querySelectorAll("[data-close]").forEach(function(b){b.addEventListener("click",async function(){
    var id=b.dataset.close, rec=b.dataset.rec, out=(V.querySelector('[data-out="'+id+'"]')||{}).value||"";
    if(rec!=="no_action"&&!out.trim()){toast("กรุณาเขียนข้อสรุปก่อนปิด");return}
    b.disabled=true;
    try{await CSBackend.closeMedReview(id,out.trim()||null,rec);toast("ปิดการทบทวนแล้ว");medsV()}
    catch(e){toast("ปิดไม่สำเร็จ");b.disabled=false}
  })});
}

var FN={login:loginV,queue:queueV,meds:medsV,port:portV,me:meV};
function go(sc){
  ST.screen=sc;(FN[sc]||loginV)();
  TABS.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.go===sc)});
  window.scrollTo(0,0);
}
TABS.addEventListener("click",function(e){var b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});

/* ---------- บูต ---------- */
(async function(){
  loginV();
  try{
    var ok=await CSBackend.init();
    if(!ok){V.insertAdjacentHTML("afterbegin",'<div class="warnbox">เชื่อมต่อฐานข้อมูลกลางไม่ได้ — แอปเจ้าหน้าที่ต้องออนไลน์เท่านั้น</div>');return}
    var u=await CSBackend.currentUser();
    if(u){
      var p=await CSBackend.loadProfile();
      if(p&&p.id===u.id&&["care_manager","insurer","admin"].indexOf(p.role)>=0){
        ST.role=p.role;ST.email=u.email;ST.name=p.display_name||u.email;
        chip();TABS.hidden=false;
        go(ST.role==="insurer"?"port":"queue");
      }else{try{await CSBackend.signOut()}catch(e){}}
    }
  }catch(e){}
})();

/* PWA */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
