async function referV(){
  head("ติดตามการส่งต่อ", isClinician()
    ? "รายการที่ส่งมาถึง"+esc(ROLE_NM[ST.role]||ST.role)+" — ค้างอยู่ขั้นไหนและนานเท่าใด"
    : "ส่งต่อแล้วได้รับบริการจริงหรือยัง — ดูว่าเคสค้างอยู่ขั้นไหนและนานเท่าใด");
  if(ST.role==="insurer"){
    V.innerHTML='<div class="warnbox"><b>หน้านี้เฉพาะทีมดูแล</b><br>บัญชีบริษัทประกันดูได้เฉพาะข้อมูลระดับกลุ่มที่หน้าพอร์ต</div>';
    return;
  }
  V.innerHTML='<div class="empty">กำลังโหลด…</div>';
  /* วิชาชีพเรียกชุดเดียวกัน แต่ RLS ส่งกลับมาเฉพาะรายการที่ส่งถึงวิชาชีพตน
     จึงไม่ต้องกรองซ้ำที่หน้าจอ และแก้โค้ดหน้าเว็บก็ไม่ทำให้เห็นของคนอื่น */
  var rows=[]; try{ rows=await (isClinician()?CSBackend.myReferrals():CSBackend.listReferralQueue()) }catch(e){}
  if(!rows.length){
    V.innerHTML='<div class="card"><div class="empty">ยังไม่มีรายการส่งต่อ</div></div>'+
      '<div class="notice">ระบบเปิดรายการส่งต่อเมื่อ Care Manager กดส่งจากหน้าเคส หรือเมื่อเภสัชกรสรุปว่าควรให้แพทย์ทบทวน</div>';
    return;
  }

  /* ---- ท่อสถานะ: จำนวนคงค้าง + เวลาเฉลี่ยที่ค้างในขั้นนั้น ---- */
  var pipe='<div class="pipe">';
  REF_PIPE.forEach(function(p){
    var inStage=rows.filter(function(r){return r.status===p.k});
    var waits=inStage.map(timeInStage).filter(function(d){return d!==null});
    var avg=waits.length?waits.reduce(function(a,b){return a+b},0)/waits.length:null;
    var late=inStage.filter(function(r){
      var d=timeInStage(r); return REF_LIMIT[p.k]&&d!==null&&d>REF_LIMIT[p.k] }).length;
    pipe+='<div class="pn" data-alert="'+(late?1:0)+'">'+
      '<div class="pl">'+esc(p.nm)+'</div>'+
      '<div class="pv">'+inStage.length+'</div>'+
      '<div class="pt">'+(avg!==null?"ค้างเฉลี่ย "+dayTxt(avg):esc(p.t))+
        (late?' · <b style="color:var(--c1)">เกินกำหนด '+late+'</b>':'')+'</div></div>';
  });
  pipe+='</div>';

  /* ---- แยกตามปลายทาง ---- */
  var byDest={};
  rows.forEach(function(r){
    var d=r.destination||r.referral_type||"อื่น ๆ";
    byDest[d]=byDest[d]||{n:0,done:0,wait:[]};
    byDest[d].n++;
    if(r.status==="completed"||r.status==="outcome_recorded") byDest[d].done++;
    var t=timeInStage(r); if(t!==null) byDest[d].wait.push(t);
  });
  var destHTML='<div class="card"><h3>แยกตามปลายทางที่ส่งต่อ</h3><div class="tblwrap"><table class="tbl">'+
    '<thead><tr><th>ปลายทาง</th><th class="num">ทั้งหมด</th><th class="num">รับบริการแล้ว</th>'+
    '<th class="num">อัตราสำเร็จ</th><th class="num">ค้างเฉลี่ย</th></tr></thead><tbody>';
  Object.keys(byDest).forEach(function(d){
    var v=byDest[d], avg=v.wait.length?v.wait.reduce(function(a,b){return a+b},0)/v.wait.length:null;
    destHTML+='<tr><td>'+esc(DEST_NM[d]||d)+'</td><td class="num">'+v.n+'</td>'+
      '<td class="num">'+v.done+'</td><td class="num">'+Math.round(v.done/v.n*100)+'%</td>'+
      '<td class="num">'+dayTxt(avg)+'</td></tr>';
  });
  destHTML+='</tbody></table></div>'+
    '<p class="tiny">อัตราสำเร็จนับเฉพาะรายการที่บันทึกว่าได้รับบริการแล้ว · ตัวเลขจากข้อมูลที่บันทึกในระบบจริง ไม่ได้จำลอง</p></div>';

  /* ---- ตารางรายการที่ยังไม่ปิด เรียงตามค้างนานสุด ---- */
  var open=rows.filter(function(r){return ["outcome_recorded","declined"].indexOf(r.status)<0});
  open.sort(function(a,b){return (timeInStage(b)||0)-(timeInStage(a)||0)});
  var listHTML='<div class="card wide"><h3>รายการที่ยังไม่ปิด ('+open.length+')</h3>';
  if(!open.length){ listHTML+='<div class="empty">ปิดครบทุกรายการ</div>'; }
  else{
    listHTML+='<div class="tblwrap"><table class="tbl"><thead><tr>'+
      '<th>ผู้เอาประกัน</th><th>ปลายทาง</th><th>ขั้นปัจจุบัน</th>'+
      '<th class="num">ค้างมาแล้ว</th><th>งานถัดไป</th></tr></thead><tbody>';
    open.forEach(function(r){
      var pr=r.profiles||{}, st=REF_PIPE.filter(function(p){return p.k===r.status})[0];
      var d=timeInStage(r), lim=REF_LIMIT[r.status];
      var over=lim&&d!==null&&d>lim;
      listHTML+='<tr data-ref="'+esc(r.id)+'"><td>'+esc(pr.pseudonym||"—")+'<br><span style="color:var(--ink3);font-size:11.5px">'+esc(pr.display_name||"")+'</span></td>'+
        '<td>'+esc(DEST_NM[r.destination||r.referral_type]||r.destination||r.referral_type||"—")+'</td>'+
        '<td>'+esc(st?st.nm:(REF_END[r.status]||r.status))+'</td>'+
        '<td class="num"'+(over?' style="color:var(--c1);font-weight:700"':'')+'>'+dayTxt(d)+(over?' ⚠':'')+'</td>'+
        '<td>'+esc(st?st.t:"—")+
          (isClinician()&&!r.review?'<br><button class="claim" data-review="'+esc(r.id)+'" style="margin-top:6px">ส่งผลทบทวนกลับ</button>':'')+
          (r.review?'<br><span class="tiny" style="color:var(--c4)">✓ ส่งผลกลับแล้ว</span>':'')+
          '</td></tr>';
    });
    listHTML+='</tbody></table></div>';
    listHTML+='<p class="tiny">⚠ = ค้างนานกว่าที่ตั้งไว้สำหรับขั้นนั้น ('+
      Object.keys(REF_LIMIT).map(function(k){
        var p=REF_PIPE.filter(function(x){return x.k===k})[0];
        return (p?p.nm:k)+" "+REF_LIMIT[k]+" วัน" }).join(" · ")+
      ') — เป็นเกณฑ์บริหารงาน ไม่ใช่เกณฑ์ทางคลินิก</p>';
  }
  listHTML+='</div>';

  V.innerHTML=orgBarHTML()+pipe+'<div class="cols">'+destHTML+listHTML+'</div>';
  bindOrgBar();
  /* ส่งผลทบทวนกลับ — Refer Back */
  V.querySelectorAll("[data-review]").forEach(function(b){
    b.addEventListener("click",function(){
      var r=rows.filter(function(x){return x.id===b.dataset.review})[0];
      if(r) reviewSheet(r, function(){ referV() });
    });
  });
  /* เข้าตรงเคสที่ลิงก์มา — เลื่อนไปที่แถวนั้นและทำเครื่องหมายให้เห็นชัด */
  if(ST.focusRef){
    var row=V.querySelector('[data-ref="'+ST.focusRef+'"]');
    if(row){
      row.style.cssText="outline:2px solid var(--gold);outline-offset:2px;border-radius:8px";
      row.scrollIntoView({block:"center"});
      toast("เปิดจากลิงก์ที่ได้รับ — เคสนี้อยู่ในรายการด้านล่าง");
    }else{
      toast("ไม่พบเคสจากลิงก์นี้ หรือเคสนี้ไม่ได้ส่งมาถึงท่าน");
    }
    ST.focusRef=null;
  }
}

  html+=tbl("สถานะเคสที่เปิดอยู่", [
    ["เคสเปิดอยู่ทั้งหมด", open.length],

    ["ต้องทบทวน", byLevel.decline||0],
    ["เฝ้าสังเกต", byLevel.watch||0],
    ["เกินกำหนดตามที่ตั้งไว้", overdue.length]
  ], "นับจากตาราง care_cases ที่ยังไม่อยู่ในสถานะปิด");

  html+=tbl("เคสแยกตามขั้นของวงจร",

    ["รายการส่งต่อทั้งหมด", refs.length],
    ["ได้รับบริการแล้ว", refDone],
    ["อัตราสำเร็จ", refs.length?Math.round(refDone/refs.length*100)+"%":"—"],
    ["ยังไม่ปิด", refs.filter(function(r){return ["outcome_recorded","declined"].indexOf(r.status)<0}).length]
  ], "รายละเอียดรายขั้นดูที่หน้าติดตามการส่งต่อ");

  html+=tbl("การทบทวนยา", [
    ["คำขอทบทวนที่ค้าง", meds.length],
    ["พบยากลุ่มเสี่ยงสูง", meds.filter(function(m){return (m.summary||{}).high>0}).length],

    '(ผลลัพธ์ก่อน–หลังการดูแล · อัตราการหกล้มซ้ำ · เวลาเฉลี่ยจากสัญญาณถึงการติดต่อครั้งแรก) '+
    'ต้องรอข้อมูลจากการใช้งานจริงในระยะนำร่อง — ระบบจะไม่แสดงตัวเลขที่ยังไม่มีข้อมูลรองรับ</div>';
  V.innerHTML=html;

function go(sc){
  /* โอเวอร์เลย์บอร์ดอยู่เหนือทุกอย่าง ถ้าไม่ปิดก่อนย้ายหน้า จะบังหน้าถัดไปทั้งหน้า */
  if(WARD.on&&sc!=="ward")wardClose();
  ST.screen=sc;(FN[sc]||loginV)();
  [TABS,SIDE].forEach(function(nav){
    nav.querySelectorAll("[data-go]").forEach(function(b){b.setAttribute("aria-selected",b.dataset.go===sc)});
  });
  window.scrollTo(0,0);
}
[TABS,SIDE].forEach(function(nav){
  nav.addEventListener("click",function(e){var b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});
});
/* ============================================================
   เข้าตรงที่เคส — เทียบเคียงกรณีที่ 1 ของ Health Link
   ------------------------------------------------------------
   ถ้าระบบ HIS มีปุ่ม Health Link แพทย์กดจากหน้าประวัติคนไข้ได้เลย
   ไม่ต้องเลือกคนไข้ใหม่ · ของเรา: ลิงก์ที่ส่งไปกับการแจ้งส่งต่อ
   จะพาผู้เชี่ยวชาญมาที่เคสนั้นโดยตรง ไม่ต้องไล่หาในคิว
   รูปแบบ: ...CareSignal-Staff.html#ref=<รหัสรายการส่งต่อ>
   ============================================================ */
function deepLink(){
  var m=(location.hash||"").match(/ref=([0-9a-f-]{8,})/i);
  return m?m[1]:null;
}
/* บัญชีบริษัทประกันเห็นเฉพาะภาพรวมระดับกลุ่ม — ซ่อนเมนูรายบุคคลไว้ตั้งแต่แรก
   ไม่ใช่แค่กันตอนกดเข้า เพื่อไม่ให้เข้าใจผิดว่ามีสิทธิ์ */
var NAV_BY_ROLE={
  /* ผู้ประสานงานเห็นทั้งพอร์ตเพราะต้องจัดสรรงานและติดตามภาพรวม */
  care_manager:["ward","mine","queue","refer","meds","port","reports","audit","me"],
  admin:       ["ward","mine","queue","refer","meds","port","reports","audit","users","me"],
  /* บริษัทประกันเห็นเฉพาะภาพรวมระดับกลุ่ม ไม่มีเมนูรายบุคคลเลย */
  insurer:     ["port","me"],
  /* วิชาชีพเห็นเฉพาะงานที่ส่งมาถึงตน ไม่มีคิวรวมทั้งพอร์ต
     เภสัชกรได้หน้าทบทวนยาเพิ่ม เพราะเป็นเครื่องมือของวิชาชีพนั้นโดยตรง */
  pharmacist:  ["mine","refer","meds","me"],
  physio:      ["mine","refer","me"],
  doctor:      ["mine","refer","me"],
  nurse:       ["mine","refer","me"]
};
function navForRole(){
  var allow=NAV_BY_ROLE[ST.role]||["mine","me"];
  [TABS,SIDE].forEach(function(nav){
    nav.querySelectorAll("[data-go]").forEach(function(b){
      b.hidden = allow.indexOf(b.dataset.go)<0;
    });
  });
  SIDE.querySelectorAll(".sgrp").forEach(function(g){
    /* ซ่อนหัวข้อกลุ่มที่ไม่มีปุ่มเหลืออยู่ */
    var vis=0, n=g.nextElementSibling;
    while(n&&n.tagName==="BUTTON"){ if(!n.hidden) vis++; n=n.nextElementSibling }
    g.hidden = vis===0;
  });
}
/* ตัวเลขงานค้างข้างเมนู — เจ้าหน้าที่เห็นภาระงานโดยไม่ต้องกดเข้าไปดู */
async function navCounts(){
  if(ST.role==="insurer") return;
  var n={};
  try{ n.mine=(await CSBackend.myWork()).length }catch(e){}
  if(isCoordinator()){
    try{ var c=await CSBackend.caseQueue();
         n.queue=c.filter(function(x){return ["stable","closed"].indexOf(x.status)<0}).length }catch(e){}
    try{ n.meds=(await CSBackend.medReviewQueue()).length }catch(e){}
  }
  try{ n.refer=(await (isClinician()?CSBackend.myReferrals():CSBackend.listReferralQueue()))
         .filter(function(r){return ["outcome_recorded","declined"].indexOf(r.status)<0}).length }catch(e){}
  Object.keys(n).forEach(function(k){
    var el=SIDE.querySelector('[data-cnt="'+k+'"]');
    if(el&&n[k]>0){ el.textContent=n[k]; el.hidden=false }
  });
}

/* ============================================================
   ออกจากระบบอัตโนมัติ — คอนโซลนี้เปิดข้อมูลสุขภาพรายบุคคล
   ถ้าเดินออกจากโต๊ะแล้วลืมออกจากระบบ คนอื่นจะเปิดดูต่อได้
   ============================================================ */
var IDLE_MIN=20, idleT=null;
function resetIdle(){
  if(!ST.role) return;
  clearTimeout(idleT);
  idleT=setTimeout(async function(){
    try{ await CSBackend.signOut() }catch(e){}
    ST.role=null; ST.email=null; chip(); TABS.hidden=true; if(SIDE) SIDE.hidden=true;
    loginV();
    V.insertAdjacentHTML("afterbegin",
      '<div class="warnbox">ออกจากระบบอัตโนมัติ เนื่องจากไม่มีการใช้งานเกิน '+IDLE_MIN+' นาที</div>');
  }, IDLE_MIN*60000);
}
["click","keydown","touchstart","scroll"].forEach(function(ev){
  window.addEventListener(ev, resetIdle, {passive:true});
});

/* แถบกำกับโหมดสาธิต — ต้องเห็นทุกหน้าจอของคอนโซลด้วย ไม่ใช่เฉพาะแอปสมาชิก */
if(window.CSDemo&&CSDemo.on()){ CSDemo.restore(); CSDemo.banner(); }

/* ---------- บูต ---------- */
(async function(){
  loginV();
  try{
    var ok=await CSBackend.init();
    if(!ok){V.insertAdjacentHTML("afterbegin",'<div class="warnbox">เชื่อมต่อฐานข้อมูลกลางไม่ได้ — แอปเจ้าหน้าที่ต้องออนไลน์เท่านั้น</div>');return}
    var u=await CSBackend.currentUser();
    if(u){
      var p=await CSBackend.loadProfile();
      if(p&&p.id===u.id&&mayConsole(p.role)){
        /* ลิงก์เข้าตรงเคส — ถ้ามี #ref=... ให้ไปหน้าติดตามการส่งต่อทันที
           เทียบเคียงกับปุ่ม Health Link ในระบบ HIS ที่พาเข้าตรงหน้าประวัติคนไข้ */
        var dl=deepLink();
        if(dl) ST.focusRef=dl;
        await enterConsole(p.role, u.email, p.display_name, dl?"refer":null);
      }else if(p&&p.id===u.id){
        /* บัญชีจริงที่ยังไม่ได้แลกรหัส — ให้กรอกรหัสต่อได้เลย ไม่ต้องล็อกอินใหม่ */
        ST.email=u.email; ST.name=p.display_name||u.email; redeemV(u.email);
      }else{try{await CSBackend.signOut()}catch(e){}}
    }
  }catch(e){}
})();

/* PWA */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
